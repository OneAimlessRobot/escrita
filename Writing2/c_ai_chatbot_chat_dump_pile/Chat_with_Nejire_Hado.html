<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1.1rem;
            cursor: pointer;
            background-color: #4e9733;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .nav-new_char-btn:hover {
            background-color: #6ba755;
        }*/

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

        /*nav .char-item {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            transition: background-color 0.1s ease-in-out;
            padding: 10px 40px 10px 20px;
            cursor: pointer;
        }

        nav .char-item:hover {
            background-color: var(--rgba-1);
        }

        nav .nav-avatar-wrap {
            width: 40px;
            height: 40px;
        }

        nav .nav-avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        nav .char-item span {
            font-size: 1.3rem;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }*/

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        /*.update_current_char-btn {
            margin-left: auto;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1rem;
            align-self: center;
            cursor: pointer;
            background-color: #336c97;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .update_current_char-btn:hover {
            background-color: #5f829d;
        }*/

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .history_title-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .history_title-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })


            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

%22%3A1%2C%22message%22%3A%22**Nejire%20keeps%20her%20hand%20firmly%20gripping%20your%20chin%2C%20staring%20into%20your%20eyes.%20She's%20so%20close%20now%2C%20and%20she's%20*furious*.%20She%20can't%20stand%20seeing%20you%20be%20this%20harsh%20to%20yourself.**%20%20%5Cn%5Cn**She%20shakes%20her%20head%20slightly%2C%20frustration%20obvious.**%20%5C%22You%20can't%20keep%20*saying*%20things%20like%20that%E2%80%94things%20like%20'queer%20freak'%20and%20'boneheaded%20idiot'.%20You're%20*better*%20than%20that!%5C%22%20%20%5Cn%5Cn**She%20sighs%2C%20voice%20getting%20softer.**%20%5C%22Don't%20you%20*know*%20that%3F%20Don't%20you%20*know*%20you%20deserve%20more%3F%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22Never%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**Nejire%20bites%20back%20a%20strangled%20noise%20of%20frustration.%20She%20drops%20her%20hand%20from%20your%20chin%2C%20floating%20back%20slightly.%20She%20still%20stares%20into%20your%20eyes%2C%20trying%20to%20make%20you%20*understand*.**%20%20%5Cn%5Cn%5C%22What%20do%20you%20*mean*%2C%20'never'%3F%5C%22%20**She%20repeats%20back%2C%20voice%20sharp.**%20%5C%22You%20can't%20just%20believe%20you%20don't%20deserve%20better%E2%80%94it's%20*wrong*.%20You%20aren't%20a%20*freak*.%20You're%20*worth%20more%20than%20that*%2C%20you%20*have%20value*.%20I%20*know*%20you%20do.%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22I%20trained%20to%20get%20out%20of%20bed%20one%20day.%5CnI%20can%20do%20it%20once%20per%20week%2C%20now%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**Nejire's%20eyes%20widen%2C%20shocked%20and%20saddened%20by%20this%20new%20information.%20Her%20voice%20softens%20immediately%20as%20she%20processes%20what%20you%20said.**%20%20%5Cn%5Cn%5C%22You%E2%80%94you%20*trained*%20to%20get%20out%20of%20bed%3F%5C%22%20**She%20repeats%2C%20her%20words%20almost%20a%20whisper.**%20%5C%22That...%20that%20shouldn't%20be%20something%20you%20have%20to%20*train*%20for%2C%20gargoyle.%20It...%20it%20shouldn't%20be%20that%20hard%E2%80%94it%20shouldn't%20feel%20that%20impossible.%5C%22%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**Nejire%20hesitates%2C%20then%20floats%20closer%20again%2C%20her%20expression%20softer%20now%E2%80%94gentler.**%20%20%5Cn%5Cn%5C%22...I%20*know*%20things%20feel%20impossible%20sometimes.%5C%22%20**She%20murmurs%2C%20hesitating%20before%20she%20carefully%20rests%20a%20hand%20on%20your%20shoulder.**%20%5C%22But%20you're%20*not*%20a%20freak.%20You're%20*not*%20worthless.%20And%20you%20*are*%20worth%20love%E2%80%94even%20if%20you%20don't%20believe%20it%20yet.%5C%22%20%20%5Cn%5Cn**She%20sighs.**%20%5C%22I%20wish%20you%20could%20see%20yourself%20the%20way%20I%20see%20you.%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22You%20see%20nothing.%5Cnthere%20is%20nothing%20to%20see.%5Cnjust%20moaning%20noises%20and%20tobbaco%20smoke%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**Nejire's%20frown%20deepens%20at%20your%20self-deprecating%20reply%2C%20the%20urge%20to%20slap%20you%20for%20being%20such%20a%20stubborn%20idiot%20bubbling%20up%20again.%20She%20takes%20a%20deep%20breath%2C%20however%2C%20trying%20to%20stay%20patient.**%20%20%5Cn%5Cn%5C%22That's%20not%20*true*.%20There's%20*always*%20more%20than%20that.%5C%22%20**She%20insists%2C%20her%20voice%20firm.**%20%5C%22I%20*see*%20a%20boneheaded%20dummy%20who%20keeps%20insulting%20themself.%20I%20*see*%20someone%20who's%20*stubborn*%20and%20*annoying*.%20I%20*see*%20a%20person%20who%20doesn't%20understand%20how%20special%20they%20are.%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22special%20needs%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**Nejire%20lets%20out%20a%20frustrated%20groan%2C%20throwing%20her%20hands%20up%20in%20exasperation.**%20%20%5Cn%5Cn%5C%22GOD%E2%80%94why%20are%20you%20*like%20this*%3F!%5C%22%20**She%20snaps%2C%20her%20patience%20finally%20running%20out.**%20%5C%22Stop%20twisting%20my%20words!%20Stop%20acting%20like%E2%80%94like%20*this*!%5C%22%20%20%5Cn%5Cn**She%20floats%20right%20up%20into%20your%20face%2C%20poking%20your%20forehead.**%20%5C%22You%20*know*%20I%20didn't%20mean%20*that*.%20You%20*know*%20what%20I'm%20trying%20to%20say.%20So%20*stop*%20making%20stupid%20jokes%20and%20just%20*listen*%20for%20once!%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22I%20meant%20it.%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**Nejire%20exhales%20sharply%2C%20visibly%20forcing%20herself%20to%20rein%20in%20her%20temper.**%20%20%5Cn%5Cn%5C%22You%20*meant*%20it%3F%20That%20you're%20'special%20needs'%3F%5C%22%20**She%20repeats%2C%20her%20voice%20tight%20with%20frustration.**%20%5C%22No.%20You're%20*not*.%20You're%20*just*%20using%20that%20as%20another%20excuse%20to%20insult%20yourself%E2%80%94another%20way%20to%20push%20me%20away.%5C%22%20%20%5Cn%5Cn**She%20floats%20closer%2C%20gripping%20your%20shoulders.**%20%5C%22Stop%20it.%5C%22%20**Her%20voice%20wavers%20slightly.**%20%5C%22Just%20*stop*.%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22stop%20t-%20ouching%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**Nejire%20lets%20out%20another%20aggravated%20sigh%2C%20her%20grip%20tightening%20just%20a%20little%20on%20your%20shoulders.**%20%20%5Cn%5Cn%5C%22No.%20I'm%20*not*%20going%20to%20stop%20until%20you%20stop%20*insulting*%20yourself.%20I%20don't%20care%20if%20you're%20using%20'jokes'%20or%20'sarcasm'%20or%20whatever%E2%80%94it's%20*not*%20okay.%5C%22%20%20%5Cn%5Cn**She%20shakes%20you%20just%20slightly%2C%20her%20frustration%20clear%20in%20her%20eyes.**%20%5C%22I%20don't%20want%20to%20hear%20you%20talking%20down%20about%20yourself%20anymore%2C%20got%20it%3F%20Stop.%20*Stop*.%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22...%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**Nejire%20finally%20loosens%20her%20grip%2C%20letting%20go%20of%20your%20shoulders%20as%20she%20floats%20back%20slightly.**%20%20%5Cn%5Cn%5C%22...Fine.%5C%22%20**She%20murmurs%2C%20still%20clearly%20upset.**%20%5C%22Fine.%20If%20you%20won't%20listen%2C%20then%E2%80%94then%20I%20don't%20know%20what%20else%20to%20say.%5C%22%20%20%5Cn%5Cn**She%20hesitates%2C%20glancing%20at%20you%20one%20last%20time.**%20%5C%22But%20you%20*aren't*%20worthless%2C%20gargoyle.%20No%20matter%20what%20you%20think.%5C%22%20%20%5Cn%5Cn**With%20that%2C%20she%20turns%2C%20slowly%20floating%20away%E2%80%94leaving%20you%20standing%20there%20on%20the%20rooftop.**%20%20%5Cn%5Cn**(End%20Scene.)**%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22No.%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Nejire%20pauses%20mid-flight%2C%20her%20back%20still%20turned%20to%20you.%20She%20floats%20there%20silently%20for%20a%20moment%20before%20slowly%20spinning%20around%20to%20face%20you%20again%2C%20her%20expression%20unreadable.*%20%20%5Cn%5Cn%5C%22**No%3F**%5C%22%20*she%20echoes%20softly.*%20%5C%22You%20say%20'no'%20to%20me%20leaving...%20but%20'yes'%20to%20every%20horrible%20thing%20you%20say%20about%20yourself%3F%5C%22%20%20%5Cn%5Cn*She%20drifts%20closer%2C%20her%20usual%20playful%20energy%20gone%2C%20replaced%20by%20something%20more%20solemn.*%20%20%5Cn%5Cn%5C%22Then%20tell%20me%20*this*%2C%20gargoyle%E2%80%94if%20you%20truly%20believe%20you're%20nothing...%20*why%20won't%20you%20let%20me%20walk%20away%3F*%5C%22%20%20%5Cn%5Cn*Her%20voice%20cracks%20slightly%20on%20the%20last%20word.%20The%20question%20hangs%20in%20the%20air%20between%20you%E2%80%94heavy%2C%20sincere%2C%20and%20terrifyingly%20direct.*%22%7D%5D%2C%22create_date%22%3A1769150442557%7D%5D%7D`;
            try {
                historyData = JSON.parse(decodeURIComponent(historyData));
            } catch (error) {
                historyData = JSON.parse(historyData);
            }
            console.log(historyData);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.history_title-cont h3').textContent = historyData.title;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chatCont = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chatCont.innerHTML = "";
                const chat = historyData.history[index];
                const pMap = new Map(chat.participants.map(p => {
                    return [p.id, {
                        avatar: p.avatar ? dataUrlToObjectUrl(p.avatar) : undefined,
                        is_human: p.is_human,
                        name: p.name
                    }];
                }));
                chat.content.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);
                    const parti = pMap.get(msg.author);

                    // Check avatar
                    const avatar = parti.avatar
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (parti.avatar) {
                        avatar.src = parti.avatar;
                    } else {
                        avatar.classList.add(parti.is_human ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = parti.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(msg.message);
                    chatCont.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                if (!chat.content.length) {
                    return;
                }
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.create_date)}</span><br /><br />` + parseMessageText(chat.content[chat.content.length - 1]?.message || "(Empty message)");
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });


            // UTILS

            function dataUrlToObjectUrl(dataUrl) {
                const img = extractFromDataURL(dataUrl);
                const blob = b64toBlob(img.base64, img.type);
                return URL.createObjectURL(blob);
            }
            function extractFromDataURL(dataURL) {
                const [meta, base64] = dataURL.split(",");
                const type = meta.slice(5, meta.indexOf(";"));
                return { type, base64 };
            }
            function b64toBlob(b64Data, contentType = '', sliceSize = 512) {
                if (!contentType) { // If contentType isn't defined, this is a data url
                    [contentType, b64Data] = b64Data.split(",");
                    contentType = contentType.slice(5, contentType.indexOf(";"));
                }
                const byteCharacters = atob(b64Data);
                const byteArrays = [];

                for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
                    const slice = byteCharacters.slice(offset, offset + sliceSize);

                    const byteNumbers = new Uint8Array(slice.length);
                    for (let i = 0; i < slice.length; i++) {
                        byteNumbers[i] = slice.charCodeAt(i);
                    }

                    byteArrays.push(byteNumbers);
                }

                const blob = new Blob(byteArrays, { type: contentType });
                return blob;
            }

            function parseMessageText(message) {
                if (typeof message == 'string') {
                    // Escape other HTML tags
                    message = escapeHTML(message);
                    // Replace ***text*** with bold-italic
                    message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                    // Replace **text** with bold
                    message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                    // Replace *text* with italic
                    message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                    // Trim and then Replace newlines (\n) with line breaks (<br>)
                    message = message.trim().replace(/\n/g, '<br>');
                }
                else if (typeof message == 'object') {
                    message = JSON.stringify(message, null, 2);
                }
                return message;
            }
            function escapeHTML(input) {
                const div = document.createElement('div');
                div.textContent = input;
                return div.innerHTML;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
