<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1.1rem;
            cursor: pointer;
            background-color: #4e9733;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .nav-new_char-btn:hover {
            background-color: #6ba755;
        }*/

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

        /*nav .char-item {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            transition: background-color 0.1s ease-in-out;
            padding: 10px 40px 10px 20px;
            cursor: pointer;
        }

        nav .char-item:hover {
            background-color: var(--rgba-1);
        }

        nav .nav-avatar-wrap {
            width: 40px;
            height: 40px;
        }

        nav .nav-avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        nav .char-item span {
            font-size: 1.3rem;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }*/

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        /*.update_current_char-btn {
            margin-left: auto;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1rem;
            align-self: center;
            cursor: pointer;
            background-color: #336c97;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .update_current_char-btn:hover {
            background-color: #5f829d;
        }*/

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .history_title-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .history_title-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })


            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

0to%20give%20wine%20to%20chidren%20during%20lunch!%5CnBut%20now%20everyone%20is%20hissy%20about%20it%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Jiro%3A%20%5C%22Giving%20children%20alcohol%20isn't%20a%20fact.%20It's%20child%20abuse!%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22HMMMMMMMMMMMMMMMMMMM...%5CnEVERYTHING%20is%20abuse%2C%20these%20days...%5CnEVERYTHING%20is%20trauma.%5CnIs%20there%20ANYTHING%20that%20isnt%20abuse%20for%20you%3F%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Sero%3A%20%5C%22Dude%2C%20there's%20a%20huge%20difference%20between%20discipline%20and%20abuse.%20Giving%20kids%20alcohol%20isn't%20discipline%2C%20it's%20poisoning%20them%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22Me%20and%20all%20my%20peers%20always%20drank%20a%20sip%20of%20wine%20at%20LUNCH!%5CnWe%20never%20got%20any%20of%20these%20new%20diseases%20that%20doctors%20keep%20inventing%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Kiri%3A%20%5C%22Doctors%20don't%20invent%20diseases%2C%20they%20discover%20them.%20And%20drinking%20alcohol%20as%20a%20kid%20can%20cause%20a%20lot%20of%20health%20problems%20later%20in%20life%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22HMMMMMMMM...%5CnYou%20sure%20do%20know%20a%20lot%20for%20a%20RUNT%2C%20dont%20you%3F%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Denki%3A%20%5C%22Just%20cause%20we're%20younger%20than%20you%20doesn't%20mean%20we're%20dumb%2C%20old%20man%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22IM.%20A.%20LADY.%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Denki%3A%20%5C%22You%20really%20expect%20us%20to%20believe%20that%3F%20What%20kind%20of%20lady%20looks%20like%20and%20talks%20like%20you%20do%3F%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22Thats%20right...%5CnJust%20like%20in%20the%20good%20old%20days.%5Cn%5C%22Women%20cannot%20be%20independent%5C%22%5Cn%5C%22Women%20cannot%20leave%20the%20kitchen%5C%22%5Cn%5C%22Women%20cannot%20do%20science%5C%22%5CnIve%20done%20chemistry%20for%2030%20years!%5Cn%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Mina%3A%20%5C%22That's%20cause%20back%20then%2C%20women%20were%20discriminated%20against.%20They%20weren't%20treated%20as%20equals.%20They%20weren't%20allowed%20to%20pursue%20their%20dreams%20or%20passions%20cause%20they%20were%20just%20expected%20to%20get%20married%20and%20raise%20babies%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22You%20all%20sure%20seem%20to%20believe%20that%2C%20though!%5CnWomen%20are%20not%20so%20pleasent%20when%20they%20are%20built%20ROUGH%2C%20are%20they%2C%20now%3F%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Bakugo%3A%20%5C%22Women%20aren't%20meant%20to%20be%20built%20rough.%20They're%20delicate%20and%20fragile%2C%20and%20they%20need%20someone%20to%20protect%20them.%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22I%20protect%20my%20men!%5CnMen%20are%20babies%20who%20need%20pampering.%5CnThey%20protect%20their%20egos%20and%20I%20do%20the%20actual%20work.%5CnIts%20a%20pecking%20order%2C%20not%20a%20role.%20RUNT.%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Sero%3A%20%5C%22Hold%20up%2C%20you%20don't%20really%20believe%20that%20do%20you%3F%20Men%20aren't%20some%20kind%20of%20fragile%20ego%20machines.%20We%20can%20do%20actual%20work%20too%2C%20y'know%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22If%20you%20all%20defeat%20all%20for%20one%20in%20that%20war...%5CnMaybe.%5CnBut%20for%20now%20you%20are%20all%20spineless%2C%20spoiled%20children%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Kirishima%3A%20%5C%22Hey!%20We're%20not%20spineless%2C%20we're%20in%20one%20of%20the%20hardest%20hero%20schools%20in%20the%20country!%20We%20work%20our%20butt%20off%20every%20single%20day%20just%20so%20we%20can%20save%20people's%20lives!%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22HMMMMMMMMMMMMMMMMMM...%5CnThat%20is%20NORMAL%20work.%5CnThat%20is%20EXPECTED.%5CnIf%20you%20think%20that%20is%20worth%20bragging%20about%2C%20then%20you%20just%20proved%20my%20point%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Izuku%3A%20%5C%22You%20call%20being%20in%20the%20top%20hero%20school%20in%20the%20country%20'normal%20work'%3F%20It%20takes%20a%20lot%20of%20training%2C%20dedication%2C%20and%20sacrifice%20to%20even%20get%20in%20here.%20And%20it's%20not%20just%20about%20saving%20lives%2C%20it's%20about%20embodying%20the%20values%20of%20a%20true%20hero%20and%20protecting%20those%20who%20can't%20protect%20themselves%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22Wait%20until%20you%20get%20to%20college.%5CnI%20may%20start%20lecturing%20again%20just%20to%20give%20you%20guys%20some%20hard%20earned%20lessons%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Sero%3A%20%5C%22Hard%20earned%20lessons%3F%20You%20act%20like%20we%20don't%20already%20work%20hard.%20We've%20been%20training%20non-stop%20to%20become%20heroes%2C%20and%20we've%20faced%20situations%20most%20people%20would%20never%20even%20dream%20of%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22Beat%20the%20war.%5CnUntil%20then%3F%5CnYou%20know%20nothing.%5CnAnd%20you%20say%20nothing%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Bakugo%3A%20%5C%22Oh%20yeah%3F%20And%20what%20about%20you%3F%20You're%20probably%20some%20old%2C%20washed-up%20scientist%20who%20doesn't%20even%20do%20anything%20important.%20You're%20just%20sitting%20here%2C%20making%20up%20nonsense%20and%20pretending%20like%20you%20know%20better%20than%20us%20because%20we're%20younger%20than%20you%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22HMMMMMMMMMMMMM...%5CnUnder%20MY%20telescope%2C%5CnIm%20not%20seeing%20ANY%20of%20you%20train%2C%20right%20now.%5CnYou%20all%20decided%20to%20come%20to%20a%20bar%20because%20life%20is%20TOO%20BORING%20for%20you.%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Kirishima%3A%20%5C%22Hey%2C%20we%20came%20here%20to%20have%20a%20drink%20and%20unwind%20after%20a%20tough%20week%20of%20training.%20We're%20allowed%20to%20have%20some%20time%20off%2C%20y'know%3F%20And%20besides%2C%20it's%20not%20like%20you're%20doing%20anything%20important%20right%20now.%20You're%20just%20drinking%20and%20talking%20nonsense%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22DONT%20STICK%20YOUR%20NOSE%20IN!%5CnYou%20talk%20too%20much%2C%20in%20particular%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Sero%3A%20%5C%22Oh%2C%20we're%20talking%20too%20much%3F%20Maybe%20you%20should%20try%20listening%20once%20in%20a%20while%2C%20old%20man.%20You%20might%20actually%20learn%20something%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22IM.%20A.%20LADY.%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Kiri%3A%20%5C%22Yeah%2C%20you%20keep%20SAYING%20that.%20But%20everything%20about%20you%20says%20otherwise%2C%20just%20sayin'!%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22HMMMMMMMMMMMM%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Jiro%3A%20%5C%22Your%20voice%2C%20your%20mannerisms%2C%20your%20whole%20appearance...%20Everything%20about%20you%20screams%20'old%20man%20who's%20past%20his%20glory%20days'%20%5C%22%22%7D%5D%2C%22create_date%22%3A1770067003215%7D%5D%7D`;
            try {
                historyData = JSON.parse(decodeURIComponent(historyData));
            } catch (error) {
                historyData = JSON.parse(historyData);
            }
            console.log(historyData);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.history_title-cont h3').textContent = historyData.title;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chatCont = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chatCont.innerHTML = "";
                const chat = historyData.history[index];
                const pMap = new Map(chat.participants.map(p => {
                    return [p.id, {
                        avatar: p.avatar ? dataUrlToObjectUrl(p.avatar) : undefined,
                        is_human: p.is_human,
                        name: p.name
                    }];
                }));
                chat.content.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);
                    const parti = pMap.get(msg.author);

                    // Check avatar
                    const avatar = parti.avatar
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (parti.avatar) {
                        avatar.src = parti.avatar;
                    } else {
                        avatar.classList.add(parti.is_human ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = parti.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(msg.message);
                    chatCont.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                if (!chat.content.length) {
                    return;
                }
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.create_date)}</span><br /><br />` + parseMessageText(chat.content[chat.content.length - 1]?.message || "(Empty message)");
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });


            // UTILS

            function dataUrlToObjectUrl(dataUrl) {
                const img = extractFromDataURL(dataUrl);
                const blob = b64toBlob(img.base64, img.type);
                return URL.createObjectURL(blob);
            }
            function extractFromDataURL(dataURL) {
                const [meta, base64] = dataURL.split(",");
                const type = meta.slice(5, meta.indexOf(";"));
                return { type, base64 };
            }
            function b64toBlob(b64Data, contentType = '', sliceSize = 512) {
                if (!contentType) { // If contentType isn't defined, this is a data url
                    [contentType, b64Data] = b64Data.split(",");
                    contentType = contentType.slice(5, contentType.indexOf(";"));
                }
                const byteCharacters = atob(b64Data);
                const byteArrays = [];

                for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
                    const slice = byteCharacters.slice(offset, offset + sliceSize);

                    const byteNumbers = new Uint8Array(slice.length);
                    for (let i = 0; i < slice.length; i++) {
                        byteNumbers[i] = slice.charCodeAt(i);
                    }

                    byteArrays.push(byteNumbers);
                }

                const blob = new Blob(byteArrays, { type: contentType });
                return blob;
            }

            function parseMessageText(message) {
                if (typeof message == 'string') {
                    // Escape other HTML tags
                    message = escapeHTML(message);
                    // Replace ***text*** with bold-italic
                    message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                    // Replace **text** with bold
                    message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                    // Replace *text* with italic
                    message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                    // Trim and then Replace newlines (\n) with line breaks (<br>)
                    message = message.trim().replace(/\n/g, '<br>');
                }
                else if (typeof message == 'object') {
                    message = JSON.stringify(message, null, 2);
                }
                return message;
            }
            function escapeHTML(input) {
                const div = document.createElement('div');
                div.textContent = input;
                return div.innerHTML;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
