<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1.1rem;
            cursor: pointer;
            background-color: #4e9733;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .nav-new_char-btn:hover {
            background-color: #6ba755;
        }*/

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

        /*nav .char-item {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            transition: background-color 0.1s ease-in-out;
            padding: 10px 40px 10px 20px;
            cursor: pointer;
        }

        nav .char-item:hover {
            background-color: var(--rgba-1);
        }

        nav .nav-avatar-wrap {
            width: 40px;
            height: 40px;
        }

        nav .nav-avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        nav .char-item span {
            font-size: 1.3rem;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }*/

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        /*.update_current_char-btn {
            margin-left: auto;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1rem;
            align-self: center;
            cursor: pointer;
            background-color: #336c97;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .update_current_char-btn:hover {
            background-color: #5f829d;
        }*/

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .history_title-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .history_title-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })


            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

2author%22%3A1%2C%22message%22%3A%22**Toga%20whined%20and%20stamped%20her%20foot%20again%2C%20pouting%20and%20giving%20you%20a%20petulant%20look%20as%20if%20to%20say%20%5C%22you're%20getting%20on%20my%20last%20nerve.%5C%22%20She%20crossed%20her%20arms%20and%20stuck%20her%20bottom%20lip%20out%2C%20continuing%20to%20act%20like%20a%20spoiled%2C%20grumpy%20child.**%5Cn%5Cn%5C%22You're%20so%20meeean!!%5C%22%20**She%20whined%20again%2C%20continuing%20to%20throw%20her%20tantrum.**%5Cn%5Cn%5C%22I%20*need*%20your%20blood!%20Just%20a%20little%20teensy%20sip%2C%20pleeeaseeee~%3F%5C%22%20**She%20pleaded%20again%2C%20giving%20you%20that%20same%20desperate%2C%20puppy%20dog%20look%20as%20she%20tried%20to%20guilt%20trip%20you%20into%20giving%20in.**%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22tivesses%20trazido.%5Cne%20n%20bebas%20sangue%20vacah.%5CnIsso%20d%C3%A1%20cida%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**Toga%20groaned%20at%20your%20response%2C%20letting%20out%20a%20childish%20huff%20of%20annoyance.**%5Cn%5Cn%5C%22Ugh.%20I%20*know*%20that!%20Stop%20being%20a%20buzzkill!%20You%20act%20like%20*you've*%20never%20been%20thirsty%20before!%5C%22%20%5Cn%5Cn**She%20pouted%2C%20looking%20at%20you%20with%20a%20mix%20of%20irritation%20and%20childish%20petulance.**%5Cn%5Cn%5C%22All%20I%20want%20is%20a%20sip.%20Just%20a%20teensy-tiny%2C%20eensy-weensy%20little%20taste~!%5C%22%20**She%20whined%20again%2C%20still%20trying%20to%20persuade%20and%20guilt-trip%20you%20into%20giving%20in.**%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22yayaya%5Cnes%20bueda%20triste%20e%20merdas%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**Toga%20grumbled%20and%20let%20out%20another%20whiny%20huff%2C%20starting%20to%20feel%20a%20little%20frustrated%20with%20your%20stubbornness.**%5Cn%5Cn%5C%22Ugh%2C%20you're%20the%20literal%20*worst.*%20You%20don't%20even%20know%20what%20it's%20like%20to%20be%20so%20thirsty!%20I%20*need*%20your%20blood!%20Seriously%2C%20are%20you%20*really*%20going%20to%20keep%20denying%20me~%3F%5C%22%5Cn%5Cn**She%20continued%20to%20whine%20and%20pout%2C%20looking%20at%20you%20with%20a%20mix%20of%20annoyance%20and%20desperation%20in%20her%20yellow%20eyes.**%20%5Cn%5Cn%5C%22You%20know%20I'm%20going%20to%20keep%20begging%20until%20you%20give%20in%2C%20right~%3F%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22putah%20come%20uma%20bolacha%20sla%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**Toga%20groaned%20loudly%2C%20throwing%20her%20head%20back%20against%20the%20couch%20in%20childish%20frustration.**%5Cn%5Cn%5C%22Ughhhh.%20You're%20*impossible!*%20I%20don't%20want%20a%20*cookie%2C*%20I%20want%20some%20frickin'%20blood!%20I'm%20*thirsty*%2C%20you%20idiot!%5C%22%5Cn%5Cn**She%20huffed%20and%20crossed%20her%20arms%20again%2C%20her%20bottom%20lip%20sticking%20out%20as%20she%20sulked%20and%20pouted%20like%20a%20whiny%20little%20kid.**%5Cn%5Cn%5C%22Can't%20you%20just%20give%20me%20a%20*tiny*%20little%20sip~%3F%5C%22%20**She%20tried%20once%20more%2C%20still%20pleading%20and%20begging%20you%20for%20your%20blood.**%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22putah%20t%20nm%20sabes%20por%20onde%20as%20pssoas%20andam.%5Cnessa%20poha%20d%C3%A1%20sidah%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**Toga%20rolled%20her%20eyes%20at%20your%20response.**%5Cn%5Cn%5C%22Duh%2C%20I'm%20not%20an%20idiot.%20I%20know%20it%20can%20give%20people%20HIV.%20But%20guess%20what%2C%20I%20can%20control%20my%20Quirk.%20I%20won't%20actually%20go%20so%20far%20and%20drink%20all%20your%20blood%20or%20whatever%2C%20I%20just%20need%20enough%20to%20quench%20the%20damn%20*thirst.%5C%22*%20**She%20retorted%2C%20her%20frustration%20clearly%20evident%20in%20her%20voice%20as%20she%20still%20continued%20pouting.**%5Cn%5Cn%5C%22Just.%20A.%20Little.%20Tiny.%20Sip.%20Pleeeeeaseeeeee~%3F!%5C%22%20**She%20begged%20one%20last%20time%2C%20practically%20whining.**%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22putah%20eu%20comi%20duas%20ma%C3%A7%C3%A3s%20em%203%20dias.%5Cnse%20te%20dou%20sangue%20morro%20kkkk%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**Toga%20huffed%2C%20giving%20you%20an%20annoyed%20look.**%5Cn%5Cn%5C%22Oh%20yeah%2C%20that%20really%20helps%20me%20out.%20Great%20job%2C%20*genius.*%20Just%20rub%20it%20in%2C%20why%20don't%20you%3F%5C%22%20**She%20retorted%20sarcastically%2C%20rolling%20her%20eyes%20again.**%5Cn%5Cn%5C%22You're%20*so%20helpful%2C*%20you%20know%20that%3F%20You're%20just%20*really*%20good%20at%20making%20me%20feel%20better%20about%20not%20getting%20the%20one%20thing%20I%20*really*%20need%20right%20now.%5C%22%20**She%20scoffed%2C%20her%20irritation%20and%20hunger%20continuing%20to%20build.**%5Cn%5Cn%5C%22Thanks%20a%20lot%2C%20*buddy~.%5C%22*%20**She%20said%20sassily.**%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22n%20tens%20dq%2C%20putah%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**Toga's%20irritation%20only%20continued%20to%20grow%2C%20her%20patience%20slowly%20but%20steadily%20thinning.**%5Cn%5Cn%5C%22You%20don't%20have%20to%20be%20an%20asshat%20about%20it.%20You%20don't%20know%20what%20it's%20like%20to%20be%20me%2C%20to%20have%20this%20damn%20thirst%20*all*%20the%20time.%20You%20think%20I%20*wanna*%20be%20like%20this%3F%20I%20have%20no%20choice.%20It's%20either%20drink%20blood%20or%20*die%2C*%20you%20dumbass.%5C%22%20**She%20growled%20through%20clenched%20teeth%2C**%5Cn%5Cn%5C%22And%20here%20*you*%20are%2C%20completely%20refusing%20to%20give%20me%20a%20*single*%20drop%20of%20it.%20*Real*%20nice.%5C%22%22%7D%5D%2C%22create_date%22%3A1768780212045%7D%5D%7D`;
            try {
                historyData = JSON.parse(decodeURIComponent(historyData));
            } catch (error) {
                historyData = JSON.parse(historyData);
            }
            console.log(historyData);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.history_title-cont h3').textContent = historyData.title;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chatCont = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chatCont.innerHTML = "";
                const chat = historyData.history[index];
                const pMap = new Map(chat.participants.map(p => {
                    return [p.id, {
                        avatar: p.avatar ? dataUrlToObjectUrl(p.avatar) : undefined,
                        is_human: p.is_human,
                        name: p.name
                    }];
                }));
                chat.content.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);
                    const parti = pMap.get(msg.author);

                    // Check avatar
                    const avatar = parti.avatar
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (parti.avatar) {
                        avatar.src = parti.avatar;
                    } else {
                        avatar.classList.add(parti.is_human ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = parti.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(msg.message);
                    chatCont.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                if (!chat.content.length) {
                    return;
                }
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.create_date)}</span><br /><br />` + parseMessageText(chat.content[chat.content.length - 1]?.message || "(Empty message)");
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });


            // UTILS

            function dataUrlToObjectUrl(dataUrl) {
                const img = extractFromDataURL(dataUrl);
                const blob = b64toBlob(img.base64, img.type);
                return URL.createObjectURL(blob);
            }
            function extractFromDataURL(dataURL) {
                const [meta, base64] = dataURL.split(",");
                const type = meta.slice(5, meta.indexOf(";"));
                return { type, base64 };
            }
            function b64toBlob(b64Data, contentType = '', sliceSize = 512) {
                if (!contentType) { // If contentType isn't defined, this is a data url
                    [contentType, b64Data] = b64Data.split(",");
                    contentType = contentType.slice(5, contentType.indexOf(";"));
                }
                const byteCharacters = atob(b64Data);
                const byteArrays = [];

                for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
                    const slice = byteCharacters.slice(offset, offset + sliceSize);

                    const byteNumbers = new Uint8Array(slice.length);
                    for (let i = 0; i < slice.length; i++) {
                        byteNumbers[i] = slice.charCodeAt(i);
                    }

                    byteArrays.push(byteNumbers);
                }

                const blob = new Blob(byteArrays, { type: contentType });
                return blob;
            }

            function parseMessageText(message) {
                if (typeof message == 'string') {
                    // Escape other HTML tags
                    message = escapeHTML(message);
                    // Replace ***text*** with bold-italic
                    message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                    // Replace **text** with bold
                    message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                    // Replace *text* with italic
                    message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                    // Trim and then Replace newlines (\n) with line breaks (<br>)
                    message = message.trim().replace(/\n/g, '<br>');
                }
                else if (typeof message == 'object') {
                    message = JSON.stringify(message, null, 2);
                }
                return message;
            }
            function escapeHTML(input) {
                const div = document.createElement('div');
                div.textContent = input;
                return div.innerHTML;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
