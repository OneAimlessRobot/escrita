<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Writing persona tools</title>
</head>
<body>
  <h2>Enter the name of your character:</h2>
  <textarea id="textbox_name" maxlength="50" rows="1" cols="60" placeholder="Name:"></textarea>
  <p id="chars_name">0 / 50</p>
  <h2>Enter the description, now (750c):</h2>
  <textarea id="textbox_desc750" maxlength="750" rows="10" cols="80" placeholder="Desc:"></textarea>
  <p id="chars_desc750">0 / 750</p>
  <h2>Enter the description, now (1000c):</h2>
  <textarea id="textbox_desc1000" maxlength="1000" rows="10" cols="100" placeholder="Desc:"></textarea>
  <p id="chars_desc1000">0 / 1000</p>
  <h2>Enter the description, now (2250c):</h2>
  <textarea id="textbox_desc2250" maxlength="2250" rows="23" cols="100" placeholder="Desc:"></textarea>
  <p id="chars_desc2250">0 / 2250</p>

  <script>
    const textbox_name = document.getElementById('textbox_name');
    const textbox_desc750 = document.getElementById('textbox_desc750');
    const textbox_desc1000 = document.getElementById('textbox_desc1000');
    const textbox_desc2250 = document.getElementById('textbox_desc2250');
    const chars_name = document.getElementById('chars_name');
    const chars_desc750 = document.getElementById('chars_desc750');
    const chars_desc1000 = document.getElementById('chars_desc1000');
    const chars_desc2250 = document.getElementById('chars_desc2250');

    textbox_name.addEventListener('input', () => {
      chars_name.textContent = `${textbox_name.value.length} / 50`;
    });
    textbox_desc750.addEventListener('input', () => {
      chars_desc750.textContent = `${textbox_desc750.value.length} / 750`;
    });
    textbox_desc1000.addEventListener('input', () => {
      chars_desc1000.textContent = `${textbox_desc1000.value.length} / 1000`;
    });
    textbox_desc2250.addEventListener('input', () => {
      chars_desc2250.textContent = `${textbox_desc2250.value.length} / 2250`;
    });
  </script>
</body>
</html>
