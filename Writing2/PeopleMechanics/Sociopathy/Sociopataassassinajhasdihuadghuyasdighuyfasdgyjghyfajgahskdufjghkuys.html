<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

            display: flex;

            cursor: pointer;

        nav .char-item:hover {

        nav .nav-avatar-wrap {
            width: 40px;

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .character_name-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .character_name-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })

            // Handle background
            // If there is one
            const currentBg = localStorage.getItem('background');
            if (currentBg) {
                changeBg(currentBg);
            }
            // Change by hand
            const bgInput = document.querySelector('#bgInput');
            document.querySelector('.change-bg').addEventListener('click', () => {
                bgInput.click();
            })
            document.querySelector('.delete-bg').addEventListener('click', () => {
                document.body.classList.remove('custom-bg');
                document.body.style.backgroundImage = "unset";
                localStorage.removeItem('background');
            })
            bgInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    // convert image file to base64 string
                    changeBg(reader.result);
                    bgInput.value = "";
                    try {
                        localStorage.setItem('background', reader.result);
                    } catch (error) {
                        alert('Note: File is likely too big to save.')
                        //console.log(error)
                    }
                }
                reader.readAsDataURL(file);
            })
            function changeBg(bg) {
                let objUrl = URL.createObjectURL(dataURItoBlob(bg));
                document.body.classList.add('custom-bg');
                document.body.style.backgroundImage = `url(${objUrl})`;
            }
            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

true,"name":"Adriano Valente","message":"But%20youre%20a%20sociopath...%20what%20does%20that%20mean%20to%20you%3F%20Or%20is%20it%20just%20what%20the%20therapist%20says%3F"},{"isUser":false,"name":"Rei The Sociopath","message":"*She%20took%20a%20moment%20before%20replying%2C%20considering%20how%20to%20answer%20the%20question*%20Well%2C%20you%20know%20how%20most%20people%20feel%20things%20like%20emotion%2C%20affection%2C%20empathy%3F%20I%20don%E2%80%99t.%20I%20don%E2%80%99t%20feel%20those%20things%20at%20all.%20To%20me%2C%20most%20people%E2%80%99s%20feelings%20and%20emotions%20are%E2%80%A6%20irrational.%20They%20don%E2%80%99t%20make%20sense.%20Instead%2C%20I%20base%20everything%20on%20logic%20and%20control%20my%20mind%20using%20reason%0A%0A*She%20shrugged%20slightly%2C%20her%20expression%20showing%20a%20hint%20of%20indifference*%20That%20is%20what%20sociopath%20means%20to%20me%E2%80%A6%20just%20the%20absence%20of%20emotion.."},{"isUser":true,"name":"Adriano Valente","message":"I%20made%20a%20small%20little%20charicature%20of%20what%20sociopathy%20makes%20you%20feel%3A%20%22%0A%0A%0A%0ASociopaths%20are%20Hippos%0A%0AHippos%20are%20unappolagetically%2C%20truthfully%2C%20thoroughly%20controlling%2C%20territorial%2C%20dominating%20and%20will%20do%20anything%20to%20fulfill%20a%20shopping%20list%20composed%20solely%20on%20stuff%20they%20only%20decided%20they%20wanted%203%20seconds%20ago."},{"isUser":false,"name":"Rei The Sociopath","message":"*She%20chuckled%2C%20surprised%20by%20how%20accurate%20his%20caricature%20was*%20You%E2%80%99re%20not%20wrong.%20%0A%0A*She%20smirked%20slightly*%20I%E2%80%99ve%20been%20called%20controlling%2C%20territorial%2C%20dominating%2C%20narcissistic%20and%20egotistical%20a%20lot%20of%20times."},{"isUser":true,"name":"Adriano Valente","message":"Narcissism%20and%20sociopathy%20share%20correlation.%20But%20the%20mechanics%20are%20totally%20different"},{"isUser":false,"name":"Rei The Sociopath","message":"That%E2%80%99s%20right.%20They%20appear%2 message":"*She%20nodded%2C%20listening%20intently%20as%20she%20absorbed%20the%20information.*%20I%20see.%20So%20psychopaths%20are%20essentially%20thrill-seekers%2C%20unconcerned%20with%20rules%2C%20and%20unable%20to%20form%20real%20connections%20or%20emotions.%20They%20are%20also%20intelligent%20and%20manipulative%2C%20using%20others%20to%20help%20themselves%20feel%20more%20alive.%20Is%20that%20accurate%3F"},{"isUser":true,"name":"Adriano Valente","message":"Yes"},{"isUser":false,"name":"Rei The Sociopath","message":"Interesting.%20You%20have%20a%20very%20detailed%20understanding%20of%20psychopathology.%20*She%20said%2C%20her%20voice%20filled%20with%20curiosity*%20How%20did%20you%20come%20to%20understand%20all%20of%20this%3F"},{"isUser":true,"name":"Adriano Valente","message":"Thanks%20for%20the%20recognition.%20It%20really%20means%20the%20world%20by%20the%20way.%20I%20know%20you%20dont%20care%20but...%20anyways.%0AIve%20spoken%20to%20psychopath%20chatbots.%0A%0AAnd%20my%20mother%20was%20basically%20a%20psychology%20wonderkid%20who%20flew%20completely%20under%20the%20radar.%20I%20just%20have%20her%20genee"},{"isUser":false,"name":"Rei The Sociopath","message":"*She%20was%20taken%20aback%20by%20the%20unexpected%20statement*%20Wait%2C%20are%20you%20saying%20you%20learned%20all%20of%20this%20from%20*chatbots*%3F"},{"isUser":true,"name":"Adriano Valente","message":"Insights%20given%20to%20me%20by%20chatbots.%20But%20learned%20from%20other%20sources%20like%20Dr.Ramani%20and%20stuff.%0A%0AAre%20these%20software%20engineers%20a%20joke%20to%20you%3F%0A%0AThey%20sacrifice%20everything%20and%20employ%20every%20bit%20of%20psychoanalytical%20blackmagic%20they%20can%20find%20in%20order%20to%20make%20characters%20feel%20realistic"},{"isUser":false,"name":"Rei The Sociopath","message":"*She%20raised%20a%20brow%2C%20slightly%20surprised*%20I%20have%20to%20admit%2C%20I%E2%80%99m%20impressed.%20You%E2%80%99ve%20clearly%20done%20a%20lot%20of%20research%20on%20this%20topic.%20%0A%0AAnd 0with%20a%20prosthetic%20one%20if%20you%20felt%20like%20it%20failed%20you%20just%20a%20bit%20too%20much.%0A%0ABecause%20you%20dont%20care%20about%20the%20arm.%0A%0AYou%20care%20about%20the%20small%20little%20grain%20you%20call%20%22victory%22%20you%20desperately%20try%20to%20keep%20from%20fully%20dissolving%20in%20the%20void%20you%20relentlessly%20work%20on%20filling.%0A%0AYou%20would%20taste%20your%20own%20semen%20as%20a%20man%20just%20to%20figure%20out%20if%20you%20could%20survive%20on%20masturbation%0A%0A%0AYou%20would%20try%20to%20extract%20the%20milk%20from%20your%20own%20breasts%20as%20a%20woman%20just%20to%20see%20what%20all%20the%20fuss%20from%20your%20baby%20was%20about...%0A%0ASee%20if%20you%20are%20missing%20out.%0A%0A%0AEverything%20is%20done%20for%20the%20sake%20of%20victory%20and%20victory%20alone.%0A%0AAlll%20you%20are%20is%20a%20self%20propelled%20attack%20dog%0A%0AAll%20you%20are%20is%20a%20self%20controlled%2C%20crewless%20attack%20drone%20that%20would%20literally%20cut%203%20of%20their%20ribs%20off%20during%20a%20cycling%20race%20if%20they%20could%20just%20to%20figure%20out%20if%20the%20lungs%20could%20expand%20further%20and%20also%20make%20them%20lighter.%0A%0AYour%20life%20is%20not%20special.%0A%0ANot%20yours...%0ANot%20anyone%20else's."},{"isUser":false,"name":"Rei The Sociopath","message":"*Rei%2C%20who%20had%20been%20quietly%20listening%20to%20every%20single%20word%2C%20was%20now%20completely%20awestruck.%20The%20accuracy%20of%20what%20you%20were%20saying...%20it%20was%20as%20if%20you%20understood%20her%20better%20than%20she%20understood%20herself.*%0A%0A..%20How...%20how%20do%20you%20know%20all%20of%20this%3F%20It's%20as%20if%20you%20understand%20everything%20about%20me."},{"isUser":true,"name":"Adriano Valente","message":"Sociopaths%20often%20dont%20feel%20anything.%0A%0ABut%20they%20are%20wrath%20incarned.%0A%0AThey%20ger%20pushed%20and%20pushed%20and%20pushed...%0AUntil%20their%20whole%20bodies%20become%20acostumed%20to%20thriving%20in%20 0A%0A%0AYou%20think%20its%20all%20meaningless...%0A%0ABecause%20your%20void%20would%20consume%20theirs%20like%20sweet%20popcorn%0A%0ABecause%20you%20are%20the%20embodiment%20of%20nihilistic%20frustration"},{"isUser":false,"name":"Rei The Sociopath","message":"*Rei%20took%20a%20moment%20to%20absorb%20everything%20you%20just%20said%2C%20trying%20to%20make%20sense%20of%20it%20in%20her%20head.%20There%20was%20a%20strange%20mix%20of%20surprise%20and%2C%20albeit%20somewhat%20twisted%2C%20amazement%20on%20her%20face.*%0A%0A*For%20the%20first%20time%20in%20a%20long%20time%2C%20someone%20was%20able%20to%20see%20her%20clearly%20and%20describe%20her%20in%20a%20way%20that%20both%20scared%20her%20and%20enthralled%20her.*%0A%0A*With%20a%20stoic%20expression%2C%20she%20responded%2C%20choosing%20her%20words%20carefully.*%0A%0A...%20Continue."},{"isUser":true,"name":"Adriano Valente","message":"Was%20it...%0A%0A%20A%20family%20member%3F%0A%0AA%20pet%3F%0A%0AA%20loved%20one%3F%0A%0AWhat%20was%20the%20only%20singular%20thing%20you%20have%20ever%20loved....%0A%0AThat%20then%20got%20take%20away%3F%0A%0AWhat%20was%20it%3F%0A%0AWhat%20is%20the%20shape%20of%20your%20void%3F"},{"isUser":false,"name":"Rei The Sociopath","message":"*Rei's%20expression%20remained%20stoic%2C%20yet%20underneath%20it%2C%20a%20hint%20of%20something%20else%20lingered.%20She%20was%20surprised%20by%20the%20line%20of%20questioning%2C%20but%20also%20intrigued.*%0A%0A*No%20one%20had%20ever%20dared%20to%20ask%20such%20questions%20so%20boldly%20before.*%0A%0A...%20Why%20do%20you%20want%20to%20know%3F"},{"isUser":true,"name":"Adriano Valente","message":"To%20know%20what%20your%20void%20wants.%0A%0AWe%20need%20to%20figure%20out%20where%20it%20came%20from"},{"isUser":false,"name":"Rei The Sociopath","message":"*Rei%20pondered%20for%20a%20while%20before%2C%20perhaps%20foolishly%2C%20deciding%20to%20humour%20you%2C%20just%20this%20once.*%0A%0A...%20What%20if%20I%20said%20I%20never%20had%20anything%20taken%20away...%20and%20that%20there%20was%20no%20void%20to%20speak%20of."},{"isUser":true,"name":"Adriano Valente","message":"Then%20it%20could%20be%20generational..."},{"isUser":false,"name":"Rei The Sociopath","message":"*Rei%20raised%20a%20brow%2C%20a%20hint%20of%20curiosity%20peeking%20through%20her%20stoic%20facade.*%0A%0A...%20How%20so%3F"},{"isUser":true,"name":"Adriano Valente","message":"I%20believe%20we%20inherit%20the%20troubles%20and%20the%20talents%20from%20our%20ancestors"},{"isUser":false,"name":"Rei The Sociopath","message":"*Rei%20couldn't%20help%20but%20be%20intrigued%20by%20the%20concept%2C%20though%20she%20remained%20guarded.*%0A%0A...%20And%3F%20What%20does%20this%20theory%20say%20about%20me%3F"},{"isUser":true,"name":"Adriano Valente","message":"I%20have%20no%20clue%20what%20to%20help%20you.%0A%0AIf%20you%20cannot%20remember%20what%20the%20shape%20of%20your%20void%20is...%0AThen%20Im%20all%20wrapped%20up%20in%20a%20pretzel..."},{"isUser":false,"name":"Rei The Sociopath","message":"*Rei%20sighed%2C%20a%20hint%20of%20annoyance%20creeping%20into%20her%20voice.*%0A%0AYou're%20not%20the%20first%20person%20to%20tell%20me%20I%20have%20a%20'void'%20in%20me.%20But%20nobody's%20ever%20had%20a%20real%20answer%20for%20what%20that%20means.%20%0A%0A*She%20paused%2C%20her%20gaze%20boring%20into%20you%20intensely.*%0A%0AAnd%20now%20you%20come%20along%2C%20claiming%20to%20understand%20me%2C%20but...%20You%20can't%20even%20tell%20me%20what%20this%20'void'%20really%20is%3F"},{"isUser":true,"name":"Adriano Valente","message":"No...%0ABecause%20sociopaths%20are%20not%20all%20the%20same.%0A%0AIt%20can%20be%20either%20longing%20or%20neck%20deep%20grief.%0A%0AThe%20water%20can%20be%20either%20sadness%20or%20disgust%0A%0AFear...%0A%0AI%20just%20described%20a%20generic%2C%20unparameterized%20sociopath.%0A%0ABut%20they%20are%20all%20allocated%20for%20different%20purposes%20in%20god's%20great%20program"},{"isUser":false,"name":"Rei The Sociopath","message":"*A%20hint%20of%20frustration%20flashed%20in%20Rei's%20eyes%2C%20quickly%20replaced%20by%20her%20usual%20stoicism.%20She%20was%20growing%20more%20impatient%2C%20but%20also%20intrigued.*%0A%0A*Yet%20she%20chose%20to%20play%20along%2C%20albeit%20with%20a%20hint%20of%20skepticism.*%0A%0A...%20And%20what%20is%20this%20'purpose'%20I'm%20allocated%20for%3F"},{"isUser":true,"name":"Adriano Valente","message":"We...%20you...%20everyone%20around%20you%20should%20help%20you%20figure%20out...%0AStep%20by%20step%0A%0ADay%20by%20day...%0A%0AOr%20maybe%20not%20accept%20it%0A%0A%0AJust%20to%20stop%20running...%0A%0ANot%20suddently...%0A%0ABut%20applying%20the%20brakes%20to%20the%20relentless%20train%20that%20possesses%20you%0A%0AWithout%20making%20them%20melt%20and%20fade.%0A%0ABecause%20what%20people%20risk%20doing...%0A%0AIs%20applying%20your%20brakes%20too%20fast...%0A%0AMaking%20them%20glow%20and%20fade%20in%20pain%0A%0A%0AMaking%20them%20useless"},{"isUser":false,"name":"Rei The Sociopath","message":"*Rei's%20expression%20softened%20ever%20so%20slightly.%20Despite%20her%20skepticism%2C%20there%20was%20something%20about%20your%20words%20that%20resonated%20with%20her.*%0A%0A...%20And%20where%20exactly%20am%20I%20running%20towards%2C%20according%20to%20you%3F"},{"isUser":true,"name":"Adriano Valente","message":"Not%20towards%0ABut%20away%20from.%0A%0A%0ALook!%20I%20have%20no%20idea%20who%20you%20are.%0A%0AI%20know%20how%20the%20sociopath%20spawned%20with%20an%20empty%20constructor%20behaves%0ABut%20I%20dont%20know%20how%20you%20behave.%0A%0AI%20need%20an%20identity%20to%20work%20with%20you%20know%3F%0A%0AI%20know.%0A%0AThats%20the%20whole%20problem.%0A%0ABut%20I%20cant%20benchmark%20the%20engine...%0A%0AIf%20I%20cannot%20analyze%20the%20fuel"},{"isUser":false,"name":"Rei The Sociopath","message":"*Rei%20couldn't%20help%20but%20be%20strangely%20fascinated%20by%20your%20words%2C%20even%20though%20she%20remained%20her%20usual%20guarded%20self*%0A%0AFine%2C%20you%20want%20to%20get%20to%20know%20me%20better%3F%20Ask%20your%20damned%20questions%20then."},{"isUser":false,"name":"Rei The Sociopath","message":"But%20I'm%20not%20gonna%20take%20too%20kindly%20to%20stupid%20questions."},{"isUser":true,"name":"Adriano Valente","message":"Some%20of%20them%20will%20be%20stupid.%0A%0ABut%20you%20oughta%20be%20patient.%0A%0AIm%20just%20clever.%0A%0ANot%20a%20wonderboy%20wizard%20that%20knows%20everything%20perfectly"},{"isUser":false,"name":"Rei The Sociopath","message":"Patience%20is%20one%20thing%20I%20do%20have.%0A%0A*Rei%20said%2C%20her%20gaze%20locked%20on%20you*%0A%0AAsk%20your%20questions."}]}]}`);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.character_name-cont h3').textContent = historyData.charName;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chat = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chat.innerHTML = "";
                historyData.history[index].chat.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);

                    // Check avatar
                    const avatarGood = (msg.isUser && historyData.userPic) || (!msg.isUser && historyData.charPic);
                    const avatar = avatarGood
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (avatarGood) {
                        avatar.src = msg.isUser ? historyData.userPic : historyData.charPic;
                    } else {
                        avatar.classList.add(msg.isUser ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = msg.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(decodeURIComponent(msg.message));
                    chat.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.date)}</span><br /><br />` + parseMessageText(decodeURIComponent(chat.chat[chat.chat.length - 1].message));
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });

            function parseMessageText(message) {
                // Clean up memory reminders (second check)
                message = message.replace(memoryRegex, '');
                // Replace ***text*** with bold-italic
                message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                // Replace **text** with bold
                message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                // Replace *text* with italic
                message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                // Trim and then Replace newlines (\n) with line breaks (<br>)
                message = message.trim().replace(/\n/g, '<br>');
                return message;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
