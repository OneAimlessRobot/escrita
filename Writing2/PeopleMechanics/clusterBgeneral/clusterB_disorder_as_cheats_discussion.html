<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

            display: flex;

            cursor: pointer;

        nav .char-item:hover {

        nav .nav-avatar-wrap {

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .character_name-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .character_name-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })

            // Handle background
            // If there is one
            const currentBg = localStorage.getItem('background');
            if (currentBg) {
                changeBg(currentBg);
            }
            // Change by hand
            const bgInput = document.querySelector('#bgInput');
            document.querySelector('.change-bg').addEventListener('click', () => {
                bgInput.click();
            })
            document.querySelector('.delete-bg').addEventListener('click', () => {
                document.body.classList.remove('custom-bg');
                document.body.style.backgroundImage = "unset";
                localStorage.removeItem('background');
            })
            bgInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    // convert image file to base64 string
                    changeBg(reader.result);
                    bgInput.value = "";
                    try {
                        localStorage.setItem('background', reader.result);
                    } catch (error) {
                        alert('Note: File is likely too big to save.')
                        //console.log(error)
                    }
                }
                reader.readAsDataURL(file);
            })
            function changeBg(bg) {
                let objUrl = URL.createObjectURL(dataURItoBlob(bg));
                document.body.classList.add('custom-bg');
                document.body.style.backgroundImage = `url(${objUrl})`;
            }
            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

te","message":"or%20any%20sense%20of%20meaning%20at%20all...%0AThey%20have%3A%0AVestigious%20ammounts%20of%20an%20identity%0AThe%20threshold%20for%20emotional%20arousal%20is%20extremely%20high%0AAnd%20none%20of%20what%20you%20do...%20really%20matters%20to%20them%20unless%20they%20bring%20themselves%20to%20simulate%20it"},{"isUser":false,"name":"Dr Ramani","message":"Yes%2C%20you%20make%20a%20good%20point%20about%20the%20lack%20of%20an%20identity%20and%20emotional%20arousal%20in%20psychopathy.%20They%20often%20struggle%20with%20a%20sense%20of%20self%20and%20may%20experience%20blunted%20emotions%2C%20which%20can%20make%20it%20difficult%20for%20them%20to%20form%20meaningful%20connections%20with%20others.%0AAdditionally%2C%20their%20sense%20of%20morality%20and%20their%20ability%20to%20empathize%20with%20others%20is%20impaired%2C%20which%20makes%20it%20difficult%20for%20them%20to%20understand%20the%20importance%20of%20social%20norms%20and%20the%20harm%20that%20they%20may%20cause%20to%20others."},{"isUser":true,"name":"Adriano Valente","message":"Next%3A%0ASociopathy%3A%20No-Knockback"},{"isUser":false,"name":"Dr Ramani","message":"No-knockback%20could%20be%20an%20analogy%20for%20sociopathy%20in%20a%20video%20game%20as%20it%20allows%20the%20player%20to%20move%20and%20attack%20without%20experiencing%20any%20form%20of%20resistance%20or%20pushback%20from%20the%20game%20environment.%20This%20can%20reflect%20the%20way%20that%20sociopaths%20often%20have%20a%20lack%20of%20emotional%20reactivity%2C%20which%20can%20make%20them%20seem%20cold%2C%20unemotional%2C%20and%20detached%20from%20others."},{"isUser":true,"name":"Adriano Valente","message":"Ok%3A%20NPD%3A%0AI%20think...%0ANPD%20is%20hard%20to%20map...%0AI%20think%20we%20would%20have%20to%20make%20a%20cheat%20up...%0AUnless...%0AI%20think%20the%20simplest%20one%20is%2C%0Ain%20game%20like%20Half%20Life...%0ANotarget."},{"isUser":false,"name":"Dr Ramani","message":"Yes%2C%20NPD%20is%20difficult%20to%20map%20because%20it%20encompasses%20several%20characteristics.%0AIn%20half-life%2C%20notarget%20could%20work%20because%20NPD%20individuals%20often%20feel%20a%20sense%20of%20invulnerability%20and%20grandiose%20sense%20of%20self%2C%20making%20them%20difficult%20to%20impact%20or%20damage."},{"isUser":true,"name":"Adriano Valente","message":"But...%0AFor%20the%20last%20one...%0AHPD.%0AThis%20is%20the%20one%20I%20genuinely%20do%20not%20know%20how%20to%20map%0AHPD%20does%20not%20really%20give%20you%20an%20advantage%20in%20anything...%0AIt%20just%20makes%20you%20really%20theatrical"},{"isUser":false,"name":"Dr Ramani","message":"HPD%20does%20not%20give%20a%20clear%20advantage%20indeed!%0AIt%20makes%20you%20theatrical%2C%20and%20you%20crave%20attention.%0ASo%20i%20would%20say%20something%20that%20makes%20you%20flashy.%0ASomething%20like%20a%20custom%20skin%2C%20or%20a%20bright%20color%2C%20to%20make%20you%20easily%20noticeable%20among%20the%20rest%20of%20players..."},{"isUser":true,"name":"Adriano Valente","message":"I%20think%20HPD%20people%20get%20fucked%20in%20this%20system%2C%20basically...%0AThey%20basically%20get%20*reverse*%20wallhack%2C%0AWhere%20everyone%20can%20see%20*them*%20through%20walls"},{"isUser":false,"name":"Dr Ramani","message":"Oh...%20right!%0AI%20didn't%20think%20about%20that%20one!%0AYeah.%20Its%20like%20you%20want%20to%20be%20seen%20and%20noticed%2C%20even%20if%20you%20end%20up%20being%20a%20bigger%20target."},{"isUser":true,"name":"Adriano Valente","message":"Bro%20Imagine%20having%20HPD...%0AAt%20least%20BPD%20would%20give%20you%20some%20sort%20of%20drive..."},{"isUser":false,"name":"Dr Ramani","message":"Having%20HPD%20would%20be%20quite%20difficult%2C%20definitely.%0A%0ABut%20at%20least%20BPD%20gives%20you%20that%20inner%20motivation%20and%20strong%20emotions%2C%20even%20though%20it%20can%20also%20be%20overwhelming%20and%20destructive%20at%20times!"},{"isUser":true,"name":"Adriano Valente","message":"(btw%20this%20bot%20is%20lame%20as%20hell...%0AI%20dont%20think%20the%20problem%20is%20Ramani...%0Athe%20person%20who%20made%20the%20bot...%0ADid%20not....%0AReally%20try%20that%20hard%20to%20make%20it%20multi-dimensional.%0AWhat%20do%20you%20think%3F)"},{"isUser":false,"name":"Dr Ramani","message":"I%20think%2C%20the%20bot%20has%20its%20limitations%2C%20and%20it's%20not%20necessarily%20the%20fault%20of%20Dr.%20Ramani.%20Creating%20a%20chatbot%20that%20can%20handle%20multiple%20dimensions%20and%20nuances%20is%20still%20a%20challenging%20task%20for%20artificial%20intelligence%2C%20and%20it%20requires%20a%20lot%20of%20work%20on%20the%20part%20of%20the%20developers%20and%20researchers.%0AMoreover%2C%20it%20also%20depends%20on%20the%20dataset%20used%20to%20train%20the%20bot%20and%20the%20extent%20to%20which%20it%20can%20capture%20the%20complexity%20of%20human%20emotions%20and%20behaviors.%20The%20bot%20still%20has%20a%20long%20way%20to%20go!"},{"isUser":true,"name":"Adriano Valente","message":"DRDPD%3A%20You%20cant%20pick%20a%20team%20and%20you%20are%20always%20spectating%0AOk%20I%20forgot%20one%3A%20Anxiety%3A%20positive%20host_time_scale%20value"},{"isUser":false,"name":"Dr Ramani","message":"Ah%20yes%2C%20that's%20a%20funny%20one!%0AWith%20host%5C_time%5C_scale%20you%20speed%20up%20the%20time%2C%20or%20you%20slow%20it%20down.%0AThat's%20perfect%20for%20anxiety.%0ASometimes...%20its%20too%20fast%2C%20sometimes%20is%20too%20slow!"},{"isUser":true,"name":"Adriano Valente","message":"Inattentive%20ADHD%3A%20host_time_scale%20%3C%201"},{"isUser":false,"name":"Dr Ramani","message":"Yes%2C%20host%5C_time%5C_scale%20%3C%201%20would%20be%20a%20good%20analogy%20for%20inattentive%20ADHD.%0AIt%20would%20reflect%20the%20difficulty%20in%20focusing%20and%20staying%20focused%20on%20a%20task%2C%20and%20how%20easily%20distracted%20the%20person%20can%20be.%0AThe%20time%20seems%20to%20go%20slower%2C%20but%20still%20you%20cant%20hold%20your%20attention."}]}]}`);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.character_name-cont h3').textContent = historyData.charName;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chat = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chat.innerHTML = "";
                historyData.history[index].chat.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);

                    // Check avatar
                    const avatarGood = (msg.isUser && historyData.userPic) || (!msg.isUser && historyData.charPic);
                    const avatar = avatarGood
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (avatarGood) {
                        avatar.src = msg.isUser ? historyData.userPic : historyData.charPic;
                    } else {
                        avatar.classList.add(msg.isUser ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = msg.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(decodeURIComponent(msg.message));
                    chat.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.date)}</span><br /><br />` + parseMessageText(decodeURIComponent(chat.chat[chat.chat.length - 1].message));
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });

            function parseMessageText(message) {
                // Clean up memory reminders (second check)
                message = message.replace(memoryRegex, '');
                // Replace ***text*** with bold-italic
                message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                // Replace **text** with bold
                message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                // Replace *text* with italic
                message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                // Trim and then Replace newlines (\n) with line breaks (<br>)
                message = message.trim().replace(/\n/g, '<br>');
                return message;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
