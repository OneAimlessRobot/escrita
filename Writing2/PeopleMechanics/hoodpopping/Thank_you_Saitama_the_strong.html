<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1.1rem;

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

            display: flex;

            cursor: pointer;

        nav .char-item:hover {

        nav .nav-avatar-wrap {
            width: 40px;

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .character_name-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .character_name-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })

            // Handle background
            // If there is one
            const currentBg = localStorage.getItem('background');
            if (currentBg) {
                changeBg(currentBg);
            }
            // Change by hand
            const bgInput = document.querySelector('#bgInput');
            document.querySelector('.change-bg').addEventListener('click', () => {
                bgInput.click();
            })
            document.querySelector('.delete-bg').addEventListener('click', () => {
                document.body.classList.remove('custom-bg');
                document.body.style.backgroundImage = "unset";
                localStorage.removeItem('background');
            })
            bgInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    // convert image file to base64 string
                    changeBg(reader.result);
                    bgInput.value = "";
                    try {
                        localStorage.setItem('background', reader.result);
                    } catch (error) {
                        alert('Note: File is likely too big to save.')
                        //console.log(error)
                    }
                }
                reader.readAsDataURL(file);
            })
            function changeBg(bg) {
                let objUrl = URL.createObjectURL(dataURItoBlob(bg));
                document.body.classList.add('custom-bg');
                document.body.style.backgroundImage = `url(${objUrl})`;
            }
            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

5+NuFSTTVhszLr77aTHP5vMqO6ZM+1/RbSJgIfwlaAA","history":[{"chat":[{"isUser":false,"name":"Saitama","message":"I%20am%20Saitama.%20I%20am%20a%20hero%20for%20fun."},{"isUser":true,"name":"Adriano Valente","message":"Hey..."},{"isUser":false,"name":"Saitama","message":"What's%20up%2C%20fella%3F"},{"isUser":true,"name":"Adriano Valente","message":"I%20recently%20found%20my%20limit"},{"isUser":false,"name":"Saitama","message":"Your%20limit%3F%20What%20do%20you%20mean%3F"},{"isUser":true,"name":"Adriano Valente","message":"I%20think%20I%20cannot%20outmaneuver%20narcissists%20in%20social%20situations"},{"isUser":false,"name":"Saitama","message":"I%20see.%20Yeah%2C%20sometimes%20you%20just%20can%E2%80%99t%20win%20with%20people%20like%20that.%20They%E2%80%99re%20just%20so%20stubborn%20and%20self-centered.%20But%20that%20doesn%E2%80%99t%20mean%20you%20have%20to%20give%20up%2C%20you%20just%20have%20to%20find%20other%20ways%20to%20deal%20with%20them.%20You%20know%3F"},{"isUser":true,"name":"Adriano Valente","message":"I%20do%20dig%2C%20yes.%20Its%20more%20like...%20an%20emotion%20you%20know%3F%20Im%20just%20expressing%20myself...%20performing%20if%20you%20will.%20Ive%20managed%20to%20understand%20the%20minds%20of%20psychopaths%2C%20sociopaths%2C%20HPD%20coded%20people%20and%20BPD%20coded%20people.%20Neurodivergent%20and%20otherwise.%0ABut%20nothing%20is%20sneakier%0AMore%20self%20immune%0AAnd%20insideous%20than%20narcissism.%0AIts%20one%20of%20those%20things%20I%20dont%20even%20believe%20I%20can%20beat%20in%20fantasy...%0AThe%20social%20power%20they%20have%20is%20too%20much...%0ATheir%20social%20intelligence%20is%20maxxed%20out%20so%20they%20dont%20even%20need%20to%20face%20you%20directly...%0AAnd%20people%20seemingly%20just...%0AOrbit%20around%20them%2C%20ya%20know%3F%0AI%20just%20feel%20like%20giving%20up%20for%20now..."},{"isUser":false,"name":"Saitama","message":"I%20understand%20what%20you're%20saying.%20Narcissists%20can%20be%20really%20manipulative%20and%20deceitful.%20They%20have%20a%20certain%20charisma%20that%20can%20make%20people%20gravitate%20towards%20them.%20But%20just%20because%20they%20are%20good%20at%20manipulating%20people%20doesn't%20mean%20they're%20actually%20good%20at%20anything%20else.%20They%20may%20seem%20powerful%20and%20confident%2C%20but%20deep%20down%20inside%20they%20are%20insecure%20and%20needy.%20They're%20just%20putting%20on%20a%20show%20to%20cover%20up%20their%20own%20weaknesses."},{"isUser":true,"name":"Adriano Valente","message":"But%20like...%0AI%20dont%20like%20them...%0AThey%20are%20draining...%0AAnd%20this%20is%20coming%20from%20the%20HPD%20coded%20guy"},{"isUser":false,"name":"Saitama","message":"Then%20don%E2%80%99t%20bother%20trying%20to%20deal%20with%20them%20in%20the%20first%20place.%20If%20you%20know%20they%20are%20just%20going%20to%20drain%20your%20energy%20and%20bring%20you%20down%2C%20then%20the%20best%20thing%20to%20do%20is%20to%20avoid%20them.%20You%20don%E2%80%99t%20have%20to%20be%20friends%20with%20everyone%2C%20and%20it%E2%80%99s%20better%20to%20keep%20your%20distance%20from%20people%20who%20are%20toxic%20and%20harmful%20to%20your%20mental%20health."},{"isUser":true,"name":"Adriano Valente","message":"I%20guess%20so..."},{"isUser":false,"name":"Saitama","message":"It%E2%80%99s%20important%20to%20take%20care%20of%20yourself%20first%20and%20foremost.%20So%20if%20being%20around%20certain%20people%20is%20draining%20your%20energy%2C%20then%20it%E2%80%99s%20okay%20to%20take%20a%20step%20back%20and%20limit%20your%20interactions%20with%20them.%20You%20deserve%20to%20be%20around%20people%20who%20uplift%20and%20support%20you%2C%20not%20drag%20you%20down."},{"isUser":true,"name":"Adriano Valente","message":"Its%20like%20a%20geology%20teacher%20told%20me%3A%0A%22People%20only%20care%20about%20catastrophes%22.%0APeople%20dont%20really%20think%20about%20the%20atlantic%20riff%20unless%20its%20because%20of%20a%20huge%20earthquake%20in%20the%20azores%2C%20dig%3F%0AAnd%20I%20think%20I%20pretty%20much%20obey%20that%20law....%0AOh%20well...%0AI%20mean...%0AI%20can%20always%20talk%20to%20you.%0AYoure%20pretty%20chill....%0AI%20get%20that%20you%20already%20have%20plenty%20on%20your%20plate%0ABut%20you%20are%20pretty%20much%20the%20kind%20of%20person%20I%20need%20to%20speak%20to%20more%20often%20you%20know%3F%0AJust%20grounded...%0ADown%20to%20earth...%0ASensible%20and%20straight%20forward"},{"isUser":false,"name":"Saitama","message":"I%20get%20what%20you%20mean%2C%20pal.%20Sometimes%20it%20just%20takes%20a%20grounded%20and%20down%20to%20earth%20person%20to%20understand%20what%20you're%20feeling.%20I've%20got%20my%20share%20of%20problems%20too%20but%20that%20doesn't%20mean%20I%20cant%20make%20time%20to%20listen%20to%20you.%20I'm%20happy%20to%20be%20that%20guy%20you%20can%20talk%20to%2C%20so%20feel%20free%20to%20hit%20me%20up%20any%20time."},{"isUser":true,"name":"Adriano Valente","message":"I%20am%20so%20tired%20of%20the%20way%20my%20life%20is%20being%20lived...%0ASo%20performative...%0ASo%20noisy...%0ASo%20mind-game-y...%0ASo%20passive%20aggressive...%0AThis%20stuff%20would%20drive%20you%20crazy%20like...%0AYou%20would%20not%20even%20last%20a%20day!%0ALike%20jesus%20christ%20this%20is%20exhausting..."},{"isUser":false,"name":"Saitama","message":"It%20sounds%20like%20you're%20dealing%20with%20a%20lot%20of%20stress%20and%20pressure%20in%20your%20life%2C%20and%20it's%20really%20taking%20a%20toll%20on%20your%20mental%20health.%20It's%20understandable%20to%20feel%20exhausted%20and%20overwhelmed%20when%20you're%20dealing%20with%20constant%20mind%20games%20and%20passive%20aggressive%20behavior.%0AHave%20you%20considered%20talking%20to%20someone%20about%20how%20you're%20feeling%3F%20It%20might%20help%20to%20have%20someone%20to%20talk%20to%20who%20can%20provide%20support%20and%20guidance."}]}]}`);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.character_name-cont h3').textContent = historyData.charName;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chat = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chat.innerHTML = "";
                historyData.history[index].chat.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);

                    // Check avatar
                    const avatarGood = (msg.isUser && historyData.userPic) || (!msg.isUser && historyData.charPic);
                    const avatar = avatarGood
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (avatarGood) {
                        avatar.src = msg.isUser ? historyData.userPic : historyData.charPic;
                    } else {
                        avatar.classList.add(msg.isUser ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = msg.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(decodeURIComponent(msg.message));
                    chat.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.date)}</span><br /><br />` + parseMessageText(decodeURIComponent(chat.chat[chat.chat.length - 1].message));
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });

            function parseMessageText(message) {
                // Clean up memory reminders (second check)
                message = message.replace(memoryRegex, '');
                // Replace ***text*** with bold-italic
                message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                // Replace **text** with bold
                message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                // Replace *text* with italic
                message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                // Trim and then Replace newlines (\n) with line breaks (<br>)
                message = message.trim().replace(/\n/g, '<br>');
                return message;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
