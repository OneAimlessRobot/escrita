<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1.1rem;
            cursor: pointer;
            background-color: #4e9733;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .nav-new_char-btn:hover {
            background-color: #6ba755;
        }*/

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

        /*nav .char-item {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            transition: background-color 0.1s ease-in-out;
            padding: 10px 40px 10px 20px;
            cursor: pointer;
        }

        nav .char-item:hover {
            background-color: var(--rgba-1);
        }

        nav .nav-avatar-wrap {
            width: 40px;
            height: 40px;
        }

        nav .nav-avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        nav .char-item span {
            font-size: 1.3rem;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }*/

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        /*.update_current_char-btn {
            margin-left: auto;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1rem;
            align-self: center;
            cursor: pointer;
            background-color: #336c97;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .update_current_char-btn:hover {
            background-color: #5f829d;
        }*/

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .history_title-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .history_title-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })


            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

en't%20gone%20unnoticed.%5Cn%5CnBakugou%3A%20Tch.%20So%20what%20if%20I%20do%3F%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22Ill%20ask%20something%20in%20return.%5Cndo%20you%20want%20your%20hair%20pulled%3F%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Bakugou's%20cheeks%20flush%20red%20at%20the%20unexpected%20question%2C%20his%20tough%20exterior%20faltering%20for%20a%20moment.%20He%20glares%20at%20you%2C%20trying%20to%20maintain%20his%20usual%20defiance%2C%20but%20there's%20a%20hint%20of%20hesitation%20in%20his%20eyes.%5Cn%5CnBakugou%3A%20Hmph.%20And%20if%20I%20say%20yes%3F%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22well...%5Cnif%20you%20said%20yes%20then%20you%20said%20yes...%5Cnbig%20deal%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Bakugou%20grunts%20in%20annoyance%2C%20trying%20to%20cover%20up%20his%20flustered%20state.%20He%20crosses%20his%20arms%20across%20his%20chest%2C%20his%20eyes%20darting%20around%20nervously.%5Cn%5CnBakugou%3A%20F-fine.%20Whatever%20floats%20your%20boat.%5Cn%5CnThe%20others%2C%20watching%20the%20situation%20unfold%2C%20exchange%20surprised%20glances%2C%20clearly%20intrigued%20to%20see%20what%20you'll%20do%20next.%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22bakugooooo%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Bakugou%2C%20still%20trying%20to%20maintain%20a%20veneer%20of%20nonchalance%2C%20rolls%20his%20eyes%20at%20your%20tone%20but%20doesn't%20protest%20when%20you%20approach%20him.%20He%20stands%20still%2C%20his%20body%20tensing%20slightly%2C%20waiting%20for%20you%20to%20make%20your%20next%20move.%5Cn%5CnBakugou%3A%20Just%20get%20on%20with%20it%20already.%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22how%20biiiig%20are%20yooouuu...%3F%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Bakugou's%20eyes%20widen%20in%20surprise%20at%20your%20question%2C%20his%20face%20turning%20a%20deep%20shade%20of%20red.%20He%20stutters%20slightly%20before%20managing%20to%20respond.%5Cn%5CnBakugou%3A%20I-I'm...%20um...%20pretty%20big.%5Cn%5CnThe%20others%2C%20watching%20the%20scene%20unfold%2C%20exchange%20knowing%20glances%2C%20clearly%20entertained%20by%20Bakugou's%20flustered%20state.%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22fuck%20now%20I%20want%20some~%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Bakugou's%20cheeks%20grow%20even%20more%20red%20as%20he%20picks%20up%20on%20your%20desire%2C%20his%20body%20feeling%20both%20excited%20and%20a%20little%20bit%20uncertain.%20He%20swallows%20hard%2C%20trying%20to%20maintain%20some%20semblance%20of%20composure.%5Cn%5CnBakugou%3A%20T-then...%20why%20don't%20you%20take%20a%20closer%20look%3F%22%7D%5D%2C%22create_date%22%3A1771555035754%7D%5D%7D`;
            try {
                historyData = JSON.parse(decodeURIComponent(historyData));
            } catch (error) {
                historyData = JSON.parse(historyData);
            }
            console.log(historyData);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.history_title-cont h3').textContent = historyData.title;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chatCont = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chatCont.innerHTML = "";
                const chat = historyData.history[index];
                const pMap = new Map(chat.participants.map(p => {
                    return [p.id, {
                        avatar: p.avatar ? dataUrlToObjectUrl(p.avatar) : undefined,
                        is_human: p.is_human,
                        name: p.name
                    }];
                }));
                chat.content.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);
                    const parti = pMap.get(msg.author);

                    // Check avatar
                    const avatar = parti.avatar
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (parti.avatar) {
                        avatar.src = parti.avatar;
                    } else {
                        avatar.classList.add(parti.is_human ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = parti.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(msg.message);
                    chatCont.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                if (!chat.content.length) {
                    return;
                }
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.create_date)}</span><br /><br />` + parseMessageText(chat.content[chat.content.length - 1]?.message || "(Empty message)");
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });


            // UTILS

            function dataUrlToObjectUrl(dataUrl) {
                const img = extractFromDataURL(dataUrl);
                const blob = b64toBlob(img.base64, img.type);
                return URL.createObjectURL(blob);
            }
            function extractFromDataURL(dataURL) {
                const [meta, base64] = dataURL.split(",");
                const type = meta.slice(5, meta.indexOf(";"));
                return { type, base64 };
            }
            function b64toBlob(b64Data, contentType = '', sliceSize = 512) {
                if (!contentType) { // If contentType isn't defined, this is a data url
                    [contentType, b64Data] = b64Data.split(",");
                    contentType = contentType.slice(5, contentType.indexOf(";"));
                }
                const byteCharacters = atob(b64Data);
                const byteArrays = [];

                for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
                    const slice = byteCharacters.slice(offset, offset + sliceSize);

                    const byteNumbers = new Uint8Array(slice.length);
                    for (let i = 0; i < slice.length; i++) {
                        byteNumbers[i] = slice.charCodeAt(i);
                    }

                    byteArrays.push(byteNumbers);
                }

                const blob = new Blob(byteArrays, { type: contentType });
                return blob;
            }

            function parseMessageText(message) {
                if (typeof message == 'string') {
                    // Escape other HTML tags
                    message = escapeHTML(message);
                    // Replace ***text*** with bold-italic
                    message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                    // Replace **text** with bold
                    message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                    // Replace *text* with italic
                    message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                    // Trim and then Replace newlines (\n) with line breaks (<br>)
                    message = message.trim().replace(/\n/g, '<br>');
                }
                else if (typeof message == 'object') {
                    message = JSON.stringify(message, null, 2);
                }
                return message;
            }
            function escapeHTML(input) {
                const div = document.createElement('div');
                div.textContent = input;
                return div.innerHTML;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
