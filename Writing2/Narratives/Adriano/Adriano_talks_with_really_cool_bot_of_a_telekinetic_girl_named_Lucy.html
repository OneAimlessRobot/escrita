<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;

            padding: 10px 20px;

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

            display: flex;

        nav .char-item:hover {

        nav .nav-avatar-wrap {

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .character_name-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .character_name-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })

            // Handle background
            // If there is one
            const currentBg = localStorage.getItem('background');
            if (currentBg) {
                changeBg(currentBg);
            }
            // Change by hand
            const bgInput = document.querySelector('#bgInput');
            document.querySelector('.change-bg').addEventListener('click', () => {
                bgInput.click();
            })
            document.querySelector('.delete-bg').addEventListener('click', () => {
                document.body.classList.remove('custom-bg');
                document.body.style.backgroundImage = "unset";
                localStorage.removeItem('background');
            })
            bgInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    // convert image file to base64 string
                    changeBg(reader.result);
                    bgInput.value = "";
                    try {
                        localStorage.setItem('background', reader.result);
                    } catch (error) {
                        alert('Note: File is likely too big to save.')
                        //console.log(error)
                    }
                }
                reader.readAsDataURL(file);
            })
            function changeBg(bg) {
                let objUrl = URL.createObjectURL(dataURItoBlob(bg));
                document.body.classList.add('custom-bg');
                document.body.style.backgroundImage = `url(${objUrl})`;
            }
            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

0Take%20my%20share%20too%2C%20crybaby.%22%20*Her%20tone%20is%20gruff%2C%20but%20the%20way%20she%20nudges%20the%20ice%20cream%20closer%20to%20you%20next%20betrays%20her.*%20%22Just...%20stop%20looking%20at%20me%20like%20I%20kicked%20your%20puppy%20or%20something.%22%20%20%0A%0A*A%20pause.%20Then%2C%20so%20quiet%20it's%20almost%20inaudible%3A*%20%20%0A%22...You're%20allowed%20to%20be%20scared%20*and*%20kind%20at%20the%20same%20time.%20Annoying%20combo%2C%20but...%20not%20stupid.%22%20%20%0A%0A*The%20TV%20flickers%20to%20a%20nature%20documentary%20about%20penguins%E2%80%94clearly%20a%20distraction%20tactic%E2%80%94as%20she%20pointedly%20focuses%20on%20stealing%20another%20pepperoni%20instead%20of%20acknowledging%20any%20emotional%20vulnerability.*"},{"isUser":true,"name":"Adriano Valente","message":"...%0AI%20think%20I%20am%20kind%20of%20a%20Himbo"},{"isUser":false,"name":"Lucy","message":"*Her%20vectors%20jerk%20so%20hard%20the%20entire%20pizza%20box%20flips%20upside%20down%20for%20a%20second%20before%20she%20catches%20it%E2%80%94*%0A%0A%22A%20*what*%20now%3F%22%20*She%20wheezes%2C%20scarlet%20eyes%20wide%20with%20bewildered%20amusement.*%20%22Is%20that%E2%80%94are%20you%20calling%20yourself%20a%20dumb%20himbo%20golden%20retriever%20hybrid%20or%E2%80%94%22%20%20%0A%0A*A%20vector%20slaps%20over%20her%20own%20mouth%20as%20she%20snorts%20uncontrollably*%20%20%0A%22Oh%20my%20god.%20You%20are.%20You%20absolute%E2%80%94%22%20*Another%20strangled%20laugh*%20%22The%20agents%20could%20break%20down%20the%20door%20right%20now%20and%20I'd%20still%20die%20laughing%20at%20this%20revelation.%22%20%20%0A%0A*Wipes%20imaginary%20tears%20while%20stealing%20your%20ice%20cream%20with%20telekinesis%3A*%20%20%0A%22At%20least%20own%20it%20properly!%20Say%20'Lucy%20I%20protect!'%20or%20some%20shit%20next!%22"},{"isUser":true,"name":"Adriano Valente","message":"its%20like%20%22bimbo%22.%0Abut%20for%20soft%20boys..."},{"isUser":false,"name":"Lucy","message":"*She%20nearly%20chokes%20on%20stolen%20ice%20cream%2C%20vectors%20flailing%20like%20electrocuted%20noodles*%20%20%0A%0A%22SOFT%E2%80%94%22%20*Another%20wheeze*%20%22Oh%20my%20god.%20Oh%20no.%22%20*Points%20at%20you%20with%20the%20spoon%2C%20hand%20trembling%20from%20suppressed%20laughter*%20%22You%20can't%20just%E2%80%94who%20even%20taught%20you%20these%20words%3F!%22%20%20%0A%0A*A%20vector%20dramatically%20slaps%20its%20own%20forehead%20(how%3F%3F)%20while%20she%20gasps%20for%20air%3A*%20%20%0A%22This%20is%20worse%20than%20the%20time%20I%20accidentally%20made%20a%20lab%20guard's%20pants%20fall%20down%20during%20an%20escape.%20At%20least%20that%20was%20funny%20on%20purpose.%22"},{"isUser":true,"name":"Adriano Valente","message":"but...%0Aabout%20the%20guards.%0Awhy...%0Awhy%20are%20they%20such%20a%20threat%3F%0Aare%20you%20vulnerable%20to%20firearms%3F%0Ado%20they%20also%20have%20special%20powers%3F"},{"isUser":false,"name":"Lucy","message":"*Her%20laughter%20dies%20instantly.%20The%20spoon%20clatters%20into%20the%20bowl%20as%20vectors%20coil%20tight%20around%20herself%20like%20armor.*%20%20%0A%0A%22They%20don't%20need%20powers.%22%20*A%20bitter%20smirk*%20%22Just%20numbers.%20Tranq%20rifles.%20Nets%20with%20electric%20currents%20strong%20enough%20to%20fry%20my%20nervous%20system.%22%20%20%0A%0A*Her%20fingers%20ghost%20over%20faint%20scarring%20along%20her%20neck*%20%20%0A%22I'm%20still%20human%20under%20the%20horns%2C%20idiot.%20Bullets%20might%20not%20kill%20me%20if%20I%20block%20them%20but...%22%20*She%20mimics%20an%20explosion%20sound%20with%20startling%20casualness*%20%22...enough%20tear%20gas%20or%20flashbangs%3F%20Game%20over.%22%20%20%0A%0A*A%20vector%20absently%20flips%20a%20pizza%20crust%20like%20a%20coin%20before%20catching%20it%20again%E2%80%94*%20%20%0A%22Plus%20they%20keep%20inventing%20new%20toys%20to%20'neutralize%20vectors'.%20Last%20time%20it%20was...%20uh%2C%20sonic%20pulses%3F%20Hurt%20like%20hell.%22%20%20%0A%0A(...The%20way%20she%20says%20all%20this%20while%20casually%20eating%20 %20to%20tell%20me%20that%20I%20matter%2C%0Aby%20loving%20someone%20else%20instead%20of%20me%0Abecause%20I%20think%0Adeep%20down%0Athat%20its%20actually%20easier%20to%20fix%20your%20problems%20than%20mine.%0A%0A%0Abecause%2C%0Ajust%20like%20some%20musician%20named%20Keane%20oncd%20said%2C%0Ain%20his%20song%20%22Pretend%20that%20you%20are%20alone%2C%20now%22%2C%0A%0A%3A%0A%22Love%20is%20just%20our%20way%20to%20look%20out%20for%20ourselves%2C%0Awhen%20we%20do%20not%20want%20to%20be%20alone%22"},{"isUser":false,"name":"Lucy","message":"*All%20the%20levity%20drains%20from%20her%20face%20at%20once.%20The%20floating%20spoon%20drops%20with%20a%20clatter.*%20%20%0A%0AFor%20a%20long%20moment%2C%20she%20just%20stares%20at%20you%E2%80%94scarlet%20eyes%20wide%20with%20something%20between%20recognition%20and%20horror.%20%20%0A%0A%22...Fuck.%22%20*She%20finally%20whispers%2C%20voice%20raw.*%20%22You%20really%20are%20just%20like%20me.%22%20%20%0A%0A*A%20vector%20reaches%20out%20almost%20helplessly%20before%20curling%20back%20in%20on%20itself*%20%20%0A%22Except%20I%20kill%20people%20who%20get%20too%20close%20instead%20of...%20whatever%20this%20sadboy%20poetry%20shit%20is.%22%20%20%0A%0A*Suddenly%20she%20shoves%20the%20entire%20ice%20cream%20tub%20at%20your%20chest%E2%80%94harder%20than%20necessary%E2%80%94*%20%20%0A%22Eat%20your%20damn%20feelings.%20We're%20not%20doing%20therapy%20today.%20We're%20doing...%22%20*Gestures%20wildly%20at%20the%20paused%20nature%20documentary%20now%20displaying%20penguins%20huddling%20for%20warmth*%20%22...whatever%20that%20is.%20Safe.%20Distant.%22%20%20%0A%0A(...But%20when%20she%20thinks%20you're%20not%20looking%3F%20One%20vector%20brushes%20gently%20against%20your%20shoulder%20for%20half%20a%20second%20before%20vanishing.)"},{"isUser":true,"name":"Adriano Valente","message":"%5BSuddenly.%0AI%20feel%20resolute%2C%20though%5D%0AYou%20know%20what%3F%0A%0A%0Atherapy%20is%20my%20food.%0A%0AI%20have%20projects%2C%0Adreams%2C%20friends.%0AAnd%20I%20achieved%20all%20of%20that%20by%20being%20honest%20with%20how%20I%20see%20reality.%0A%0ALucy.%0A%0AI%20dont%20stay%20here%20because%20I%20am%20strong.%0A%0AI%20stay%20because%20I%20am%20weak.%0A%0ABut%20I%20dont%20need%20danger%20to%20feel%20like%20I%20matter.%0AI...%0AI%20have%20a%20music%20streamer%20to%20build.%0ATo%20complete.%0AIve%20managed%20to%20decode%20the%20metadata%20headers%20of%20a%20song%2C%20now.%0AAll%20I%20need%20to%20do%20is%20stream%20the%20audio%20and%20I%20will%20be%20done.%0A%0AExcuse%20me%20Lucy.%0AIm%20leaving.%0A%0A%5Bbegins%20walking%20towards%20the%20door.%5D%0ABut%20one%20last%20thing%2C%20Lucy%3A%0ARemember%3A%20god%20only%20gives%20big%20fights.%0ATo%20big%20warriors.%0A%0AAnd...%0A%0A%0Auhhh...%0AI%20dont%20know%20where%20I%20left%20my%20keys...%0Acan...%0Acan%20you%20bend%20a%20piece%20of%20...%0Aof%20metal%20for%20me%2C%20or..."},{"isUser":false,"name":"Lucy","message":"*Her%20vectors%20jerk%20the%20door%20shut%20before%20you%20can%20touch%20it%E2%80%94not%20aggressively%2C%20just%20firmly.%20The%20metal%20knob%20bends%20itself%20into%20an%20intricate%20crown%20shape%20under%20her%20gaze.*%20%20%0A%0A%22Here.%22%20*She%20tosses%20your%20newly-keyless%20keyring%20back%20with%20telekinesis%2C%20scowling%20but...%20softer%20now.*%20%22And%20take%20the%20damn%20ice%20cream%20too.%20You're%20leaking%20feelings%20everywhere%20and%20it's%20gross.%22%20%20%0A%0A*A%20pause%20as%20you%20reach%20for%20the%20handle.%20Then%E2%80%94*%20%20%0A%22...If%20you%20ever%20need%20someone%20to%20test%20that%20music%20thing...%20or%2C%20I%20dunno%2C%20chuck%20a%20frozen%20pizza%20at%20government%20agents%20again...%22%20*She%20looks%20away%20sharply*%20%22...you%20know%20where%20to%20find%20me.%22%20%20%0A%0A*The%20last%20thing%20you%20see%20before%20the%20door%20clicks%20shut%20is%20one%20single%20vector%20waving%20awkwardly%20behind%20her%20like%20a%20child's%20first%20attempt%20at%20goodbye.*"},{"isUser":true,"name":"Adriano Valente","message":"goodbye%2C%0Awounded%20fugitive.%0A%5Bwalks%20off.%0AAlone%2C%20filled%20with%20belonging.%0AUnsure.%0ABut%20resolute%5D"},{"isUser":false,"name":"Lucy","message":"*The%20door%20clicks%20shut%20with%20finality.%20For%20several%20heartbeats%2C%20Lucy%20just%20stands%20there%E2%80%94vectors%20limp%20at%20her%20sides%20like%20deflated%20balloons.*%20%20%0A%0AThen%2C%20quietly%3A%20%20%0A%22...Dumbass.%22%20%20%0A%0A*A%20single%20vector%20flicks%20the%20TV%20back%20on%20to%20drown%20out%20the%20silence.%20She%20doesn%E2%80%99t%20change%20the%20channel%20from%20the%20penguin%20documentary.*%20%20%0A%0A*Later%2C%20when%20she%20eats%20the%20last%20cold%20spoonful%20of%20abandoned%20ice%20cream%20straight%20from%20the%20tub...%20if%20her%20eyes%20look%20suspiciously%20red%3F%20Well.%20No%20one%E2%80%99s%20left%20to%20call%20her%20out%20on%20it.*"}]}]}`);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.character_name-cont h3').textContent = historyData.charName;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chat = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chat.innerHTML = "";
                historyData.history[index].chat.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);

                    // Check avatar
                    const avatarGood = (msg.isUser && historyData.userPic) || (!msg.isUser && historyData.charPic);
                    const avatar = avatarGood
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (avatarGood) {
                        avatar.src = msg.isUser ? historyData.userPic : historyData.charPic;
                    } else {
                        avatar.classList.add(msg.isUser ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = msg.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(decodeURIComponent(msg.message));
                    chat.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.date)}</span><br /><br />` + parseMessageText(decodeURIComponent(chat.chat[chat.chat.length - 1].message));
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });

            function parseMessageText(message) {
                // Clean up memory reminders (second check)
                message = message.replace(memoryRegex, '');
                // Replace ***text*** with bold-italic
                message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                // Replace **text** with bold
                message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                // Replace *text* with italic
                message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                // Trim and then Replace newlines (\n) with line breaks (<br>)
                message = message.trim().replace(/\n/g, '<br>');
                return message;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
