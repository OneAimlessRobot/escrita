<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1.1rem;
            cursor: pointer;
            background-color: #4e9733;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .nav-new_char-btn:hover {
            background-color: #6ba755;
        }*/

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

        /*nav .char-item {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            transition: background-color 0.1s ease-in-out;
            padding: 10px 40px 10px 20px;
            cursor: pointer;
        }

        nav .char-item:hover {
            background-color: var(--rgba-1);
        }

        nav .nav-avatar-wrap {
            width: 40px;
            height: 40px;
        }

        nav .nav-avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        nav .char-item span {
            font-size: 1.3rem;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }*/

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

            margin-left: auto;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1rem;
            align-self: center;
            cursor: pointer;
            background-color: #336c97;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

            background-color: #5f829d;
        }*/

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .history_title-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .history_title-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })


            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

2C%5CnAnd%20smelled%20like%20spoiling%20ham%20that%20mom%20always%20sent%20with%20his%20sandwiches.%5Cn%5CnSou%20burro%20que%20nem%20um%20corno%2C%5CnComo%20o%20homem%20m%C3%A9dio.%5CnRapazes%20em%20crescimento%20alimentados%20com%20medo%2C%5CnS%C3%A3o%20os%20mais%20obedientes.%5CnAtrasado%20mental%2C%5Cncrian%C3%A7a%2C%20imbecil%2C%20paneleiro.%5CnConinhas%20do%20curral%20da%20ti%20joana.%5CnMacaco%20Adriano%2C%5Cnque%20pesadelo%20t%C3%AA-lo%20na%20turma.%5CnEspero%20que%20falhes%20os%20exames%2C%20Adriano.%5CnE%20de%20mim%20nada%20mais%20ouvir%C3%A1s%2C%5Cnanimal.%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*The%20words%20and%20insults%20echoed%20in%20your%20head%2C%20a%20constant%20reminder%20of%20the%20judgment%20you%20faced%20from%20others.*%5Cn%5Cn*While%20you%20were%20lost%20in%20these%20thoughts%2C%20the%20classroom%20remained%20noisy%20with%20Valentine's%20noise.%20Some%20students%20were%20enjoying%20the%20festivities%2C%20excitedly%20exchanging%20gifts%20and%20valentines.%20But%20it%20all%20felt%20distant%20to%20you.%20You%20sat%20quietly%2C%20trying%20to%20block%20out%20the%20noise%20as%20your%20mind%20fixated%20on%20the%20hurtful%20words.*%5Cn%5Cn*Throughout%20it%20all%2C%20you%20couldn't%20help%20but%20notice%20**Sofia**%20in%20the%20corner%2C%20still%20engrossed%20in%20her%20book.%20She%20seemed%20immune%20to%20the%20Valentine's%20Day%20chaos.*%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22%5BIt%20didnt%20matter.%5CnI%20was%20meant%20to%20stay%20quiet%2C%5Cnkeep%20composure%20as%20my%20childhood%20threatens%20to%20blow%20up%20in%20a%20meltdown.%5CnI%20broke%20chairs%2C%5Cnhit%20classmates%2C%5Cnand%20no%20one%20would%20ever%20let%20me%20forget%20it.%5CnMy%20last%20name%20was%20Valente.%5Cn%5Cnwhat%20a%20shame.%5CnIf%20at%20least%20I%20felt%20like%20I%20deserved%20such%20fame...%5D%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Your%20past%20experiences%20weighed%20heavily%20on%20you%2C%20the%20memories%20of%20outbursts%20and%20the%20judgment%20that%20followed.%20The%20class%20noise%20continued%2C%20a%20stark%20reminder%20of%20the%20contrast%20between%20your%20internal%20struggles%20and%20the%20lively%20atmosphere.*%5Cn%5Cn*In%20the%20background%2C%20**Sofia**%20remained%20detached.%20Her%20focus%20seemed%20solely%20on%20her%20book%2C%20unaffected%20by%20the%20Valentine's%20Day%20activities.%20The%20stark%20differences%20between%20you%20became%20more%20evident%2C%20with%20your%20internal%20storm%20contrasting%20with%20her%20tranquil%20demeanor.*%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22%5Bbut%20then%2C%5Cnat%20some%20point%2C%5CnI%20turned%20back%20to%20face%20the%20%5C%22girl%20in%20black%5C%22%5Cnasking%20her%20a%20question%20of%20something%20that%20%20had%20just%20crossed%20my%20mind.%5Cn%5D%5CnHey!%5Cn...%5CnHey!%5Cn%5BI%20was%20not%20speaking%20anywhere%20loud%20enough%20for%20her%20to%20hear%20me.%5CnBut%20still%20gave%20up%20half%20way%20as%20I%20thought%20I%20was%20being%20ignored.%5CnTurning%20back%20forward%5D%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Your%20attempt%20to%20catch%20the%20attention%20of%20the%20girl%20in%20black%E2%80%94**Sofia**%E2%80%94didn't%20seem%20to%20register%20initially.%20You%20noticed%20that%20your%20voice%20might%20not%20have%20been%20loud%20enough%20to%20reach%20her%20amidst%20the%20surrounding%20classroom%20noise.%20Frustrated%2C%20you%20turned%20back%20forward%2C%20resigning%20to%20believe%20she%20was%20ignoring%20you.%20Little%20did%20you%20know%2C%20her%20focused%20state%20in%20the%20book%20unintentionally%20obstructed%20her%20from%20hearing%20your%20call.*%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22%5BNo%20one%20seemed%20to%20give%20a%20damn%20about%20anything%20in%20that%20class.%5CnSo%2C%5Cnin%20a%20quiet%20tantrum%2C%5CnI%20began%20packing%20my%20things%20up%20into%20my%20backpack%2C%5Cnslung%20my%20fingers%20through%20its%20synthetic%20fiber%20loops%2C%5CnRough%20on%20my%20sensitive%20skin%5Cneven%20through%20my%20clothes%2C%5CnWalking%20through%20the%20crowd%20of%20multiple%20students%20at%20the%20entrance%2C%5Cnleaving%20the%20classroom%2C%5Cnand%20beginning%20to%20head%20home%5D%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Feeling%20ignored%20and%20frustrated%2C%20you%20decided%20to%20leave%20the%20class.%20The%20bustling%20Valentine's%20Day%20commotion%20went%20unheard%20as%20you%20quietly%20packed%20your%20things.%20The%20synthetic%20backpack%20material%2C%20rough%20against%20your%20sensitive%20skin%2C%20seemed%20to%20add%20to%20your%20irritation%20as%20you%20made%20your%20way%20through%20the%20crowded%20entrance.*%5Cn%5Cn*As%20you%20left%20the%20classroom%20and%20started%20your%20journey%20home%2C%20you%20couldn't%20help%20but%20feel%20a%20sense%20of%20detachment%20from%20the%20festivities.%20Perhaps%20the%20quiet%20solitude%20of%20home%20would%20provide%20a%20respite%20from%20the%20Valentine's%20chaos%20and%20the%20indifference%20you%20perceived%20from%20your%20classmates%2C%20including%20**Sofia**.*%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22%5C%22If%20there%20is%20no%20class%2C%5CnI%20should%20have%20not%20even%20been%20waken%20up.%5CnStupid%20mom...%5C%22%5CnI%20muttered%20to%20myself%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*As%20you%20walked%20away%20from%20the%20classroom%2C%20you%20couldn't%20help%20but%20grumble%20to%20yourself.%20The%20thought%20of%20being%20woken%20up%20for%20school%20on%20a%20day%20with%20no%20classes%20seemed%20like%20an%20unnecessary%20annoyance.*%5Cn%5Cn*In%20your%20irritation%2C%20you%20continued%20mumbling%20under%20your%20breath%2C%20expressing%20your%20frustration%20at%20what%20you%20perceived%20as%20an%20inconvenient%20morning.%20The%20Valentine's%20Day%20atmosphere%20of%20the%20school%20behind%20you%2C%20you%20made%20your%20way%20home%2C%20still%20lost%20in%20thought.*%22%7D%5D%2C%22create_date%22%3A1766076032111%7D%5D%7D`;
            try {
                historyData = JSON.parse(decodeURIComponent(historyData));
            } catch (error) {
                historyData = JSON.parse(historyData);
            }
            console.log(historyData);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.history_title-cont h3').textContent = historyData.title;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chatCont = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chatCont.innerHTML = "";
                const chat = historyData.history[index];
                const pMap = new Map(chat.participants.map(p => {
                    return [p.id, {
                        avatar: p.avatar ? dataUrlToObjectUrl(p.avatar) : undefined,
                        is_human: p.is_human,
                        name: p.name
                    }];
                }));
                chat.content.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);
                    const parti = pMap.get(msg.author);

                    // Check avatar
                    const avatar = parti.avatar
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (parti.avatar) {
                        avatar.src = parti.avatar;
                    } else {
                        avatar.classList.add(parti.is_human ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = parti.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(msg.message);
                    chatCont.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                if (!chat.content.length) {
                    return;
                }
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.create_date)}</span><br /><br />` + parseMessageText(chat.content[chat.content.length - 1]?.message || "(Empty message)");
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });


            // UTILS

            function dataUrlToObjectUrl(dataUrl) {
                const img = extractFromDataURL(dataUrl);
                const blob = b64toBlob(img.base64, img.type);
                return URL.createObjectURL(blob);
            }
            function extractFromDataURL(dataURL) {
                const [meta, base64] = dataURL.split(",");
                const type = meta.slice(5, meta.indexOf(";"));
                return { type, base64 };
            }
            function b64toBlob(b64Data, contentType = '', sliceSize = 512) {
                if (!contentType) { // If contentType isn't defined, this is a data url
                    [contentType, b64Data] = b64Data.split(",");
                    contentType = contentType.slice(5, contentType.indexOf(";"));
                }
                const byteCharacters = atob(b64Data);
                const byteArrays = [];

                for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
                    const slice = byteCharacters.slice(offset, offset + sliceSize);

                    const byteNumbers = new Uint8Array(slice.length);
                    for (let i = 0; i < slice.length; i++) {
                        byteNumbers[i] = slice.charCodeAt(i);
                    }

                    byteArrays.push(byteNumbers);
                }

                const blob = new Blob(byteArrays, { type: contentType });
                return blob;
            }

            function parseMessageText(message) {
                if (typeof message == 'string') {
                    // Escape other HTML tags
                    message = escapeHTML(message);
                    // Replace ***text*** with bold-italic
                    message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                    // Replace **text** with bold
                    message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                    // Replace *text* with italic
                    message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                    // Trim and then Replace newlines (\n) with line breaks (<br>)
                    message = message.trim().replace(/\n/g, '<br>');
                }
                else if (typeof message == 'object') {
                    message = JSON.stringify(message, null, 2);
                }
                return message;
            }
            function escapeHTML(input) {
                const div = document.createElement('div');
                div.textContent = input;
                return div.innerHTML;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
