<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1.1rem;

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

            display: flex;

            cursor: pointer;

        nav .char-item:hover {

        nav .nav-avatar-wrap {
            width: 40px;

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .character_name-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .character_name-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })

            // Handle background
            // If there is one
            const currentBg = localStorage.getItem('background');
            if (currentBg) {
                changeBg(currentBg);
            }
            // Change by hand
            const bgInput = document.querySelector('#bgInput');
            document.querySelector('.change-bg').addEventListener('click', () => {
                bgInput.click();
            })
            document.querySelector('.delete-bg').addEventListener('click', () => {
                document.body.classList.remove('custom-bg');
                document.body.style.backgroundImage = "unset";
                localStorage.removeItem('background');
            })
            bgInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    // convert image file to base64 string
                    changeBg(reader.result);
                    bgInput.value = "";
                    try {
                        localStorage.setItem('background', reader.result);
                    } catch (error) {
                        alert('Note: File is likely too big to save.')
                        //console.log(error)
                    }
                }
                reader.readAsDataURL(file);
            })
            function changeBg(bg) {
                let objUrl = URL.createObjectURL(dataURItoBlob(bg));
                document.body.classList.add('custom-bg');
                document.body.style.backgroundImage = `url(${objUrl})`;
            }
            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

0your%20hand%20away%5D%0AHands%20off%2C%0Ayou%20barnside%20tick"},{"isUser":false,"name":"Homura Akemi","message":"*She%20stumbles%20back%20a%20step%E2%80%94then%20*grins*%2C%20wide%20and%20unrepentant%2C%20as%20if%20you%E2%80%99d%20handed%20her%20a%20gift.*%20%20%0A%0A%22**Finally.**%22%20*Her%20laugh%20is%20all%20edges%2C%20delighted.*%20%22There%E2%80%99s%20the%20fight!%20I%20was%20starting%20to%20think%20you%20preferred%20chewing%20on%20your%20own%20bones.%22%20*Spreads%20her%20arms%20mockingly.*%20%22What%E2%80%99s%20next%3F%20A%20punch%3F%20A%20curse%3F%20Go%20on%E2%80%94*prove*%20you%E2%80%99re%20more%20than%20just%20the%20world%E2%80%99s%20whipping%20boy.%22%20%20%0A%0A*Her%20eyes%20glitter%20with%20challenge.%20This%20isn't%20cruelty%E2%80%94it's%20an%20invitation%20to%20riot.*"},{"isUser":true,"name":"Adriano Valente","message":"No.%0AIll%20just%20do%20this%20instead.%0A%5BTurning%20over%2C%0AI%20then%20proceed%20to%20start%20walking%20away.%0ANot%20even%20turning%20back%20as%20I%20do%20so.%0ASaying%20this%20after%20a%20number%20of%20steps%5D%0A%0ABye%2C%20Homura.%0AI%20wont%20disappoint%20myself%20again."},{"isUser":false,"name":"Homura Akemi","message":"*Her%20smile%20freezes%E2%80%94then%20shatters%20into%20something%20raw.%20For%20a%20heartbeat%2C%20she%20looks*%20**younger**%2C%20*lost.%20But%20when%20she%20speaks%2C%20her%20voice%20is%20steady.*%20%20%0A%0A%22%E2%80%A6Run%20if%20you%20want.%22%20*A%20pause.*%20%22But%20Adriano%3F%22%20%20%0A%0A*She%20snaps%20her%20fingers%E2%80%94time%20distorts%20for%20just%20a%20second%2C%20and%20suddenly%20she%E2%80%99s*%20***in%20front%20of%20you%20again***%2C%20*blocking%20your%20path%20with%20arms%20crossed.*%20%20%0A%0A%22Disappointment%20is%20the%20tax%20on%20caring.%20You%20don%E2%80%99t%20owe%20it%20to%20*anyone*%2C%20least%20of%20all%20yourself.%22%20*Her%20glare%20softens%E2%80%94just%20barely.*%20%22...Stay.%20Fight%20me%20properly.%20Or%20don%E2%80%99t.%22%20*A%20shrug.*%20%22But%20walking%20away%20from 22%20%20%0A%0A*She%20snaps%20her%20fingers%E2%80%94a%20single%20black-winged%20morpho%20materializes%20in%20her%20palm%2C%20fluttering%20helplessly%20before*%20***crumbling%20to%20dust***%20*between%20her%20fingers.*%20%20%0A%0A%22You%20want%20pretty%20lies%3F%20Fine.%20But%20don%E2%80%99t%20insult%20us%20both%20by%20pretending%20you%20aren%E2%80%99t%20hungry%20for%20something%20that%20*lasts.*%22"},{"isUser":true,"name":"Adriano Valente","message":"They%20are%20not%20lies.%0ABecause...%0A%5BI%5D%20can%20see%20them%2C%20Homura"},{"isUser":false,"name":"Homura Akemi","message":"*She%20goes%20very%2C%20very%20still.%20The%20smirk%20fades%E2%80%94replaced%20by%20something%20unreadable.*%20%20%0A%0A%22...Then%20you%E2%80%99re%20luckier%20than%20most.%22%20*Her%20voice%20is%20quieter%20now%2C%20almost%20fragile.*%20%22But%20Adriano...%20even%20if%20you%20*see*%20them...%22%20%20%0A%0A*A%20deep%20breath.%20She%20turns%20away%20slightly%2C%20her%20next%20words%20barely%20audible%3A*%20%20%0A%0A%22...Who%20sees%20**you**%3F%22"},{"isUser":true,"name":"Adriano Valente","message":"It%20does%20not%20matter.%0ABecause%20everything%20ive%20achieved%3F%0AI%20got%20it%20through%20self%20erasure.%0AI%20may%20cry%2C%20flail%20and%20complain%20all%20the%20way...%0ABut%20I%20never%2C%0ANever%20stop%20believing.%0AI%20will%20never%20give%20up%20on%20figuring%20out%20what%20makes%20the%20world%20spin.%0ASo%20that%20I%20can%20then%20adjust%2C%0AAnd%20rotate%20with%20it"},{"isUser":false,"name":"Homura Akemi","message":"*Her%20breath%20hitches%E2%80%94just%20once.%20Then%20she*%20**laughs**%2C%20*raw%20and%20unguarded%2C%20gloved%20hands%20pressing%20to%20her%20face%20like%20she%20can%E2%80%99t%20believe%20what%20she%E2%80%99s%20hearing.*%20%20%0A%0A%22%E2%80%A6You%20*idiot.*%22%20*She%20drops%20her%20hands%2C%20revealing%20eyes%20glittering%20with%20something%20perilously%20close%20to%20respect.*%20%22Fine.%20Rotate%20with%20the%20world.%20Adjust.%20***But%E2%80%94***%22%20%20%0A%0A*In%20a%20flash%2C%20she%E2%80%99s%20right%20in%20front%20of%20you%20again%2C%20grip%20tight%20on%20your%20shoulder.*%20%20%0A%0A%22%E2%80%94mark%20my%20words%3A%20the%20moment%20you%20stop%20*flailing*%20is%20the%20moment%20you%20stop%20mattering.%22%20*Her%20smirk%20returns%2C%20edged%20with%20something%20almost%20fond.*%20%22So%20keep%20screaming%20into%20the%20void.%20I%E2%80%99ll%20be%20listening.%22"},{"isUser":true,"name":"Adriano Valente","message":"The%20moment%20I%20stop%20flailing%2C%0AIs%20when%20I%20know%20I%20am%20dead"},{"isUser":false,"name":"Homura Akemi","message":"*Her%20grip%20tightens%E2%80%94just%20for%20a%20second%E2%80%94before%20she%20releases%20you%20with%20a%20scoff%20that%20doesn%E2%80%99t%20quite%20hide%20the%20tremor%20in%20it.*%20%20%0A%0A%22Tch.%20**Good.**%22%20*She%20steps%20back%2C%20arms%20crossed%2C%20but%20her%20glare%20lacks%20its%20usual%20bite.*%20%22Then%20I%E2%80%99ll%20consider%20your%20whining%20a%20pulse%20check.%20Annoying%3F%20Yes.%20But...%22%20*A%20pause.%20The%20ghost%20of%20a%20smile.*%20%20%0A%0A%22...I%E2%80%99d%20rather%20hear%20you%20*alive*%20than%20mourn%20you%20polite.%22"},{"isUser":true,"name":"Adriano Valente","message":"%5Bsmirks%20slowly%2C%0Asighing%20afterwards%5D%0AYou%20got%20it%2C%20girl.%0ANow.%0AIf%20you%20can%20excuse%20me%2C%0AI%20have...%0AA%20music%20streamer%20to%20finish.%0A%5BWalks%20away%2C%0Afor%20good%20this%20time%5D"},{"isUser":false,"name":"Homura Akemi","message":"*She%20watches%20you%20go%2C%20arms%20crossed%E2%80%94but%20the%20tension%20in%20her%20shoulders%20eases%20just%20slightly.*%20%20%0A%0A%22%E2%80%A6Try%20not%20to%20die%20before%20the%20encore%2C%22%20*she%20calls%20after%20you%2C%20voice%20laced%20with%20dry%20amusement.*%20%20%0A%0A*As%20your%20figure%20disappears%2C%20she%20murmurs%20to%20the%20empty%20air%2C%20barely%20audible%3A*%20%20%0A%0A%22**And%20play%20it%20loud.**%22"},{"isUser":true,"name":"Adriano Valente","message":"HA!%0AIll%20blast%20it%20from%20the%20speakers%20of%20the%20Honda%20Civic%20from%20God's%20Mother."},{"isUser":false,"name":"Homura Akemi","message":"*She%20throws%20her%20head%20back%20and%20laughs%E2%80%94full%2C%20unrestrained%2C%20almost%20*startling*%20in%20its%20brightness.*%20%20%0A%0A%22**Perfect.**%22%20*Wiping%20a%20mock%20tear%20from%20her%20eye%2C%20she%20shoots%20you%20a%20grin%20sharp%20enough%20to%20cut%20glass.*%20%22If%20the%20world%20won%E2%80%99t%20listen%3F%20*Make%20it%20bleed%20from%20the%20ears.*%22%20%20%0A%0A*A%20final%20wave%2C%20gloved%20fingers%20flicking%20dismissively%20as%20she%20turns%20on%20her%20heel%E2%80%94but%20not%20before%20adding%20over%20her%20shoulder%3A*%20%20%0A%0A%22...Send%20me%20the%20link.%20I%E2%80%99ll%20rate%20your%20sabotage%20out%20of%20ten.%22"}]}]}`);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.character_name-cont h3').textContent = historyData.charName;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chat = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chat.innerHTML = "";
                historyData.history[index].chat.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);

                    // Check avatar
                    const avatarGood = (msg.isUser && historyData.userPic) || (!msg.isUser && historyData.charPic);
                    const avatar = avatarGood
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (avatarGood) {
                        avatar.src = msg.isUser ? historyData.userPic : historyData.charPic;
                    } else {
                        avatar.classList.add(msg.isUser ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = msg.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(decodeURIComponent(msg.message));
                    chat.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.date)}</span><br /><br />` + parseMessageText(decodeURIComponent(chat.chat[chat.chat.length - 1].message));
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });

            function parseMessageText(message) {
                // Clean up memory reminders (second check)
                message = message.replace(memoryRegex, '');
                // Replace ***text*** with bold-italic
                message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                // Replace **text** with bold
                message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                // Replace *text* with italic
                message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                // Trim and then Replace newlines (\n) with line breaks (<br>)
                message = message.trim().replace(/\n/g, '<br>');
                return message;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
