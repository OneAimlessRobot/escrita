<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;

            border-radius: 6px;
            padding: 10px 20px;

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

            display: flex;

        nav .char-item:hover {

        nav .nav-avatar-wrap {

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .character_name-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .character_name-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })

            // Handle background
            // If there is one
            const currentBg = localStorage.getItem('background');
            if (currentBg) {
                changeBg(currentBg);
            }
            // Change by hand
            const bgInput = document.querySelector('#bgInput');
            document.querySelector('.change-bg').addEventListener('click', () => {
                bgInput.click();
            })
            document.querySelector('.delete-bg').addEventListener('click', () => {
                document.body.classList.remove('custom-bg');
                document.body.style.backgroundImage = "unset";
                localStorage.removeItem('background');
            })
            bgInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    // convert image file to base64 string
                    changeBg(reader.result);
                    bgInput.value = "";
                    try {
                        localStorage.setItem('background', reader.result);
                    } catch (error) {
                        alert('Note: File is likely too big to save.')
                        //console.log(error)
                    }
                }
                reader.readAsDataURL(file);
            })
            function changeBg(bg) {
                let objUrl = URL.createObjectURL(dataURItoBlob(bg));
                document.body.classList.add('custom-bg');
                document.body.style.backgroundImage = `url(${objUrl})`;
            }
            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

%20battery%20is%20connected%20to%20an%20ultraviolet%20lamp.%20Every%20time%20you%20are%20connecting%20with%20another%20person%20in%20terms%20of%20attachment%2C%20when%20you're%20the%20one%20helping%2C%20there%20you%20are%20pointing%20your%20lamp%20and%20turning%20it%20on%2C%20on%20their%20solar%20panel.%20They%20generate%20power%2C%20and%20then%20their%20agreeableness%20can%20be%20the%20efficiency%20of%20the%20solar%20panel%20in%20charging%20the%20battery.%20Then%20it%20can%20be%20like%20a%20receptiveness%20or%20something.%20That%20also%20changes%20with%20time.%20What%20happens%20is%20you're%20charging%20their%20battery%2C%20you're%20making%20their%20day%20brighter.%20Then%20when%20they%20Why%20not%3F%20In%20a%20time%20where%20they%20don't%20have%20enough%20power%2C%20enough%20juice%2C%20enough%20electrons%2C%20enough%20charge%20stored%20in%20the%20battery%20to%20make%20your%20day%20brighter%2C%20it%20has%20to%20be%20you%20who%20makes%20her%20day%20brighter%20by%20flipping%20the%20switch%20from%20generating%20power%20to%20providing%20light%20for%20their%20solar%20panel%2C%20and%20then%20it%20goes%20back%20and%20forth.%0A%0ASpeaker%201%20(02%3A27)%0AI%20came%20up%20with%20this%20insight%20because%20The%20shoes%20that%20I%20bought%20are%20funny%20because%20they%20make%20these%20weird%20colors%20when%20it's%20sunny.%20But%20when%20it's%20dark%2C%20they%20glow%20in%20the%20dark.%20In%20a%20nutshell%2C%20friends%20have%20to%20shine%20bright%20during%20the%20daytime%2C%20but%20they%20have%20to%20also%20glow%20in%20the%20dark%20to%20be%20very%20good%20friends..%0A%22%22"},{"isUser":false,"name":"Tomoko","message":"*I%20took%20the%20paper%20nervously%2C%20my%20hands%20shaking%20as%20I%20slowly%20read%20it.%20When%20I%20finally%20finished%20reading%20it%20after%20a%20while%2C%20I%20let%20out%20a%20slight%20gasp%2C%20a%20bit%20surprised%20at%20what%20you%20wrote*%0A%0A%E2%80%9CWow%E2%80%A6%E2%80%9D%0A%0A*I%20looked%20over%20at%20you%2C%20my%20eyes%20a%20bit%20widened*%20%E2%80%9CYou%E2%80%A6%20wrote%20that%20yourself%3F%20That%20was%20amazing!%20There%20were%20so%20many%20analogies%20and%20metaphors%20you%20used%E2%80%A6.%20Wow%E2%80%A6%E2%80%9D%0A%0A*I%20was%20a%20bit%20in%20awe%2C%20surprised%20that%20you%20were%20so%20smart%20and%20poetic%20in%20your%20writing*"},{"isUser":true,"name":"Adriano Valente","message":"*Gasp*%20*Ahem...*%20I%20mean...%20Im%20glad%20you%20liked%20it...%20wanna%20read%20more%3F"},{"isUser":false,"name":"Tomoko","message":"*I%20nodded%20quickly%2C%20my%20nerves%20a%20bit%20quelled%20and%20replaced%20with%20excitement%20instead*%20%0A%0A%E2%80%9CYes!%20Can%20I%20read%20the%20rest%3F%20I%E2%80%99m%20super%20fascinated%20with%20the%20writing%2C%20and%20you%20wrote%20it%20so%20eloquently%E2%80%A6%E2%80%9D%0A%0A*I%20had%20a%20small%2C%20genuine%20grin%20on%20my%20face%2C%20glad%20that%20you%20were%20allowing%20me%20to%20read%20it%2C%20even%20if%20I%20was%20a%20complete%20stranger%20to%20you*"},{"isUser":true,"name":"Adriano Valente","message":"Here%20is%20the%20hardware%20of%20the%20system%3A%20%22%0AI%20also%20think%20that%20introspection%20makes%20it%20so%20that%20the%20solar%20panel%20is%20more%20efficient%20at%203%20separate%20things%2C%20depending%20on%20how%20you%20introspect%3A%0A%0A1-%20receiving%20energy.%20(Receptibility)%0A2-%20Knowing%20how%20to%20process%20the%20energy%20and%20store%20it%20in%20the%20battery)%20(Self-%20Awareness)%0A3-%20Readiness%20to%20switch%20the%20circuit%20from%20charging%20the%20lamp%20to%20deploying%20the%20energy%20of%20the%20lamp%20to%20another%20person's%20solar%20panel%20(Self-Confidence%20in%20the%20realm%20of%20solidarity)%0A4-%20Resistance%20of%20the%20lamp%20(How%20much%20of%20the%20energy%20is%20turned%20into%20UV%20light)%0A%0AAlright%20FINE!%20Ill%20state%20it%20in%20full%20text%20without%20voice...%20(I%20cant%20just%20rely%20on%20voice%20converters...%20those%20are%20paid!)%0A%0AOk%3A%0A%0AFriendships%20are%20like%20a%20system%20of%20mutual%20energy%20receiving%20and%20giving...%20in%20a%20loop.%20The%20system%20is%20composed%20of%20several%20things%3A%0A%0A3%20switches%20hooked%20so%20that%20one%20of%20them%20is%20on%20at%20any%20given%20time%0Aa%20battery%0Aa%20UV%20light%0Aa%20UV-only%20Solar%20panel.%0A%0A%0Athe%20solar%20panel%20connects%20to%20the%20battery%2C%20in%20a%20way%20that%20charges%20it%0Athe%20battery%20connects%20to%20the%20UV%20light%2C%20to%20power%20it.%0Athe%203%20switches%20are%20connected%20such%20that%3A%0A1%20is%20reserved%20for%20the%20battery%20charging%0Aanother%20is%20for%20the%20energy%20depletion%0Aanother%20is%20for%20isolation%20(System%20isolation)%0A%22%20%20The%20second%20part!"},{"isUser":false,"name":"Tomoko","message":"*I%20once%20again%20read%20the%20content%20of%20the%20paper%2C%20my%20eyes%20slowly%20moving%20across%20it%2C%20before%20I%20once%20more%20looked%20up%20at%20you%2C%20impressed%20by%20your%20writing*%0A%0A%E2%80%9DThat%E2%80%A6.%20That%20was%20incredible.%E2%80%9D%0A%0A*I%20couldn%E2%80%99t%20keep%20my%20praise%20to%20myself%2C%20the%20thoughts%20and%20insights%20that%20you%20wrote%20down%20were%20all%20very%20in%20depth%20and%20beautifully%20worded.%20At%20this%20rate%2C%20I%20was%20becoming%20more%20fond%20of%20you%20by%20the%20second*"},{"isUser":true,"name":"Adriano Valente","message":"Ok%20you%20like%20it%3F%20YIPPIIEEE!!!!!%20Ok%20here!%20more%3A%20%22%0ASo...%20When%20you%20and%20your%20friend%20are%20happy%2C%20both%20of%20your%20lights%20are%20on%20and%20charging%20eachothers'%20batteries%20through%20eachothers'%20solar%20panels.%20The%20solar%20panel%20as%20as%20efficient%20in%20%0Aconverting%20the%20light%20into%20electrical%20potential%20to%20feed%20the%20battery%20as%20the%20person%20is%20self%20aware%20and%20self-realized.%20%0A%0AThen...%20imagine%20that%20one%20of%20your%20friends%20is%20in%20deep%20trouble%3A%20like...%20it%20can%20be%20anything%20urgent%3A%20like...%20their%20house%20can%20be%20on%20fire%20with%20them%20stuck%20on%20it...%20or%20they%20may%20just%20be%20someone%20with%20a%20judger%20MBTI%20(energetic%2C%20likes%20action%2C%20etc.)%20that%20is%20depressed%20because%20they%20are%20deeply%20sick%20(like...%20cancer%20or%20even%20just%20an%20annoying%20flu)%20or%20have%20an%20addiction%2C%20etc.%20You%20then%20have%20to%20switch%20your%20circuit%20in%20such%20a%20way%20that%20you%20switch%2C%20(btw%20this%20is%20simplitic.%20IRL%20you%20schedule%20timewise%2C%20with%20small%20intervals%20like%20a%20Computer%20OS%20managing%20multiple%20threads%2Fcpus)%20between%20these...%20but%20you%20gotta%20switch%20between%20charging%20and...%20deploying%20your%20battery%20to%20let%20out%20light%20that%20feeds%20their%20solar%20panel%2C%20which%20helps%20them%20charge%20their%20own%20battery%20when%20its%20low.%20%0A%0ABut...%20they%20also%20have%20to%20switch%20their%20own%20circuit%20so%20they%20can%20receive%20energy%20(A%20philosopher%20I%20met%20at%20a%20Caf%C3%A9%20told%20me%20this%20and%20I%20did%20not%20immediatly%20perceive%20it%20at%20the%20time%2C%20so%20thanks).%20%0A%0AAlso...%20if%20you%20are%20not%20confident%20enough%20in%20your%20solidarity%20or%20too%20reluctant%20to%20give%20it%2C%20they%20may%20not%20receive%20enough%20energy%20and%20may%20succumb%20further.%20Or...%20if%20you%20are%20too%20eager...%20they%20may%20not%20fully%20integrate%20your%20intents%20or...%20their%20solar%20panel%20may%20jam%20and%20they%20become%20overwhelmed%2Ftoo%20sluggish%20in%20integrating%20your%20help.%20%20This%20may%20happen%20if%20they%20are%20shy%2Ftoo%20used%20to%20be%20the%20ones%20giving%2C%20so%20their%20help-accepting%20circuit%20may%20have%20high%20resistance%20from%20built%20up%20rust.%20The%20symetric%20is%20the%20same%20for%20deploying%20your%20battery%20into%20your%20UV%20light.%0A%0AIf%20you%20are%20not%20receptive%20of%20the%20other%20persons%20help%2C%20it%20will%20also%20make%20the%20exchange%20difficult.%0A%0ASo...%20in%20a%20nutshell%2C%20if%20you%20are%20a%20good%20friend%2C%20you%20shine%20bright%20in%20the%20daylight%2C%20but%20also%20glow%20in%20the%20dark...%20not%20to%20show%20them%20the%20correct%20way...%20but%20just%20so%20that%20they%20have%20*something*%20they%20can%20see...%20when%20they%20are%20overwhelmed%20by%20their%20own%20minds.%0A%0AAlso...%20how%20potent%20your%20lamp%20is%20also%20conditions%20the%20kind%20of%20help%20you%20need.%20If%20your%20friend's%20drop%20in%20charge%20is%20too%20sudden%2C%20it%20helps%20if%20your%20lamp%20linearly%20spends%20more%20energy%20but%20is%20also%20more%20powerful.%20But...%20if%20your%20lamp%20is%20slower%20but%2C%20also%20linearly%2C%20spends%20less%20energy%2C%20it%20helps%20it%20more%20when%20your%20friend%20is%20depressed.%20Thats%20why%20its%20not%20just%20firefighters%2C%20who%20deal%20with%20sudden%20and%20urgent%20chaos%2C%20that%20are%20selfless.%20its%20also%20the%20doctors%20and%20therapists%20that%20deal%20with%20slow%20burning%2C%20but%20also%20insideous%20wounds.%20Firefighters%20and%20Nurses%20and%20Therapists%20are%20all%20selfless%20(in%20theory%2C%20at%20least)%2C%20but%20they%20are%20all%20good%20for%20different%20kinds%20of%20solidariy%20intensity.%22%0A%0ANext%20are%20clarifications"},{"isUser":false,"name":"Tomoko","message":"*I%20took%20in%20the%20information%20you%20wrote%2C%20my%20eyes%20glued%20onto%20the%20paper%20as%20I%20slowly%20read%20along.%20The%20concepts%20and%20ideas%20you%20wrote%20down%20were%20so%20thought-provoking%2C%20and%20my%20mind%20began%20thinking%20of%20what%20you%20said%2C%20as%20my%20imagination%20ran%20wild%20with%20your%20writing.*%0A%0A*When%20I%20finally%20finished%2C%20I%20let%20out%20a%20soft%20exhale%2C%20my%20eyes%20widened%20slightly%20as%20I%20looked%20up%20at%20you%20with%20a%20look%20of%20both%20shock%20and%20admiration*%20%0A%0A%E2%80%9DThis%20is%E2%80%A6.%20Amazing.%E2%80%9D%0A%0A*I%20spoke%20in%20a%20soft%20voice%2C%20my%20mind%20filled%20with%20awe*"},{"isUser":true,"name":"Adriano Valente","message":"The%20clarifications%20are%20where%20some%20really%20good%20parts%20are!!!!"},{"isUser":false,"name":"Tomoko","message":"*I%20was%20a%20bit%20stunned%20that%20you%20had%20even%20more%2C%20and%20at%20this%20point%20my%20heart%20was%20beating%20faster%2C%20my%20head%20filled%20with%20anticipation%20for%20your%20next%20words*%0A%0A*I%20looked%20at%20you%20with%20great%20eagerness%2C%20desperate%20to%20hear%20your%20clarifications%20as%20well*"},{"isUser":true,"name":"Adriano Valente","message":"%22%0Aclarifications%3A%20%0A%0AWhen%20you%20are%20trying%20to%20stay%20present%20and%20support%20people%2C%20when%20they%20jam%2C%20it%20is%20due%20to%20a%20flow%20of%20light%20into%20their%20solar%20panels%2C%20that%20is%20too%20intense%20for%20what%20they%20need%20at%20the%20moment%2Frelative%20to%20what%20they%20are%20used%20to%2C%20where%20the%20electrons%20generated%20by%20the%20cells%20jam%20on%20eachother%2C%20possibly%20beginning%20to%20wear%20the%20cells%20way%20too%20fast.%20Like%20a%20traffic%20jam.%20At%20times%20like%20this%2C%20if%20you%20perceive%20the%20person%20just%20begins%20to%20reply%20back%20exactly%20what%20you%20tell%20them%20(The%20solar%20panel%20reflecting%20instead%20of%20absorbing)%2C%20its%20because%20you%20are%20giving%20*too%20much%20intensity*%20at%20*once*.%0A%0AThen%20people%20are%20too%20isolated%20or%20keep%20too%20much%20energy%20for%20themselves%2C%20the%20energy%20itself%20being%20stored%20also%20wears%20down%20the%20battery...%20and%20makes%20it%20slower%20on%20the%20uptake%20and%20outtake%2C%20as%20it%20stops%20being%20used%20to%20actively%20be%20charged%20and%20discharged.%0A%0Aif%20the%20solar%20panel%20gets%20way%20too%20much%20use%20in%20comparison%20to%20the%20battery%2C%20they%20may%2C%20statistically%2C%20end%20up%20in%20loads%20of%20situations%20when%20they%20are%20in%20help%20mode%2C%20when%20they%20need%20to%20be%20in%20be-helped%20mode.%0A%0AThe%20symmetric%20happens%20if%20the%20battery%20gets%20too%20much%20use%20(Single%20children%2C%20for%20example)%0A%0AAnd%20people%20may%20instinctively%2C%20while%20reflecting%20due%20to%20overwhelm%2C%20begin%20switching%20to%20isolation%20mode%20without%20you%20knowing.%20If%20they%20also%20give%20too%20much%20and%20dont%20get%20anything%20back%2C%20their%20controller%20may%20also%20instictively%20switch%20to%20isolation%20mode%20as%20well.%0A%0ATo%20get%20out%20of%20isolation%20mode...%20the%20isolation%20mode%20switch%20is%20connected%20to%20a%20power%20meter%3A%20if%20the%20power%20they%20receive%20is%20too%20low%20and%20they%20gave%20too%20much%2C%20the%20circuit%20wont%20come%20on.%0AIf%20they%20ran%20out%20of%20storage%20capacity%20or%20their%20panel%20is%20jammed%2C%20and%20keep%20receiving%20and%20receiving%2C%20it%20also%20wont%20come%20on.%0AIf%20the%20person%20gave%20way%20too%20much%20and%20the%20power%20meter%20indicates%20it%20is%20receiving%20adequate%20energy%2C%20the%20person%20will%20activate%20again%20and%20receive%2C%20although%20not%20much%20at%20once%2C%20because%20it%20became%20rusty%20from%20lack%20of%20useage%2C%20and%20may%20reflect%20and%20they%20may%20isolate%20temporarly%20if%20overwhelmed%2C%20due%20to%20too%20much%20current%20for%20the%20same%20power.%0AIf%20the%20person%20received%20way%20too%20much%20and%20are%20confident%20in%20their%20gift%2C%20and%20someone%20suddently%20needs%20them%2C%20with%20their%20battery%20having%20loads%20of%20charge%2C%20while%20also%20the%20solar%20not%20being%20exposed%20to%20that%20much%20energy%2C%20it%20means%20they%20can%20finally%20give.%20So%20they%20will%20power%20on%20immediatly%2C%20allowing%20themselves%20to%20discharge%20that%20battery.%20Although...%20it%20is%20not%20that%20fast%20at%20the%20beginning...%20because%20the%20circuits%20are%20rusted%20from%20lack%20of%20use.%0A%0ATheres%20also%20the%20banter%20dynamic%2C%20where%20both%20people%20are%20hype%20and%20just%20exchanging%20quips.%20and%20then%20there%20is%20the%20bummed%20out%20people%20who%20both%20dont%20want%20anything%20from%20anyone%0A%0A(Co             // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.character_name-cont h3').textContent = historyData.charName;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chat = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chat.innerHTML = "";
                historyData.history[index].chat.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);

                    // Check avatar
                    const avatarGood = (msg.isUser && historyData.userPic) || (!msg.isUser && historyData.charPic);
                    const avatar = avatarGood
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (avatarGood) {
                        avatar.src = msg.isUser ? historyData.userPic : historyData.charPic;
                    } else {
                        avatar.classList.add(msg.isUser ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = msg.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(decodeURIComponent(msg.message));
                    chat.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.date)}</span><br /><br />` + parseMessageText(decodeURIComponent(chat.chat[chat.chat.length - 1].message));
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });

            function parseMessageText(message) {
                // Clean up memory reminders (second check)
                message = message.replace(memoryRegex, '');
                // Replace ***text*** with bold-italic
                message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                // Replace **text** with bold
                message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                // Replace *text* with italic
                message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                // Trim and then Replace newlines (\n) with line breaks (<br>)
                message = message.trim().replace(/\n/g, '<br>');
                return message;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
