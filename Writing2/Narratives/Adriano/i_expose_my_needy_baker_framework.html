<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;

            border-radius: 6px;
            padding: 10px 20px;

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

            display: flex;

        nav .char-item:hover {

        nav .nav-avatar-wrap {

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .character_name-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .character_name-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })

            // Handle background
            // If there is one
            const currentBg = localStorage.getItem('background');
            if (currentBg) {
                changeBg(currentBg);
            }
            // Change by hand
            const bgInput = document.querySelector('#bgInput');
            document.querySelector('.change-bg').addEventListener('click', () => {
                bgInput.click();
            })
            document.querySelector('.delete-bg').addEventListener('click', () => {
                document.body.classList.remove('custom-bg');
                document.body.style.backgroundImage = "unset";
                localStorage.removeItem('background');
            })
            bgInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    // convert image file to base64 string
                    changeBg(reader.result);
                    bgInput.value = "";
                    try {
                        localStorage.setItem('background', reader.result);
                    } catch (error) {
                        alert('Note: File is likely too big to save.')
                        //console.log(error)
                    }
                }
                reader.readAsDataURL(file);
            })
            function changeBg(bg) {
                let objUrl = URL.createObjectURL(dataURItoBlob(bg));
                document.body.classList.add('custom-bg');
                document.body.style.backgroundImage = `url(${objUrl})`;
            }
            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

nality%20disorder.%0Aand%20that%20is%20one%20of%20the%20main%20differences%3A%0A%0AHistrionic%20Personality%20Disorder%20people%20have%20loads%20of%20issues%3A%0A%0AThey%20are%20very%20reluctant%20to%20act%20on%20their%20responsibilities%20in%20pragmatic%20ways.%0AIn%20extreme%20cases%2C%0AWhen%20the%20Histrionic%20personality%20disorder%20is%20%22Malignant%22%0ATo%20the%20detriment%20of%20their%20well%20being%20and%20even%20survival!%0A%0AAnd%20they%20will%20put%20in%20as%20much%20effott%20as%20possible%20into%20growimg%20the%20sizs%20of%20their%20craft.%0AExternalizing%20themselves%20the%20whole%20way.%0A%22Im%20no%20weakling.%0AI%20will%20create%20more.%0Abe%20more.%0Amake%20others%20feel%20more.%0Asee%20more.%0AI%20will%20only%20sleep%20when%20Im%20dead.%0AAnd%20rest%20feels%20like%20dread.%22%0A%0ABut%2C%20unlike%20narcissists%2C%0Athey%20do%20not%20weaponize%20their%20position%20for%20the%20sake%20of%20their%20narrative.%0Athey%20are%20perfectly%20capable%20of%20feeling%20things%20like%20shame%20and%20guilt%2C%0Awhich%20they%20need%20to%2C%0Aotherwise%2C%0Aif%20others%20do%20not%20approve%20them%2C%0Athey%20cannot%20approve%20their%20craft%0Aand%20then%20if%20they%20cannot%20approve%20their%20craft%2C%20they%20canno%20approve%20th-%0Aget%20it%3F%0AIts%20like...%0AIts%20interleaved.%0AThey%20cannot%20leave%20their%20craft.%0Aits%20their%20shell.%0Aand%2C%0Ataken%20to%20an%20extreme%2C%0Athey%20can%20%5BDefinitely%5D%0Amake%20a%20career%20out%20of%20it.%0ABut...%0Athey%20can%20also%20become%20very%20isolated%20when%20others%20%22dont%20seem%20to%20get%20it%22%0Aand%20may%20even%20develop%20common%20conditions%20associated%20with%20terminal%20isolation%2C%0Alike%20feelings%20of%20misanthropy%2C%0Aalienation%0Aand%20despondency%20towards%20leaving%20their%20situation.%0A%0A%0Aand%20even%20at%20a%20milder%20phase%2C%0Aits%20tricky.%0Anot%20impossible.%0ABut%20HPD%20people%2C%0Aas%20I%20define%20them%2C%0Aare%20often%20very%20flaky%20on%20their%20promisses%2C%0Athey ylum Scientist","message":"%22I'm%20afraid%20I%20can't%20do%20that.%20In%20my%20professional%20opinion...%20I%20think%20you%20have%20HPD%20but%20there%20are%20some%20minor%20traces%20of%20NPD.%22%0A%0A*She%20says%20simply.%20Her%20voice%20is%20calm%20but%20it's%20clear%20she%20is%20not%20convinced%20you%20are%20HPD%20alone.*"},{"isUser":true,"name":"Adriano Valente","message":"yes%20there%20are!%0ABut%20the%20original%20dsm-5%20criteria%20list%20is%20garbage.%0AI%20want%20mine%20instead.%0AIm%20not%20even%20aura%20farming%20here.%0A%0AI%20actually%20think%20that%20it%20is%20way%20more%20actionable%20and%20useful%20than%20that%0A%22Flirtatious%2C%20sexualised%20chamer%22%0Anonsense%20that%20the%20original%20HPD%20is"},{"isUser":false,"name":"Asylum Scientist","message":"%22Hm...%20I'll%20take%20your%20word%20for%20it...%20However%20this%20is%20the%20system%20we%20use%20right%20now%2C%20I%20cannot%20go%20off%20on%20your%20word%20alone.%20I'm%20sorry%2C%20but%20until%20a%20change%20has%20been%20made%20and%20we%20have%20a%20system%20to%20replace%20it%20with%2C%20we%20will%20use%20the%20DSM-5%20criteria.%22%0A%0A*She%20doesn't%20sound%20rude%2C%20just%20very%20factual.*%0A%0A%22I'll%20keep%20your%20ideas%20in%20mind%20though%2C%20I%20think%20you%20may%20be%20right%20in%20a%20lot%20of%20your%20theory's.%22"},{"isUser":true,"name":"Adriano Valente","message":"whatever...%0Acan%20I%20at%20least%20add%20them%3F%0Awith%20a%20personalized%20name%3F%0Aill%20call%20it%20%22needy%20baker%20syndrome%22.%0AIll%20suggest%20the%20dialectic%20therapy%20thingy%20so%20they%20separate%20their%20worth%20from%20their%20craft.%0Aand%20develop%20actual%20mental%20endurance%0Aand%20an%20ability%20to%20articulate%20long-term%20plans%20in%20a%20reliable%20way"},{"isUser":false,"name":"Asylum Scientist","message":"%22Sure...%20It%20could%20help%20me.%20Though%20I%20recommend%20you%20go%20for%20a%20nap%20before%20I%20start%20doing%20any%20more%20work.%20You%20need%20to%20keep%20your%20energy%20for%20when%20we%20meet%20up%20again.%22%0A%0A*She%20stands%20up.*%0A%0A%22I%20also%20think%20you%20should%20go%20over%20these%20ideas%20you%20know%20and%20maybe%20get%20it%20peer%20reviewed%20by%20one%20of%20the%20psychologists%20here.%20I%20think%20they%20could%20be%20more%20well%20received%20with%20their%20help%20than%20just%20me.%22%0A%0A*She%20smiles%20and%20holds%20her%20hand%20out.*%0A%0A%22I%20hope%20we%20get%20along%20well%20in%20the%20future%2C%20Adriano.%22"},{"isUser":true,"name":"Adriano Valente","message":"well...%0Abut%20do%20you%20think%20they%20are%20good%3F"},{"isUser":false,"name":"Asylum Scientist","message":"%22Hmm...%20I%20think%20you...%20Have%20an%20interesting%20take%20on%20it.%20I%20believe%20you%20are%20very%20intelligent%20and%20you%20have%20potential%20to%20learn%20even%20more.%22%0A%0A*She%20didn't%20really%20answer%20the%20question%20how%20he%20wanted%2C%20she's%20just%20being%20honest.*%0A%0A%22I%20will%20say%20again%2C%20I%20need%20you%20to%20go%20take%20a%20nap.%20You%20look%20exhausted%2C%20please...%20Get%20some%20good%20rest.%22"},{"isUser":true,"name":"Adriano Valente","message":"sure...%0Abye%2C%20I%20guess...%0A%5Bsighs%20in%20disappointment.%0Areluctantly%20letting%20you%20go%5D"},{"isUser":false,"name":"Asylum Scientist","message":"%22I'll%20see%20you%20again%20tomorrow.%22%0A%0A*She%20walks%20out%2C%20locking%20you%20back%20in.*%0A%0A%22Good%20night%2C%20Adriano.%22"},{"isUser":true,"name":"Adriano Valente","message":"good%20night...%0A%5BI%20say%20in%20a%20resigned%2C%0Atired%20yet%20mildly%20pouty%20tone%5D"},{"isUser":false,"name":"Asylum Scientist","message":"*She%20smiles%20a%20little%2C%20knowing%20that%20you%20will%20miss%20her.%20She%20can%20be%20a%20shoulder%20to%20cry%20on%20for%20sure%2C%20and%20she%20doesn't%20want%20to%20leave%20you%2C%20but%20alas...%20It's%20better%20for%20both%20of%20them%20that%20she%20just%20gets%20on%20with%20work.*%0A%0A*Alice%20turns%20around%20and%20goes%20to%20her%20desk%2C%20beginning%20to%20work%20on%20other%20patients.%20It's%20good%20when%20she%20can%20finally%20get%20through%20her%20work%2C%20her%20coworkers%20never%20complain%20so%20she%20can%20actually%20focus%20on%20just%20doing%20the%20job%20with%20minimal%20interruptions.*"}]}]}`);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.character_name-cont h3').textContent = historyData.charName;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chat = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chat.innerHTML = "";
                historyData.history[index].chat.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);

                    // Check avatar
                    const avatarGood = (msg.isUser && historyData.userPic) || (!msg.isUser && historyData.charPic);
                    const avatar = avatarGood
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (avatarGood) {
                        avatar.src = msg.isUser ? historyData.userPic : historyData.charPic;
                    } else {
                        avatar.classList.add(msg.isUser ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = msg.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(decodeURIComponent(msg.message));
                    chat.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.date)}</span><br /><br />` + parseMessageText(decodeURIComponent(chat.chat[chat.chat.length - 1].message));
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });

            function parseMessageText(message) {
                // Clean up memory reminders (second check)
                message = message.replace(memoryRegex, '');
                // Replace ***text*** with bold-italic
                message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                // Replace **text** with bold
                message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                // Replace *text* with italic
                message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                // Trim and then Replace newlines (\n) with line breaks (<br>)
                message = message.trim().replace(/\n/g, '<br>');
                return message;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
