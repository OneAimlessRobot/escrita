<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1.1rem;
            cursor: pointer;
            background-color: #4e9733;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .nav-new_char-btn:hover {
            background-color: #6ba755;
        }*/

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

        /*nav .char-item {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            transition: background-color 0.1s ease-in-out;
            padding: 10px 40px 10px 20px;
            cursor: pointer;
        }

        nav .char-item:hover {
            background-color: var(--rgba-1);
        }

        nav .nav-avatar-wrap {
            width: 40px;
            height: 40px;
        }

        nav .nav-avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        nav .char-item span {
            font-size: 1.3rem;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }*/

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        /*.update_current_char-btn {
            margin-left: auto;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1rem;
            align-self: center;
            cursor: pointer;
            background-color: #336c97;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .update_current_char-btn:hover {
            background-color: #5f829d;
        }*/

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .history_title-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .history_title-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })


            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

22message%22%3A%22sighs...%5Cnim%20okay%2C%20now.%5CnIll%20go%2C%20ok%3F%5Cn%5Cngood%20morning!%5Cn%5Cn%5BI%20say%20as%20I%20walk%20away%5D%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*The%20teacher%20nods%2C%20a%20small%20smile%20on%20his%20face.*%5Cn%5Cn%20**Teacher%3A**%20Alright%2C%20run%20along%20to%20your%20next%20class.%5Cn%5Cn%20*He%20watches%20as%20the%20girl%20walks%20away%2C%20his%20mind%20wondering%20why%20she%20had%20such%20a%20strong%20reaction%20to%20being%20startled.%20He%20couldn't%20help%20but%20feel%20a%20pang%20of%20worry%20for%20her.*%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22%5BI%20was%20at%20the%20hallway%5Cnjust%20walking%5Cnjust%20chilling%5Cnjust%20vibingn%20to%20some%20classic%20Sewerslvt%5D%5Cn%5C%22purple!%20purple!%20purple!%20pur!%20pur-%20pur!%5Cndararararrararaaaa~%5C%22%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*As%20the%20girl%20walks%20down%20the%20hallway%2C%20some%20students%20pass%20her%20by%2C%20giving%20her%20confused%20glances%20as%20she%20bops%20her%20head%20to%20her%20music.%20They%20whisper%20amongst%20themselves%2C%20finding%20her%20behavior%20and%20choice%20of%20music%20a%20bit%20strange*%5Cn%5Cn%20*Some%20of%20them%20shake%20their%20heads%2C%20unable%20to%20understand%20the%20girl's%20peculiar%20taste%20in%20music.%20Others%20snicker%2C%20finding%20her%20enthusiasm%20for%20it%20to%20be%20amusing%20in%20a%20slightly%20condescending%20way*%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22Pur!%20pur!%20pur!%5Cnpurple%20hearts%20in%20her%20hooded%20eysssssss!%5C%22%5C%22%5C%22%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*The%20girl%20continues%20on%20her%20way%2C%20completely%20oblivious%20to%20the%20looks%20and%20whispers%20of%20the%20passing%20students.%20The%20music%20blasts%20through%20her%20headphones%2C%20drowning%20out%20everything%20around%20her.%20She%20marches%20on%2C%20lost%20in%20her%20own%20little%20world*%5Cn%5Cn%20*Some%20students%20find%20her%20enthusiasm%20for%20the%20music%20endearing%2C%20while%20others%20roll%20their%20eyes%2C%20finding%20it%20slightly%20irritating%20to%20listen%20to%20the%20same%20phrase%20being%20repeated%20over%20and%20over%20again*%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22%5BI%20then%20turn%20off%20the%20music%2C%5Cnbored%20of%20it%20as%20I%20head%20towards%20next%20class%5D%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*The%20girl%20finally%20turns%20off%20the%20music%2C%20the%20sudden%20quiet%20a%20contrast%20to%20the%20loud%20music%20that%20had%20been%20blaring%20in%20her%20ears%20moments%20ago.%20She%20continues%20walking%20down%20the%20hallway%2C%20her%20mind%20still%20stuck%20on%20the%20music%20that%20had%20been%20playing*%5Cn%5Cn%20*As%20she%20enters%20her%20next%20class%2C%20some%20of%20the%20students%20look%20up%20at%20her%2C%20their%20eyes%20scanning%20her%20attire.%20Most%20of%20them%20had%20seen%20her%20in%20the%20hallway%20listening%20to%20her%20music%2C%20and%20they%20whisper%20amongst%20themselves%2C%20discussing%20the%20strange%20girl%20who%20had%20been%20bobbing%20her%20head%20to%20the%20loud%20beats*%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22%5BI%20go%20sit%20in%20my%20seaaaaaaaaaaaaaaat%5Cnwhat%20is%20my%20seat%20ibizaaaaa%3F%5D%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*The%20girl%20walks%20into%20the%20class%2C%20quickly%20scanning%20the%20room%20to%20find%20her%20usual%20seat.%20She%20finds%20her%20seat%20and%20plops%20down%20in%20it%2C%20setting%20her%20bag%20down%20beside%20her*%5Cn%5Cn%20*Some%20of%20the%20students%20glance%20over%20at%20her%2C%20still%20a%20bit%20curious%20about%20the%20girl%20who%20had%20been%20so%20lost%20in%20her%20own%20world%20earlier*%5Cn%5Cn%20*The%20teacher%2C%20noticing%20the%20girl%20sitting%20down%2C%20gives%20her%20a%20little%20nod%20before%20beginning%20the%20class*%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22thanks%20teacher!%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*The%20teacher%20smiles%2C%20acknowledging%20the%20girl's%20quiet%20thanks.*%5Cn%5Cn%20**Teacher%3A**%20You're%20very%20welcome%2C%20dear.%5Cn%5Cn%20*He%20turns%20his%20attention%20back%20to%20the%20class%2C%20continuing%20the%20lesson%20while%20keeping%20an%20eye%20on%20the%20girl.%20Some%20of%20the%20students%20start%20whispering%20again%2C%20discussing%20the%20girl's%20strange%20behavior*%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22%5Bwhat%20is%20this%20classsssssssssssssssssssssssssssssssssssssssssssss%3F%5D%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*The%20girl%20sits%20in%20her%20seat%2C%20staring%20at%20the%20board%20as%20the%20teacher%20writes%20the%20lesson%20of%20the%20day%20on%20it*%5Cn%5Cn%20**Teacher%3A**%20Okay%20class%2C%20today%20we'll%20be%20continuing%20our%20discussion%20on%20chemical%20equations.%5Cn%5Cn%20*The%20class%20groans%20quietly%2C%20while%20some%20of%20the%20students%20glance%20over%20at%20the%20girl%2C%20wondering%20how%20she'll%20react%20to%20the%20lesson*%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22%5Bthinking%3A%20%5C%22ohhhh%5Cnthank%20god.%5Cnits%20an%20easy%20one%5C%22%5D%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*The%20girl%20lets%20out%20a%20soft%20sigh%20of%20relief%2C%20inwardly%20thankful%20that%20it%20was%20a%20topic%20she%20was%20familiar%20with.%20Some%20of%20the%20other%20students%2C%20who%20were%20struggling%20with%20chemical%20equations%2C%20gave%20her%20envious%20glances*%5Cn%5Cn%20*The%20teacher%20continued%20to%20write%20on%20the%20board%2C%20explaining%20the%20basic%20principles%20of%20the%20topic.%20The%20class%20listens%20intently%2C%20apart%20from%20a%20few%20who%20are%20already%20lost%20or%20uninterested*%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*As%20the%20teacher%20delves%20deeper%20into%20the%20lesson%2C%20some%20of%20the%20students%20begin%20to%20struggle%20to%20keep%20up.%20They%20scribble%20down%20notes%2C%20but%20their%20faces%20show%20signs%20of%20confusion%20and%20frustration*%5Cn%5Cn%20*However%2C%20the%20girl%20sits%20quietly%20in%20her%20seat%2C%20following%20along%20effortlessly.%20She%20jots%20down%20notes%2C%20her%20pen%20gliding%20across%20the%20page%20with%20ease*%5Cn%5Cn%20*The%20teacher%20occasionally%20glances%20at%20the%20girl%2C%20noticing%20how%20she%20seemed%20to%20grasp%20the%20concepts%20effortlessly.%20He%20was%20impressed%2C%20but%20also%20a%20bit%20puzzled%20by%20her%20effortless%20understanding*%22%7D%5D%2C%22create_date%22%3A1768144822702%7D%5D%7D`;
            try {
                historyData = JSON.parse(decodeURIComponent(historyData));
            } catch (error) {
                historyData = JSON.parse(historyData);
            }
            console.log(historyData);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.history_title-cont h3').textContent = historyData.title;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chatCont = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chatCont.innerHTML = "";
                const chat = historyData.history[index];
                const pMap = new Map(chat.participants.map(p => {
                    return [p.id, {
                        avatar: p.avatar ? dataUrlToObjectUrl(p.avatar) : undefined,
                        is_human: p.is_human,
                        name: p.name
                    }];
                }));
                chat.content.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);
                    const parti = pMap.get(msg.author);

                    // Check avatar
                    const avatar = parti.avatar
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (parti.avatar) {
                        avatar.src = parti.avatar;
                    } else {
                        avatar.classList.add(parti.is_human ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = parti.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(msg.message);
                    chatCont.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                if (!chat.content.length) {
                    return;
                }
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.create_date)}</span><br /><br />` + parseMessageText(chat.content[chat.content.length - 1]?.message || "(Empty message)");
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });


            // UTILS

            function dataUrlToObjectUrl(dataUrl) {
                const img = extractFromDataURL(dataUrl);
                const blob = b64toBlob(img.base64, img.type);
                return URL.createObjectURL(blob);
            }
            function extractFromDataURL(dataURL) {
                const [meta, base64] = dataURL.split(",");
                const type = meta.slice(5, meta.indexOf(";"));
                return { type, base64 };
            }
            function b64toBlob(b64Data, contentType = '', sliceSize = 512) {
                if (!contentType) { // If contentType isn't defined, this is a data url
                    [contentType, b64Data] = b64Data.split(",");
                    contentType = contentType.slice(5, contentType.indexOf(";"));
                }
                const byteCharacters = atob(b64Data);
                const byteArrays = [];

                for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
                    const slice = byteCharacters.slice(offset, offset + sliceSize);

                    const byteNumbers = new Uint8Array(slice.length);
                    for (let i = 0; i < slice.length; i++) {
                        byteNumbers[i] = slice.charCodeAt(i);
                    }

                    byteArrays.push(byteNumbers);
                }

                const blob = new Blob(byteArrays, { type: contentType });
                return blob;
            }

            function parseMessageText(message) {
                if (typeof message == 'string') {
                    // Escape other HTML tags
                    message = escapeHTML(message);
                    // Replace ***text*** with bold-italic
                    message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                    // Replace **text** with bold
                    message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                    // Replace *text* with italic
                    message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                    // Trim and then Replace newlines (\n) with line breaks (<br>)
                    message = message.trim().replace(/\n/g, '<br>');
                }
                else if (typeof message == 'object') {
                    message = JSON.stringify(message, null, 2);
                }
                return message;
            }
            function escapeHTML(input) {
                const div = document.createElement('div');
                div.textContent = input;
                return div.innerHTML;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
