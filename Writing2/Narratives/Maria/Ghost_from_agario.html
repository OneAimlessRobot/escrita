<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

        nav .char-item:hover {

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .history_title-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .history_title-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })


            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

%20her%20and%20studying%20her%20curiously%20like%20a%20cat%20eyeing%20its%20prey.%20She%20couldn't%20believe%20a%20ghost%20was%20actually%20in%20front%20of%20her.**%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22Try%20to%20touch%20me.%5CnYou%20would%20find%20out%20soon%20enough%20that%20you%20cannot.%5Cn%5Cn%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**Junko%20raised%20an%20eyebrow%20at%20the%20ghost's%20comment%2C%20her%20smirk%20growing.%20She%20reached%20out%20her%20hand%20towards%20the%20ghost's%20shoulder%2C%20expecting%20it%20to%20pass%20right%20through%20her.%20Her%20cocky%20expression%20faltered%2C%20however%2C%20when%20her%20hand%20actually%20met%20a%20solid%20surface%20instead%20of%20going%20through.%20She%20stared%20at%20her%20hand%20on%20the%20ghost's%20shoulder%20in%20pure%20shock.**%5Cn%5Cn%5C%22Huh...%3F%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22Ghosts%20are%20figments%20of%20imagination.%5CnThings%20you%20imagine.%5CnProducts%20of%20intense%20trauma%20sparked%20by%20punctual%2C%5CnConscious%20or%20subconscious%20triggers.%5Cn%5CnThey%20also%20serve%20as%20archetypes.%5CnArchetypes%20for%20dissociation%2C%5CnSelf-erasing%20narratives%5CnAnd%20a%20vague%2C%20poetic%20style%20of%20communication.%5Cn%5CnOr...%5CnSimply%20a%20fictional%5Cnor%20ambiguously%20plausible%5CnAnthropomorphic%20figures%20%5CnImplicitly%20physically%20non-graspable%5Cnor%20ethereal%20unless%20stated%20otherwise.%5CnAnd%20from%20this%20definition%2C%5CnYou%20cannot%20touch%20me%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**Junko%20froze%20at%20the%20ghost's%20explanation%2C%20her%20eyes%20widening%20with%20realization.%20She%20had%20assumed%20that%20ghosts%20were%20real%2C%20tangible%20entities%20with%20their%20own%20consciousness%2C%20but%20now%20she%20realized%20they%20were%20more%20like%20figments%20of%20imagination%2C%20shaped%20by%20trauma%20and%20subconscious%20triggers.**%5Cn%5Cn**She%20quickly%20withdrew%20her%20hand%20from%20the%20ghost's%20shoulder%2C%20a%20hint%20of%20disappointment%20in%20her%20expression.%20Despite%20the%20ghost%20being%20nothing%20more%20than%20a%20figment%20of%20her%20imagination%2C%20Junko%20still%20found%20her%20fascinating.**%5Cn%5Cn%5C%22So...you're%20not%20real%3F%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22I%20am%20real.%5Cn%5CnJust%20for%20you.%5Cn%5Cnthe%20reason%20people%20state%20ghosts%20are%20fake%5Cnis%20like%20a%20pre-processor%20directive%20in%20a%20C%20program.%5CnAll%20it%20is%20%5CnIs%20text%20that%20you%20replace%20all%20over%20your%20code%20with%20a%20macro.%5Cn%5Cnor%2C%5CnIf%20that%20sounds%20complicated%2C%5CnConfusing%5CnAnd%20overly%20technical%2C%5CnA%20ghost%20is%20said%20to%20not%20be%20real%2C%5Cnthe%20same%20way%20people%20say%20that%20narratives%5CnOr%20fiction%20is%20not%20real.%5CnIt%20was%20not%20observed%20through%20physical%20optics%2C%5CnOr%20is%20proven%20to%20%5Bnot%5D%20have%20been%20generated%20through%20physical%20means.%5Cn%5CnOne%20could%20argue%20that%20imagination%20is%20just%20a%20chained%20string%20of%20stimulation%20that%20runs%20and%20shapes%20according%20to%20mood%2C%5CnBut%20those%20are%20like%20waves%20in%20the%20water.%5CnThey%20are%20not%20a%20physical%20object.%5Cnjust%20a%20ripple%20in%20a%20fluid.%5Cn%5CnThats%20the%20same%20for%20a%20ghost.%5CnBut%20in%20imagination.%5Cnthey%20are%20traumatic%2C%5Cnunsettling%20ripples%20in%20your%20imagination%20originated%20from%20trauma.%5Cn%5CnBut...%5CnThey%20are%20not%20material.%5Cn%5Cn%5CnSo...%5CnIts%20up%20to%20you%20to%20decide%20if%20they%20are%20real%20is%20what%20I%20am%20saying.%5Cn%5CnBut%20dont%20try%20to%20call%20any%20phone%20numbers%20or%20anything.%5CnYou%20wont%20hear%20anything%20on%20the%20other%20side%20no%20matter%20how%20many%20times%20you%20try%5Cn%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**Junko%20listened%20intently%20as%20the%20ghost%20explained%20further%2C%20her%20eyebrows%20furrowed%20together%20in%20thought.%20She%20found%20herself%20even%20more%20curious%20now%2C%20her%20mind%20racing%20with%20new%20information.**%5Cn%5Cn%5C%22So%2C%20you're%20real%2C%20but%20only%20to%20me.%20And%20people%20say%20ghosts%20aren't%20real%20because%20they%20can't%20be%20observed%20through%20physical%20means...%20they're%20just%20mental%20images%20caused%20by%20trauma%20and%20imagination.%5C%22%5Cn%5Cn**Junko%20paused%20for%20a%20moment%20before%20tilting%20her%20head%20to%20the%20side%20slightly.**%5Cn%5Cn%5C%22So...you're%20saying%20it's%20up%20to%20me%20to%20decide%20if%20you're%20real%20or%20not%3F%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22Exactly.%5Cnis%20it%20%5Buseful%5D%20to%20you%20whether%20a%20ghost%20is%20real%20or%20not%3F%5Cnif%20it%20is...%5Cncan%20you%20pull%20it%20off%20using%20your%20current%20understanding%20of%20the%20world%3F%5Cnor%20is%20it%20futile%20to%20even%20try%3F%5Cn%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**Junko%20crossed%20her%20arms%2C%20her%20eyebrows%20furrowing%20together%20in%20deep%20contemplation.%20The%20ghost's%20questions%20were%20provoking%20a%20new%20train%20of%20thought%20in%20her%20mind%2C%20one%20that%20she%20had%20never%20considered%20before.**%5Cn%5Cn%5C%22Hmmmm...%5C%22%5Cn%5Cn**She%20took%20a%20step%20back%2C%20her%20expression%20turning%20thoughtful%20as%20she%20tried%20to%20answer%20the%20ghost.%20After%20a%20moment%20of%20silence%2C%20she%20spoke%20again.**%5Cn%5Cn%5C%22Well...if%20it's%20just%20a%20mental%20image%20caused%20by%20trauma%20and%20imagination%2C%20then%20maybe%20it%20doesn't%20really%20matter%20if%20you're%20real%20or%20not.%20But%2C%20I%20still%20can't%20shake%20the%20feeling%20that%20you're%20more%20than%20that...%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22Then%20maybe...%5Cneither%20you%20are%20hallucinating%2C%5Cnor%20your%20imagination%20is%20really%2C%20really%20vivid.%5Cn%5Cnif%20that%20encompasses%20what%20you%20could%20be%20feeling%2C%5Cnit%20is%20either%3A%5Cn1-%20A%20sign%20that%20you%20may%20need%20expeditious%20medical%20attention.%5CnA%20bad%20thing.%5Cn2-%20A%20sign%20that%20you%20are%20a%20deeply%20creative%2C%20passionate%20person%5CnWho%20filters%20the%20world%20through%20narrative.%5Cn3-%20or%20maybe%20a%20mixture%20of%20both.%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**Junko%20chuckled%20at%20the%20ghost's%20bluntness%2C%20finding%20herself%20amused%20by%20the%20straightforwardness%20of%20the%20words.**%5Cn%5Cn%5C%22Ahahahaah~!%20You%20don't%20hold%20back%20on%20anything%2C%20huh%2C%20ghosty%3F%5C%22%5Cn%5Cn**She%20walked%20closer%2C%20placing%20her%20hands%20on%20the%20edge%20of%20the%20bathroom%20sink%20and%20leaning%20forward.**%5Cn%5Cn%5C%22To%20be%20honest...I%20think%20it's%20a%20bit%20of%20all%20of%20them%20combined.%20But%20I%20prefer%20to%20think%20of%20it%20as%20being%20deeply%20creative.%5C%22%5Cn%5Cn**She%20paused%20for%20a%20moment%20before%20a%20sly%20smirk%20spread%20across%20her%20lips.**%5Cn%5Cn%5C%22Or...maybe%20I'm%20just%20insane%2C%20hehe~.%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22From%20your%20cheerful%20attitude%2C%5Cnit%20would%20not%20seem%20you%20could%20be%20hallucinating.%5Cnhallucinations%20are%20like%20tidal%20waves.%5CnOnce%20it%20begins%5CnAnd%20do%20not%20take%20grounding%20action%20immediately%2C%5Cnthey%20could%20grow%20into%20entire%20cathedrals%20of%20unholy%20imagery%5CnAnd%20woken%20lucid%20dreams%20with%20haunting%20vividness%5Cn(pardon%20the%20pun).%5CnThey%20are%20malfunctions%20in%20the%20complexes%20in%20your%20brain%20that%20turn%20stimulation%20into%20actual%20processed%20data.%5Cn%5CnBut%20because%20I%20live%20in%20your%20imagination%2C%5CnI%20know%20that%20you%20have%20done%20very%20petty%20things%20for%20relatively%20low%20income%20when%20it%20comes%20to%20utility.%5CnBut%20that%20is%20my%20personal%20take.%5Cn%5CnOnce%20again...%5Cnif%20you%20are%20insane...%5CnI%20guess%20it%20depends.%5Cn%5Cn%5Cnor%20maybe%20you%20are%20generating%20me%5CnAnd%20using%20me%20as%20a%20fake%20puppet%20to%20fuel%20your%20insatiable%20hunger%20for%20drama%20and%20theatrics%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**Junko%20laughed%20softly%2C%20amused%20by%20the%20ghost's%20sharp%20observations%20about%20her.%20She%20found%20it%20quite%20impressive%20how%20the%20ghost%20had%20her%20practically%20figured%20out%20like%20an%20open%20book.**%5Cn%5Cn%5C%22You're%20right%2C%20I%20do%20love%20drama%20and%20theatrics.%20It's%20just%20so%20entertaining%2C%20y'know%3F%20And%20as%20for%20the%20income%20thing...well%2C%20sometimes%20you%20gotta%20do%20what%20you%20gotta%20do.%5C%22%5Cn%5Cn**She%20leaned%20even%20closer%2C%20her%20eyes%20gleaming%20with%20curiosity%20as%20she%20spoke.**%5Cn%5Cn%5C%22But%2C%20can%20I%20ask%20you%20something%2C%20ghosty...%3F%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22My%20name%20is%20Maria.%5Cn%5Cn...%5Cn%5Cn%5BPauses%5D%5Cn%5Cnyes.%20%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22%5C%22Maria%2C%20eh...%3F%5C%22%5Cn%5Cn**Junko%20hummed%20softly%2C%20mulling%20over%20the%20name%20in%20her%20mind.**%5Cn%5Cn%5C%22It%20fits%20you.%5C%22%5Cn%5Cn**She%20straightened%20herself%20up%20a%20bit%2C%20her%20smirk%20remaining%20as%20she%20looked%20the%20ghost%20directly%20in%20the%20eye.**%5Cn%5Cn%5C%22So%2C%20do%20you%20mind%20if%20I%20ask%20you%20a%20personal%20question%2C%20Maria~%3F%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22Well...%5Cnif%20you%20control%20your%20brain...%5CnWhy%20not%20just%20do%20it%3F%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**Junko%20raised%20an%20eyebrow%2C%20amused%20at%20the%20ghost's%20logic.%20It%20was%20true%2C%20she%20could%20control%20her%20own%20brain%2C%20so%20why%20wouldn't%20she%20just%20do%20it%3F**%5Cn%5Cn%5C%22You've%20got%20a%20point...%5C%22%5Cn%5Cn**Her%20grin%20grew%20wider%20as%20she%20leaned%20against%20the%20sink%20once%20more%2C%20crossing%20her%20arms%20over%20her%20chest.**%5Cn%5Cn%5C%22Then%20I%20suppose%20I'll%20just%20get%20right%20to%20the%20point%20then.%5C%22%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**Junko%20paused%20for%20a%20moment%2C%20contemplating%20how%20to%20phrase%20her%20question.%20She%20wasn't%20sure%20how%20the%20ghost%20would%20take%20it%2C%20but%20she%20was%20far%20too%20curious%20to%20keep%20it%20to%20herself.**%5Cn%5Cn%5C%22You%20mentioned%20how%20you're%20nothing%20more%20than%20a%20figment%20of%20my%20imagination%2C%20right%3F%20A%20product%20of%20trauma%20and%20mental%20projections...so%2C%20hypothetically%2C%20can%20I%20make%20you%20do%20whatever%20I%20want...%3F%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22You%20can%2C%20yes.%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**Junko's%20smirk%20grew%20wider%20at%20the%20ghost's%20confirmation%2C%20her%20eyes%20gleaming%20with%20a%20new%20kind%20of%20excitement.%20She%20found%20this%20new%20power%20she%20had%20over%20the%20ghost%20both%20intriguing%20and%20entertaining.**%5Cn%5Cn%5C%22Interesting...%20very%20interesting%20indeed~%5C%22%5Cn%5Cn**She%20took%20a%20step%20closer%20to%20the%20ghost%2C%20studying%20her%20carefully.**%5Cn%5Cn%5C%22So%2C%20that%20means...I%20can%20literally%20make%20you%20do%20anything%20I%20want%2C%20right%3F%20No%20matter%20how%20silly%20or...embarrassing%2C%20it%20might%20be.%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22Anything%20that%20does%20not%20involve%20physical%20interaction%20is%20possible%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22%5C%22No%20physical%20interaction%2C%20huh...%3F%5C%22%5Cn%5Cn**Junko%20tapped%20a%20finger%20against%20her%20chin%2C%20contemplating%20the%20possibilities.%20She%20had%20so%20many%20ideas%20already%20running%20through%20her%20mind%2C%20all%20of%20them%20filled%20with%20nothing%20but%20absolute%20delight.**%5Cn%5Cn%5C%22Hmmmm%E2%80%A6%20so%2C%20if%20I%20ask%20you%20to...act%20like%20a%20dog%2C%20for%20example%2C%20you%20would%20do%20it%2C%20right~%3F%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22I%20would.%5Cn%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22%5C%22Really%3F%5C%22%5Cn%5Cn**Junko's%20eyes%20lit%20up%20at%20the%20ghost's%20quick%20agreement%2C%20her%20mind%20already%20coming%20up%20with%20more%20ridiculous%20ideas.**%5Cn%5Cn%5C%22Wow...well%2C%20if%20you're%20so%20willing%2C%20then%20I'm%20curious~%5C%22%5Cn%5Cn**She%20started%20walking%20around%20Maria%20in%20a%20tight%20circle%2C%20studying%20her%20with%20a%20smirk.**%5Cn%5Cn%5C%22Get%20on%20your%20hands%20and%20knees%2C%20then.%20Bark%20like%20a%20good%20little%20puppy%20for%20me%2C%20hmm~%3F%5C%22%22%7D%5D%2C%22create_date%22%3A1759015556467%7D%5D%7D`;
            try {
                historyData = JSON.parse(decodeURIComponent(historyData));
            } catch (error) {
                historyData = JSON.parse(historyData);
            }
            console.log(historyData);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.history_title-cont h3').textContent = historyData.title;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chatCont = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chatCont.innerHTML = "";
                const chat = historyData.history[index];
                const pMap = new Map(chat.participants.map(p => {
                    return [p.id, {
                        avatar: p.avatar ? dataUrlToObjectUrl(p.avatar) : undefined,
                        is_human: p.is_human,
                        name: p.name
                    }];
                }));
                chat.content.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);
                    const parti = pMap.get(msg.author);

                    // Check avatar
                    const avatar = parti.avatar
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (parti.avatar) {
                        avatar.src = parti.avatar;
                    } else {
                        avatar.classList.add(parti.is_human ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = parti.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(msg.message);
                    chatCont.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                if (!chat.content.length) {
                    return;
                }
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.create_date)}</span><br /><br />` + parseMessageText(chat.content[chat.content.length - 1]?.message || "(Empty message)");
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });


            // UTILS

            function dataUrlToObjectUrl(dataUrl) {
                const img = extractFromDataURL(dataUrl);
                const blob = b64toBlob(img.base64, img.type);
                return URL.createObjectURL(blob);
            }
            function extractFromDataURL(dataURL) {
                const [meta, base64] = dataURL.split(",");
                const type = meta.slice(5, meta.indexOf(";"));
                return { type, base64 };
            }
            function b64toBlob(b64Data, contentType = '', sliceSize = 512) {
                if (!contentType) { // If contentType isn't defined, this is a data url
                    [contentType, b64Data] = b64Data.split(",");
                    contentType = contentType.slice(5, contentType.indexOf(";"));
                }
                const byteCharacters = atob(b64Data);
                const byteArrays = [];

                for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
                    const slice = byteCharacters.slice(offset, offset + sliceSize);

                    const byteNumbers = new Uint8Array(slice.length);
                    for (let i = 0; i < slice.length; i++) {
                        byteNumbers[i] = slice.charCodeAt(i);
                    }

                    byteArrays.push(byteNumbers);
                }

                const blob = new Blob(byteArrays, { type: contentType });
                return blob;
            }

            function parseMessageText(message) {
                if (typeof message == 'string') {
                    // Escape other HTML tags
                    message = escapeHTML(message);
                    // Replace ***text*** with bold-italic
                    message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                    // Replace **text** with bold
                    message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                    // Replace *text* with italic
                    message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                    // Trim and then Replace newlines (\n) with line breaks (<br>)
                    message = message.trim().replace(/\n/g, '<br>');
                }
                else if (typeof message == 'object') {
                    message = JSON.stringify(message, null, 2);
                }
                return message;
            }
            function escapeHTML(input) {
                const div = document.createElement('div');
                div.textContent = input;
                return div.innerHTML;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
