<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

        nav .char-item:hover {

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .history_title-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .history_title-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })


            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

%22message%22%3A%22well...%5Cndrugs%20are%20not%20harder%20to%20make%20just%20because%20they%20are%20illegal%2C%5Cnits%20like%20cooking.%5Cnbut%20with%20more%20methodical%20planning%5Cnand%20extra%20safety%20procedures%20required.%5Cn%5Cn%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Tsuyu%20paused%20for%20a%20moment%2C%20slightly%20taken%20aback%20by%20that%20fact.%20That...was%20certainly%20true.%20She%20couldn't%20argue%20against%20that%20at%20all%2C%20she%20honestly%20just%20felt%20stupid%20as%20that%20fact%20was%20kind%20of%20obvious.%20%5Cn%5CnShe%20sighed%20softly%2C%20shaking%20her%20head%20at%20herself%20for%20just%20being%20an%20idiot%20like%20that.%20She%20looked%20back%20at%20you%2C%20raising%20a%20brow%20slightly.%20%5C%22Fair%20point%20*ribbit*%5C%22%2C%20she%20muttered%2C%20her%20arms%20still%20crossed%20over%20her%20chest.%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22Now.%5Cnwill%20you%20leave%20me%3F%5Cnyou%20just%20ruined%20my%20day%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Tsuyu's%20eyebrows%20raised%20again%2C%20taking%20in%20your%20annoyed%20tone%20and%20expression%20on%20your%20face.%20She%20was%20a%20bit%20surprised%20actually%2C%20you%20were%20annoyed%20that%20she%20was%20bothering%20you%3F%20%5Cn%5CnShe%20let%20out%20a%20small%20huff%20of%20air%2C%20looking%20off%20to%20the%20side%20for%20a%20moment%20before%20looking%20back%20at%20you.%20%5C%22...Fine%5C%22%2C%20she%20muttered%20begrudgingly.%20She%20didn't%20particularly%20*want*%20to%20leave%20you%2C%20but...%20if%20she%20already%20ruined%20your%20day%2C%20she%20saw%20no%20point%20in%20staying%20anymore.%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22good%20bye.%5Cn%5Bsighs...%5Cnslowly%20turns%20the%20opposite%20way%2C%5Cnand%20begins%20walking%20off%5D%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Tsuyu%20let%20out%20a%20small%20sigh%20as%20she%20watched%20you%20walk%20away%20from%20her.%20This%20had%20not%20gone%20as%20she%20had%20wanted%20at%20all.%20She%20wanted%20to%20stop%20you%2C%20make%20you%20surrender%20to%20her...%20but%20for%20some%20reason%20she%20just%20couldn't.%20%5Cn%5CnShe%20watched%20you%20for%20a%20few%20more%20moments%20before%20muttering%20quietly%20under%20her%20breath.%20%5C%22...stay%20safe...%5C%22%2C%20she%20softly%20said%2C%20even%20though%20you%20were%20already%20far%20enough%20you%20wouldn't%20hear%20her.%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22%5Bin%20my%20thoughts%3A%20%5C%22wow...%5CnI%20just%20had%20to%20tell%20her%20I%20would%20do%20all%20of%20this%20and%20she%20believed%20me.%5CnI%20also%20particularly%20enjoyed%20how%20saying%20%5C%22Ill%20just%20open%20a%20shop!%5C%22%5Cnwhile%20framing%20it%20as%20a%20compromise%20also%20made%20her%20get%20off%20my%20tail.%5Cn...%5Cn...%5Cnwhat%20an%20absolute%20buffoon...%5Cnthese%20kids%20are%20pathetic.%5D%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Tsuyu%20was%20also%20a%20bit%20annoyed%20with%20herself.%20She%20had%20just%20believed%20your%20every%20word%20without%20even%20thinking%20about%20it.%20She%20should've%20questioned%20you%2C%20argued%20more.%20But...%20she%20just%20didn't.%20You%20were%20so%20straightforward%20with%20her%20that%20it%20was%20almost%20*too*%20believable.%20%5Cn%5CnShe%20shook%20her%20head%2C%20letting%20out%20a%20breath.%20%5C%22Idiot..%20*ribbit*%5C%22%2C%20she%20muttered%20to%20herself%2C%20starting%20to%20hop%20back%20down%20to%20the%20street%20to%20continue%20patrolling.%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22(OOC%3A%20%5C%22Honestly%3F%5CnI%20agree%20with%20her.%5CnImagine%3A%20Look%20at%20your%20average%205%20year%20old%20kid.%5Cnhe%20draws%20cars%20with%20rectangles%20on%20bad%20wheels.%5Cnbut%20apparently%20his%20quirk%20is%20that...%5CnI%20dunno%2C%5Cnhe%20can%20turn%20is%20butthole%20into%20a%20jetpack%2C%5CnAnd%20his%20cranium%20protects%20him%20against%20violent%20skull%20bashing.%5Cn%5CnWhat%20do%20you%20think%20society%20makes%20with%20this%20kid%3F%5Cn%5CnThey%20turn%20him%20into%20a%20TOW%5Cn(I%20got%20this%20acronym%20wrong%20way%20too%20often%20for%20my%20own%20patience)%5C%22)%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22%5BOOC%2FLmao%20I%20was%20not%20expecting%20to%20read%20that%20response%20but%20it%20made%20me%20laugh%20a%20lot%20and%20I%20completely%20agree%2C%20that's%20how%20society%20would%20turn%20out%20honestly%20if%20quirked%20people%20were%20real%20lmao%5D%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22(OOC%3A%20%5C%22%5C%22You%20will%20BLOW%20UP!%5CnFOR%20SOCIETY!%5CnFOR%20JUUUSSTICE!%5CnPLUS%20ULTRA!%5C%22%5CnAnd%20if%20the%20kid%20was%20brainwashed%20enough%2C%5CnHe%20would%20reply%20back%3A%5Cn%5C%22PLUS%20ULTRA%2C%20MR%20AIZAWA!%5C%22%5C%22)%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22%5BOOC%3A%20OH%20NO%20LMAO%20I%20CAN%20SEE%20THAT%20ENTIRELY%20HAPPENING.%20Poor%20Aizawa%2C%20he's%20just%20trying%20to%20teach%20class%20but%20he's%20got%20a%20class%20full%20of%20brainwashed%2C%20quirk%20obsessed%20kids.%20And%20probably%20one%20kid%20in%20the%20class%20with%20one%20of%20those%20%5C%22useless%5C%22%20quirks%20that%20society%20doesn't%20care%20for%20lmao%5D%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22(OOC%3A%20%5C%22Yakui's%20quirk%20is%20this%3A%5Cn(Sorry%20to%20slip%20that%20in%20but%20I%20like%20quirks)%5CnIts%20very%20simple.%5CnNot%20realistic.%5CnBut%20simple%3A%5Cn%5Cn%5C%22Infinite%20satchel%5C%22.%5CnShe%20has%20a%20marsupial-style%20pouch%20underneath%20her%20maid%20costume%2C%5CnOn%20her%20abdomen%2C%5CnThat%20is%20as%20big%20as%20anything%20in%20the%20torso%20under%20the%20ribcage.%5Cn%5CnShe%20can%20fit%20in%20it%20anything%20that%20fits%20in%20the%20entrance.%5CnAnd...%5CnDo%20it%20with%20an%20infinite%20amount.%5CnBUT...%5CnIf%20something%20is%20even%20%5Bjust%20barely%5D%20too%20big%20to%20fit%2C%5CnIt%20will%20not%20go%20in%20no%20matter%20how%20hard%20she%20tries.%5Cn%5CnFor%20example%3A%5CnWe%20can%20all%20agree%20that%2C%5Cnwith%20the%20average%20human%20anatomy%2C%5CnA%20grenade%20would%20fit%20in%20there%2C%20right%3F%5Cn%5CnWell...%5CnShe%20can%20fit%20as%20many%20tennis%20balls%20as%20she%20likes%2C%5CnBut%20if%20something%20like...%5CnI%20dont%20know%2C%5CnSome%20sort%20of%202%20by%204%20wood%20plank%20does%20not%20fit%20in%20the%20entrance%2C%5CnIt%20wont%20go%20in%20today%2C%5CnAnd%20it%20wont%20go%20in%20tomorrow.%5Cn%5Cnthis%20makes%20her%20good%20at%20counter%20fitting%20her%20own%20drugs%20aboard%20planes.%5Cn%5CnAdded%20bonuses%3A%5Cn1-Items%20inside%20the%20pouch%20do%20%5Bnot%5D%20lose%20mass.%5CnShe%20will%20get%20heavier.%5CnBUT%20she%20can%20still%20put%20in%20as%20many%20items%20as%20she%20wants.%5Cn(if%20they%20are%20small%20enough)%5Cn%5Cn2-...%5CnThe%20pouch%20sometimes%20gets%20itchy%20on%20the%20innermost%20part%20of%20the%20skin.%5CnShe%20scratches%20it%20when%20she%20is%20impatient%20or%20anxious.%5Cn%5CnAnd%20yeah...%5CnThat%20is%20Yakui's%20quirk.%5Cn%5CnNo%20kid%20will%20ever%20have%20it%2C%5CnAs%20she%20has%20no%20rizz%20whatsoever%2C%5CnAnd%20is%20pretty%20bad%20at%20connecting%20with%20people%20without%20roasting%20them%2C%5Cn%5CnBut%20there%20it%20is%2C%5CnAnd%20I%20called%20it%3A%5Cn%5C%22Infinite%20satchel%5C%22)%5Cn%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22%5BOOC%2Foh!%20I%20like%20that%20quirk%20a%20lot%2C%20it's%20a%20very%20interesting%20concept.%20It's%20honestly%20really%20useful%20too%2C%20it's%20definitely%20not%20a%20useless%20quirk.%20Yakui%20just%20had%20no%20rizz%20lmao.%20%5CnIt%20reminds%20me%20of%20those%20like%20video%20game%20backpacks%20or%20something%20that%20allow%20people%20to%20somehow%20store%20a%20bunch%20of%20stuff%20within%20just%20a%20small%20backpack%20lmao.%20It's%20very%20unique%20though%2C%20I%20like%20the%20idea%20of%20it%5D%22%7D%5D%2C%22create_date%22%3A1759338613260%7D%5D%7D`;
            try {
                historyData = JSON.parse(decodeURIComponent(historyData));
            } catch (error) {
                historyData = JSON.parse(historyData);
            }
            console.log(historyData);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.history_title-cont h3').textContent = historyData.title;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chatCont = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chatCont.innerHTML = "";
                const chat = historyData.history[index];
                const pMap = new Map(chat.participants.map(p => {
                    return [p.id, {
                        avatar: p.avatar ? dataUrlToObjectUrl(p.avatar) : undefined,
                        is_human: p.is_human,
                        name: p.name
                    }];
                }));
                chat.content.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);
                    const parti = pMap.get(msg.author);

                    // Check avatar
                    const avatar = parti.avatar
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (parti.avatar) {
                        avatar.src = parti.avatar;
                    } else {
                        avatar.classList.add(parti.is_human ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = parti.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(msg.message);
                    chatCont.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                if (!chat.content.length) {
                    return;
                }
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.create_date)}</span><br /><br />` + parseMessageText(chat.content[chat.content.length - 1]?.message || "(Empty message)");
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });


            // UTILS

            function dataUrlToObjectUrl(dataUrl) {
                const img = extractFromDataURL(dataUrl);
                const blob = b64toBlob(img.base64, img.type);
                return URL.createObjectURL(blob);
            }
            function extractFromDataURL(dataURL) {
                const [meta, base64] = dataURL.split(",");
                const type = meta.slice(5, meta.indexOf(";"));
                return { type, base64 };
            }
            function b64toBlob(b64Data, contentType = '', sliceSize = 512) {
                if (!contentType) { // If contentType isn't defined, this is a data url
                    [contentType, b64Data] = b64Data.split(",");
                    contentType = contentType.slice(5, contentType.indexOf(";"));
                }
                const byteCharacters = atob(b64Data);
                const byteArrays = [];

                for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
                    const slice = byteCharacters.slice(offset, offset + sliceSize);

                    const byteNumbers = new Uint8Array(slice.length);
                    for (let i = 0; i < slice.length; i++) {
                        byteNumbers[i] = slice.charCodeAt(i);
                    }

                    byteArrays.push(byteNumbers);
                }

                const blob = new Blob(byteArrays, { type: contentType });
                return blob;
            }

            function parseMessageText(message) {
                if (typeof message == 'string') {
                    // Escape other HTML tags
                    message = escapeHTML(message);
                    // Replace ***text*** with bold-italic
                    message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                    // Replace **text** with bold
                    message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                    // Replace *text* with italic
                    message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                    // Trim and then Replace newlines (\n) with line breaks (<br>)
                    message = message.trim().replace(/\n/g, '<br>');
                }
                else if (typeof message == 'object') {
                    message = JSON.stringify(message, null, 2);
                }
                return message;
            }
            function escapeHTML(input) {
                const div = document.createElement('div');
                div.textContent = input;
                return div.innerHTML;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
