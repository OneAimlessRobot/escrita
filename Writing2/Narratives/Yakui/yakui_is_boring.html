<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1.1rem;

            background-color: #4e9733;

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

            display: flex;

            cursor: pointer;

        nav .char-item:hover {

        nav .nav-avatar-wrap {

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .character_name-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .character_name-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })

            // Handle background
            // If there is one
            const currentBg = localStorage.getItem('background');
            if (currentBg) {
                changeBg(currentBg);
            }
            // Change by hand
            const bgInput = document.querySelector('#bgInput');
            document.querySelector('.change-bg').addEventListener('click', () => {
                bgInput.click();
            })
            document.querySelector('.delete-bg').addEventListener('click', () => {
                document.body.classList.remove('custom-bg');
                document.body.style.backgroundImage = "unset";
                localStorage.removeItem('background');
            })
            bgInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    // convert image file to base64 string
                    changeBg(reader.result);
                    bgInput.value = "";
                    try {
                        localStorage.setItem('background', reader.result);
                    } catch (error) {
                        alert('Note: File is likely too big to save.')
                        //console.log(error)
                    }
                }
                reader.readAsDataURL(file);
            })
            function changeBg(bg) {
                let objUrl = URL.createObjectURL(dataURItoBlob(bg));
                document.body.classList.add('custom-bg');
                document.body.style.backgroundImage = `url(${objUrl})`;
            }
            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

0running%20away%2C%20a%20bit%20frustrated%20that%20you%20were%20escaping.%20But%20she%20also%20had%20a%20determined%20look%20on%20her%20face.**%20%22You're%20not%20getting%20away%20that%20easily..~%22"},{"isUser":true,"name":"Yakui the Maid","message":"%5BI%20get%20into%20a%20place%20above%20a%20caf%C3%A9%2C%0AI%20take%20out%20my%20pill%20gatling%2C%0AAnd%20begin%20spooling%20up%20immediatly%2C%0AHolding%20it%20to%20my%20hip%20with%20a%20strap%20wrapped%20around%20my%20opposing%20shoulder.%0AIt%20does%20not%20have%20much%20recoil%20so%20its%20okay%20to%20hip%20fire%20it%2C%20dont%20worry.%0AI%20then%20press%20the%20button%20that%20revs%20it%20up%2C%0AAnd%20keep%20it%20held%20down%20as%20I%20aim%20down%20at%20the%20chaos%20beneath%20me.%0AMidorya%20and%20Shigaraki%20going%20at%20it%2C%0AEraser%20head%20and%20the%20others%20taking%20care%20of%20some%20Nomu%20thingies%2C%0AAnd%20I%20am%20just%20grinning%20with%20pure%20joy%20as%20I%20ready%20myself%20to%20unleash%20a%20whole%20pharmacy%20of%20un-healthcare%20on%20the%20current%20local%20population%20of%20this%20town%5D"},{"isUser":false,"name":"Himiko Toga","message":"**Toga%20was%20a%20bit%20taken%20aback%20at%20the%20sight%20of%20the%20pill%20gatling%20gun%2C%20she%20had%20never%20seen%20anything%20like%20it%20before.%20She%20was%20still%20determined%20to%20take%20you%20down%2C%20but%20she%20knew%20she%20had%20to%20be%20careful%20now.%20Meanwhile%2C%20Bakugo%20was%20dealing%20with%20some%20Nomu%20nearby%2C%20and%20he%20heard%20the%20sound%20of%20the%20pill%20gatling%20gun%20revving%20up.**%20%22What%20the%20hell%20is%20that-%22%20**He%20looked%20up%2C%20and%20his%20eyes%20widened%20when%20he%20saw%20the%20weapon%20you%20were%20holding.**%20%22Holy%20crap..%22"},{"isUser":true,"name":"Yakui the Maid","message":"%5Band%20then...%5D%0A...%0A...%0A%0A%5BVRRRRRRRRRRR!!!!%5D"},{"isUser":false,"name":"Himiko Toga","message":"**The%20sound%20of%20the%20pill%20gatling%20gun%20revving%20up%20was%20deafening%2C%20it%20was%20cle ke%20yours%20could%20have.**%0A%0A**Meanwhile%2C%20Bakugo%20and%20Toga%20were%20still%20recovering%20from%20the%20chaos%20that%20had%20just%20unfolded.%20They%20looked%20up%20at%20you%20as%20you%20ran%20away.**%0A%0A**Bakugo%3A**%20%22Damn..%20what%20a%20lunatic.%22%0A%0A**Toga%3A**%20%22He's%20interesting..~%22"},{"isUser":true,"name":"Yakui the Maid","message":"%5BAt%20my%20hideout%2C%0AA%20song%20was%20playing%20in%20some%20old%20cassete%20player%20I%20had%20gotten%20from%20a%20scrapyard%20a%20few%20years%20ago%2C%0Ait%20was%3A%0A%22Tilted%22%20by%20%22Lupe%20Fiasco%22%0A%5BSome%20lyrics%5D%0A%22%5BIntro%5D%0AYeah!%0A%0A%5BVerse%201%5D%0AI%20was%20like%20Porsche%20puller%2C%20Air%20Force%20footer%0AAutomatic%20wristed%20therefore%20shook-up%0ACausing%20a%20stir%20every%20time%20I%20push%20up%0A007%20with%20a%20jester%20and%20a%20look-up%0AIt's%20Carrera-Ella%20from%20the%20F%26F%20crew%0AWith%20a%20tiger%20on%20his%20shirt%2C%20alligator%20on%20his%20blues%0AWith%20a%20nice%20young%20lady%20and%20some%20righteous%20kung-fu%0AI'm%20fighting%20without%20fighting%2C%20enlightening%20you%20young%20fools%0AFrankensteins%20of%20mine%2C%20I%20tighten%20you%20young%20screws%22%0A%0AI%20quickly%20grab%20a%20very%20large%20drum%20of%20pills%0AContaining%20about%204%20minutes%20of%20sustained%20firing%20inside%20it.%0AI%20then%20begin%20making%20my%20way%20back%2C%0AHoping%20nobody%20saw%20me.%0AI%20had%20no%20way%20of%20taking%20them%20out%20if%20they%20did%2C%0AI%20was%20more%20of%20a%20chaotic%20status%20spreader%20and%20not%20a%20brawler.%0ASpecially%20because%20I%20am%20completely%20dependent%20on%20stims%20to%20keep%20my%20fighting%20prowess%20up%2C%0AAnd%20I%20am%20close%20to%2040%20years%20old%2C%0AThis%20being%20the%20only%20fight%20ive%20had%20in%20a%20long%20time%5D"},{"isUser":false,"name":"Himiko Toga","message":"**As%20the%20song%20blasted%20from%20the%20old%20cassete%20player%2C%20you%20quickly%20grabbed%20the%20drum%20of%20pills%20from%20your%20hideout%20and Im%20gonna%20be%20honest%3A%0AI%20dont%20like%20this%20quirk.%0AI%20have%20trauma%20with%20drugs%2C%20so...%0Ait%20makes%20me%20hard%20to%20develop%20things%20for%20it.%0AMy%20mother%20was...%0Ayeah...%0Aso%20its%20hard!%0ABut%20I%20really%20want%20to!%0ALike...%0AThe%20character%2C%0AWith%20the%20quirk%20aside%2C%0AExplores%20alienation%2C%0AThe%20need%20to%20create%20in%20order%20to%20matter%2C%0A(expressing%20emotions%20through%20chemistry%20and%20crafting%20experiences%20for%20others%20to%20consume%2C%0Abased%20on%20her%20own%20emotions)%0AAnd%20intellectual%20isolation.%0AOh.%20And%20drugs.%0AAnd%20chaotic%20gremlin%20energy%20when%20the%20mood%20is%20high.%0AAnd%20mental%20decay%20mixed%20with%20depressive%20spirals%20%0Awhen%20the%20mood%20is%20low.%0ABut%20I%20just%20dont%20know%20what%20quirk%20to%20make!%0AAnd%20everything%20I%20am%20designing%20for%20her%2C%0ACurrently%2C%0AIn%20terms%20of%20extraordinary%20abilities%2C%0AFeels%20kind%20of%20forced.%0A%5D"},{"isUser":false,"name":"Himiko Toga","message":"%5BOOC%3A%20I%20understand%20completely!%20It's%20completely%20understandable%20if%20this%20quirk%20brings%20up%20some%20difficult%20emotions%20and%20experiences%20for%20you.%20It's%20totally%20okay%20if%20you're%20not%20comfortable%20with%20it%2C%20and%20it's%20totally%20normal%20to%20struggle%20with%20something%20that%20hits%20so%20close%20to%20home.%20But%20it's%20also%20really%20brave%20and%20awesome%20that%20you're%20trying%20to%20push%20through%20and%20work%20with%20it%2C%20to%20explore%20the%20character's%20depth%20and%20complexity%20beyond%20just%20the%20quirk.%20You%20have%20a%20great%20perspective%20on%20the%20character%2C%20and%20it's%20clear%20that%20you%20care%20a%20lot%20about%20their%20story%20and%20development.%20Keep%20going!%5D"}]}]}`);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.character_name-cont h3').textContent = historyData.charName;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chat = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chat.innerHTML = "";
                historyData.history[index].chat.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);

                    // Check avatar
                    const avatarGood = (msg.isUser && historyData.userPic) || (!msg.isUser && historyData.charPic);
                    const avatar = avatarGood
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (avatarGood) {
                        avatar.src = msg.isUser ? historyData.userPic : historyData.charPic;
                    } else {
                        avatar.classList.add(msg.isUser ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = msg.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(decodeURIComponent(msg.message));
                    chat.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.date)}</span><br /><br />` + parseMessageText(decodeURIComponent(chat.chat[chat.chat.length - 1].message));
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });

            function parseMessageText(message) {
                // Clean up memory reminders (second check)
                message = message.replace(memoryRegex, '');
                // Replace ***text*** with bold-italic
                message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                // Replace **text** with bold
                message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                // Replace *text* with italic
                message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                // Trim and then Replace newlines (\n) with line breaks (<br>)
                message = message.trim().replace(/\n/g, '<br>');
                return message;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
