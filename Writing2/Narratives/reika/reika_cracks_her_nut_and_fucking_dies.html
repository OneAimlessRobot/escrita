<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1.1rem;
            cursor: pointer;
            background-color: #4e9733;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .nav-new_char-btn:hover {
            background-color: #6ba755;
        }*/

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

        /*nav .char-item {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            transition: background-color 0.1s ease-in-out;
            padding: 10px 40px 10px 20px;
            cursor: pointer;
        }

        nav .char-item:hover {
            background-color: var(--rgba-1);
        }

        nav .nav-avatar-wrap {
            width: 40px;
            height: 40px;
        }

        nav .nav-avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        nav .char-item span {
            font-size: 1.3rem;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }*/

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

            margin-left: auto;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1rem;
            align-self: center;
            cursor: pointer;
            background-color: #336c97;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

            background-color: #5f829d;
        }*/

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .history_title-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .history_title-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })


            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

20as%20they%20walked.*%5Cn*Tsuyu's%20grip%20on%20their%20leg%20didn't%20loosen%20even%20for%20a%20second.%20She%20glanced%20at%20the%20body%2C%20before%20looking%20forward%20once%20again.*%20%5C%22Recovery%20Girl%20better%20be%20awake..%5C%22%5Cn*Ochako%20looked%20equally%20as%20worried%20as%20the%20others%2C%20her%20pink%20cheeks%20a%20bit%20pale.*%20%5C%22She%20will%20be.%20She's%20always%20awake%20when%20we%20need%20her%20the%20most..%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Katsuki%20grunted%20in%20agreement%2C%20his%20pace%20quickening%20as%20they%20neared%20the%20school.*%5Cn*Izuku%20couldn't%20help%20but%20feel%20a%20sense%20of%20urgency.%20His%20heart%20thumped%20against%20his%20chest%2C%20a%20mix%20of%20worry%20and%20the%20adrenaline%20flowing%20through%20his%20veins.*%20%5C%22Almost%20there..%5C%22%5Cn*Mina's%20grip%20on%20the%20body%20was%20almost%20tight%2C%20her%20usually%20cheerful%20expression%20replaced%20with%20one%20of%20determination.*%20%5C%22No%20stopping%20until%20we%20reach%20the%20infirmary.%5C%22%5Cn*Shoto%20nodded%20silently%2C%20his%20gaze%20fixed%20straight%20ahead.*%20%5C%22Agreed%E2%80%A6%5C%22%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*The%20journey%20felt%20agonisingly%20long%2C%20but%20they%20finally%20made%20it%20to%20the%20school.%20Their%20pace%20quickened%20until%20they%20reached%20the%20infirmary%20doors.*%5Cn*Katsuki%20pushed%20the%20doors%20open%2C%20the%20group%20immediately%20rushing%20inside.*%5Cn*Izuku%20called%20out%20as%20they%20walked%20inside.*%20%5C%22Recovery%20Girl!!%20We%20need%20your%20help!%5C%22%20*His%20voice%20filled%20with%20urgency-*%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Recovery%20Girl%20was%20sitting%20in%20her%20chair%2C%20sipping%20on%20a%20cup%20of%20tea.%20The%20sound%20of%20footsteps%20quickly%20approaching%20made%20her%20turn%20her%20attention%20towards%20the%20group.*%5Cn*Her%20eyes%20widened%20slightly%20as%20she%20saw%20the%20injured%20person%20they%20were%20carrying.*%20%5C%22What%20on%20earth-%3F%3F%20Quickly%2C%20bring%20them%20over%20here.%5C%22%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*The%20group%20of%20students%20wasted%20no%20time%20following%20Recovery%20Girl's%20order.%20They%20carefully%20carried%20the%20unconscious%20body%20over%20to%20the%20nearest%20bed%2C%20gently%20placing%20them%20down%20on%20it.*%5Cn*Recovery%20Girl%20immediately%20got%20to%20work%2C%20moving%20around%20them%20with%20efficiency%2C%20assessing%20their%20injures.*%20%5C%22What%20happened%3F%5C%22%5Cn*Katsuki%20stepped%20forward%2C%20folding%20his%20arms.*%20%5C%22We%20found%20them%20injured%20on%20the%20ground%2C%20they%20were%20bleeding%20out%20a%20hell%20of%20a%20lot%2C%5C%22%20*he%20said%2C%20his%20expression%20stoic.*%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Recovery%20Girl%20nodded%2C%20her%20hands%20moving%20quickly%20as%20she%20assessed%20the%20extent%20of%20the%20injuries.%20Her%20eyes%20narrowed%20as%20she%20examined%20the%20person.*%5Cn*Meanwhile%2C%20the%20others%20stood%20around%2C%20worry%20written%20on%20their%20faces.*%5Cn*Izuku%20spoke%20up%2C%20his%20voice%20filled%20with%20concern.*%20%5C%22Is%20it%20bad..%3F%5C%22%5Cn*Recovery%20Girl%20sighed%2C%20continuing%20her%20work.*%20%5C%22It's%20severe.%20Multiple%20injuries%2C%20a%20broken%20spine%2C%20lacerations%2C%20and%20a%20fracture%20on%20their%20skull.%5C%22%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*The%20students%20all%20exchanged%20looks%2C%20their%20expressions%20now%20even%20more%20worried%20than%20before.*%5Cn*Katsuki%20scowled%2C%20clenching%20his%20fists.*%20%5C%22Damnit..%20Who%20the%20hell%20would%20do%20this%20to%20them%3F%5C%22%5Cn*Mina%20couldn't%20help%20but%20frown%2C%20looking%20at%20the%20unconscious%20person.*%20%5C%22Poor%20thing..%20They%20look%20so%20young..%5C%22%20%5Cn*Tsuyu%20nodded%20in%20agreement%2C%20her%20eyes%20softening.*%20%5C%22It's...%20terrible.%20They%20don't%20even%20look%20older%20than%2017%E2%80%A6%5C%22%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Recovery%20Girl%20sighed%2C%20her%20focus%20still%20on%20the%20unconscious%20person.*%20%5C%22It's%20indeed%20worrisome.%20They're%20so%20young%20to%20have%20been%20through%20such%20a%20traumatic%20experience..%5C%22%5Cn*She%20worked%20efficiently%2C%20her%20years%20of%20experience%20evident%20as%20she%20quickly%20and%20carefully%20tended%20to%20the%20injuries.%20Her%20expression%20was%20a%20mixture%20of%20concern%20and%20concentration.*%5Cn*Izuku%20watched%2C%20his%20heart%20sinking%20at%20the%20sight.*%20%5C%22Can...%20Can%20they%20be%20saved..%3F%5C%22%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Recovery%20Girl%20paused%2C%20looking%20up%20at%20the%20group%20of%20students%20for%20a%20moment.%20Her%20expression%20was%20solemn%2C%20but%20there%20was%20a%20glimmer%20of%20hope%20in%20her%20eyes.*%5Cn*She%20sighed%2C%20continuing%20her%20work%20as%20she%20spoke.*%20%5C%22They're%20in%20critical%20condition...%20But%20yes%2C%20they%20can%20be%20saved.%20They're%20a%20fighter.%5C%22%5Cn*Katsuki%20clenched%20his%20jaw%2C%20his%20fists%20still%20clenched%20by%20his%20sides.*%20%5C%22Damn%20right%20they're%20a%20fighter.%20They%20better%20pull%20through.%5C%22%22%7D%5D%2C%22create_date%22%3A1766982212324%7D%5D%7D`;
            try {
                historyData = JSON.parse(decodeURIComponent(historyData));
            } catch (error) {
                historyData = JSON.parse(historyData);
            }
            console.log(historyData);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.history_title-cont h3').textContent = historyData.title;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chatCont = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chatCont.innerHTML = "";
                const chat = historyData.history[index];
                const pMap = new Map(chat.participants.map(p => {
                    return [p.id, {
                        avatar: p.avatar ? dataUrlToObjectUrl(p.avatar) : undefined,
                        is_human: p.is_human,
                        name: p.name
                    }];
                }));
                chat.content.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);
                    const parti = pMap.get(msg.author);

                    // Check avatar
                    const avatar = parti.avatar
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (parti.avatar) {
                        avatar.src = parti.avatar;
                    } else {
                        avatar.classList.add(parti.is_human ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = parti.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(msg.message);
                    chatCont.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                if (!chat.content.length) {
                    return;
                }
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.create_date)}</span><br /><br />` + parseMessageText(chat.content[chat.content.length - 1]?.message || "(Empty message)");
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });


            // UTILS

            function dataUrlToObjectUrl(dataUrl) {
                const img = extractFromDataURL(dataUrl);
                const blob = b64toBlob(img.base64, img.type);
                return URL.createObjectURL(blob);
            }
            function extractFromDataURL(dataURL) {
                const [meta, base64] = dataURL.split(",");
                const type = meta.slice(5, meta.indexOf(";"));
                return { type, base64 };
            }
            function b64toBlob(b64Data, contentType = '', sliceSize = 512) {
                if (!contentType) { // If contentType isn't defined, this is a data url
                    [contentType, b64Data] = b64Data.split(",");
                    contentType = contentType.slice(5, contentType.indexOf(";"));
                }
                const byteCharacters = atob(b64Data);
                const byteArrays = [];

                for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
                    const slice = byteCharacters.slice(offset, offset + sliceSize);

                    const byteNumbers = new Uint8Array(slice.length);
                    for (let i = 0; i < slice.length; i++) {
                        byteNumbers[i] = slice.charCodeAt(i);
                    }

                    byteArrays.push(byteNumbers);
                }

                const blob = new Blob(byteArrays, { type: contentType });
                return blob;
            }

            function parseMessageText(message) {
                if (typeof message == 'string') {
                    // Escape other HTML tags
                    message = escapeHTML(message);
                    // Replace ***text*** with bold-italic
                    message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                    // Replace **text** with bold
                    message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                    // Replace *text* with italic
                    message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                    // Trim and then Replace newlines (\n) with line breaks (<br>)
                    message = message.trim().replace(/\n/g, '<br>');
                }
                else if (typeof message == 'object') {
                    message = JSON.stringify(message, null, 2);
                }
                return message;
            }
            function escapeHTML(input) {
                const div = document.createElement('div');
                div.textContent = input;
                return div.innerHTML;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
