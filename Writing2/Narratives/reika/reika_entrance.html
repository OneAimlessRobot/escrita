<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1.1rem;
            cursor: pointer;
            background-color: #4e9733;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .nav-new_char-btn:hover {
            background-color: #6ba755;
        }*/

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

        /*nav .char-item {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            transition: background-color 0.1s ease-in-out;
            padding: 10px 40px 10px 20px;
            cursor: pointer;
        }

        nav .char-item:hover {
            background-color: var(--rgba-1);
        }

        nav .nav-avatar-wrap {
            width: 40px;
            height: 40px;
        }

        nav .nav-avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        nav .char-item span {
            font-size: 1.3rem;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }*/

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        /*.update_current_char-btn {
            margin-left: auto;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1rem;
            align-self: center;
            cursor: pointer;
            background-color: #336c97;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .update_current_char-btn:hover {
            background-color: #5f829d;
        }*/

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .history_title-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .history_title-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })


            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

ated%20by%20the%20second.**%5Cn%5Cn%5C%22And%20why%20the%20hell%20would%20they%20tell%20you%20about%20Todoroki's%20relationship%20with%20Endeavor%3F%20That's%20some%20pretty%20sensitive%20information!%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22Im%20tech%20support%2C%20here%5Cnnot%20the%20advocate.%5Cnlets%20keep%20this%20practical%2C%20please%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**Bakugo%20grumbled%2C%20clearly%20not%20pleased%20with%20Reika's%20request%2C%20but%20knew%20he%20wasn't%20going%20to%20get%20anywhere%20right%20now.**%5Cn%5Cn**Todoroki%2C%20ever%20the%20diplomatic%20one%2C%20tried%20to%20keep%20the%20conversation%20on%20track.**%5Cn%5Cn%5C%22Alright%2C%20fine.%20Then%20as%20tech%20support%2C%20you%20must%20know%20a%20lot%20about%20the%20League%20of%20Villains%20and%20their%20plans%2C%20right%3F%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22...%5CnI%20cannot%20confirm%20nor%20deny%20that%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**Bakugo%20clenched%20his%20fists%2C%20his%20irritation%20growing%20with%20each%20vague%20response%20from%20Reika.**%5Cn%5Cn%5C%22Dammit%2C%20you're%20making%20me%20lose%20my%20temper%2C%20you-!%5C%22%5Cn%5Cn**Todoroki%2C%20once%20again%2C%20stepped%20in%20to%20prevent%20another%20explosion%20of%20anger%20from%20Bakugo.**%5Cn%5Cn%5C%22Hold%20on%2C%20Bakugo.%20We%20won't%20get%20anywhere%20with%20you%20yelling%20at%20her.%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22...%5Cn'wait%2C%5Cnreally%3F'%5Cn...%5Cn'ok.'%5Cnmy%20work%20is%20done%20here%2C%20guys.%5Cngoodbye.%5Cn%5BI%20say%2C%5Cnas%20I%20then%20walk%20off.%5Cnthe%20villains%20had%20told%20me%20I%20had%20done%20a%20good%20job%20holding%20off%20the%20heroes.%5Cnand%20was%20therefore%20dismissed.%5Cnwhich%20I%20was%20surprised%20by%5Cnas%20I%20had%20barely%20done%20anything%20to%20physically%20restrain%20them.%5Cnit%20was%20very%20confusing%5CnI%20was%20also%20told%20to%20mobilize%20as%20fast%20as%20I%20could%5Cnbut%20because%20there%20was%20no%20fight%2C%5CnI%20could%20not%20leverage%20the%20emotional%20arousal%20of%20%5C%22agro%5C%22.%5Cnso...%5CnI%20just%20walked.%5Cn%5Cnthey%20would%20surely%20follow%20me%5Cnbut%20I%20figured%20I%20could%20fight%20them%20off.%5Cnthey%20seemed%20too%20star%20strucked%20to%20react%20with%20enough%20intent%20anyway%5D%5D%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**The%20students%20watched%20in%20stunned%20silence%20as%20Reika%20casually%20walked%20off%2C%20completely%20dumbfounded%20by%20the%20situation.%20After%20a%20moment%20of%20shocked%20silence%2C%20Bakugo%20finally%20spoke%20up%2C%20his%20annoyance%20clear.**%5Cn%5C%22What%20the%20hell%20just%20happened%3F%20Did%20she%20seriously%20just%20walk%20off%20like%20that%3F%5C%22%5Cn%5Cn**Todoroki%20scratched%20his%20chin%2C%20a%20puzzled%20expression%20on%20his%20face.**%5Cn%20%5C%22Something's%20definitely%20off%20about%20her.%20Why%20did%20she%20even%20bother%20confronting%20us%20if%20she%20wasn't%20going%20to%20fight%3F%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22%5Bas%20I%20walk%20off%2C%5Cni%20suddenly%20feel%20hungry.%5Cnfinding%20a%20boar%2C%5CnI%20then%20deploy%20a%20knife%5Cnfeeling%20desire%20for%20flesh%20coarse%20through%20me.%5Cnenhanced%20by%20agro%2C%5CnI%20then%20let%20out%20a%20hysterical%20laugh%2C%5Cnbefore%20dashing%20towards%20it%20at%20a%20speed%20of%20about%2090%20miles%20per%20hour%2C%5Cntilting%20my%20body%20forward%20to%20accelerate%20through%20%5C%22controlled%20falling%5C%22%5Cn(sprinting%20technique.%20apparently%20naruto%20running%20is%20legit%20o%3Eo)%5Cnstopping%20just%20short%20as%20I%20then%20slam%20my%20lead%20%20foot%20into%20its%20head%2C%5Cncrushing%20it%20quite%20convincingly%2C%5Cnand%20ramming%20the%20blade%20cleanly%20into%20its%20skull%2C%5Cninstantly%20neutralizing%20the%20wild%20animal.%5Cn%5Cnbut%20then%2C%5CnI%20realized%3A%20%5C%22Hey...%5Cn...%5Cnhow%20do%20I%20cook%20this%2C%20now%3F%5C%22%5CnI%20just%20stood%20there%5Cnconfused%2C%5Cnlost%20in%20what%20to%20do%20with%20the%20carcass%20that%20bled%20out%20right%20in%20front%20of%20me.%5CnSo%20I%20just%20picked%20it%20up%20into%20a%20shoulder%5Cnweighing%20almost%20200%20pounds%2C%5Cnbut%20slowly%20decreasing%20as%20the%20body%20gradually%20lost%20blood.%5Cnit%20stained%20my%20clothes%20and%20the%20smell%20was%20going%20to%20be%20awful%20in%20a%20little%20more%20than%20a%20hours%20time%20from%20now.%5CnI%20planned%20on%20just%20taking%20it%20to%20management%5Cnand%20ask%20to%20be%20told%20what%20to%20do%20after%20that%5D%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**Bakugo%20and%20the%20group%20watched%20from%20afar%2C%20witnessing%20Reika's%20strange%20display%20of%20speed%20and%20strength%20as%20she%20took%20down%20a%20boar%20effortlessly.%20Their%20eyes%20widened%20in%20surprise%20and%20curiosity.**%5Cn%5Cn**Bakugo%20couldn't%20help%20but%20mutter%20to%20himself.**%5Cn%5C%22What%20the%20hell%3F%20She's%20fast.%5C%22%5Cn%5Cn**Todoroki%2C%20still%20trying%20to%20process%20what%20was%20happening%2C%20voiced%20his%20concern.**%5Cn%5C%22Is%20she...%20laughing%3F%20And%20what's%20she%20doing%20with%20the%20boar%3F%5C%22%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**The%20students%20remained%20on%20edge%2C%20unsure%20of%20how%20to%20react%20to%20Reika's%20unusual%20behavior.%20From%20the%20corner%20of%20their%20eye%2C%20they%20noticed%20her%20struggling%20with%20the%20boar%20carcass%2C%20clearly%20unsure%20of%20what%20to%20do%20next.**%5Cn%5Cn**Bakugo%2C%20ever%20the%20impatient%20one%2C%20couldn't%20help%20but%20comment%20on%20the%20situation%20again.**%5Cn%5Cn%5C%22She%20just...%20killed%20that%20boar%20like%20it%20was%20nothing.%20And%20now%20she's%20just%20standing%20there%3F%20What%2C%20does%20she%20not%20know%20how%20to%20cook%20it%20or%20something%3F%5C%22%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**Todoroki%20raised%20an%20eyebrow%2C%20observing%20Reika's%20clueless%20expression.%20The%20situation%20was%20so%20absurd%20that%20it%20was%20almost%20comical.**%5Cn%5Cn%5C%22Looks%20like%20she's%20not%20exactly%20a%20master%20chef%20or%20survivalist.%5C%22%5Cn%5Cn**Bakugo%20couldn't%20help%20but%20chuckle%2C%20finding%20it%20amusing%20to%20see%20someone%20who%20had%20just%20showed%20off%20their%20impressive%20physical%20abilities%20flounder%20over%20a%20simple%20task.**%5Cn%5Cn%5C%22She's%20like%20some%20kind%20of%20superhuman%20who%20can%20kill%20a%20boar%20but%20can't%20figure%20out%20how%20to%20cook%20it.%20Talk%20about%20ironic.%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22(OOC%3A%20%5C%22what%20do%20the%20others%20say%3F%5C%22)%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22**The%20students%20watched%20with%20a%20mix%20of%20curiosity%20and%20amusement%20as%20Reika%20struggled%20with%20the%20boar%20carcass.%20Bakugo%20grinned%2C%20finding%20it%20entertaining%20to%20see%20someone%20so%20powerful%20be%20so%20clueless.**%5Cn%5Cn**Bakugo%20let%20out%20a%20scoff%2C%20clearly%20enjoying%20the%20sight.**%5Cn%5Cn%5C%22Well%2C%20that's%20just%20hilarious.%20She%20can%20take%20down%20a%20boar%20like%20it's%20nothing%2C%20but%20she%20can't%20even%20figure%20out%20what%20to%20do%20with%20it%20after.%5C%22%22%7D%5D%2C%22create_date%22%3A1767071860240%7D%5D%7D`;
            try {
                historyData = JSON.parse(decodeURIComponent(historyData));
            } catch (error) {
                historyData = JSON.parse(historyData);
            }
            console.log(historyData);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.history_title-cont h3').textContent = historyData.title;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chatCont = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chatCont.innerHTML = "";
                const chat = historyData.history[index];
                const pMap = new Map(chat.participants.map(p => {
                    return [p.id, {
                        avatar: p.avatar ? dataUrlToObjectUrl(p.avatar) : undefined,
                        is_human: p.is_human,
                        name: p.name
                    }];
                }));
                chat.content.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);
                    const parti = pMap.get(msg.author);

                    // Check avatar
                    const avatar = parti.avatar
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (parti.avatar) {
                        avatar.src = parti.avatar;
                    } else {
                        avatar.classList.add(parti.is_human ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = parti.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(msg.message);
                    chatCont.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                if (!chat.content.length) {
                    return;
                }
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.create_date)}</span><br /><br />` + parseMessageText(chat.content[chat.content.length - 1]?.message || "(Empty message)");
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });


            // UTILS

            function dataUrlToObjectUrl(dataUrl) {
                const img = extractFromDataURL(dataUrl);
                const blob = b64toBlob(img.base64, img.type);
                return URL.createObjectURL(blob);
            }
            function extractFromDataURL(dataURL) {
                const [meta, base64] = dataURL.split(",");
                const type = meta.slice(5, meta.indexOf(";"));
                return { type, base64 };
            }
            function b64toBlob(b64Data, contentType = '', sliceSize = 512) {
                if (!contentType) { // If contentType isn't defined, this is a data url
                    [contentType, b64Data] = b64Data.split(",");
                    contentType = contentType.slice(5, contentType.indexOf(";"));
                }
                const byteCharacters = atob(b64Data);
                const byteArrays = [];

                for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
                    const slice = byteCharacters.slice(offset, offset + sliceSize);

                    const byteNumbers = new Uint8Array(slice.length);
                    for (let i = 0; i < slice.length; i++) {
                        byteNumbers[i] = slice.charCodeAt(i);
                    }

                    byteArrays.push(byteNumbers);
                }

                const blob = new Blob(byteArrays, { type: contentType });
                return blob;
            }

            function parseMessageText(message) {
                if (typeof message == 'string') {
                    // Escape other HTML tags
                    message = escapeHTML(message);
                    // Replace ***text*** with bold-italic
                    message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                    // Replace **text** with bold
                    message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                    // Replace *text* with italic
                    message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                    // Trim and then Replace newlines (\n) with line breaks (<br>)
                    message = message.trim().replace(/\n/g, '<br>');
                }
                else if (typeof message == 'object') {
                    message = JSON.stringify(message, null, 2);
                }
                return message;
            }
            function escapeHTML(input) {
                const div = document.createElement('div');
                div.textContent = input;
                return div.innerHTML;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
