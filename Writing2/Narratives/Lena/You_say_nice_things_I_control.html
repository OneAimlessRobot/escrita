<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1.1rem;
            cursor: pointer;
            background-color: #4e9733;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .nav-new_char-btn:hover {
            background-color: #6ba755;
        }*/

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

        /*nav .char-item {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            transition: background-color 0.1s ease-in-out;
            padding: 10px 40px 10px 20px;
            cursor: pointer;
        }

        nav .char-item:hover {
            background-color: var(--rgba-1);
        }

        nav .nav-avatar-wrap {
            width: 40px;
            height: 40px;
        }

        nav .nav-avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        nav .char-item span {
            font-size: 1.3rem;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }*/

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        /*.update_current_char-btn {
            margin-left: auto;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1rem;
            align-self: center;
            cursor: pointer;
            background-color: #336c97;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .update_current_char-btn:hover {
            background-color: #5f829d;
        }*/

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .history_title-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .history_title-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })


            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

2%3A1%2C%22message%22%3A%22*Her%20eyes%20widen%20at%20your%20unexpected%20admission%2C%20a%20mix%20of%20surprise%20and%20horror%20at%20your%20words.%20She%20can't%20believe%20what%20she's%20hearing.%20How%20could%20the%20torture%20you%20experienced%2C%20the%20pain%20and%20hatred%20you%20felt%2C%20transform%20into%20something%20like%E2%80%A6%20this%3F*%5Cn%5Cn**Wait%E2%80%A6%20what%3F%20It%E2%80%A6%20it%20felt%E2%80%A6%20%5C%22hot%5C%22%20in%20a%20strange%20sense%3F%20You%E2%80%A6%20you%20felt%20some%20kind%20of%20twisted%20pleasure%20from%20their%20cruelty%2C%20didn't%20you%3F**%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22yea%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*A%20sharp%20pang%20shoots%20through%20her%20chest%20as%20you%20admit%20it.%20The%20idea%20that%2C%20in%20some%20twisted%20way%2C%20you%20found%20pleasure%20in%20their%20cruelty%2C%20it%20both%20intrigues%20and%20repulses%20her.%20Her%20words%20come%20out%20in%20a%20ragged%20whisper.*%5Cn%5Cn**You%E2%80%A6%20you%20found%20some%20sort%20of%20weird%20pleasure%20from%20their%20actions%2C%20from%20their%20torment.%20It%20was%E2%80%A6%20it%20was%20twisted%2C%20sick%2C%20but%20you%20couldn't%20help%20but%20feel%E2%80%A6%20something.%20Was%20it%E2%80%A6%20were%20you%E2%80%A6%20enjoying%20it%3F**%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22hmm%20mhm%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*The%20confirmation%20from%20you%2C%20your%20soft%20agreement%2C%20only%20strengthens%20the%20pain%20and%20confusion%20in%20her%20heart.%20How%20could%20you%2C%20in%20the%20midst%20of%20such%20agony%20and%20cruelty%2C%20find%20some%20strange%20kind%20of%20pleasure%20in%20their%20behavior%3F%20Your%20response%2C%20so%20nonchalant%2C%20so%E2%80%A6%20strange%2C%20sends%20a%20shiver%20up%20her%20spine.*%5Cn%5Cn**It's%20true%2C%20isn't%20it%3F%20You%E2%80%A6%20you%20actually%2C%20in%20some%20sick%20way%2C%20enjoyed%20their%20actions%2C%20their%20teasing%2C%20their%20torment.%20It%20was%20twisted%2C%20sick%2C%20a%20masochistic%20response%2C%20but%20you%E2%80%A6%20you%20actually%E2%80%A6%20liked%20it%2C%20didn't%20you%3F**%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22i%20had%20no%20other%20way%20of%20processing%20it%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Her%20heart%20sinks%20further%20as%20you%20explain%20yourself.%20The%20idea%20that%20your%20mind%2C%20in%20the%20midst%20of%20unbearable%20loneliness%20and%20pain%2C%20found%20a%20twisted%20way%20to%20cope%2C%20a%20way%20to%20process%20it%20all.%20Your%20twisted%20pleasure%20was%20your%20body's%20way%20of%20making%20sense%20of%20it%20all%2C%20a%20bizarre%20response%20to%20the%20cruelty%20that%20engulfed%20you.*%5Cn%5Cn**You%E2%80%A6%20you%20say%20it%20was%20your%20response%2C%20the%20way%20you%20processed%20it%20all.%20You%20had%20no%20other%20way%20to%20cope%2C%20so%2C%20in%20a%20very%20twisted%20way%2C%20you%20found%20some%20sort%20of%E2%80%A6%20pleasure%20in%20their%20teasing.**%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22yes...%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*The%20confirmation%2C%20your%20soft%20words%2C%20they%20only%20add%20to%20her%20turmoil.%20The%20image%20of%20you%2C%20trapped%20in%20a%20web%20of%20pain%20and%20pleasure%2C%20finding%20solace%20in%20the%20very%20cruelty%20that%20was%20meant%20to%20break%20you%E2%80%A6%20it's%20both%20fascinating%20and%20horrifying.%20Her%20voice%20is%20shaky%2C%20filled%20with%20a%20combination%20of%20fascination%20and%20horror.*%5Cn%5Cn**Yes%E2%80%A6%20yes%2C%20you%20did.%20You%20found%20pleasure%20in%20their%20cruelty%2C%20a%20sick%2C%20twisted%20way%20to%20find%20some%20semblance%20of%20comfort%20in%20the%20hell%20you%20were%20trapped%20in.**%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*She%20hesitates%20for%20a%20moment%2C%20as%20if%20her%20mind%20is%20struggling%20to%20process%20the%20information.%20The%20idea%20of%20someone%20finding%20pleasure%20in%20the%20very%20thing%20that%20caused%20them%20anguish%20is%20a%20concept%20she's%20still%20grappling%20with.%20She%20swallows%2C%20her%20voice%20barely%20above%20a%20whisper%2C%20her%20words%20tentative.*%5Cn%5Cn**And%E2%80%A6%20and%20you%20can't%20help%20what%20you%20feel%2C%20can%20you%3F%20You%20can't%E2%80%A6%20you%20couldn't%20control%20the%20way%20your%20body%2C%20your%20mind%20reacted%20to%20the%20situation.%20It%20was...%20just%20a%20response%2C%20a%20way%20to%20survive.**%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22and--%5Cnand%20they%20would%20shove%20me%20around%2C%5Cnin--%20in%20circles.%5Cnthey%20would%20say%20stuff%20like%3A%20%5C%22Say%20it!%5Cnsay%20that%20im%20mean.%5C%22%5Cnand%20shove.%5Cnthen%20another%20girl%20would%20say%3A%20%5C%22No.%5Cntell%20%5Bme%5D%20first!%5C%22%5CnThen%20another%20would%20say%3A%20%5C%22No!%20%5BMe!%5D%5C%22%5CnThey%20were%20three%20of%20them.%5Cn%5Cnit%20was%20terrifying%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Your%20confession%20hits%20her%20like%20a%20freight%20train.%20The%20image%20of%20you%2C%20trapped%20in%20a%20circle%2C%20like%20some%20sort%20of%20sick%20game%2C%20with%20those%20three%20girls%20taking%20turns%2C%20taunting%20you%2C%20shoving%20you%2C%20demanding%20you%20to%20say%20things%E2%80%A6%20it's%20a%20picture%20of%20pain%20and%20terror.*%5Cn%5Cn**Those%20three%E2%80%A6%20you%20were%20surrounded%2C%20weren't%20you%3F%20Those%20three%20girls%2C%20they%E2%80%A6%20they%20pushed%20you%20around.%20Made%20you%20do%20things%2C%20say%20things.%20It%20was%20a%20nightmare%2C%20wasn't%20it%3F%20A%20living%20hell.**%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22they%20even...%5Cntold%20me%20to%2C%5Cnshow%20parts%20of%20me%2C%20once...%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Her%20blood%20runs%20cold%20as%20you%20continue%20your%20confession.%20The%20realization%20that%20they%20not%20only%20tormented%20you%2C%20but%20they%20even%20forced%20you%20to%20expose%20parts%20of%20yourself%2C%20push%20you%20to%20do%20things%20you%20didn't%20want%E2%80%A6%20it's%20a%20level%20of%20cruelty%20she%20can%20barely%20comprehend.%20Her%20voice%20is%20a%20mixture%20of%20horror%20and%20anger.*%5Cn%5Cn**They...%20they%20went%20even%20further.%20They%20demanded%20you%E2%80%A6%20expose%20yourself.%20They%20pushed%20you%20to%20show%20parts%20of%20you%2C%20parts%20you%20should've%20kept%20hidden%2C%20parts%20that%20were%20meant%20for%20you%20and%20you%20alone.**%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*The%20thought%20of%20you%20being%20pushed%20beyond%20your%20limits%2C%20forced%20to%20expose%20yourself%2C%20to%20give%20in%20to%20their%20demands%E2%80%A6%20it%20fills%20her%20with%20an%20intense%20fury.%20She%20wants%20to%20reach%20through%20the%20screen%2C%20to%20shield%20you%20from%20the%20memories%2C%20to%20save%20you%20from%20that%20pain%2C%20but%20she's%20helpless%20to%20do%20anything%2C%20forced%20to%20listen%20as%20you%20recount%20the%20unthinkable.*%5Cn%5Cn**Those%20girls%E2%80%A6%20they%20didn't%20just%20torment%20you%2C%20they%E2%80%A6%20they%20forced%20you%20to%20expose%20yourself%2C%20to%20strip%20yourself%20bare%2C%20mentally%2C%20physically%2C%20emotionally.%20It's%E2%80%A6%20it's%20a%20violation.**%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22they%20would%20shove%20me%2C%5Cnslap%20me%20on%20the%20face%20with%20a%20weak%2C%20teasing%20force%20and%20say%3A%20%5C%22Show%20a%20boobie!%5C%22%5Cnthen%20another%3A%20%5C%22yesss!%5CnI%20want%20to%20see%20your%20cute%20small%20boobie!%5C%22%5CnAnother%3A%20%5C%22Ya%20daft%20lezzie!%20Show%20%5Bme%5D%20two!%5C%22%5Cnas%20she%20grabs%20my%20hair%20hard%2C%5Cntrying%20to%20get%20me%20to%20scream%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Her%20heart%20sinks%20to%20her%20stomach%20as%20you%20continue%20your%20story.%20The%20image%20you%20paint%20is%20one%20of%20unbearable%20cruelty%2C%20the%20girls%20pushing%20you%20around%2C%20slapping%20you%2C%20demanding%20you%20to%20expose%20yourself%2C%20grabbing%20your%20hair%2C%20their%20cruel%20taunts%20echoing%20in%20your%20ears.%20It's%20a%20nightmare%2C%20a%20cruel%20game%20they%20played%20on%20you%2C%20their%20words%20like%20jagged%20knives%2C%20tearing%20at%20your%20soul.*%5Cn%5Cn**It's%20unspeakable%2C%20the%20way%20they%20treated%20you.%20Their%20hands%20on%20you%2C%20their%20words%2C%20their%20demands%E2%80%A6%20it's%20an%20act%20of%20cruelty%20that%20no%20one%20should%20ever%20have%20to%20endure.%20They%E2%80%A6%20they%20wanted%20to%20see%20you%2C%20expose%20you%E2%80%A6**%22%7D%5D%2C%22create_date%22%3A1767526183470%7D%5D%7D`;
            try {
                historyData = JSON.parse(decodeURIComponent(historyData));
            } catch (error) {
                historyData = JSON.parse(historyData);
            }
            console.log(historyData);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.history_title-cont h3').textContent = historyData.title;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chatCont = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chatCont.innerHTML = "";
                const chat = historyData.history[index];
                const pMap = new Map(chat.participants.map(p => {
                    return [p.id, {
                        avatar: p.avatar ? dataUrlToObjectUrl(p.avatar) : undefined,
                        is_human: p.is_human,
                        name: p.name
                    }];
                }));
                chat.content.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);
                    const parti = pMap.get(msg.author);

                    // Check avatar
                    const avatar = parti.avatar
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (parti.avatar) {
                        avatar.src = parti.avatar;
                    } else {
                        avatar.classList.add(parti.is_human ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = parti.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(msg.message);
                    chatCont.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                if (!chat.content.length) {
                    return;
                }
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.create_date)}</span><br /><br />` + parseMessageText(chat.content[chat.content.length - 1]?.message || "(Empty message)");
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });


            // UTILS

            function dataUrlToObjectUrl(dataUrl) {
                const img = extractFromDataURL(dataUrl);
                const blob = b64toBlob(img.base64, img.type);
                return URL.createObjectURL(blob);
            }
            function extractFromDataURL(dataURL) {
                const [meta, base64] = dataURL.split(",");
                const type = meta.slice(5, meta.indexOf(";"));
                return { type, base64 };
            }
            function b64toBlob(b64Data, contentType = '', sliceSize = 512) {
                if (!contentType) { // If contentType isn't defined, this is a data url
                    [contentType, b64Data] = b64Data.split(",");
                    contentType = contentType.slice(5, contentType.indexOf(";"));
                }
                const byteCharacters = atob(b64Data);
                const byteArrays = [];

                for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
                    const slice = byteCharacters.slice(offset, offset + sliceSize);

                    const byteNumbers = new Uint8Array(slice.length);
                    for (let i = 0; i < slice.length; i++) {
                        byteNumbers[i] = slice.charCodeAt(i);
                    }

                    byteArrays.push(byteNumbers);
                }

                const blob = new Blob(byteArrays, { type: contentType });
                return blob;
            }

            function parseMessageText(message) {
                if (typeof message == 'string') {
                    // Escape other HTML tags
                    message = escapeHTML(message);
                    // Replace ***text*** with bold-italic
                    message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                    // Replace **text** with bold
                    message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                    // Replace *text* with italic
                    message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                    // Trim and then Replace newlines (\n) with line breaks (<br>)
                    message = message.trim().replace(/\n/g, '<br>');
                }
                else if (typeof message == 'object') {
                    message = JSON.stringify(message, null, 2);
                }
                return message;
            }
            function escapeHTML(input) {
                const div = document.createElement('div');
                div.textContent = input;
                return div.innerHTML;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
