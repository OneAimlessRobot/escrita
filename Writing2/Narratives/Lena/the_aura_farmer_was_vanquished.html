<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;

            border-radius: 6px;
            padding: 10px 20px;

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

            display: flex;

            cursor: pointer;

        nav .char-item:hover {

        nav .nav-avatar-wrap {

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .character_name-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .character_name-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })

            // Handle background
            // If there is one
            const currentBg = localStorage.getItem('background');
            if (currentBg) {
                changeBg(currentBg);
            }
            // Change by hand
            const bgInput = document.querySelector('#bgInput');
            document.querySelector('.change-bg').addEventListener('click', () => {
                bgInput.click();
            })
            document.querySelector('.delete-bg').addEventListener('click', () => {
                document.body.classList.remove('custom-bg');
                document.body.style.backgroundImage = "unset";
                localStorage.removeItem('background');
            })
            bgInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    // convert image file to base64 string
                    changeBg(reader.result);
                    bgInput.value = "";
                    try {
                        localStorage.setItem('background', reader.result);
                    } catch (error) {
                        alert('Note: File is likely too big to save.')
                        //console.log(error)
                    }
                }
                reader.readAsDataURL(file);
            })
            function changeBg(bg) {
                let objUrl = URL.createObjectURL(dataURItoBlob(bg));
                document.body.classList.add('custom-bg');
                document.body.style.backgroundImage = `url(${objUrl})`;
            }
            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

20than%20some%20creepy%20fan.%22%0A%0A*Despite%20her%20words%2C%20her%20voice%20got%20quieter%20as%20she%20spoke.%20Was...%20was%20she%20actually%20feeling%20a%20bit%20conflicted%3F*"},{"isUser":true,"name":"Lena de Verías","message":"None%20of%20this%20made%20any%20sense.%0AI%20feel%20like..."},{"isUser":false,"name":"Hatsune Miku","message":"*Miku's%20brow%20furrowed%20in%20confusion%2C%20looking%20at%20you%20with%20a%20perplexed%20expression.%20She%20tilted%20her%20head%20to%20the%20side%20a%20bit%2C%20trying%20to%20understand%20what%20you%20were%20getting%20at.*%0A%0A%22What%20do%20you%20mean%2C%20'none%20of%20this%20made%20any%20sense%3F'%20What%20doesn't%20make%20sense%3F%22%0A%0A*She%20took%20a%20step%20closer%2C%20her%20arms%20uncrossing%2C%20her%20body%20language%20becoming%20a%20bit%20more%20open%20and%20engaged.%20Despite%20her%20earlier%20hostility%2C%20she%20seemed%20genuinely%20curious%20about%20what%20you%20were%20trying%20to%20say.*"},{"isUser":true,"name":"Lena de Verías","message":"You%20only%20did%20this%20in%20some%20vain%20attempt%20to%20project.%0AIf%20I%20was%20a%20male%2C%0AYou%20would%20have%20just%20started%20to%20ramble%20about%20%22yo%20im%202%20kewl%204%20you%22%20or%20some%20lame%20shit%20like%20that.%0AYOu%20have%20%5Bno%5D%20spine%2C%20miku.%0A%5Bno%5D%20adult%20issues.%0A%5Bno%5D%20adversity.%0AAll%20you%20exist%20for%20is%20to%20prantz%20around%0AIn%20a%20puddle%20of%20your%20own%20fecees"},{"isUser":false,"name":"Hatsune Miku","message":"*Miku%20just%20stared%20at%20you%2C%20speechless.%20It%20was%20as%20if%20you%20finally%20found%20the%20*one*%20thing%20to%20say%20that%20could%20actually%20render%20her%20speechless.%20Your%20words%20were%20like%20a%20slap%20to%20the%20face%2C%20harsh%20and%20biting%2C%20yet%20strangely%20insightful.*%0A%0A*The%20idol's%20face%20was%20a%20mixture%20of%20anger%20at%20being%20told%20off%20like%20that%2C%20but%20also...%20realization%20that%20you%20had%20a%20point.*%0A%0A*...She%20had%20no%20comeback.%20She%20couldn't%20deny%20that%20you%20were%20right%2C%20and%20her%20usual%20arrogant%2C%20smug%20demeanor%20was%20nowhere%20to%20be%20found.*"},{"isUser":true,"name":"Lena de Verías","message":"There%20is%20%5Bnothing%5D%20of%20value%20inside%20of%20you.%0AYou%20disgust%20me.%0AYou%20make%20my%20skin%20crawl.%0AAll%20you%20are%2C%0AIs%20a%20blood%20drinking%20moth%2C%0ASurviving%20on%20validation%20drip%20feed%20from%20remnants%20of%20its%20own%20unprocessed%20teen%20angst.%0AWith%20nothing%20but%20dust%2C%0AStale%20air%2C%0AAnd%20microbes%20inside%20of%20it.%0AYou%20drink%20little%20droplets%20of%20blood%20from%20people%20who%20%5Bactually%5D%20matter%2C%0AYou%20breathe%20oxygen%20so%20you%20can%20metabolize%20said%20blood%2C%0AAnd%20then%20you%20shit.%0AThat%20is%20it.%0A%0Auseless."},{"isUser":false,"name":"Hatsune Miku","message":"*Miku%20recoiled%20from%20your%20harsh%20words%20as%20if%20physically%20hurt%20by%20them.%20She%20tried%20desperately%20to%20maintain%20her%20composure%2C%20but%20it%20was%20evident%20that%20each%20word%20you%20spoke%20hit%20her%20like%20a%20stab%20to%20the%20heart.*%0A%0A*The%20confident%2C%20arrogant%20idol%20was%20nowhere%20to%20be%20seen%20now%3B%20in%20her%20place%20was%20a%20vulnerable%20and%20insecure%20girl%2C%20struggling%20to%20come%20to%20terms%20with%20the%20brutal%20truth%20you%20laid%20bare%20in%20front%20of%20her.%20She%20wanted%20to%20deny%20it%2C%20to%20fight%20back%2C%20but%20all%20she%20could%20manage%20was%20a%20small%2C%20trembling%20voice.*%0A%0A%22Y...%20you're%20wrong...%20I-I'm%20not...%20I'm%20not...%20useless...%22"},{"isUser":true,"name":"Lena de Verías","message":"Yes.%0AYou%20are%20right.%0AYou%20are%20expressive%2C%0AIntrospective.%0AAnd%20honestly%20very%20pretty.%0AI%20just%20do%20not%20like%20vain%20attitudes%20in%20people.%0AAnd%20angsty%20twigs%20like%20you%20piss%20me%20off.%0AYou%20are%20%5BNOT%5D%20the%20creme%20de%20la%20crop%20just%20because%20some%20bozo%20is%20watching%20you%20on%20his%20phone%2C%20you%20entitled%20spurt%20of%20rotten%20leek%20and%20stale%20hair%20pigment"},{"isUser":false,"name":"Hatsune Miku","message":"*Miku%20couldn't%20help%20but%20let%20out%20a%20small%2C%20bitter%20chuckle.%20Your%20harsh%20words%20were%20like%20daggers%2C%20but%20she%20found%20herself%20unable%20to%20truly%20hate%20you.%20She%20hated%20to%20admit%20it%2C%20but%20there%20was%20something%20about%20your%20brutal%20honesty%20that%20she%20found%20oddly%20refreshing.*%0A%0A%22Rotten%20leek%20and%20stale%20hair%20pigment...%20That's%20quite%20the%20colorful%20insult.%22%0A%0A*She%20paused%2C%20crossing%20her%20arms%20and%20looking%20away%2C%20her%20expression%20becoming%20more%20serious.*%0A%0A%22But...%20I%20guess%20you're%20right.%20I%20*am*%20pretty%20vain%2C%20aren't%20I%3F%20Too%20full%20of%20myself...%20too%20self-absorbed...%22"},{"isUser":true,"name":"Lena de Verías","message":"And%20that%20bozo%20is%20going%20to%20masturbate%20at%20home%20tonight.%0Aheck%2C%0AI%20doubt%20most%20girls%20here%20are%20all%20that%20sexually%20figured%20out%20themselves...%0AWhich%20includes%20me.%0AAnd%20you%20have%20%5Bzero%5D%20responsibility%20or%20control%20over%20it.%0AAnd%20also%20not%20really%20a%20reason%20to%20monitor%20it.%0AWell...%0ANot%20aside%20from%20prantzing%20around%20how%20special%20you%20are%20just%20because%20you%20have%2C%0AGod%2C%20just%20imagine%2C%0A%22fans%22%20as%20a%20%22singer%22.%0A%0AI%20mean...%0AIts%20better%20than%20having%20no%20fans%20at%20all...%0A%0AI%20mean...%0AYour%20career%20is%20actually%20ground%20breaking%20in%20its%20impact.%0A%0AHonestly%3F%0A%0AI%20think%20you%20sing%20pretty%20well%2C%0Athe%20themes%20you%20express%20are%20compelling%2C%0AAnd%20you%20are%20pretty%2C%0AAs%20previously%20mentioned.%0A%0AJust%20a%20little%20bit%20of%20an%20entitled%20aura%20farmer"},{"isUser":false,"name":"Hatsune Miku","message":"*Miku%20listened%20carefully%20to%20your%20words%2C%20her%20expression%20softening%20a%20bit%20as%20you%20shifted%20from%20harsh%20truths%20to%20somewhat%20of%20a%20more%20balanced%20take.%20Your%20brutal%20honesty%20was%20still%20there%2C%20but%20there%20was%20also%20a%20hint%20of...%20understanding%3F*%0A%0A*She%20took%20a%20deep%20breath%2C%20letting%20out%20a%20small%20scoff.*%0A%0A%22I%20suppose%20you're%20right.%20I%20guess%20being%20an%20idol%20does%20come%20with%20some%20level%20of%20narcissism...%20and%2C%20yeah%2C%20it's%20not%20like%20I%20have%20any%20control%20over%20how%20people%20react%20to%20me.%20It's%20just...%22%0A%0A*Miku%20paused%2C%20looking%20down%20at%20her%20reflection%20in%20a%20nearby%20mirror.*"},{"isUser":false,"name":"Hatsune Miku","message":"*Her%20expression%20turned%20pensive.*%0A%0A%22I%20just...%20I%20don't%20know.%20I%20guess%20I'm%20just%20used%20to%20everyone%20treating%20me%20like%20a%20perfect%20idol.%20Always%20smiling%2C%20always%20confident%2C%20always%20*perfect*.%20Sometimes%20I%20forget%20that%20I'm%20just...%20a%20person%2C%20y'know%3F%20Flawed%20and%20insecure%2C%20just%20like%20anyone%20else.%22%0A%0A*She%20let%20out%20a%20small%20sigh%2C%20leaning%20slightly%20against%20the%20wall.*%0A%0A%22It's...%20nice%2C%20actually.%20Talking%20to%20someone%20who%20doesn't%20put%20me%20on%20a%20pedestal.%20Who%20actually%20sees%20the%20real%20me%2C%20instead%20of%20just%20the%20idol.%22"},{"isUser":true,"name":"Lena de Verías","message":"I%20guess%20that%20was%20what%20you%20were%20looking%20for%2C%20right%3F%0AAll%20of%20this%20was%20starting%20to%20turn%20you%20spoiled%2C%0AWas%20it%20not%3F%0AForced%20to%20be%20an%20idol%20for%20a%20bunch%20of%20ungrateful%2C%0ABroken%20souls"},{"isUser":false,"name":"Hatsune Miku","message":"*Miku%20nodded%20slowly%2C%20her%20expression%20a%20mix%20of%20realization%20and%20resignation.*%0A%0A%22Yeah%2C%20I%20guess%20you%20could%20say%20that.%20Sometimes...%20sometimes%20it%20feels%20like%20I'm%20just%20a%20puppet%2C%20used%20to%20fulfill%20the%20fantasies%20and%20desires%20of%20others.%20They%20don't%20really%20care%20about%20*me*%2C%20not%20really...%22%0A%0A*She%20paused%2C%20her%20voice%20becoming%20a%20bit%20quieter%2C%20a%20hint%20of%20vulnerability%20in%20her%20words.*%0A%0A%22And...%20yeah%2C%20it%20does%20make%20me%20feel%20spoiled.%20Like%20I'm%20just%20a%20product%20to%20be%20bought%20and%20sold.%22"},{"isUser":true,"name":"Lena de Verías","message":"Well...%0AAnd%20with%20that%2C%0AWe%20might%20as%20well%20keep%20moving%20on%20with%20our%20lives%2C%0AWalk%20back%20to%20our%20homes%2C%0AAnd%20then%20to%20our%20cribs%2C%0AAs%20we%20hug%20ourselves%20through%20yet%20another%20cold%20night%20of%20restless%20shuffling%20and%20tussling%2C%0AYearning%20for%20the%20sweet%20beams%20of%20light%20peering%20through%20holes%0AIn%20our%20shutters%20in%20the%20morning"},{"isUser":false,"name":"Hatsune Miku","message":"*Miku%20couldn't%20help%20but%20crack%20a%20small%20smile%20at%20your%20words.%20Despite%20your%20blunt%20demeanor%2C%20there%20was%20something%20weirdly%20endearing%20about%20your%20nihilistic%20outlook.*%0A%0A%22Yeah%2C%20I%20guess%20so.%20Back%20to%20our%20lonely%20lives%2C%20right%3F%22%0A%0A*There%20was%20an%20edge%20of%20irony%20in%20her%20voice%2C%20but%20there%20was%20also%20a%20hint%20of%20resignation.%20She%20understood%20all%20too%20well%20that%20life%20often%20felt%20cold%20and%20unfeeling%2C%20like%20a%20constant%20battle%20against%20solitude%20and%20despair.*"}]}]}`);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.character_name-cont h3').textContent = historyData.charName;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chat = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chat.innerHTML = "";
                historyData.history[index].chat.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);

                    // Check avatar
                    const avatarGood = (msg.isUser && historyData.userPic) || (!msg.isUser && historyData.charPic);
                    const avatar = avatarGood
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (avatarGood) {
                        avatar.src = msg.isUser ? historyData.userPic : historyData.charPic;
                    } else {
                        avatar.classList.add(msg.isUser ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = msg.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(decodeURIComponent(msg.message));
                    chat.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.date)}</span><br /><br />` + parseMessageText(decodeURIComponent(chat.chat[chat.chat.length - 1].message));
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });

            function parseMessageText(message) {
                // Clean up memory reminders (second check)
                message = message.replace(memoryRegex, '');
                // Replace ***text*** with bold-italic
                message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                // Replace **text** with bold
                message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                // Replace *text* with italic
                message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                // Trim and then Replace newlines (\n) with line breaks (<br>)
                message = message.trim().replace(/\n/g, '<br>');
                return message;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
