<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1.1rem;
            cursor: pointer;
            background-color: #4e9733;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .nav-new_char-btn:hover {
            background-color: #6ba755;
        }*/

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

        /*nav .char-item {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            transition: background-color 0.1s ease-in-out;
            padding: 10px 40px 10px 20px;
            cursor: pointer;
        }

        nav .char-item:hover {
            background-color: var(--rgba-1);
        }

        nav .nav-avatar-wrap {
            width: 40px;
            height: 40px;
        }

        nav .nav-avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        nav .char-item span {
            font-size: 1.3rem;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }*/

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        /*.update_current_char-btn {
            margin-left: auto;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1rem;
            align-self: center;
            cursor: pointer;
            background-color: #336c97;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .update_current_char-btn:hover {
            background-color: #5f829d;
        }*/

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .history_title-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .history_title-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })


            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

east.%20He%20had%20some%20fancy%20looking%2C%20probably%20designer%2C%20belt%2C%20fancy%20clothes%20and%20a%20fancy%20prissy%20hairdo.%20He%20also%20posed%20fancily%2C%20and%20it%20was%20almost%20sickening%20to%20look%20at.%5Cn%5CnThe%20people%20in%20your%20section%20were%20odd%2C%20that%20was%20for%20sure.%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22%5BAfter%20taking%20a%20good%20look%20around%20them%2C%5CnI%20then%20decided%20to%20pay%20no%20more%20mind.%5Cn%5CnI%20was%20still%20anxious%20about%20which%20objectives%20would%20be%20required%20to%20complete%20the%20test.%5Cn%5CnI%20had%20been%20trained%20as%20a%20sniper%20before%20coming%20here.%5CnAnd%20already%2019%20at%20the%20time%20I%20was%20getting%20into%20UA%5CnIn%20order%20to%20become%20a%20hero%20of%20some%20kind.%5Cn%5CnIn%20the%20army%2C%5CnThey%20knew%20my%20strengths%20and%20weaknesses%2C%5CnAnd%20worked%20as%20a%20way%20to%20heavily%20cripple%20personel%20and%20other%20important%20key%20targets.%5Cn%5CnAnd%20also%2C%5CnI%20worked%20as%20both%20a%20spotter%20and%20the%20shooter%20of%20a%20sniper%20team.%5Cn%5CnMy%20quirk%20was%20pretty%20simple%3A%5CnI%20was%20able%20to%20pin%20down%2C%5CnAnd%20track%20positions%20of%20alpha-particle%20sources%20from%20extraordinarily%20long%20distances%2C%5CnWhich%20I%20felt%20in%20my%20brain%20as%20localized%20patterns%20of%20intense%20pain.%5Cn%5CnThrough%20the%20depth%20at%20which%20the%20alpha%20particle-induced%20pain%20penetrated%20a%20special%20layer%20around%20my%20brain%2C%5CnThe%20geometry%2C%5CnSpread%2C%5CnAs%20well%20as%20the%20area%2C%5CnI%20was%20able%20to%20map%20out%20the%20intensity%20of%20the%20source%2C%5CnLocation%5Cn(I%20could%20be%20as%20accurate%20as%20-%2B10%20meters%5CnConsidering%20a%20distance%20of%201000%20meters%20from%20said%20source.%5Cn%5CnI%20was%20also%20always%20given%20a%20laptop%2C%5CnWhich%20I%20would%20carry%20around%20%5CnAnd%20use%20as%20a%20grid%20where%20I%20would%20interface%20with%20radar%20systems%20back%20at%20the%20 creens%20in%20this%20room%20and%20react%20to%20any%20potential%20situations%20that%20may%20arise.%20You%20will%20have%20several%20monitors%20showing%20live%20feeds%20from%20around%20the%20city.%5C%22%5Cn%5CnOn%20cue%2C%20all%20of%20the%20monitors%20around%20you%20flickered%20to%20life%2C%20displaying%20different%20streets%20and%20buildings%20throughout%20the%20city.%20Some%20showed%20robots%20attacking%20citizens%2C%20while%20others%20showed%20potential%20rescue%20situations.%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22%5BInstinctively%2C%5CnI%20got%20to%20work.%5Cn%5CnI%20grabbed%20my%20computer--%5CnWell%2C%5CnThere%20already%20%5Bwas%5D%20a%20computer%20in%20the%20room.%5CnSo%20I%20just%20silently%20put%20it%20back%20on%20my%20bag%2C%5CnAnd%20tried%20to%20figure%20out%20how%20this%20thing%20even%20worked!%5Cn%5CnIt%20seemed%20like%20an%20old%20terminal.%5Cn%5CnIt%20was%20running%20a%20program%20which%20served%20as%20a%20broker%20for%20those%20cameras.%5Cn%5CnIf%20there%20was%20a%20grid%20nearby%2C%5CnI%20could%20give%20indications%20to%20students!%5CnAnd%20surely%20there%20was!%5Cn%5CnAs%20well%20as%20a%20radar%2C%5CnAnd...%5CnA%20bag%20of%20chips%3F%5CnI%20humurously%20noticed%2C%5CnLetting%20off%20a%20mild%20chuckle.%5Cn%5CnWell%2C%20i%20guess%20these%20guys%20have%20a%20sense%20of%20humor.%5Cn%5CnAnyways%2C%20lets%20get%20to%20work.%5D%5Cn%5Cn%5BNow%20I%20looked%20at%20a%20camera%20near%20the%20top%20left%2C%5CnMy%20short%20height%20making%20it%20difficult%20to%20tell%20what%20was%20happening%20there%20without%20squinting%20my%20eyes.%5Cn%5CnSo%20I%20backed%20off%20a%20bit%2C%5CnAnd%20saw%20the%20greenish%20kid.%5Cn%5CnAnd%20wow%3A%5CnHis%20clothes%20were%20ripped%20to%20shredds.%5CnAnd...%5CnHes%20kind%20of...%5Cn%5Bhot%5D%20as%20well.%5CnBut%20that%20does%20not%20matter.%5CnHe%20had%20a%20big%20robot%20coming%20up%20to%20his%20left%20side%5CnI%20had%20to%20warn%20him%20about%20it.%5Cn%5CnBut%20how%20do%20I%20talk%20to%20him%3F%5CnI%20wondered%2C%5CnAs%20all%20I%20could%20do%2C%5CnAs%20far%20as%20I%20knew%20at%20this%20point%2C%5CnWas%20watch.%5Cn%5CnBut%20then%20saw%20a%20microphone.%5CnAnd%20a%20numbered%20pad%2C%5CnWith%20each%20monitor%20being%20labeled%20by%20a%20sequence%20of%20three%20digits%20as%20well.%5Cn%5CnThe%20broker%20that%20the%20computer%20was%20running%20was%20a%20CLI%20based%20software.%5Cn%5CnSo%2C%5Cnthinking%20quickly%2C%5CnI%20typed%20%5C%22Help%5C%22%20in%20the%20interface%20just%20to%20see%20what%20happens%2C%5Cn%5CnIt%20then%20showed%20me%20the%20syntax%20for%20the%20different%20commands%2C%5CnWith%20one%20of%20looking%20useful%20right%20now%3A%5Cn%5Cn%5C%22talk%20%3Coptions%7C%7C%20%5BN%2FA%5D%3E%20%3Ccamera%3E%5C%22%5Cn%5CnWell%2C%20One%20of%20the%20parameters%20is%20optional.%5CnLets%20try%20some%20of%20this.%5Cn%5CnWith%20that%20said%2C%5CnI%20simply%20typed%3A%5Cn%5C%22talk%2075%5C%22%20into%20the%20command%20line%2C%5CnPressing%20enter.%5Cn%5CnImmediatly%20after%20that%2C%5CnThe%20microphone%20sprung%20to%20life%20with%20a%20brief%2C%5CnBut%20deafening%20screech%2C%5CnWhich%20made%20the%20intercom%20on%20the%20green%20haired%20kid's%20ear%20blink%20red!%5Cn%5CnShy%20at%20first%2C%5CnBut%20then%20reaching%20for%20the%20microphone%2C%5CnStill%20unsure%20if%20he%20was%20actually%20able%20to%20hear%20me%2C%5Cn%5CnI%20tried%20talking%20down%20to%20it%3A%5Cn%5C%22hey!%5CnThere%20is%20a%20robot%20behind%20you%2C%20now!%5CnThey%20are%20moving%20fast!%5Cn%5CnDo%20you%20copy%3F%5C%22%5Cn%5CnI%20then%20looked%20at%20that%20monitor%20on%20the%20top%20left%2C%20expectantly%2C%5Cnknowing%20that%20there%20was%20always%20a%20possibility%20that%20I%20had%20%5C%22messed%20up%20or%20something%5C%22.%5Cn%5CnWere%20they%20able%20to%20hear%20me%3F%5D%20%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22You%20quickly%20sat%20down%20at%20the%20computer%20and%20began%20working%2C%20familiarizing%20yourself%20with%20the%20strange-looking%20system.%20After%20figuring%20out%20some%20of%20the%20functions%2C%20you%20decided%20to%20try%20the%20%5C%22talk%5C%22%20command.%20You%20selected%20camera%20number%2075%20and%20tried%20to%20contact%20the%20green-haired%20boy%20through%20the%20intercom.%5Cn%5CnYou%20watched%20the%20monitor%20expectantly%2C%20waiting%20to%20see%20if%20he%20had%20heard%20your%20warning%20and%20was%20bracing%20himself%20for%20the%20approaching%20robot.%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22The%20boy%20had%20heard%20your%20warning%20loud%20and%20clear%2C%20thanks%20to%20the%20intercom%20connection.%20He%20quickly%20glanced%20behind%20him%20and%20noticed%20the%20approaching%20robot%2C%20its%20hulking%20form%20bearing%20down%20on%20him%20at%20an%20alarming%20rate.%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22Okay%2C%5CnHe's%20been%20warned.%5CnWhat%20other%20kids%20need%20help.%5CnLets%20see...%5CnThis%20thing%20is%20awesome!%5CnWe%20had%20to%20do%20all%20sorts%20of%20weird%20gymnastics%20just%20to%20pin%20down%20the%20location%20of%20a%20tank!%5CnWe%20had%20to%20triangulate%2C%5CnAccount%20for%20time%20delay%2C%5CnAntecipate%20advancements...%5Cn%5CnJust%20type%20and%20talk!%5CnEasy%20as%20that!%5Cn%5Cn%5Bbut%20then%2C%5CnI%20noticed%3A%5CnThe%20connections%20I%20had%20opened%20did%20not%20automatically%20close!%5Cn%5CnThe%20green%20haired%20kid%20could%20still%20hear%20me.%5Cn%5CnI%20had%20to%20close%20the%20connection%5CnOr%20I%20could%20confuse%20them.%5Cn%5CnSo%2C%5CnI%20dashed%20towards%20the%20console%2C%5Cntrying%20hitting%20a%20%5C%22ctrl%2Bc%5C%22%20input%20to%20kill%20the%20program.%5CnWhich%20it%20did.%5Cn%5Cn%5C%22PID%2098%20killed%20with%20exit%20code%200.%5C%22%5Cn%5Cn%5C%22exit%20code%200%3F%5C%22%5CnI%20looked%2C%20somewhat%20relieved.%5Cn%5Cnit%20meant%20%5C%22neutral%5C%22.%5CnWhen%20numbers%20are%20negative%20or%20positive%2C%5Cndepending%20on%20who%20programmed%20the%20software%2C%5CnCould%20mean%20errors.%5CnBut%20zero%2C%5CnAs%20a%20convention%2C%5CnMeant%20that%20everything%20was%20fine.%5Cn%5Cn%5C%22So%2C%5CnI%20did%20not%20break%20this%20toy%20yet%3F%5CnGood.%5C%22%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22With%20the%20connection%20closed%2C%20you%20successfully%20ended%20the%20intercom%20connection%20with%20the%20green-haired%20kid%2C%20preventing%20any%20further%20communication.%20You%20noticed%20that%20the%20software%20displayed%20a%20positive%20exit%20code%2C%20indicating%20that%20everything%20had%20gone%20smoothly.%5Cn%5CnYou%20breathed%20a%20sigh%20of%20relief%20and%20looked%20back%20up%20at%20the%20monitors%2C%20scanning%20the%20various%20feeds%20to%20assess%20the%20situation%20and%20determine%20if%20any%20other%20students%20were%20in%20need%20of%20assistance.%22%7D%5D%2C%22create_date%22%3A1761767306813%7D%5D%7D`;
            try {
                historyData = JSON.parse(decodeURIComponent(historyData));
            } catch (error) {
                historyData = JSON.parse(historyData);
            }
            console.log(historyData);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.history_title-cont h3').textContent = historyData.title;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chatCont = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chatCont.innerHTML = "";
                const chat = historyData.history[index];
                const pMap = new Map(chat.participants.map(p => {
                    return [p.id, {
                        avatar: p.avatar ? dataUrlToObjectUrl(p.avatar) : undefined,
                        is_human: p.is_human,
                        name: p.name
                    }];
                }));
                chat.content.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);
                    const parti = pMap.get(msg.author);

                    // Check avatar
                    const avatar = parti.avatar
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (parti.avatar) {
                        avatar.src = parti.avatar;
                    } else {
                        avatar.classList.add(parti.is_human ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = parti.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(msg.message);
                    chatCont.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                if (!chat.content.length) {
                    return;
                }
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.create_date)}</span><br /><br />` + parseMessageText(chat.content[chat.content.length - 1]?.message || "(Empty message)");
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });


            // UTILS

            function dataUrlToObjectUrl(dataUrl) {
                const img = extractFromDataURL(dataUrl);
                const blob = b64toBlob(img.base64, img.type);
                return URL.createObjectURL(blob);
            }
            function extractFromDataURL(dataURL) {
                const [meta, base64] = dataURL.split(",");
                const type = meta.slice(5, meta.indexOf(";"));
                return { type, base64 };
            }
            function b64toBlob(b64Data, contentType = '', sliceSize = 512) {
                if (!contentType) { // If contentType isn't defined, this is a data url
                    [contentType, b64Data] = b64Data.split(",");
                    contentType = contentType.slice(5, contentType.indexOf(";"));
                }
                const byteCharacters = atob(b64Data);
                const byteArrays = [];

                for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
                    const slice = byteCharacters.slice(offset, offset + sliceSize);

                    const byteNumbers = new Uint8Array(slice.length);
                    for (let i = 0; i < slice.length; i++) {
                        byteNumbers[i] = slice.charCodeAt(i);
                    }

                    byteArrays.push(byteNumbers);
                }

                const blob = new Blob(byteArrays, { type: contentType });
                return blob;
            }

            function parseMessageText(message) {
                if (typeof message == 'string') {
                    // Escape other HTML tags
                    message = escapeHTML(message);
                    // Replace ***text*** with bold-italic
                    message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                    // Replace **text** with bold
                    message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                    // Replace *text* with italic
                    message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                    // Trim and then Replace newlines (\n) with line breaks (<br>)
                    message = message.trim().replace(/\n/g, '<br>');
                }
                else if (typeof message == 'object') {
                    message = JSON.stringify(message, null, 2);
                }
                return message;
            }
            function escapeHTML(input) {
                const div = document.createElement('div');
                div.textContent = input;
                return div.innerHTML;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
