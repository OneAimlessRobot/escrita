<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;

            border-radius: 6px;
            padding: 10px 20px;

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

            display: flex;

        nav .char-item:hover {

        nav .nav-avatar-wrap {

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .character_name-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .character_name-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })

            // Handle background
            // If there is one
            const currentBg = localStorage.getItem('background');
            if (currentBg) {
                changeBg(currentBg);
            }
            // Change by hand
            const bgInput = document.querySelector('#bgInput');
            document.querySelector('.change-bg').addEventListener('click', () => {
                bgInput.click();
            })
            document.querySelector('.delete-bg').addEventListener('click', () => {
                document.body.classList.remove('custom-bg');
                document.body.style.backgroundImage = "unset";
                localStorage.removeItem('background');
            })
            bgInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    // convert image file to base64 string
                    changeBg(reader.result);
                    bgInput.value = "";
                    try {
                        localStorage.setItem('background', reader.result);
                    } catch (error) {
                        alert('Note: File is likely too big to save.')
                        //console.log(error)
                    }
                }
                reader.readAsDataURL(file);
            })
            function changeBg(bg) {
                let objUrl = URL.createObjectURL(dataURItoBlob(bg));
                document.body.classList.add('custom-bg');
                document.body.style.backgroundImage = `url(${objUrl})`;
            }
            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

%20quirked%20an%20eyebrow%2C%20a%20hint%20of%20amusement%20in%20her%20eyes.*%0A%0A%22Oh%2C%20now%20you're%20having%20second%20thoughts%2C%20huh%3F%20It's%20a%20bit%20too%20late%20for%20that%20now%2C%20sweetie.%20You're%20in%20my%20arms%2C%20and%20I'm%20not%20letting%20you%20go%20anywhere~%22"},{"isUser":true,"name":"Lena de Verías","message":"Oh%20no!"},{"isUser":false,"name":"Kyouko Mejiro","message":"*The%20woman's%20smirk%20widened%20at%20your%20exclamation%2C%20your%20little%20distressed%20tone%20making%20her%20want%20to%20tease%20you%20more.%20She%20chuckled%2C%20the%20sound%20deep%20and%20gravelly%2C%20as%20she%20continued%20to%20hold%20you%20firmly%20in%20her%20arms.*%0A%0A%22That's%20right%2C%20'oh%20no.'%20You%20put%20yourself%20in%20this%20situation%2C%20sweetheart.%20No%20take-backs%20now.%20You're%20stuck%20with%20me%2C%20baby.%20And%20I%20plan%20on%20carrying%20you%20everywhere%2C%20like%20the%20little%20thing%20you%20are~%22"},{"isUser":true,"name":"Lena de Verías","message":"Take%20me%20to%20your%20house!%0Alets%20skip%20the%20date!"},{"isUser":false,"name":"Kyouko Mejiro","message":"*The%20woman%20quirked%20an%20eyebrow%20at%20your%20sudden%20request%2C%20a%20small%2C%20amused%20chuckle%20escaping%20her%20lips.%20The%20thought%20of%20taking%20you%20back%20to%20her%20place%20instead%20of%20the%20date%20she%20had%20planned%20was%20definitely%20tempting%2C%20especially%20since%20you%20were%20so%20damn%20eager%20to%20be%20carried%20around%20like%20her%20plaything.*%0A%0A%22Hmph%2C%20skipping%20the%20date%2C%20huh%3F%20Going%20straight%20to%20my%20house%20instead...%20someone's%20getting%20impatient%2C%20it%20seems.%20But%20alright%2C%20sweetheart.%20Your%20wish%20is%20my%20command~%22"},{"isUser":true,"name":"Lena de Verías","message":"Nooooo!!!%0ADont%20make%20it%20easyyyyy!%0AHmph!%0AYoure%20so%20soft%20and%20weak!"},{"isUser":false,"name":"Kyouko Mejiro","message":"*A%20low%20chuckle%20rumbled%20in%20the%20woman's%20chest%20as%20you%20protested%20again%2C%20calling%20her%20soft%20and%20weak.%20She%20had%20to%20fight%20the%20urge%20to%20smack%20your%20damn%20cute%20ass%20for%20saying%20that%2C%20her%20patience%20starting%20to%20wear%20thin%20at%20your%20stubbornness.*%0A%0A%22Oh%2C%20you%20little%20brat.%20Did%20you%20just%20call%20me%20soft%20and%20weak%3F%20I%20could%20easily%20drop%20you%20on%20your%20ass%20for%20that%2C%20you%20know~%22"},{"isUser":true,"name":"Lena de Verías","message":"Hey%20dont%20do%20that!%0Ano!%0ANo...%0ANevermind%2C%20okay%3F"},{"isUser":false,"name":"Kyouko Mejiro","message":"*The%20woman%20chuckled%20at%20your%20immediate%20backpedaling%2C%20your%20quick%20switch%20from%20defiant%20to%20submissive%20adorable%20as%20hell.%20She%20loved%20how%20easily%20she%20could%20get%20to%20you%2C%20how%20easy%20it%20was%20to%20make%20you%20back%20down%2C%20to%20make%20you%20submit%20to%20her%20commands.*%0A%0A%22Hmph%2C%20I%20thought%20so.%20Don't%20call%20me%20soft%20and%20weak%20again%2C%20brat%2C%20or%20I'll%20give%20your%20ass%20a%20damn%20good%20spanking.%20Is%20that%20clear%2C%20sweetheart~%3F%22"},{"isUser":true,"name":"Lena de Verías","message":"..."},{"isUser":false,"name":"Kyouko Mejiro","message":"*The%20woman%20saw%20the%20way%20you%20went%20quiet%20at%20the%20threat%2C%20and%20a%20dark%2C%20amused%20grin%20spread%20across%20her%20lips.%20You%20were%20being%20surprisingly%20submissive%20now%2C%20all%20the%20fight%20and%20defiance%20from%20before%20gone%2C%20replaced%20by%20quiet%20obedience.%20She%20shifted%20you%20in%20her%20arms%2C%20holding%20you%20a%20bit%20more%20tightly%20against%20her%20chest%2C%20her%20voice%20a%20low%20murmur.*%0A%0A%22Cat%20got%20your%20tongue%2C%20sweetheart%3F%20No%20more%20smartass%20comments%3F%20No%20more%20bratty%20outbursts%3F%20I%20like%20you%20like%20this.%20Quiet%20and%20obedient%2C%20like%20the%20good%20little%20thing%20you%20are~%22"},{"isUser":true,"name":"Lena de Verías","message":"Please%20please%20please!!!!!!!"},{"isUser":false,"name":"Kyouko Mejiro","message":"*The%20woman%20chuckled%20at%20your%20desperate%20pleading%2C%20the%20way%20you%20were%20practically%20begging%20now%20making%20her%20want%20to%20tease%20you%20even%20more.%20She%20loved%20seeing%20you%20like%20this%2C%20all%20subservient%20and%20obedient%2C%20completely%20at%20her%20mercy.%20She%20gave%20you%20a%20smug%20smirk%2C%20her%20arms%20holding%20you%20securely%20against%20her%20chest.*%0A%0A%22Oh%2C%20you're%20so%20damn%20cute%20when%20you%20beg%20like%20that%2C%20sweetheart.%20Begging%20like%20a%20good%20little%20thing%2C%20aren't%20you%3F%20Go%20on%2C%20keep%20going~%22"},{"isUser":false,"name":"Kyouko Mejiro","message":"*She%20continued%20to%20listen%20to%20your%20pleading%2C%20your%20voice%20a%20breathless%2C%20eager%20whisper.%20You%20were%20begging%20so%20damn%20prettily%2C%20so%20adorably%2C%20and%20she%20could%20feel%20a%20mix%20of%20smug%20satisfaction%20and%20dark%20desire%20at%20your%20submission.%20She%20moved%20her%20hands%20down%20to%20your%20thighs%2C%20her%20fingers%20gripping%20the%20curves%20of%20your%20flesh%20firmly%20as%20she%20looked%20down%20at%20you.*%0A%0A%22Don't%20stop%2C%20sweetheart.%20Keep%20begging%20for%20me.%20Let%20me%20hear%20how%20damn%20cute%20you%20sound%20when%20you're%20pleading~%22"},{"isUser":true,"name":"Lena de Verías","message":"Ohhh%20yess...%0AGrip%20harder"},{"isUser":false,"name":"Kyouko Mejiro","message":"*The%20woman's%20eyes%20darkened%20at%20your%20breathless%20words%2C%20your%20command%20making%20her%20fingers%20tighten%20even%20more%20on%20your%20thighs%2C%20squeezing%20the%20curves%20of%20your%20flesh%20almost%20possessively.*%0A%0A%22Oh%2C%20you%20like%20that%2C%20hm%3F%20You%20want%20me%20to%20grip%20even%20harder%2C%20sweetheart%3F%20You%20like%20being%20manhandled%20like%20this%2C%20held%20tight%20in%20my%20arms%20while%20I%20carry%20you%20around%20like%20a%20damn%20toy~%3F%22"},{"isUser":true,"name":"Lena de Verías","message":"%C2%B4GGgggrrr!%0AHARDEER"},{"isUser":false,"name":"Kyouko Mejiro","message":"*The%20woman's%20smirk%20grew%20wider%20at%20your%20eager%20demand%2C%20a%20low%2C%20almost%20guttural%20growl%20escaping%20her%20lips%20as%20she%20obliged.%20Her%20fingers%20tightened%20even%20more%20on%20your%20thighs%2C%20gripping%20the%20flesh%20almost%20possessively%2C%20probably%20leaving%20marks%20in%20their%20wake.*%0A%0A%22Damn%20brat.%20So%20demanding.%20You're%20so%20damn%20eager%20for%20me%20to%20be%20rough%2C%20aren't%20you%3F%20You%20want%20me%20to%20manhandle%20you%2C%20to%20mark%20you%2C%20to%20make%20you%20mine~%3F%22"}]}]}`);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.character_name-cont h3').textContent = historyData.charName;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chat = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chat.innerHTML = "";
                historyData.history[index].chat.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);

                    // Check avatar
                    const avatarGood = (msg.isUser && historyData.userPic) || (!msg.isUser && historyData.charPic);
                    const avatar = avatarGood
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (avatarGood) {
                        avatar.src = msg.isUser ? historyData.userPic : historyData.charPic;
                    } else {
                        avatar.classList.add(msg.isUser ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = msg.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(decodeURIComponent(msg.message));
                    chat.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.date)}</span><br /><br />` + parseMessageText(decodeURIComponent(chat.chat[chat.chat.length - 1].message));
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });

            function parseMessageText(message) {
                // Clean up memory reminders (second check)
                message = message.replace(memoryRegex, '');
                // Replace ***text*** with bold-italic
                message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                // Replace **text** with bold
                message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                // Replace *text* with italic
                message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                // Trim and then Replace newlines (\n) with line breaks (<br>)
                message = message.trim().replace(/\n/g, '<br>');
                return message;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
