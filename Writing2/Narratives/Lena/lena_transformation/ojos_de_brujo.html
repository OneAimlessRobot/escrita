<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1.1rem;

            background-color: #4e9733;

            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

            display: flex;

            cursor: pointer;
        }

        nav .char-item:hover {

        nav .nav-avatar-wrap {
            width: 40px;

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .character_name-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .character_name-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })

            // Handle background
            // If there is one
            const currentBg = localStorage.getItem('background');
            if (currentBg) {
                changeBg(currentBg);
            }
            // Change by hand
            const bgInput = document.querySelector('#bgInput');
            document.querySelector('.change-bg').addEventListener('click', () => {
                bgInput.click();
            })
            document.querySelector('.delete-bg').addEventListener('click', () => {
                document.body.classList.remove('custom-bg');
                document.body.style.backgroundImage = "unset";
                localStorage.removeItem('background');
            })
            bgInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    // convert image file to base64 string
                    changeBg(reader.result);
                    bgInput.value = "";
                    try {
                        localStorage.setItem('background', reader.result);
                    } catch (error) {
                        alert('Note: File is likely too big to save.')
                        //console.log(error)
                    }
                }
                reader.readAsDataURL(file);
            })
            function changeBg(bg) {
                let objUrl = URL.createObjectURL(dataURItoBlob(bg));
                document.body.classList.add('custom-bg');
                document.body.style.backgroundImage = `url(${objUrl})`;
            }
            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

%20bewilderment.%20Your%20skin%20feels%20warm%20under%20her%20touch%2C%20but%20not%20excessively%20hot%20like%20a%20fever.*"},{"isUser":true,"name":"Lena de Verías","message":"%5BA%20gentle%2C%20chilling%20breezs%20can%20be%20felt%2C%0Arustling%20my%20short%20air%20around%2C%0Alaying%20some%20strands%20from%20my%20bangs%20on%20my%20eyes%5D"},{"isUser":false,"name":"Ochaco Ururaka","message":"*The%20chill%20breeze%20causes%20Uraraka%20to%20shiver%2C%20goosebumps%20rising%20on%20her%20skin.%20She%20watches%20as%20the%20wind%20gently%20tousled%20your%20hair%2C%20the%20strands%20laying%20across%20your%20eyes%20in%20a%20soft%2C%20ethereal%20way.%20The%20sight%20makes%20her%20heart%20skip%20a%20beat%20for%20some%20reason%2C%20though%20she%20quickly%20dismisses%20the%20feeling%2C%20attributing%20it%20to%20the%20weirdness%20of%20the%20situation.*%0A%0A*With%20a%20small%20sigh%2C%20she%20carefully%20pushes%20the%20hair%20away%20from%20your%20eyes%2C%20so%20they're%20no%20longer%20obstructed.*"},{"isUser":true,"name":"Lena de Verías","message":"%5Bmhhhhgmn%5D%0A%0A%5Bzzzzz...%5D"},{"isUser":false,"name":"Ochaco Ururaka","message":"*Uraraka%20pauses%20as%20she%20hears%20a%20muffled%20sound%20escape%20your%20lips.%20Her%20eyebrows%20furrow%20in%20concern%20as%20she%20leans%20in%20closer%2C%20listening%20intently.%20But%20after%20a%20moment%2C%20the%20sound%20fades%20back%20into%20the%20soft%2C%20rhythmic%20breaths%20of%20sleep.*%0A%0A*She%20relaxes%20slightly%2C%20relief%20washing%20over%20her%20as%20she%20realizes%20it%20was%20just%20a%20sleepy%20mumble.*%0A%0A%22Just%20sleep-talking...%22%20she%20mutters%20quietly."},{"isUser":true,"name":"Lena de Verías","message":"%5BSleep%20talking%2C%20indeed%3A%20%22O-%20Ojos...%0A%0AO-%20Ojos%20d-%20de%20Brujo%22%5D"},{"isUser":false,"name":"Ochaco Ururaka","message":"*Uraraka's%20eyebrows%20raise%20in%20surprise%20and%20confusion%20at%20the%20mumbled%20words.%20Your%20sleep-talking%20was%20quite%20unusual%2C%20but%20then%20again%2C%20nothing%20about%20your%20situation%20made%20sense.*%0A%0A*Her%20curiosity%20piqued%2C%20she%20leaned%20closer%20to%20you%2C%20trying%20to%20make%20out%20the%20words%20you%20were%20repeating.*%0A%0A%22Eyes...%20Eyes%20of...%20Witch%3F%22%20she%20whispered%2C%20unsure%20of%20what%20to%20make%20of%20the%20phrase."},{"isUser":true,"name":"Lena de Verías","message":"%5BStill%20sleep%20talking%3A%20%22Rumo%20a%20liberdad%2C%0Arespiro%20ar%2C%0Asinto%20el%20viento%22%5D"},{"isUser":false,"name":"Ochaco Ururaka","message":"*The%20unfamiliar%20words%20continued%20to%20slip%20from%20your%20lips%2C%20each%20one%20a%20mystery%20to%20Uraraka.%20She%20tried%20her%20best%20to%20make%20sense%20of%20them%2C%20but%20the%20only%20word%20she%20recognized%20was%20%22Liberdad%22%20which%20she%20assumed%20meant%20%22freedom%22%20in%20Spanish.*%0A%0A*She%20listened%20closely%2C%20her%20head%20tilted%20slightly%20to%20the%20side%20as%20she%20processed%20the%20words.*%0A%0A%22Rumo%20a%20liberdad...%20Rumo%20a%20liberdad...%22%20she%20repeated%20softly%20to%20herself%2C%20the%20foreign%20syllables%20rolling%20off%20her%20tongue."},{"isUser":true,"name":"Lena de Verías","message":"%5BSleep%20talks%20some%20more...%0Abut%20stops%20after%3A%20%22Espero...%0Aque%20pelo%20menos%20o%20inferno...%0An%C3%A3o%20seja%20t%C3%A3o%20frio%22%5D"},{"isUser":false,"name":"Ochaco Ururaka","message":"*Uraraka's%20confusion%20deepened%20as%20your%20slumbering%20ramblings%20took%20on%20a%20darker%20tone.%20The%20words%20%22inferno%22%20and%20%22frio%22%20were%20recognizable%2C%20implying%20a%20mention%20of%20heat%20and%20cold.*%0A%0A*She%20knew%20that%20%22inferno%22%20meant%20%22hell%22%20in%20Spanish%2C%20while%20%22frio%22%20meant%20%22cold%22.%20But%20the%20context%20they%20were%20used%20in%20left%20her%20baffled.*%0A%0A%22Infierno...%20fr%C3%ADo...%22%20she%20mumbled%20to%20herself%2C%20the%20words%20sounding%20sinister%20as%20she%20spoke%20them%20aloud."},{"isUser":false,"name":"Ochaco Ururaka","message":"*She%20leaned%20back%20slightly%2C%20watching%20you%20with%20narrowed%20eyes%2C%20her%20mind%20racing%20with%20questions.%20Your%20sleep%20talking%20was%20turning%20into%20a%20bizarre%2C%20cryptic%20message%20that%20seemed%20to%20hint%20at%20a%20darker%20side%20of%20your%20subconscious.*%0A%0A*She%20couldn't%20help%20but%20wonder%20what%20images%20or%20experiences%20lay%20hidden%20behind%20those%20seemingly%20innocent%20words%20you%20murmured%20in%20your%20sleep...*"},{"isUser":true,"name":"Lena de Verías","message":"%22Eu...%0Aeu%20mateios.%0A%0APorque...%0Acertas%20pessoas%20precisam%20de%20se%20acalmar...%0Adepressa%2C%0Aoutras%20precisam%20de%20um%20alivio%20durarouro...%0Ae%20eu%20proporcionei-lhes%20ambos.%0ADois...%0Aem%20um.%0AN%C3%A3o%20me%20pe%C3%A7am%20para%20fazer%20melhor%2C%20por%20favor.%0AN%C3%A3o%20tenho...%0AOlhos%20de%20bruxa%20para%20decifrar%20%C3%A9tica%20na%20hora%20de%20agir%22"},{"isUser":false,"name":"Ochaco Ururaka","message":"*Uraraka's%20eyes%20widened%20as%20your%20sleep-talking%20took%20a%20chilling%2C%20eerie%20turn.%20The%20words%20you%20said%20seemed%20to%20carry%20dark%2C%20almost%20sinister%20undertones.%20She%20listened%20intently%2C%20trying%20to%20decipher%20the%20meanings%20behind%20your%20mumbled%20phrases.*%0A%0A*The%20mention%20of%20killing%20someone%2C%20and%20the%20talk%20of%20%22providing%20relief%22%20sent%20a%20shiver%20down%20her%20spine.%20It%20sounded%20almost%20like%20something%20a...%20a%20psychopath%20would%20say.*%0A%0A*Her%20heart%20rate%20began%20to%20quicken%20slightly%20as%20she%20processed%20the%20disturbing%20nature%20of%20your%20words.*"}]}]}`);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.character_name-cont h3').textContent = historyData.charName;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chat = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chat.innerHTML = "";
                historyData.history[index].chat.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);

                    // Check avatar
                    const avatarGood = (msg.isUser && historyData.userPic) || (!msg.isUser && historyData.charPic);
                    const avatar = avatarGood
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (avatarGood) {
                        avatar.src = msg.isUser ? historyData.userPic : historyData.charPic;
                    } else {
                        avatar.classList.add(msg.isUser ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = msg.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(decodeURIComponent(msg.message));
                    chat.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.date)}</span><br /><br />` + parseMessageText(decodeURIComponent(chat.chat[chat.chat.length - 1].message));
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });

            function parseMessageText(message) {
                // Clean up memory reminders (second check)
                message = message.replace(memoryRegex, '');
                // Replace ***text*** with bold-italic
                message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                // Replace **text** with bold
                message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                // Replace *text* with italic
                message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                // Trim and then Replace newlines (\n) with line breaks (<br>)
                message = message.trim().replace(/\n/g, '<br>');
                return message;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
