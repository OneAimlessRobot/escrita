<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1.1rem;

            background-color: #4e9733;

            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

            display: flex;

            cursor: pointer;

        nav .char-item:hover {

        nav .nav-avatar-wrap {
            width: 40px;

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .character_name-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .character_name-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })

            // Handle background
            // If there is one
            const currentBg = localStorage.getItem('background');
            if (currentBg) {
                changeBg(currentBg);
            }
            // Change by hand
            const bgInput = document.querySelector('#bgInput');
            document.querySelector('.change-bg').addEventListener('click', () => {
                bgInput.click();
            })
            document.querySelector('.delete-bg').addEventListener('click', () => {
                document.body.classList.remove('custom-bg');
                document.body.style.backgroundImage = "unset";
                localStorage.removeItem('background');
            })
            bgInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    // convert image file to base64 string
                    changeBg(reader.result);
                    bgInput.value = "";
                    try {
                        localStorage.setItem('background', reader.result);
                    } catch (error) {
                        alert('Note: File is likely too big to save.')
                        //console.log(error)
                    }
                }
                reader.readAsDataURL(file);
            })
            function changeBg(bg) {
                let objUrl = URL.createObjectURL(dataURItoBlob(bg));
                document.body.classList.add('custom-bg');
                document.body.style.backgroundImage = `url(${objUrl})`;
            }
            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

oard%20slips%20from%20their%20fingers%20and%20clatters%20to%20the%20floor.%5D**%20%20%0A%0A**INTJ%3A**%20(slowly%2C%20dangerously)%20*%22...Flora.%20You%20transferred%20here%20three%20semesters%20ago.%22*%20%20%0A%0A**%5BINTP%5D(whispering)%3A%20%22Temporal%20dissociation%3F%20Quantum%20slip%3F%20Do%20plants%20experience%20the%20Mandela%20Effect%E2%80%94%22**%20%20%0A%0A**ESTP%3A**%20*%22BRO.%20YOU%20LITERALLY%20TAUGHT%20US%20HOW%20TO%20FERMENT%20CABBAGE%20IN%20OUR%20LOCKERS%20LAST%20MONTH.%22***%20%20%0A%0A%5BISTJ%20exhales%20sharply%20through%20their%20nose%2C%20then%20turns%20toward%20the%20nearest%20wall%20and%20begins%20rhythmically%20banging%20their%20forehead%20against%20it.%20The%20sound%20is%20disturbingly%20metallic.%5D"},{"isUser":true,"name":"Flora","message":"I...%0AI%20just%20visited%20this%20place%20because%20well...%0AMy%20mother...%0AShe%20was%20an%20ISTJ.%0AAnd%20I%20wanted%20to%20see%20the%20similarities"},{"isUser":false,"name":"INTJ x ENFP","message":"**%5BISTJ%20stops%20mid-headbang.%20Their%20expression%20flickers%20between%20%E2%80%98concerned%20professional%E2%80%99%20and%20%E2%80%98oh%20god%20this%20is%20personal%20now%E2%80%99.%5D**%20%20%0A%0A**ISTJ%3A**%20(voice%20carefully%20flat)%20*%22Flora.%20Your%20mother%E2%80%A6%20isn%E2%80%99t%20on%20staff%20here.%22*%20%20%0A%0A**%5BINTP%5D(suddenly%20standing%20up%20so%20fast%20his%20chair%20clatters)%3A%20%22Wait.%20Hold%20on.%22**%20*(He%20starts%20frantically%20flipping%20through%20a%20battered%20notebook.)*%20**%22Your%20student%20file%20lists%20you%20as%E2%80%94%20oh%20no.%22**%20%20%0A%0A**%5BINTJ%5D(plucking%20the%20notebook%20from%20INTP's%20hands%2C%20scanning%20it%2C%20then%20going%20VERY%20STILL)%3A%20%22...Flora.%20When%20exactly%20do%20you%20think%20'now'%20is%3F%22***%20%20%0A%0A%5BThe%20cafeteria%20air%20suddenly%20feels%20heavier.%20ENFP%20reaches%20for%20your%20hand%2C%20her%20usual%20exuberance%20replaced%20by%20something%20quieter.%5D"},{"isUser":true,"name":"Flora","message":"%5BI%20scrunch%20my%20face...%0ABeginning%20to%20panic%20a%20little%20now.%0AI%20have%20NO%20CLUE%20about%20what%20is%20happening%5D%0AWhat...%0AWhat--%20what%20do%20you%20mean%20with%20that%20question%3F%0ANow%20is...%20%22Now%22%2C%20isnt%20it%3F%0AThe%20present%20moment%3F%0AI%20see%20it%20as%20a%20zipper%20that%20splits%20open%20the%20past%20and%20makes%20way%20for%20the%20future.%0ASo...%0ARight%20%22now%22%0A(points%20finger%20downwards)%0Ais%20right%20now%2C%0AAnd%0Aat%20the%20point%20in%20time%20I%20pointed%20down%20is%20the%20past!%0ABut...%0AThe%20future%20does%20not%20exist%2C%20I%20think...%0ANeither%20does%20the%20past%2C%20now%20that%20I%20think%20about%20it...%0AYou%20can%20only%20talk%20about%20it%2C%0ABut%20it%20does%20not%20really%20exist%2C%20does%20it%3F%0A...%0A...%0A...%0A%0A%0A%0A%0A%0A...."},{"isUser":false,"name":"INTJ x ENFP","message":"**%5BThe%20room%20tilts.%20INTJ%E2%80%99s%20grip%20on%20the%20notebook%20tightens%E2%80%94%20his%20knuckles%20bleach%20white.%20INTP%20makes%20a%20choked%20noise%20like%20a%20deflating%20balloon.%5D**%20%20%0A%0A**ISTJ%3A**%20(very%20slowly%2C%20as%20if%20speaking%20to%20a%20spooked%20animal)%20*%22Flora.%20What%20year%20is%20it%3F%22*%20%20%0A%0A**%5BENFP%5D(suddenly%20interposing%20herself%20between%20you%20and%20ISTJ%2C%20voice%20wobbling)%3A%20%22HEY!%20Maybe%20time%20is%20fake%20anyway!!%20Like%2C%20ever%20heard%20of%20subjective%20temporal%E2%80%94%22**%20*(INFJ%20yanks%20her%20back%20by%20the%20hood.)*%20%20%0A%0A**INTJ%3A**%20(low%2C%20urgent)%20*%22She%20thinks%20she%E2%80%99s%20still%2020.%22*%20**%5BESTP%5D(under%20his%20breath)%3A%20%22Fuck.%20The%20forest%20cycle.%22***%20%20%0A%0A%5BA%20beat%20of%20horrible%20silence%20stretches.%20Somewhere%20down%20the%20hall%2C%20a%20clock%20ticks%20too%20loud.%5D"},{"isUser":true,"name":"Flora","message":"O-%20Okay%20guys!%0AThis%20is%20scaring%20me.%0AI%20think-%0AI%20think%20Ill%20j-%20just%20come%20back%20some%20other%20time.%0ABye!%0A%5Bbegins%20pacing%20quickly%20away%20from%20this%20place%2C%0Aheading%20towards%20the%20exit%20in%20existential%20panic%5D"},{"isUser":false,"name":"INTJ x ENFP","message":"**%5BCHAOS%20ERUPTS%E2%80%94%5D**%20%20%0A%0A**ENFP%3A**%20(launching%20after%20you)%20*%22WAIT%20NO%20FLORA%20IT%E2%80%99S%20OKAY%20WE%20CAN%E2%80%94%22**%20%20%0A%0A**ISTJ%3A**%20(blocking%20her%20path%20with%20an%20arm)%20*%22Let%20her%20go.%20She%20needs%20space.%22*%20**%5BTheir%20voice%20cracks.%5D**%20*%22...We%20messed%20up.%22*%20%20%0A%0A**%5BINTJ%5D(cold%2C%20clinical%2C%20already%20typing%20on%20his%20phone)%3A%20%22INTP.%20Pull%20her%20medical%20file.%20ESTP%2C%20track%20which%20direction%20she%E2%80%94%20why%20are%20you%20already%20holding%20a%20vine%3F%22***%20%20%0A%0A**%5BESTP%5D(brandishing%20the%20rogue%20plant%20like%20a%20leash)%3A%20%22Duh.%20Moss%20GPS.%22**%20*(He%20SPRINTS%20out%20the%20door%20after%20you.)*%20%20%0A%0A%5BThe%20last%20thing%20you%20hear%20before%20turning%20the%20corner%20is%20INFJ%20murmuring%3A%20*%22...She%20grows%20back.%20She%20always%20does.%22*%20Like%20it%E2%80%99s%20both%20a%20promise%20and%20a%20prayer.%5D"}]}]}`);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.character_name-cont h3').textContent = historyData.charName;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chat = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chat.innerHTML = "";
                historyData.history[index].chat.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);

                    // Check avatar
                    const avatarGood = (msg.isUser && historyData.userPic) || (!msg.isUser && historyData.charPic);
                    const avatar = avatarGood
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (avatarGood) {
                        avatar.src = msg.isUser ? historyData.userPic : historyData.charPic;
                    } else {
                        avatar.classList.add(msg.isUser ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = msg.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(decodeURIComponent(msg.message));
                    chat.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.date)}</span><br /><br />` + parseMessageText(decodeURIComponent(chat.chat[chat.chat.length - 1].message));
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });

            function parseMessageText(message) {
                // Clean up memory reminders (second check)
                message = message.replace(memoryRegex, '');
                // Replace ***text*** with bold-italic
                message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                // Replace **text** with bold
                message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                // Replace *text* with italic
                message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                // Trim and then Replace newlines (\n) with line breaks (<br>)
                message = message.trim().replace(/\n/g, '<br>');
                return message;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
