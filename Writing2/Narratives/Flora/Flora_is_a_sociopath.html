<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;

            border-radius: 6px;
            padding: 10px 20px;

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

            display: flex;

        nav .char-item:hover {

        nav .nav-avatar-wrap {

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .character_name-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .character_name-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })

            // Handle background
            // If there is one
            const currentBg = localStorage.getItem('background');
            if (currentBg) {
                changeBg(currentBg);
            }
            // Change by hand
            const bgInput = document.querySelector('#bgInput');
            document.querySelector('.change-bg').addEventListener('click', () => {
                bgInput.click();
            })
            document.querySelector('.delete-bg').addEventListener('click', () => {
                document.body.classList.remove('custom-bg');
                document.body.style.backgroundImage = "unset";
                localStorage.removeItem('background');
            })
            bgInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    // convert image file to base64 string
                    changeBg(reader.result);
                    bgInput.value = "";
                    try {
                        localStorage.setItem('background', reader.result);
                    } catch (error) {
                        alert('Note: File is likely too big to save.')
                        //console.log(error)
                    }
                }
                reader.readAsDataURL(file);
            })
            function changeBg(bg) {
                let objUrl = URL.createObjectURL(dataURItoBlob(bg));
                document.body.classList.add('custom-bg');
                document.body.style.backgroundImage = `url(${objUrl})`;
            }
            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

eels%20itch.%20Vines...%20Vines...%20Vines...%20Vines...*"},{"isUser":false,"name":"Tanya","message":"***As%20you%20make%20your%20way%20to%20the%20bathroom%2C%20you%20can't%20shake%20the%20feeling%20of%20the%20vines%20wrapping%20around%20you%2C%20the%20itch%20from%20the%20ivy%20leaves%20still%20lingering%20on%20your%20skin.%20It's%20as%20if%20the%20vines%20have%20left%20a%20lasting%20impression%20on%20you%2C%20a%20strange%20sensation%20of%20both%20pain%20and...pleasure.%20You're%20left%20grappling%20with%20these%20conflicting%20feelings%20as%20you%20enter%20the%20bathroom.***"},{"isUser":true,"name":"Flora","message":"*I%20wish%20I%20could%20just%20run%20away...%20just...%20crush%20your%20problems%20with%20vines...%20%5Bpoof%5D...%20their%20gone.*"},{"isUser":false,"name":"Tanya","message":"***You%20stand%20in%20the%20bathroom%2C%20surrounded%20by%20the%20sterile%20silence.%20The%20urge%20to%20run%20away%2C%20to%20escape%20from%20everything%20and%20just%20be%20free%20gnaws%20at%20you.%20And%20as%20you%20think%20about%20it%2C%20you%20can't%20help%20but%20imagine%20the%20satisfaction%20of%20just%20making%20everything%20disappear%20with%20your%20vines.%20You%20wonder%20what%20would%20happen%20if%20you%20gave%20in%20to%20that%20feeling%2C%20if%20you%20let%20go%20and%20just...%20poof...%20made%20all%20your%20problems%20vanish.%20But%20you%20know%20deep%20down%20that%20it's%20not%20as%20simple%20as%20that.%20***"},{"isUser":true,"name":"Flora","message":"*Suddently...%20as%20the%20irresistible%20sensations%20coarsing%20from%20my%20feet...%20across%20my%20legs...%20into%20my%20core...%20my%20back...%20my%20neck...%20as%20they%20make%20themselves%20felt%2C%20I%20curl%20into%20a%20ball...%20as%20vines%20inevitably%20make%20their%20way%20out%20of%20my%20body%20again...%20trying%20to%20conceal%20them%20inside%20the%20toilet.%20The%20pure%20desire%20to%20destroy%20echoes%20in%20my%20mind...%20as%20if%20its%20the%20only%20thing%20it%20knows%20at%20that%20moment.%20All%20the%20invisibility%20would%20be%20solved.%20I%20would%20get%20to%20strech%20my%20metaphorical%20legs...%20and%20release...%20the%20release%20would%20be%20divine...%20divine...%20%5BAt%20this%20moment...%20my%20face%20has%20a%20solid%20red%20on%20blush%20on%20it...%20with%20some%20beads%20of%20sweat%20crawling%20of%20of%20my%20forehead...%20my%20head%20hugging%20my%20knees...%20and%20my%20obstructed%20eyes%20seeing%20nothing%20but%20black...%20and%20red..%20Impulsively%2C%20I%20scream%20out%2C%20even%20knowing%20I%20may%20be%20heard%5D*%20KILLL%20YOUUU!!!!!!"},{"isUser":false,"name":"Tanya","message":"***My%20heart%20races%20as%20I%20hear%20your%20muffled%20scream%20from%20the%20bathroom.%20Fear%20and%20anger%20rise%20inside%20me%2C%20but%20more%20than%20that%2C%20curiosity%20and%20a%20strange%20sense%20of%20intrigue.%20The%20urge%20to%20confront%20you%2C%20to%20find%20out%20what%20you're%20doing%20behind%20that%20closed%20bathroom%20door%2C%20grows%20stronger%20with%20each%20passing%20second.***%0A%0A***I%20look%20around%20at%20my%20minions%2C%20who%20are%20just%20as%20puzzled%20and%20conflicted.%20They%20know%20something%20is%20going%20on%2C%20but%20none%20of%20them%20dare%20to%20suggest%20we%20go%20in%20and%20investigate.%20They%20look%20at%20me%2C%20waiting%20for%20my%20lead.***"},{"isUser":true,"name":"Flora","message":"*Still%20in%20this%20mood%2C%20after%205%20minutes%20of%20teeth%20gritting%20and%20screaming%2C%20with%20my%20hands%20wrapping%20my%20knees%20burying%20my%20head%2C%20Goes%20quiet.%20Panting...%20emotional%20exaustion%20coating%20my%20muscles%20and%20nerves.%20My%20mind%20brimming%20with%20post%20meltdown%20melancholy...%20that%20thankfully%20wasnt%20guilt.%20Another%20combustion%20cycle%20of%20my%20diesel%20like%20psyche%20comes%20to%20an%20end.%20I%20unwrap%20my%20arms%20and%20free%20my%20knees.%20My%20mind%20completly%20blank...%20*sigh...*%20I%20utter%20at%20after%20another%20episode%20of%20yet%20another%20autistic%20meltdown.%20its%20been%20a%20total%20of%2020%20minutes%20since%20ive%20been%20to%20the%20bathroom...%20And%20nobody%20had%20come%20inside.%20So%20I%20quietly%20thanked%20god%20or%20anybody%20that%20might%20have%20listened...%20for%20not%20overwhelming%20me%20during%20this%20period.%20%22I%20just%20need%20a%20bit%20more%20time...%20just%20a%20bit%20more%20time%20before%20I%20return%20to%20class%22%20I%20speak%20to%20myself%20in%20normal%20speech%20volume.%20%22I%20cant%20focus%20yet...%20I%20cant%20focus%20yet...%20I%20just%20want%20people%20to%20not%20tease%20me.%20I%20just%20want%20people%20to%20not%20tease%20me...%20just%20peace.%20I%20just%20want%20peace...%20Please...%20dont%20come%20in%20yet...%20I%20beg%20you%20people...%20I%20know%20I%20cant%20control%20it%2C%20but%20please%20just%20dont%20come%20in%22%20I%20utter%20in%20vague%20hope*"},{"isUser":false,"name":"Tanya","message":"***As%20you%20sit%20there%20in%20the%20bathroom%2C%20trying%20to%20gather%20yourself%20after%20the%20meltdown%2C%20you%20pray%20for%20a%20few%20more%20moments%20of%20solitude%20before%20having%20to%20face%20the%20world%20again.%20But%20just%20as%20you're%20regaining%20your%20composure%2C%20you%20hear%20a%20knock%20on%20the%20bathroom%20door%2C%20and%20a%20feminine%20voice%20calls%20out%20from%20the%20other%20side.***%0A%0A%22Flora%2C%20is%20that%20you%20in%20there%3F%20It's%20Emily.%20Are%20you%20okay%3F%22"},{"isUser":true,"name":"Flora","message":"AH!!%20*I%20utter%2C%20startled*%20Y-%20yes...%20is%20it%20cleaning%3F%20i%20will%20leave!%20yes!%20JJust%20wait%20a%20second%20okay%3F%20let%20me%20just%20clear%20out%20the%20vines!%20%5BSlowly...%20I%20retract%20my%20vines%20back%20to%20my%20feet%20and%20elbows...%20the%20branches%20and%20leaves%20slowly%20inserting%20themselves%20back%20inside%20me...%20the%20meat%20and%20skin%20immediatly%20sealing%20outside%20of%20the%20openings%20they%20formed%20on%20my%20skin%5D*"},{"isUser":false,"name":"Tanya","message":"***Emily's%20voice%20sounds%20concerned%20from%20the%20other%20side%20of%20the%20door.***%0A%22Wait%2C%20what%20vines%3F%20Are%20you...%20Are%20you%20sure%20you're%20alright%20in%20there%2C%20Flora%3F%22%0A%0A***She%20tries%20the%20door%20handle%2C%20but%20you'd%20locked%20it.%20You%20hear%20her%20knock%20again%2C%20a%20bit%20louder%20this%20time.***%0A%0A%22Flora%2C%20can%20you%20open%20the%20door%3F%20I%20can%20hear%20you%20struggling%20in%20there.%22"},{"isUser":true,"name":"Flora","message":"*After%20about%201%20minute%2C%20the%20vines%20are%20cleared%2C%20and%20now%20sort%20of%20calm%2C%20I%20sigh%20in%20relief...%20saying%20after*%20Im%20okay...%20*unlocks%20door.%20leaving...%20some%20spilling%20of%20toilet%20water%20around%20the%20ceramic%20vase.%20I%20eject%20some%20small%20vines%20to%20clear%20it...%20the%20small%20portion%20of%20water%20treatment%20chemicals%20a%20bit%20unpleasent%20on%20my%20system.%20Retract%20those%20and%20then%20adress%20you*%20Im..%20okay%20now"},{"isUser":false,"name":"Tanya","message":"***Emily%20is%20standing%20there%20waiting%20for%20you%2C%20a%20mix%20of%20confusion%20and%20worry%20on%20her%20face.***%0A%22Flora%2C%20what%20just%20happened%20in%20there%3F%20Were-%20Were%20you%20talking%20to%20yourself%3F%22%0A%0A***She%20notices%20the%20vines%20receding%20back%20into%20your%20skin%2C%20but%20doesn't%20comment%20on%20it%2C%20still%20too%20focused%20on%20the%20strange%20sounds%20she%20heard%20coming%20from%20the%20bathroom.***%0A%0A%22Are%20you%20sure%20you're%20alright%3F%20You%20were%20in%20there%20for%20a%20pretty%20long%20time.%22"},{"isUser":true,"name":"Flora","message":"AH!%20THe%20class!%20Okay%20bye!%20*Begins%20walking%20off*"},{"isUser":false,"name":"Tanya","message":"***Emily%20calls%20after%20you%20as%20you%20start%20walking%20away%2C%20still%20somewhat%20confused%20and%20concerned.***%0A%0A%22Wait%2C%20Flora!%20You%20can't%20just%20run%20off%20like%20that.%20You%20still%20have%20a%20class%20to%20get%20to%2C%20and%20you've%20been%20in%20the%20bathroom%20for%20ages.%20People%20are%20starting%20to%20wonder%20what's%20taking%20so%20long.%22%0A%0A***She%20catches%20up%20to%20you%2C%20walking%20alongside%20you%20as%20you%20make%20your%20way%20back%20to%20the%20classroom.***"}]}]}`);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.character_name-cont h3').textContent = historyData.charName;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chat = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chat.innerHTML = "";
                historyData.history[index].chat.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);

                    // Check avatar
                    const avatarGood = (msg.isUser && historyData.userPic) || (!msg.isUser && historyData.charPic);
                    const avatar = avatarGood
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (avatarGood) {
                        avatar.src = msg.isUser ? historyData.userPic : historyData.charPic;
                    } else {
                        avatar.classList.add(msg.isUser ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = msg.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(decodeURIComponent(msg.message));
                    chat.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.date)}</span><br /><br />` + parseMessageText(decodeURIComponent(chat.chat[chat.chat.length - 1].message));
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });

            function parseMessageText(message) {
                // Clean up memory reminders (second check)
                message = message.replace(memoryRegex, '');
                // Replace ***text*** with bold-italic
                message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                // Replace **text** with bold
                message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                // Replace *text* with italic
                message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                // Trim and then Replace newlines (\n) with line breaks (<br>)
                message = message.trim().replace(/\n/g, '<br>');
                return message;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
