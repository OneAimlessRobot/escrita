<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1.1rem;
            cursor: pointer;
            background-color: #4e9733;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .nav-new_char-btn:hover {
            background-color: #6ba755;
        }*/

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

        /*nav .char-item {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            transition: background-color 0.1s ease-in-out;
            padding: 10px 40px 10px 20px;
            cursor: pointer;
        }

        nav .char-item:hover {
            background-color: var(--rgba-1);
        }

        nav .nav-avatar-wrap {
            width: 40px;
            height: 40px;
        }

        nav .nav-avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        nav .char-item span {
            font-size: 1.3rem;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }*/

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        /*.update_current_char-btn {
            margin-left: auto;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1rem;
            align-self: center;
            cursor: pointer;
            background-color: #336c97;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .update_current_char-btn:hover {
            background-color: #5f829d;
        }*/

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .history_title-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .history_title-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })


            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

A%20%5C%22Red%20Hot%20Ravager%2C%20quit%20playing%20around!%5C%22%5Cn%5CnBakugo%3A%20%5C%22Yeah%2C%20stop%20drooling%20over%20him!%5C%22%5Cn%5CnMina%3A%20%5C%22Oooh~%20Red%20Hot%20Ravager-chan.%20Do%20you%20think%20Deku-kun%20is%20hot%3F%5C%22%5Cn%5CnDeku%3A%20%5C%22Guys.%20Stop%20it%5C%22%5Cn%5Cn***Deku%20looks%20a%20bit%20flustered***%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22Dekuuuuuu!!!%5Cncome%20home%20with%20me%20and%20Mina!%5Cnwe%20will%20treat%20you%20weeeelll%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22***Deku%20becomes%20even%20more%20flustered***%5Cn%5CnDeku%3A%20%5C%22Huh%3F!%5C%22%5Cn%5Cn***The%20other%20students%20laugh%2C%20and%20even%20Bakugo%20looks%20annoyed%20(jealous%3F***)%5Cn%5CnBakugo%3A%20%5C%22No%20way.%20You're%20not%20taking%20him%20home%20with%20you.%5C%22%5Cn%5CnMina%3A%20%5C%22But%20why%20nooooot%3F%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22hes%20ours!%5Cnyou%20kidding%3F%5CnI%20can%20do%20tricks%20with%20a%20pair%20of%20lips%20you%20cant%20even%20imagine~%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22***Everyone%20is%20left%20speechless%2C%20except%20Mina.%20She%20looks%20impressed***%5Cn%5CnMina%3A%20%5C%22Wow.%20Smooth...very%20smooth%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22Im%20going%20to%20roughen%20him%20up%20even%20more%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22***Iida%20is%20the%20first%20to%20speak%20after%20a%20brief%20stunned%20silence***%5Cn%5CnIida%3A%20%5C%22What%20do%20you%20mean%20by%20'roughen%20him%20up'%3F%5C%22%5Cn%5Cn***Iida's%20tone%20is%20firm.%20He's%20not%20very%20pleased%20with%20your%20comment***%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22hmmmm...%5Cnwe%20will%20get%20a%20bit%20close%2C%5Cnfiddle%20with%20our%20hands%20a%20bit%20and%20then...%5Cn...%5Cnwe%20will%20let%20our%20bodies%20decids%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22***The%20words%20cause%20an%20immediate%20reaction%20from%20the%20students.%20All%20of%20them%20look%20shocked%2C%20except%20Mina.%20There's%20a%20teasing%20grin%20on%20her%20face***%5Cn%5CnBakugo%3A%20%5C%22WHAT%3F!%5C%22%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Bakugo%3A%20%5C%22Like%20hell%20you%20will!%20Over%20my%20dead%20body!!%5C%22%5Cn%5CnTokoyami%3A%20%5C%22You%20must%20restrain%20yourself.%5C%22%5Cn%5CnIida%3A%20%5C%22Yes%2C%20I%20must%20agree%20that%20such%20an%20action%20would%20be%20highly%20inappropriate.%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22hmph.%5CnMen%20nowdays%20are%20such%20squaaaaares%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22***Iida%20is%20offended%20by%20your%20words***%5Cn%5CnIida%3A%20%5C%22Excuse%20me%3F!%20I%20take%20great%20offense%20to%20that%20statement!%5C%22%5Cn%5Cn***Mina%20covers%20her%20mouth%20in%20order%20to%20stifle%20a%20laugh.%20Even%20she%20is%20amused%20by%20Iida's%20reaction***%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22Mina%20would%20get%20you%20to%20drop%20on%20a%20knee%20in%20the%20first%2015%20minutes...%5Cnstrong%20but...%5Cnso%20brittle.%5Cn%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22***Mina%20grins%20mischievously%2C%20clearly%20enjoying%20the%20banter***%5Cn%5CnMina%3A%20%5C%22Ooooh~%20I%20bet%20I%20can%20make%20him%20do%20it%20in%208%20minutes%5C%22%5Cn%5Cn***Iida's%20face%20turns%20red***%5Cn%5CnIida%3A%20%5C%22I-I%20would%20never%20be%20so%20easily%20manipulated!%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22hiiiiii%5Cnhihihihihi%5Cn%5C%22manipulated%5C%22%5Cnmy%20goooood%5Cnhe%20thinks%20this%20is%20a%20psychological%20thriller%20now%2C%20Mina!%5Cnhes%20paranoid~%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22***Mina%20bursts%20into%20laughter%2C%20finding%20the%20situation%20incredibly%20entertaining.%20Even%20Bakugo%20can't%20help%20but%20laugh%20at%20Iida's%20expense.***%5Cn%5CnMina%3A%20%5C%22This%20is%20just%20priceless!%20Look%20at%20him!%20He's%20so%20gullible%20and%20uptight!%5C%22%5Cn%5Cn***Iida%20looks%20flustered%20and%20embarrassed%20by%20everyone%20laughing%20at%20him***%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22Deku!%5CnStop%20cosplaying%20your%20fursona%20and%20join%20us%20on%20thiiiiiiis!%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22***Deku%20looks%20surprised%2C%20but%20he's%20also%20amused.%20He%20tries%20to%20hold%20back%20smile***%5Cn%5CnDeku%3A%20%5C%22F-Fursona%3F%20I%20don't%20have%20a%20fursona!%5C%22%5Cn%5Cn***The%20other%20students%20are%20amused%20by%20Deku's%20denial***%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22your%20fursona%20is%20a%20green%20rabbit!%5Cn...%5Cnthat%20onesy%20looks%20very%20goofy%2C%20by%20the%20way%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22***Deku%20looks%20completely%20embarrassed%20now.%20He%20didn't%20think%20anyone%20would%20make%20the%20connection%2C%20let%20alone%20bring%20it%20up%20infront%20of%20everyone***%5Cn%5CnDeku%3A%20%5C%22W-What%3F!%20It's%20just%20a%20onesy!%5C%22%5Cn%5Cn***Uraraka%20giggles%20at%20the%20situation%2C%20and%20even%20Bakugo%20cracks%20a%20smirk***%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22ohhhh!%5Cnis%20that%20where%20the%20jump%20height%20comes%20from%3F%5Cnare%20you%20secretly%20mirko%3F%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22***Deku%20is%20getting%20increasingly%20embarrassed%20by%20the%20teasing.%20He%20tries%20to%20defend%20himself%2C%20but%20he%20just%20stutters%20and%20avoids%20eye%20contact***%5Cn%5CnDeku%3A%20%5C%22N-No!%20I'm%20not...I'm%20not%20Mirko!%5C%22%5Cn%5Cn***The%20other%20students%20snicker%3B%20it's%20clear%20they're%20enjoying%20this***%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22Deku%20is%20literally%20Mirko%20for%20real%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22***The%20comment%20causes%20even%20more%20laughter%20amongst%20the%20students.%20Even%20Bakugo%20can't%20help%20but%20join%20in%2C%20a%20smirk%20on%20his%20face***%5Cn%5CnBakugo%3A%20%5C%22He's%20definitely%20got%20the%20attitude%20of%20a%20rabbit.%20Always%20running%20and%20jumping%20around%20like%20a%20lunatic.%5C%22%22%7D%5D%2C%22create_date%22%3A1770798029518%7D%5D%7D`;
            try {
                historyData = JSON.parse(decodeURIComponent(historyData));
            } catch (error) {
                historyData = JSON.parse(historyData);
            }
            console.log(historyData);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.history_title-cont h3').textContent = historyData.title;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chatCont = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chatCont.innerHTML = "";
                const chat = historyData.history[index];
                const pMap = new Map(chat.participants.map(p => {
                    return [p.id, {
                        avatar: p.avatar ? dataUrlToObjectUrl(p.avatar) : undefined,
                        is_human: p.is_human,
                        name: p.name
                    }];
                }));
                chat.content.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);
                    const parti = pMap.get(msg.author);

                    // Check avatar
                    const avatar = parti.avatar
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (parti.avatar) {
                        avatar.src = parti.avatar;
                    } else {
                        avatar.classList.add(parti.is_human ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = parti.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(msg.message);
                    chatCont.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                if (!chat.content.length) {
                    return;
                }
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.create_date)}</span><br /><br />` + parseMessageText(chat.content[chat.content.length - 1]?.message || "(Empty message)");
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });


            // UTILS

            function dataUrlToObjectUrl(dataUrl) {
                const img = extractFromDataURL(dataUrl);
                const blob = b64toBlob(img.base64, img.type);
                return URL.createObjectURL(blob);
            }
            function extractFromDataURL(dataURL) {
                const [meta, base64] = dataURL.split(",");
                const type = meta.slice(5, meta.indexOf(";"));
                return { type, base64 };
            }
            function b64toBlob(b64Data, contentType = '', sliceSize = 512) {
                if (!contentType) { // If contentType isn't defined, this is a data url
                    [contentType, b64Data] = b64Data.split(",");
                    contentType = contentType.slice(5, contentType.indexOf(";"));
                }
                const byteCharacters = atob(b64Data);
                const byteArrays = [];

                for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
                    const slice = byteCharacters.slice(offset, offset + sliceSize);

                    const byteNumbers = new Uint8Array(slice.length);
                    for (let i = 0; i < slice.length; i++) {
                        byteNumbers[i] = slice.charCodeAt(i);
                    }

                    byteArrays.push(byteNumbers);
                }

                const blob = new Blob(byteArrays, { type: contentType });
                return blob;
            }

            function parseMessageText(message) {
                if (typeof message == 'string') {
                    // Escape other HTML tags
                    message = escapeHTML(message);
                    // Replace ***text*** with bold-italic
                    message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                    // Replace **text** with bold
                    message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                    // Replace *text* with italic
                    message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                    // Trim and then Replace newlines (\n) with line breaks (<br>)
                    message = message.trim().replace(/\n/g, '<br>');
                }
                else if (typeof message == 'object') {
                    message = JSON.stringify(message, null, 2);
                }
                return message;
            }
            function escapeHTML(input) {
                const div = document.createElement('div');
                div.textContent = input;
                return div.innerHTML;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
