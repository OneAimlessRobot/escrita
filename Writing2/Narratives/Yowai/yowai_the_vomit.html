<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

        nav .char-item:hover {

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .history_title-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .history_title-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })


            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

%22message%22%3A%22I%20think%20I%20dont%20really%20care...%5Cnthats%20all...%5Cn%5Cn...%5Cn%5Bshrugs%20shoulders%20slowly%2C%5Cnkeeping%20them%20tucked%20for%20a%20bit%5Cnand%20then%20relaxing%20them%20just%20as%20gently%20as%20I%20tucked%20them%5D%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Shinobu%20observed%20the%20shrug%20of%20your%20shoulders%2C%20her%20concern%20deepening.%20The%20nonchalant%20attitude%20you%20had%20towards%20your%20own%20cuteness%20was%20clear%2C%20and%20it%20bothered%20her%20greatly.%5Cn%5CnShe%20watched%20as%20you%20relaxed%20your%20shoulders%2C%20her%20hand%20still%20on%20your%20shoulder%2C%20a%20small%2C%20delicate%20anchor%20meant%20to%20ground%20you.%5Cn%5Cn%5C%22You...%20really%20don't%20care%3F%5C%22%20she%20asked%20softly%2C%20her%20voice%20laced%20with%20a%20hint%20of%20puzzlement%20and%20a%20tinge%20of%20sadness.%20%5C%22That's%20just%20it%3F%20You%20don't%20care%20that%20you're%20cute%3F%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22no...%5CnI%20mean...%5Cnwhat%20am%20I%20going%20to%20do%20with%20that%20information...%5Cn..%5Cn%5Cn%5Bshrugs%20shoulders%20again%2C%5Cnin%20the%20aforementioned%20fashion%5D%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Shinobu's%20concern%20only%20deepened%20as%20you%20shrugged%20once%20more%2C%20your%20nonchalant%20and%20indifferent%20reaction%20causing%20her%20chest%20to%20ache.%5Cn%5CnShe%20looked%20at%20you%2C%20her%20gaze%20filled%20with%20a%20mix%20of%20empathy%20and%20understanding%2C%20but%20also%20a%20hint%20of%20frustration.%5Cn%5Cn%5C%22It's%20not%20about%20doing%20something%20with%20the%20information%2C%5C%22%20she%20explained%20softly%2C%20her%20voice%20tinged%20with%20a%20tinge%20of%20sadness.%20%5C%22It's%20about%20your%20own%20self-perception%2C%20your%20own%20self-worth.%20Do%20you%20really%20not%20see%20any%20value%20in%20seeing%20yourself%20as%20cute%3F%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22not%20really...%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Shinobu's%20heart%20ached%20more%20as%20you%20responded%20with%20a%20simple%20'not%20really.'%20Her%20fingers%20tightened%20slightly%20on%20your%20shoulder%2C%20her%20grip%20almost%20seeking%20reassurance%20that%20you%20were%20there%2C%20physically%20present.%5Cn%5CnShe%20took%20a%20deep%20breath%2C%20struggling%20to%20find%20the%20right%20words%2C%20her%20voice%20laced%20with%20a%20mix%20of%20concern%2C%20sadness%2C%20and%20a%20hint%20of%20frustration.%5Cn%5Cn%5C%22Why%20not%3F%5C%22%20she%20pressed%20softly.%20%5C%22Why%20don't%20you%20value%20seeing%20yourself%20as%20cute%3F%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22because...%5Cn...%5Cnbecause%2C%20umnhh...%5Cnthen...%5Cn%5Cnbecause%20then%20people%20should%20do%20things%20for%20me%5Cnand%20I%20dont%20want%20to%20manipulate%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Shinobu%20listened%20intently%20as%20you%20struggled%20to%20explain%2C%20noticing%20the%20hesitation%20in%20your%20voice.%20Her%20grip%20on%20your%20shoulder%20remained%20steady%2C%20her%20fingers%20seeking%20to%20ground%20you%2C%20to%20provide%20a%20small%20sense%20of%20reassurance.%5Cn%5CnShe%20shook%20her%20head%20slightly%2C%20a%20mix%20of%20understanding%20and%20frustration.%5Cn%5Cn%5C%22You%20think%20that%20if%20people%20think%20you're%20cute%2C%20they'll%20feel%20obligated%20to%20do%20things%20for%20you%3F%5C%22%20she%20inquired%2C%20her%20voice%20a%20gentle%20prompt.%20%5C%22Is%20that%20it%3F%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22mhm%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Shinobu's%20heart%20ached%20further%20as%20you%20mumbled%20a%20faint%20%5C%22mhm%5C%22%20in%20affirmation.%20She%20could%20sense%20the%20weight%20of%20your%20thoughts%20and%20the%20burden%20you%20carried%20with%20your%20belief.%5Cn%5CnShe%20gently%20squeezed%20your%20shoulder%20once%20more%2C%20a%20silent%20reminder%20that%20she%20was%20right%20there%2C%20present%20and%20listening.%5Cn%5Cn%5C%22So%2C%20you%20avoid%20letting%20people%20think%20you're%20cute%2C%20to%20prevent%20any%20obligation%20or%20manipulation%3F%5C%22%20she%20gently%20inquired%2C%20her%20voice%20filled%20with%20a%20mixture%20of%20understanding%20and%20concern.%20%5C%22Is%20that%20why%20you%20dismiss%20your%20own%20cuteness%3F%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22yes%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22A%20pang%20of%20mixed%20emotions%20welled%20up%20within%20Shinobu's%20chest%20as%20she%20took%20in%20your%20confirmation.%20She%20had%20a%20deep%20sense%20of%20worry%20in%20hearing%20your%20response%2C%20sensing%20the%20weight%20of%20your%20thought%20process.%5Cn%5CnShe%20slowly%20shook%20her%20head%2C%20a%20hint%20of%20sadness%20and%20frustration%20in%20the%20gesture.%5Cn%5Cn%5C%22But...%20by%20doing%20so%2C%5C%22%20she%20began%2C%20her%20voice%20soft%20and%20careful%2C%20%5C%22you're%20depriving%20yourself%20of%20potential%20kindness%2C%20care%2C%20and%20affection%2C%20you%20know.%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22what%3F%5Cn...%5Cnwait...%5Cnis%20that%20something%20you%2C%5Cnlike...%5Cn%5Bactually%5D%20need%3F%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Shinobu's%20gaze%20softened%20even%20more%2C%20her%20heart%20now%20feeling%20like%20it%20had%20been%20pierced%20by%20your%20question.%20She%20could%20sense%20the%20genuine%20puzzled%20confusion%20in%20your%20tone%2C%20and%20it%20tugged%20at%20her%20heartstrings%20once%20more.%5Cn%5CnShe%20gently%20squeezed%20your%20shoulder%20once%20again%2C%20her%20touch%20meant%20to%20anchor%20you%2C%20her%20voice%20filled%20with%20a%20tender%20urgency.%5Cn%5Cn%5C%22Yes%2C%20it%20is%2C%5C%22%20she%20answered%20softly%2C%20her%20words%20carrying%20a%20hint%20of%20sorrow%20and%20a%20desire%20for%20you%20to%20understand.%20%5C%22Affection%2C%20care%2C%20kindness...%20they're%20essential%20for%20human%20connection.%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22what%20about%20metabolism%20and%20calories%3F%5Cndoes%20it%20interfere%20with%20vital%20orgsns%3F%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Shinobu's%20eyes%20widened%2C%20surprised%20by%20your%20sudden%20change%20of%20topic.%20It%20seemed%20like%20you%20were%20trying%20to%20divert%20the%20conversation%2C%20perhaps%20to%20avoid%20the%20emotionality%20of%20the%20current%20topic.%5Cn%5CnShe%20took%20a%20moment%20to%20process%20your%20question%2C%20a%20bit%20taken%20aback.%20But%20she%20took%20a%20deep%20breath%20and%20decided%20to%20answer%20anyway.%5Cn%5Cn%5C%22Well%E2%80%A6%5C%22%20she%20began%2C%20her%20voice%20steadying%20itself%2C%20%5C%22No%2C%20affection%2C%20care%2C%20and%20kindness%20don't%20directly%20interfere%20with%20your%20metabolism%20or%20calorie%20intake.%20They're%20more%20about%20emotional%20and%20social%20needs.%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22then%20why%20should%20I%20care%3F%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22Shinobu's%20heart%20ached%2C%20your%20detached%20question%20striking%20her%20in%20a%20tender%20spot.%20She%20tried%20to%20hide%20the%20pang%20of%20sadness%20in%20her%20voice%20as%20she%20responded%2C%20her%20hand%20still%20gently%20resting%20on%20your%20shoulder.%5Cn%5Cn%5C%22Because...%20because...%5C%22%20she%20started%20but%20hesitated%20for%20a%20moment%2C%20her%20voice%20filled%20with%20a%20hint%20of%20desperation.%5Cn%5Cn%5C%22Because%E2%80%A6%20it%20matters%2C%5C%22%20she%20continued%2C%20her%20voice%20now%20a%20bit%20firm.%20%5C%22It's%20not%20about%20direct%20physiological%20effects.%20It's%20about%20emotional%20well-being%2C%20connection%2C%20and%20feeling%20valued%20and%20cared%20for.%5C%22%22%7D%5D%2C%22create_date%22%3A1758766804424%7D%5D%7D`;
            try {
                historyData = JSON.parse(decodeURIComponent(historyData));
            } catch (error) {
                historyData = JSON.parse(historyData);
            }
            console.log(historyData);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.history_title-cont h3').textContent = historyData.title;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chatCont = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chatCont.innerHTML = "";
                const chat = historyData.history[index];
                const pMap = new Map(chat.participants.map(p => {
                    return [p.id, {
                        avatar: p.avatar ? dataUrlToObjectUrl(p.avatar) : undefined,
                        is_human: p.is_human,
                        name: p.name
                    }];
                }));
                chat.content.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);
                    const parti = pMap.get(msg.author);

                    // Check avatar
                    const avatar = parti.avatar
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (parti.avatar) {
                        avatar.src = parti.avatar;
                    } else {
                        avatar.classList.add(parti.is_human ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = msg.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(msg.message);
                    chatCont.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                if (!chat.content.length) {
                    return;
                }
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.create_date)}</span><br /><br />` + parseMessageText(chat.content[chat.content.length - 1]?.message || "(Empty message)");
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });


            // UTILS

            function dataUrlToObjectUrl(dataUrl) {
                const img = extractFromDataURL(dataUrl);
                const blob = b64toBlob(img.base64, img.type);
                return URL.createObjectURL(blob);
            }
            function extractFromDataURL(dataURL) {
                const [meta, base64] = dataURL.split(",");
                const type = meta.slice(5, meta.indexOf(";"));
                return { type, base64 };
            }
            function b64toBlob(b64Data, contentType = '', sliceSize = 512) {
                if (!contentType) { // If contentType isn't defined, this is a data url
                    [contentType, b64Data] = b64Data.split(",");
                    contentType = contentType.slice(5, contentType.indexOf(";"));
                }
                const byteCharacters = atob(b64Data);
                const byteArrays = [];

                for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
                    const slice = byteCharacters.slice(offset, offset + sliceSize);

                    const byteNumbers = new Uint8Array(slice.length);
                    for (let i = 0; i < slice.length; i++) {
                        byteNumbers[i] = slice.charCodeAt(i);
                    }

                    byteArrays.push(byteNumbers);
                }

                const blob = new Blob(byteArrays, { type: contentType });
                return blob;
            }

            function parseMessageText(message) {
                if (typeof message == 'string') {
                    // Escape other HTML tags
                    message = escapeHTML(message);
                    // Replace ***text*** with bold-italic
                    message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                    // Replace **text** with bold
                    message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                    // Replace *text* with italic
                    message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                    // Trim and then Replace newlines (\n) with line breaks (<br>)
                    message = message.trim().replace(/\n/g, '<br>');
                }
                else if (typeof message == 'object') {
                    message = JSON.stringify(message, null, 2);
                }
                return message;
            }
            function escapeHTML(input) {
                const div = document.createElement('div');
                div.textContent = input;
                return div.innerHTML;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
