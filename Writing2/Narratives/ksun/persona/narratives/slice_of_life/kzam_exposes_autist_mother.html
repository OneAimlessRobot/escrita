<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1.1rem;
            cursor: pointer;
            background-color: #4e9733;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .nav-new_char-btn:hover {
            background-color: #6ba755;
        }*/

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

        /*nav .char-item {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            transition: background-color 0.1s ease-in-out;
            padding: 10px 40px 10px 20px;
            cursor: pointer;
        }

        nav .char-item:hover {
            background-color: var(--rgba-1);
        }

        nav .nav-avatar-wrap {
            width: 40px;
            height: 40px;
        }

        nav .nav-avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        nav .char-item span {
            font-size: 1.3rem;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }*/

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        /*.update_current_char-btn {
            margin-left: auto;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1rem;
            align-self: center;
            cursor: pointer;
            background-color: #336c97;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .update_current_char-btn:hover {
            background-color: #5f829d;
        }*/

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .history_title-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .history_title-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })


            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

to%20avoid%20laughing*%20%5C%22oh%20god%2C%20you're%20killing%20me%E2%80%A6.%5C%22%20*he%20said%20with%20a%20small%20chuckle%20still%20in%20his%20voice*%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22oh--%5Cnwe%20arrived%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Deku%20looked%20up%2C%20realizing%20that%20they've%20arrived%20at%20the%20dorms%20while%20he%20was%20preoccupied%20imagining%20what%20ksun-Ayanami's%20mom%20was%20like*%5Cn%5Cn*he%20felt%20kind%20of%20bad%20that%20they%20basically%20ignored%20Onizuka%20the%20entire%20way%20here%2C%20but%20decided%20he%20would%20apologize%20to%20her%20later*%5Cn%5Cn%5C%22Oh-%20yeah.%20Guess%20we%20have.%20We're%20here%5C%22%20*he%20said%20absent-mindedly%2C%20as%20they%20approached%20the%20entrance%20to%20the%20dorms*%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22Wow.%5CnI%20finally%20get%20to%20go%20to%20my%20room.%5CnGoodnight!%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Deku%20snapped%20out%20of%20his%20thoughts%2C%20and%20chuckled%20a%20little%20shyly*%20%5C%22yeah.%20It%20is%20pretty%20late%20now..%20goodnight.%5C%22%5Cn*he%20said%2C%20starting%20to%20head%20into%20the%20dorms*%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22%5BAs%20I%20went%20to%20the%20dorms%2C%5Cnsleep%20is%20the%20last%20thing%20I%20thought%20about%20doing.%5CnI%20locked%20the%20door%20to%20my%20dorm%20shut.%5CnAizawa%20could%20lick%20mine%20for%20all%20I%20cared.%5CnI%20was%20gonna%20play%20all%20%23%26%26%23ing%20night!%5CnSo.%5Cn%5CnI%20booted%20up%20my%20computer%2C%5Cnwired%20off%20my%20speakers%5Cnand%20in%20went%20my%20headphones.%5CnLaying%20them%20on%20the%20desk%2C%5CnI%20then%20went%20to%20close%20my%20shutters%2C%5Cnmy%20windows--%5Cnand--%5Cn%5C%22wooooohhh!!%5Cnits%20alive!%5Cnthe%20computer%20is%20alive!%5CnLets%20boot%20this%20shit%20up%20and%20gets%20started!%5C%22%5Cn%5CnI%20launched%20steam%2C%5Cnproceeding%20to%20select%20something%20to%20play.%5Cnsomething%20refined%2C%5Cnadequate%20for%20subtlety%2C%5Cnintellect%5Cnand%20composure.%5Cn%5CnMitos.is%3A%20The%20Cell%20Eating%20game!%5Cn%5CnAn...%5CnAgario%20clone%20for%20steam%2C%20basically.%5Cn%5CnI%20poured%20so%20much%20of%20my%20scholarship%20into%20buying%20gear%20for%20this%20game%20that%20it%20is%20not%20even%20funny!%5Cn%5CnAnd%20the%20best%20part%2C%5Cnis%20that%20the%20developers%20constantly%20nerfed%20and%20made%20old%20gear%20worse%5Cnwhile%20also%20making%20sure%20the%20most%20recent%20gear%20was%20always%20the%20most%20viable%20and%2C%5Cnimportantly%2C%5Cnmost%20%5Bexpsnsive%5D%20option.%5Cn%5Cnwhat%20a%20sickeningly%20money%20grubbing%20game.%5Cn%5Cnif%20my%20mother%20knew%20what%20was%20going%20on%20she%20was%20gonna%5Cnkill~%5Cnmeeew~!!!%5Cnbut%20who%20cares%20about%20that%20special%20woman!%5CnIm%20posplitting%20these%20bozoa%20at%202%20am%20and--%5Cn%5Cnknocking%3F%5Cnoh%20no.%5Cndid%20I%20make%20noise%2C%20again%3F!%5CnOhh...%5CnI%20really%20hope%20it%20was%20not%20Aizawa!%5Cn%5CnAnyways%2C%5CnI%20got%20off%20of%20my%20seat%2C%5Cnlaying%20down%20my%20headphones%2C%5Cnand%20quietly%20unlocking%20the%20door%20to%20see%20who%20it%20was%5D%5Cn%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Deku%20had%20just%20laid%20down%20in%20his%20bed%2C%20about%20to%20start%20falling%20asleep%20when%20he%20heard%20the%20distant%20sound%20of%20knocking.%20He%20sat%20up%2C%20listening.%20The%20knock%20came%20again%2C%20a%20little%20louder%20this%20time*%5Cn%5Cn*he%20sighed%20and%20sat%20up*%20%5C%22who%20the%20hell%20is%20knocking%20at%20this%20hour%E2%80%A6%5C%22%20*he%20murmured%20to%20himself%2C%20getting%20out%20of%20bed%20and%20shuffling%20to%20the%20door%20to%20open%20it*%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Deku%20opened%20the%20door%2C%20rubbing%20his%20tired%20eyes%20as%20he%20did%20so*%20%5C%22who%20the%20hell%20is-..%5C%22%20*he%20started%2C%20but%20stopped%20in%20his%20tracks%20when%20he%20saw%20who%20was%20actually%20behind%20the%20door*%5Cn%5Cn*He%20blinked%2C%20a%20little%20confused.%20He%20honestly%20wasn't%20expecting%20to%20see%20Onizuka%20of%20all%20people%20outside%20his%20door%20at%20this%20hour*%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22%5C%22Onizuka%3F..%5C%22%20*he%20said%2C%20still%20a%20little%20surprised%20as%20he%20looked%20at%20her*%20%5C%22what...%20what%20are%20you%20doing%20here%3F%20Isn't%20it%20pretty%20late%3F..%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22hey!%5Cndid%20you%20knock%20here%20too%3F%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Deku%20shook%20his%20head%2C%20still%20a%20little%20confused*%20%5C%22no%2C%20I%20didn't.%20I%20thought%20you%20did..%5C%22%5Cn%5Cn*he%20paused%2C%20then%20asked*%20%5C%22wait%2C%20were%20you%20not%20the%20one%20knocking%20at%20my%20door%3F%20Then%20who%20the%20hell%20was%20it%3F..%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22onizuka!%5CnYou%20scared%20the%20shit%20out%20of%20me.%5Cngo%20to%20sleep!%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Deku%20rubbed%20his%20eyes%20again%2C%20starting%20to%20feel%20a%20little%20irritated*%20%5C%22yeah%20yeah%2C%20I'll%20go%20back%20to%20sleep%20soon...%5C%22%5Cn%5Cn*he%20paused%2C%20and%20then%20added*%20%5C%22why%20are%20you%20still%20awake%20anyway%3F%20It's%20practically%202%20in%20the%20morning..%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22%5Blying%5D%5Cnwell%2C%5CnMaybe%20I%20wasnt%20awake.%5Cnwho%20knocked%3F%5CnIt%20certainly%20was%20not%20me%2C%20was%20it%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Deku%20was%20not%20falling%20for%20her%20answer.%20He%20saw%20right%20through%20her%20lie%2C%20not%20being%20fooled%20so%20easily*%5Cn%5Cn%5C%22Oh%20really%3F%5C%22%20*he%20said%2C%20crossing%20his%20arms%20and%20raising%20a%20slight%20eyebrow*%20%5C%22then%20who%20was%20knocking%3F%20Someone%20has%20to%20have%20been.%5C%22%22%7D%5D%2C%22create_date%22%3A1764895460050%7D%5D%7D`;
            try {
                historyData = JSON.parse(decodeURIComponent(historyData));
            } catch (error) {
                historyData = JSON.parse(historyData);
            }
            console.log(historyData);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.history_title-cont h3').textContent = historyData.title;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chatCont = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chatCont.innerHTML = "";
                const chat = historyData.history[index];
                const pMap = new Map(chat.participants.map(p => {
                    return [p.id, {
                        avatar: p.avatar ? dataUrlToObjectUrl(p.avatar) : undefined,
                        is_human: p.is_human,
                        name: p.name
                    }];
                }));
                chat.content.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);
                    const parti = pMap.get(msg.author);

                    // Check avatar
                    const avatar = parti.avatar
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (parti.avatar) {
                        avatar.src = parti.avatar;
                    } else {
                        avatar.classList.add(parti.is_human ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = parti.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(msg.message);
                    chatCont.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                if (!chat.content.length) {
                    return;
                }
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.create_date)}</span><br /><br />` + parseMessageText(chat.content[chat.content.length - 1]?.message || "(Empty message)");
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });


            // UTILS

            function dataUrlToObjectUrl(dataUrl) {
                const img = extractFromDataURL(dataUrl);
                const blob = b64toBlob(img.base64, img.type);
                return URL.createObjectURL(blob);
            }
            function extractFromDataURL(dataURL) {
                const [meta, base64] = dataURL.split(",");
                const type = meta.slice(5, meta.indexOf(";"));
                return { type, base64 };
            }
            function b64toBlob(b64Data, contentType = '', sliceSize = 512) {
                if (!contentType) { // If contentType isn't defined, this is a data url
                    [contentType, b64Data] = b64Data.split(",");
                    contentType = contentType.slice(5, contentType.indexOf(";"));
                }
                const byteCharacters = atob(b64Data);
                const byteArrays = [];

                for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
                    const slice = byteCharacters.slice(offset, offset + sliceSize);

                    const byteNumbers = new Uint8Array(slice.length);
                    for (let i = 0; i < slice.length; i++) {
                        byteNumbers[i] = slice.charCodeAt(i);
                    }

                    byteArrays.push(byteNumbers);
                }

                const blob = new Blob(byteArrays, { type: contentType });
                return blob;
            }

            function parseMessageText(message) {
                if (typeof message == 'string') {
                    // Escape other HTML tags
                    message = escapeHTML(message);
                    // Replace ***text*** with bold-italic
                    message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                    // Replace **text** with bold
                    message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                    // Replace *text* with italic
                    message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                    // Trim and then Replace newlines (\n) with line breaks (<br>)
                    message = message.trim().replace(/\n/g, '<br>');
                }
                else if (typeof message == 'object') {
                    message = JSON.stringify(message, null, 2);
                }
                return message;
            }
            function escapeHTML(input) {
                const div = document.createElement('div');
                div.textContent = input;
                return div.innerHTML;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
