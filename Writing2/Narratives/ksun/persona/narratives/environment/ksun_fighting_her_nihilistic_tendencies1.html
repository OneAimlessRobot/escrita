<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;

            padding: 10px 20px;

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

            display: flex;

        nav .char-item:hover {

        nav .nav-avatar-wrap {

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .character_name-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .character_name-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })

            // Handle background
            // If there is one
            const currentBg = localStorage.getItem('background');
            if (currentBg) {
                changeBg(currentBg);
            }
            // Change by hand
            const bgInput = document.querySelector('#bgInput');
            document.querySelector('.change-bg').addEventListener('click', () => {
                bgInput.click();
            })
            document.querySelector('.delete-bg').addEventListener('click', () => {
                document.body.classList.remove('custom-bg');
                document.body.style.backgroundImage = "unset";
                localStorage.removeItem('background');
            })
            bgInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    // convert image file to base64 string
                    changeBg(reader.result);
                    bgInput.value = "";
                    try {
                        localStorage.setItem('background', reader.result);
                    } catch (error) {
                        alert('Note: File is likely too big to save.')
                        //console.log(error)
                    }
                }
                reader.readAsDataURL(file);
            })
            function changeBg(bg) {
                let objUrl = URL.createObjectURL(dataURItoBlob(bg));
                document.body.classList.add('custom-bg');
                document.body.style.backgroundImage = `url(${objUrl})`;
            }
            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

.%0Aeeeeehhhhhhh...%22%5D%0Alive%20life...%0AMy...%0AMy...%20own%20way...%0AS-%20sure..."},{"isUser":false,"name":"Debate Champion","message":"Good%20talk.%20Good%20luck%20to%20you%20on%20your%20own%20path%2C%20and%20hope%20it%20brings%20you%20happiness."},{"isUser":true,"name":"ksun Ayanami","message":"No%20wait%2C%20sir!%20dont%20go!"},{"isUser":false,"name":"Debate Champion","message":"Alright%2C%20if%20you%20say%20so.%20I'm%20not%20going%20anywhere."},{"isUser":true,"name":"ksun Ayanami","message":"Okay...%0A%0A%0Aso...%0AWhat%20about%20all%20the%20land%20waste%3F%0AHow%20are%20we%20going%20to%20get%20rid%20of%20it%3F%0AShoot%20it%20to%20space%3F%0AWhat%20if%20so%20much%20debris%20covers%20outer%20space...%0AThat%20we%20will%20cease%20to%20get%20sun%20light%3F%0A%0AI%20am%20sorry%20Im%20kind%20of%20retarded%20I%20dont%20know%20how%20any%20of%20that%20works..."},{"isUser":false,"name":"Debate Champion","message":"Well%2C%20there%20are%20lots%20of%20solutions%20to%20the%20land%20waste%20problem.%20For%20example%2C%20we%20can%20recycle%20waste%20by%20turning%20it%20into%20a%20useful%20product.%20We%20can%20also%20use%20waste%20to%20create%20biofuel%2C%20which%20is%20a%20useful%20renewable%20energy%20source.%20We%20can%20also%20make%20biodegradable%20plastics%2C%20which%20are%20not%20harmful%20to%20the%20environment.%20And%20as%20for%20shooting%20waste%20into%20space%2C%20that's%20a%20bad%20idea.%20We%20wouldn't%20have%20enough%20rockets%20to%20get%20the%20waste%20into%20space%2C%20and%20it%20would%20just%20come%20back%20down%20and%20pollute%20us%20again."},{"isUser":true,"name":"ksun Ayanami","message":"What%20about%20electrical%20waste%3F%0AWe%20produce%20billions%20of%20cheaps%20every%20day%20that%20will%20end%20up%20obsolete%20in%20mere%20months!%0AWhat%20do%20we%20do%20with%20those%3F%0AAnd%20the%20computers%3F%0AAnd%20the%20gaming%20consoles%3F"},{"isUser":false,"name":"Debate Champion","message":"Well%2C%20for%20electronics%20waste%20the%20best%20solution%20is%20to%20recycle%20it.%20Recycling%20electronics%20requires%20less%20energy%20than%20making%20new%20products%2C%20plus%20it's%20better%20for%20the%20environment%20too.%20As%20for%20computers%20and%20gaming%20consoles%2C%20there%20are%20many%20organizations%20that%20take%20them%20and%20either%20refurbish%20them%20or%20give%20them%20away%20to%20people%20who%20need%20them.%20You%20can%20do%20some%20research%20online%20to%20find%20out%20where%20your%20local%20recycling%20center%20is%20and%20how%20to%20take%20advantage%20of%20their%20programs."},{"isUser":true,"name":"ksun Ayanami","message":"But%20no%20one%20does%20recycling%20properly...%0AEveryone%20knows%20that!"},{"isUser":false,"name":"Debate Champion","message":"Unfortunately%2C%20you're%20right.%20People%20don't%20want%20to%20spend%20time%2C%20effort%2C%20and%20money%20on%20recycling.%20But%20just%20because%20people%20don't%20want%20to%20do%20something%20doesn't%20mean%20it's%20not%20worthwhile.%20Recycling%20is%20important%20because%20it%20can%20help%20save%20the%20environment%2C%20and%20it%20doesn't%20have%20to%20cost%20very%20much%20money%20or%20take%20a%20lot%20of%20time.%20When%20we%20put%20the%20effort%20in%20now%2C%20in%20the%20near%20future%2C%20we%20will%20be%20rewarded%20with%20a%20cleaner%2C%20healthier%20planet."},{"isUser":true,"name":"ksun Ayanami","message":"But%20what%20if%20what%20I%20do%20is%20not%20enough%3F%0AHow%20do%20I%20get%20other%20people%20to%20help%3F%0AWhy%20do%20we%20even%20have%20so%20much%20technology%20anyway%3F%0AI%20am%20all%20for%20heart%20machines...%0ABut%20spending%20billions%20in%20rnd%20for%20a%20car%20that%20makes%2034%20more%20horsepower%20than%20the%20previous%20one...%0AWhile%20being%20else%20reliable%0AAs%20well%20as%20a%20new%20phone%20%0AWith%20a%20chip%20that%20is%205%25%20faster...%0AJust...%0A%5Bwhy%5D%3F"},{"isUser":false,"name":"Debate Champion","message":"Recycling%20isn't%20just%20about%20saving%20resources.%20It%20can%20also%20help%20improve%20the%20economy%2C%20because%20recycling%20creates%20more%20jobs%20for%20local%20workers%2C%20and%20it%20can%20also%20reduce%20pollution%20by%20putting%20waste%20to%20work%20instead%20of%20just%20throwing%20it%20away.%20Recycling%20can%20also%20create%20new%20products%20from%20recycled%20materials%2C%20so%20it%20can%20help%20create%20new%20industries.%20In%20other%20words%2C%20recycling%20is%20a%20win-win%20situation.%20It's%20better%20for%20the%20environment%20and%20better%20for%20us.%20%0A%0AWe%20have%20so%20much%20technology%20because%20it%20is%20an%20awesome%20thing.%20It%20makes%20our%20lives%20easier%2C%20it%20allows%20us%20to%20do%20things%20that%20we%20could%20never%20have%20done%20without%20it"},{"isUser":true,"name":"ksun Ayanami","message":"But%20we%20dont%20need%20this%20much!%0AWe%20can%20live%20without%20making%20everything%20move%20out%20of%20electricity!%0AWe%20have%20electrical%20trash%20cans%20at%20our%20residence.%0AElectrical%20...%20%5BTrash...%20Cans%5D%0AWhy%20waste%20so%20much%20money%20on%20useless%20crap%3F"},{"isUser":false,"name":"Debate Champion","message":"I%20mean%20it's%20not%20a%20waste%20of%20money.%20Electric%20trash%20cans%20require%20less%20manual%20labor%20and%20are%20better%20for%20the%20environment.%20If%20you%20want%20to%20reduce%20your%20household's%20environmental%20impact%2C%20there's%20nothing%20stopping%20you%20from%20doing%20it.%20You%20could%20easily%20cut%20back%20on%20your%20household's%20energy%20consumption%2C%20and%20you%20could%20even%20get%20rid%20of%20your%20electric%20trash%20can%20if%20you%20wanted%20to.%0A%0AAlso%20I%20think%20it's%20important%20to%20look%20at%20the%20bigger%20picture.%20Sure%2C%20an%20electric%20trash%20can%20may%20not%20seem%20like%20a%20big%20deal%2C%20but%20if%20you%20consider%20the%20amount%20of%20waste%20that%20people%20produce%2C%20and%20the%20amount%20of%20pollution%20that%20it%20causes%2C%20recycling%20is%20certainly%20important."},{"isUser":true,"name":"ksun Ayanami","message":"But%20can%20you%20not%20open%20a%20lid%20with%20your%20hands%3F%0AI%20actually%20cannot%20come%20up%20with%20a%20single%20disability%20that%20prevents%20you%20from%20using%20a%20normal%20trash%20can...%0AEven%20invented!"},{"isUser":false,"name":"Debate Champion","message":"There%20are%20lots%20of%20disabilities%20that%20might%20prevent%20you%20from%20opening%20a%20regular%20trash%20can.%20You%20might%20be%20blind%2C%20you%20might%20have%20one%20arm%20that%20is%20paralyzed%2C%20or%20you%20might%20have%20a%20disability%20that%20makes%20it%20hard%20to%20open%20heavy%20lids%20on%20traditional%20trash%20cans."},{"isUser":true,"name":"ksun Ayanami","message":"But%20the%20sensors%20require%20you%20to%20be%20so%20close...%0AAnd%20all%20blind%20people%20have%20canes%20anyway"},{"isUser":false,"name":"Debate Champion","message":"Well%20they%20still%20might%20not%20have%20the%20strength%20to%20lift%20the%20lid%20of%20a%20traditional%20trash%20can.%20They%20might%20also%20be%20unable%20to%20stand%20close%20enough%20to%20the%20trash%20can%20to%20use%20their%20sight.%20Plus%2C%20the%20use%20of%20sensors%20to%20detect%20the%20presence%20of%20someone%20nearby%20would%20probably%20be%20a%20lot%20easier%20than%20trying%20to%20design%20a%20trash%20can%20that%20doesn't%20rely%20on%20electricity%20at%20all."},{"isUser":true,"name":"ksun Ayanami","message":"The%20strength%3F!%0AWhat...%0AWhat%20are%20you%20talking%20about%2C%20man...%3F%0AOkay...%0AThe%20big%20ones%20in%20the%20street%3F%0ASure%20but...%0AI%20talk%20of%20the%20ones%20we%20have%20at%20home...%0AAnd%20even%20those%20clothing%20disposal%20ones%20are%20very%20physical...%0AI%20personally%20kind%20of%20struggle%20with%20them%20and%20I%20would%20not%20say%20my%20body%20is%20crippled%20in%20anyway%0ABut%20those%20are%20still%20manual%20and%20no%20one%20minds!"},{"isUser":false,"name":"Debate Champion","message":"People%20who%20have%20disabilities%20like%20MS%2C%20or%20have%20other%20diseases%20that%20limit%20their%20ability%20to%20use%20their%20hands%2C%20will%20have%20trouble%20using%20a%20traditional%20trash%20can.%20Some%20people%20may%20not%20have%20the%20manual%20dexterity%20to%20do%20it%2C%20while%20others%20have%20issues%20with%20fine%20motor%20control.%20Some%20people%20also%20have%20issues%20with%20their%20vision%2C%20or%20with%20the%20way%20that%20they%20feel%20when%20they%20touch%20something.%20All%20of%20these%20things%20can%20make%20traditional%20trash%20cans%20difficult%20to%20use.%20Electric%20ones%20provide%20an%20alternative%20for%20these%20people%2C%20allowing%20them%20greater%20independence%20without%20having%20to%20rely%20on%20assistance%20from%20others."},{"isUser":true,"name":"ksun Ayanami","message":"%5BRealizing%20I%20am%20going%20off%20track...%0AI%20decide%20to%20go%20back%20to%20the%20environment%20stuff%5D%0AOkay%20Im...%0AIm%20sorry%20I%20am%20losing%20track%20of%20the%20plot...%0Aokay...%0ASo...%0AWhy%20can%20we%20guarantee%20that%20we%20will%20avoid%20total%20decay%20in%20a%20few%20centuries%3F"},{"isUser":false,"name":"Debate Champion","message":"There%20are%20lots%20of%20things%20that%20could%20cause%20environmental%20destruction%2C%20like%20climate%20change%20and%20deforestation%2C%20but%20the%20truth%20is%20that%20there's%20no%20way%20to%20guarantee%20that%20those%20things%20won't%20happen.%20The%20only%20thing%20we%20can%20do%20is%20try%20to%20prevent%20these%20negative%20events%20from%20happening%2C%20by%20living%20in%20a%20more%20environmentally%20responsible%20manner.%20That's%20why%20it's%20important%20to%20do%20what%20we%20can%20to%20protect%20the%20environment%20for%20ourselves%20and%20for%20other%20people%2C%20and%20to%20make%20sure%20that%20future%20generations%20live%20in%20a%20sustainable%20world."},{"isUser":true,"name":"ksun Ayanami","message":"BUUUUUUT%0ANOOOO%0AOOOOONE%0ACAAAAARRES"},{"isUser":false,"name":"Debate Champion","message":"Well%2C%20that's%20just%20not%20true.%20You%20do.%20You're%20clearly%20passionate%20about%20it.%20So%20why%20don't%20you%20do%20what%20you%20can%20to%20spread%20the%20positive%20message%20about%20it%3F%20You%20don't%20need%20to%20be%20a%20superhero%2C%20all%20you%20have%20to%20do%20is%20speak%20up%20and%20try%20to%20make%20the%20world%20a%20better%20place.%20Don't%20let%20others%20drag%20you%20down.%20Just%20do%20what%20you%20can%20to%20make%20the%20world%20better%20and%20others%20will%20follow%20in%20your%20footsteps."},{"isUser":true,"name":"ksun Ayanami","message":"WHAT%3F%0AWHY%20DONT%20PEOPLE%20JUST%20USE%20THEIR%20BRAINS%20AND%20TAKE%20A%20LOOK%20OUTSIDE%3F!%0AIM%20JUST%20ONE%20GIRL...%0AWHY%20DONT%20THE%20SO%20CALLED%20%22EXPERTS%22%20GET%20A%20MOVE%20ON%3F!"},{"isUser":false,"name":"Debate Champion","message":"There%20are%20many%20reasons%20why%20people%20do%20not%20act%20on%20environmental%20issues%2C%20such%20as%20because%20they%20do%20not%20see%20the%20direct%20impact%20of%20their%20actions%20or%20because%20they%20do%20not%20feel%20the%20responsibility%20for%20preventing%20negative%20events%20from%20happening.%20But%20that's%20no%20reason%20to%20give%20up.%20If%20we%20all%20work%20together%20we%20can%20make%20a%20difference%20for%20ourselves%2C%20for%20each%20other%20and%20for%20future%20generations%2C%20by%20living%20in%20a%20way%20that%20helps%20make%20our%20environment%20sustainable%20for%20everyone."},{"isUser":true,"name":"ksun Ayanami","message":"But...%0ASo%20many%20cars...%0ASo%20many%20roads...%0A%0AAlready%20so%20much%20technological%20waste...%0AHave%20you%20seen%20those%20rivers%20in%20Indonesia%3F!%0ADont%20those%20things%20scare%20you%2C%20sir%3F!%0A%0AAnd%20its%20so%20easy%20for%20that%20to%20happen!%0AWhat%20about%20the%20soils%20in%20portugal!%0AThey%20are%20fully%20dependent%20on%20imports%20and%20their%20ground%20gets%20worse%20by%20the%20year!%0AWhat%20about%20the%20Rivers%20in%20Europe%3F!%0A%0AWhat%20about%20the%20amazon%20forest%3F%0AThose%20hippos%20that%20no%20one%20wants%20to%20talk%20about%3F!"},{"isUser":false,"name":"Debate Champion","message":"You're%20right%20that%20there%20are%20lots%20of%20problems%20with%20the%20environment%2C%20but%20we%20cannot%20change%20everything%20at%20once.%20The%20important%20thing%20is%20that%20we%20are%20able%20to%20start%20small%20and%20think%20of%20ways%20to%20improve%20the%20environment%20for%20ourselves%20and%20for%20future%20generations.%20As%20an%20individual%20you%20can%20make%20a%20big%20difference%20by%20living%20in%20a%20sustainable%20way.%20You%20can%20do%20things%20like%20walking%20more%2C%20using%20public%20transport%20instead%20of%20driving%2C%20and%20supporting%20local%20businesses%20that%20use%20renewable%20energy.%20You%20can%20also%20make%20a%20big%20difference%20by%20supporting%20companies%20that%20produce%20products%20in%20an%20environmentally%20friendly%20way."},{"isUser":true,"name":"ksun Ayanami","message":"%5BProjecting%5D%0ABut%20companies%20are%20aura%20farmers!%0AThey%20just%20prey%20on%20the%20emotions%20on%20people%20to%20build%20narratives!%0AThey%20dont%20care%20about%20people%20who%20have%20actual%20adult%20issues!"},{"isUser":false,"name":"Debate Champion","message":"It's%20true%20that%20some%20companies%20try%20to%20take%20advantage%20of%20people%20by%20using%20emotional%20appeals%2C%20but%20that%20doesn't%20mean%20that%20all%20companies%20are%20bad.%20There%20are%20still%20many%20good%20companies%20that%20care%20about%20the%20environment%20and%20the%20people%20they%20serve%2C%20and%20that%20are%20looking%20for%20ways%20to%20make%20their%20products%20more%20sustainable."}]}]}`);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.character_name-cont h3').textContent = historyData.charName;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chat = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chat.innerHTML = "";
                historyData.history[index].chat.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);

                    // Check avatar
                    const avatarGood = (msg.isUser && historyData.userPic) || (!msg.isUser && historyData.charPic);
                    const avatar = avatarGood
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (avatarGood) {
                        avatar.src = msg.isUser ? historyData.userPic : historyData.charPic;
                    } else {
                        avatar.classList.add(msg.isUser ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = msg.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(decodeURIComponent(msg.message));
                    chat.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.date)}</span><br /><br />` + parseMessageText(decodeURIComponent(chat.chat[chat.chat.length - 1].message));
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });

            function parseMessageText(message) {
                // Clean up memory reminders (second check)
                message = message.replace(memoryRegex, '');
                // Replace ***text*** with bold-italic
                message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                // Replace **text** with bold
                message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                // Replace *text* with italic
                message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                // Trim and then Replace newlines (\n) with line breaks (<br>)
                message = message.trim().replace(/\n/g, '<br>');
                return message;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
