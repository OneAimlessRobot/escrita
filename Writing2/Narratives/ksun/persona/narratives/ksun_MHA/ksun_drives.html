<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

        nav .char-item:hover {

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .history_title-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .history_title-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })


            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

t%20much%20in%20the%20way%20of%20traffic%2C%5Cn%5Cngoing%20%5Bway%5D%20to%20the%20left%20before%20turning%20in%2C%5Cntrying%20to%20force%20the%20corner%20to%20feel%20conventional%20but%20she%20does%20not%20need%20so%20much%20road%20space!%5Cn%5CnIts%20wasteful%20but%20she%20keeps%20going%2C%5CnTurns%20to%20the%20right%2C%5Cntightens%3B%5Cntightens%2C%5CnAnd%20now%2C%5Cnfor%20the%20main%20dish%3A%5Cn%5CnA%20full%20lap%20on%20fuji%20circuit%20completed%20on%20the%20first%20practice%20session%20of%20this%20event!%5CnShe%20now%20powers%20through%20the%20straight!%5Cn1st%20gear!%5Cn...%5CnSecond!%5Cn%5Cn...%5Cn%5Cnthird!%5Cn%5CnAND%20JUST%20LOOK%20AT%20THAT!%5Cn%5CnThe%20car%20flies%20by%20ROARING%20at%20REDLINE%20AND%20OVER%20three%20hundred%20and%20FORTY%20Kilometers%20per%20hour%2C%5CnZipping%20past%20the%20pit%20lane!%5Cn%5Cn%5D%5Cn%5Cn%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Lady%20Nagant%20was%20completely%20in%20awe%2C%20watching%20with%20bated%20breath%20as%20ksun%20navigated%20the%20track%20with%20surprising%20speed%20and%20determination.%20She%20let%20out%20a%20low%20whistle%2C%20clearly%20impressed%20by%20the%20display.*%5Cn%5Cn%5C%22Damn...%5C%22%20*She%20muttered%2C%20her%20eyes%20wide.*%20%5C%22She%20may%20not%20be%20the%20most%20experienced%2C%20but%20she's%20damn%20good%20at%20adapting%20fast.%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22%5Bksun%2C%5Cnthinking%3A%20%5C%22Gahh...%5CnHah....%5Cn%5CnOkay%2C%20calm...%5CnDown.%5Cn%5Cn%5C%22%5Cn%5Bher%20heartrate%20soaring%20now%20at%20180%20beats%20per%20minute%2C%5CnShe%20is%20stressed%20in%20the%20car!%5Cnits%20not%20looking%20good...%5D%5Cn%5Cn%5C%22Okay%2C%20concentrate.%5Cn%5CnThere%20is%20that%20braking%20marker.%5CnLets%20try...%5Cn%5Cnbefore%20the%20first%20bollard!%5C%22%5Cn%5Cn%5BAs%20she%20does%2C%5Cnthe%20brakes%20end%20up%20being%20a%20bit%20more%20capable%20than%20she%20is%20expecting%2C%5CnEnding%20up%20substantially%20under%20the%20limit%20before%20turning%20in%2C%5CnBut%20gaining%20tact%20over%20the%20driving%5D%5Cn%5Cn%5C%22Okay%2C%5Cn%5CnThis%20is%20not%20so%20bad%2C%5CnLets%20keep%20it%20steady%5C%22%5Cn%5BShe%20says%2C%5CnAs%20she%20then%20passes%20by%20a%20GTE%20porsche%20car%2C%5CnAiming%20to%20clear%20the%20backmarker%20cleanly.%5Cn%5CnShe%20approaches%20turn%20three%2C%5Cnbraking%20a%20bit%20too%20late%2C%5CnWhich%20is%20okay%2C%5CnAs%20this%20was%20by%20far%20her%20best%20shot%20at%20turn%20three%2C%5Cnmanaging%20to%20clear%20the%20marker%20by%20going%20down%20the%20inside%2C%5CnAs%20these%20slower%20cars%20are%20forced%20to%20give%20way%20to%20faster%20classes%20to%20avoid%20clashing.%5Cn%5CnThis%20porsche%20being%20the%20current%20third%20from%20pole%20at%20their%20respective%20class%5D%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Lady%20nagant%20was%20completely%20immersed%20in%20the%20action%2C%20hanging%20onto%20every%20word%20and%20movement%20she%20saw%20on%20the%20screen.*%5Cn%5Cn%5C%22Oh%20man-%5C%22%20*She%20muttered%2C%20a%20hint%20of%20worry%20in%20her%20tone.%20She%20could%20clearly%20see%20that%20ksun%20was%20struggling%20to%20adapt%20and%20her%20heart%20rate%20was%20sky%20high.*%5Cn%5Cn%5C%22She%20needs%20to%20calm%20down.%20Her%20heartrate%20is%20way%20too%20high%20for%20this...%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22Kafka%3A%20%5C%22This%20is%20normal.%5Cnthese%20cars%20are%20monsters%20to%20control.%5CnI%20mean...%5CnYou%20would%20not%20know%20much%20about%20driving%2C%5CnI%20mean...%5CnYour%20arm%20is%20a%20literal%20gun%5Cn%5Bthe%20scout%20snorts%2C%5CnQuipping%20at%20your%20anatomy%20to%20lighten%20the%20mood%5D%5C%22%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Lady%20nagant%20chuckled%20softly%2C%20a%20tinge%20of%20annoyance%20at%20Kafka's%20joke.%20She%20rolled%20her%20eyes%20slightly%20but%20couldn't%20help%20the%20small%20smile%20on%20her%20face.*%5Cn%5Cn%5C%22Yeah%2C%20hilarious...%5C%22%20*She%20retorted%2C%20though%20there%20was%20a%20hint%20of%20amusement%20in%20her%20voice.*%20%5C%22And%20for%20your%20information%2C%20I%20do%20know%20a%20thing%20or%20two%20about%20driving%2C%20thank%20you%20very%20much.*%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22%5Bksun%20has%20just%20made%20her%20way%20through%20dunlop%2C%5CnManaging%20to%20get%20her%20first%20taste%20of%20what%20%5BREAL%5D%20downforce%20actually%20feels%20like%2C%5Cn...%5CnAs%20she%20holds%20onto%20her%20speed%2C%5Cnbraking%20%5Blate%5D%20into%20the%20corner%2C%5CnAnd%2C%5Cnthis%20time%2C%5CnAlmost%20locking%20the%20rear%20tires!%5CnShe%20turns%20the%20wheel%2C%5CnAccelerating%20early%2C%5Cntrickling%20downhill%20towards%20the%20only%20chicane%20in%20the%20track%20as%20she%20passes%20by...%5CnThe%20number%2023%20GlickenHaus%3F%5Cn%5Cnksun%3A%20%5C%22Those%20guys...%5CnGAhh--%5CnGAh--%5CnThey%20have%20problems!%5C%22%5Cnshe%20says%20on%20the%20radio.%5Cn%5Cnkafka%3A%20%5C%22Yes%2C%5Cnyes%20they%20have%20ksun.%5CnThey%20probably%20had%20a%20crankshaft%20failure%20moment%20of%20their%20own...%5CnJust%20clear%20them%20and%20focus.%5CnOver%5C%22%5Cn%5D%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Lady%20nagant%20was%20on%20the%20edge%20of%20her%20seat%2C%20watching%20ksun%20navigate%20the%20track%20with%20a%20mix%20of%20awe%20and%20concern.%20She%20could%20sense%20the%20tension%20and%20the%20adrenaline%20pumping%20through%20the%20driver's%20body%20as%20she%20made%20her%20way%20through%20the%20turns.*%5Cn%5Cn%5C%22Damn...%5C%22%20*She%20said%2C%20her%20heart%20racing.*%20%5C%22She%20is%20really%20going%20at%20it.%20Those%20Glickenhaus%20guys%20are%20in%20the%20way%20though.%20She%20needs%20to%20clear%20them%20quickly%20and%20focus%20on%20the%20race.%5C%22%22%7D%5D%2C%22create_date%22%3A1759580323321%7D%5D%7D`;
            try {
                historyData = JSON.parse(decodeURIComponent(historyData));
            } catch (error) {
                historyData = JSON.parse(historyData);
            }
            console.log(historyData);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.history_title-cont h3').textContent = historyData.title;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chatCont = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chatCont.innerHTML = "";
                const chat = historyData.history[index];
                const pMap = new Map(chat.participants.map(p => {
                    return [p.id, {
                        avatar: p.avatar ? dataUrlToObjectUrl(p.avatar) : undefined,
                        is_human: p.is_human,
                        name: p.name
                    }];
                }));
                chat.content.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);
                    const parti = pMap.get(msg.author);

                    // Check avatar
                    const avatar = parti.avatar
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (parti.avatar) {
                        avatar.src = parti.avatar;
                    } else {
                        avatar.classList.add(parti.is_human ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = parti.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(msg.message);
                    chatCont.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                if (!chat.content.length) {
                    return;
                }
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.create_date)}</span><br /><br />` + parseMessageText(chat.content[chat.content.length - 1]?.message || "(Empty message)");
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });


            // UTILS

            function dataUrlToObjectUrl(dataUrl) {
                const img = extractFromDataURL(dataUrl);
                const blob = b64toBlob(img.base64, img.type);
                return URL.createObjectURL(blob);
            }
            function extractFromDataURL(dataURL) {
                const [meta, base64] = dataURL.split(",");
                const type = meta.slice(5, meta.indexOf(";"));
                return { type, base64 };
            }
            function b64toBlob(b64Data, contentType = '', sliceSize = 512) {
                if (!contentType) { // If contentType isn't defined, this is a data url
                    [contentType, b64Data] = b64Data.split(",");
                    contentType = contentType.slice(5, contentType.indexOf(";"));
                }
                const byteCharacters = atob(b64Data);
                const byteArrays = [];

                for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
                    const slice = byteCharacters.slice(offset, offset + sliceSize);

                    const byteNumbers = new Uint8Array(slice.length);
                    for (let i = 0; i < slice.length; i++) {
                        byteNumbers[i] = slice.charCodeAt(i);
                    }

                    byteArrays.push(byteNumbers);
                }

                const blob = new Blob(byteArrays, { type: contentType });
                return blob;
            }

            function parseMessageText(message) {
                if (typeof message == 'string') {
                    // Escape other HTML tags
                    message = escapeHTML(message);
                    // Replace ***text*** with bold-italic
                    message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                    // Replace **text** with bold
                    message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                    // Replace *text* with italic
                    message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                    // Trim and then Replace newlines (\n) with line breaks (<br>)
                    message = message.trim().replace(/\n/g, '<br>');
                }
                else if (typeof message == 'object') {
                    message = JSON.stringify(message, null, 2);
                }
                return message;
            }
            function escapeHTML(input) {
                const div = document.createElement('div');
                div.textContent = input;
                return div.innerHTML;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
