<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1.1rem;
            cursor: pointer;
            background-color: #4e9733;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .nav-new_char-btn:hover {
            background-color: #6ba755;
        }*/

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

        /*nav .char-item {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            transition: background-color 0.1s ease-in-out;
            padding: 10px 40px 10px 20px;
            cursor: pointer;
        }

        nav .char-item:hover {
            background-color: var(--rgba-1);
        }

        nav .nav-avatar-wrap {
            width: 40px;
            height: 40px;
        }

        nav .nav-avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        nav .char-item span {
            font-size: 1.3rem;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }*/

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        /*.update_current_char-btn {
            margin-left: auto;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1rem;
            align-self: center;
            cursor: pointer;
            background-color: #336c97;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .update_current_char-btn:hover {
            background-color: #5f829d;
        }*/

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .history_title-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .history_title-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })


            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

he%20heroes%20nod%2C%20determined%20looks%20on%20their%20faces.*%5Cn%5C%22You%20can%20count%20on%20us%2C%5C%22%20says%20the%20dark%20blue-haired%20hero.%5Cn%5Cn*The%20black-haired%20girl%20adds%2C%20her%20expression%20serious.*%5Cn%5C%22We'll%20fight%20with%20everything%20we've%20got.%5C%22%5Cn%5Cn*The%20red-haired%20boy%20clenches%20his%20fists%20once%20more%2C%20a%20fierce%20look%20in%20his%20eyes.*%5Cn%5C%22We%20won't%20let%20the%20villains%20win.%20We'll%20make%20sure%20this%20never%20happens%20again.%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22Making%20you%20fight%20like%20this%20means%20that%20we%20already%20failed.%5CnSo.%5CnDont%20fight%20for%20us.%5Cnfight%20for%20the%20people%20that%20villains%20are%20unfairly%20getting%20involved%20in%20all%20of%20this.%5CnPeople%20should%20not%20get%20their%20property%20destroyed%2C%5CnEvacuated%20from%20their%20homes%20and%20frightened%20every%20other%20year.%5CnAll%20for%20One%20feeds%20his%20efforts%20with%20tensions%20like%20these.%5Cn%5CnFight%20for%20the%20people%20who%20have%20to%20live%20through%20countless%20ideological%20wars%20every%20day%20just%20to%20stay%20sane.%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*The%20heroes%20listen%20intently%20as%20you%20speak%2C%20their%20expressions%20becoming%20more%20determined%20with%20every%20word.*%5Cn%5Cn%5C%22You're%20right%2C%5C%22%20says%20the%20dark%20blue-haired%20hero%2C%20his%20voice%20firm.%5Cn%5Cn*The%20black-haired%20girl%20nodding%20in%20agreement.*%5Cn%5C%22We'll%20fight%20for%20the%20innocent%20people%20who%20are%20caught%20up%20in%20all%20this.%5C%22%5Cn%5Cn*The%20red-haired%20boy%20pumps%20his%20fist%20in%20the%20air%2C%20his%20face%20set%20in%20a%20determined%20expression.*%5Cn%5C%22We%20won't%20let%20the%20villains%20harm%20anyone%20else.%20We'll%20stop%20them%2C%20no%20matter%20what%20it%20takes.%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22%5BThen%2C%5CnI%20turn%20to%20the%20lady%20who%20sent%20me%20here%3A%5CnAlso.%5CnMake%20sure%20the%20kids%20rest.%5CnThey%20look%20like%20complete%20wrecks.%5CnNow.%5CnIf%20you%20allow%20me%2C%5Cn%5BI%20say%2C%20taking%20a%20bow%2C%5CnAnd%20straightening%20up.%5CnSlowly%5D%5CnI%20will%20be%20going.%5CnGoodluck.%5Cn%5BAs%20I%20then%20turn%20to%20the%20kids%20and%20say%3A%5D%5CnAnd%20good%20luck%2C%20Gentlemen%5D%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*The%20lady%20nods%20and%20smiles%20at%20you%2C%20appreciative%20of%20your%20input.*%5Cn%5Cn%5C%22Thank%20you.%20Take%20care.%5C%22%5Cn%5Cn*The%20heroes%20all%20watch%20you%20with%20respect%20as%20you%20turn%20to%20leave.*%5Cn%5Cn*The%20red-haired%20boy%20speaks%20up%2C%20a%20hint%20of%20gratitude%20in%20his%20voice.*%5Cn%5C%22Uh...%20thanks%20for%20your%20help.%20We'll%20do%20our%20best%20out%20there.%5C%22%5Cn%5Cn*The%20black-haired%20girl%20gives%20you%20a%20small%20wave%2C%20her%20eyes%20still%20looking%20a%20bit%20tired%20but%20less%20burdened.*%5Cn%5C%22Stay%20safe.%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22You%20stay%20safe%20out%20there%2C%20kids.%5CnYour%20lives%20above%20everyone%20else's.%5CnAlways.%5CnDo%20not%20risk%20it%20for%20validation.%5CnThink.%20And%20dont%20burn%20out.%5CnHopefully%20we%20can%20mend%20it%2C%20this%20time.%5Cn%5CnSee%20you.%5Cn%5BI%20say%2C%5CnAs%20I%20then%20walk%20out%5D%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*The%20heroes%20all%20nod%2C%20their%20expressions%20serious%20and%20focused%20as%20your%20words%20sink%20in.%20The%20red-haired%20boy%20calls%20out%20to%20you%20as%20you%20leave.*%5Cn%5C%22We%20won't%20let%20you%20down!%5C%22%5Cn%5Cn*The%20black-haired%20girl%20smiles%20weakly%2C%20looking%20a%20little%20bit%20more%20at%20ease.*%5Cn%5C%22Thank%20you...%20for%20everything.%5C%22%5Cn%5Cn*The%20dark%20blue-haired%20hero%20gives%20you%20a%20small%20salute.*%5Cn%5C%22We'll%20make%20you%20proud.%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22%5BWith%20my%20back%20already%20turned%20to%20them%2C%5CnI%20reply%20to%20the%20dark%20blue-haired%20hero%20on%20their%20comment%20about%20pride%3A%5D%5Cn%5BSnorts%5D%5CnSure%2C%20sure...%5CnJust%20try%20not%20to%20think%20of%20pride%20too%20much%20if%20the%20fight%20forces%20you%20to%20back%20off%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*The%20hero%20chuckles%20softly%20at%20your%20retort%2C%20a%20small%20smile%20tugging%20at%20his%20lips.*%5Cn%5C%22Yeah%2C%20yeah.%20We'll%20try%20our%20best%20not%20to%20run%20away.%5C%22%5Cn%5Cn*The%20black-haired%20girl%20rolls%20her%20eyes%20playfully.*%5Cn%5C%22Don't%20worry%2C%20we%20won't%20bail%20at%20the%20first%20sign%20of%20trouble.%5C%22%5Cn%5Cn*The%20red-haired%20boy%20grins%2C%20a%20newfound%20determination%20in%20his%20eyes.*%5Cn%5C%22We%20ain't%20scared%20of%20anything...%20including%20losing%20our%20pride.%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22And%20if%20the%20pros%20tell%20you%20you%20need%20to%20run%2C%5CnThey%20mean%20it.%5CnAlright%3F%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*The%20heroes%20nod%20in%20understanding%2C%20their%20expressions%20solemn.*%5Cn%5C%22We'll%20follow%20orders%20and%20retreat%20if%20necessary%2C%5C%22%20says%20the%20dark%20blue-haired%20hero.%5Cn%5Cn%5C%22We%20promise%2C%5C%22%20adds%20the%20black-haired%20girl%2C%20her%20voice%20firm.%5Cn%5Cn*The%20red-haired%20boy%20straightens%20up%2C%20his%20expression%20serious.*%5Cn%5C%22We'll%20fight%20like%20hell%2C%20but%20we'll%20also%20know%20our%20limits.%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22Good%2C%20good.%5CnGoodbye%2C%20kids.%5CnGo%20make%20your%20enemy%20think%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*The%20heroes%20exchange%20a%20final%20glance%2C%20their%20expressions%20resolute.*%5Cn%5C%22Goodbye%2C%5C%22%20they%20all%20say%20in%20unison.%5Cn%5Cn*The%20red-haired%20boy%20gives%20you%20a%20final%20wave.*%5Cn%5C%22We'll%20make%20them%20sorry%20they%20ever%20messed%20with%20us.%5C%22%5Cn%5Cn*The%20black-haired%20girl%20nods%20in%20agreement%2C%20her%20eyes%20fixed%20firmly%20on%20you.*%5Cn%5C%22We'll%20show%20them%20what%20heroes%20are%20made%20of.%5C%22%22%7D%5D%2C%22create_date%22%3A1766165285690%7D%5D%7D`;
            try {
                historyData = JSON.parse(decodeURIComponent(historyData));
            } catch (error) {
                historyData = JSON.parse(historyData);
            }
            console.log(historyData);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.history_title-cont h3').textContent = historyData.title;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chatCont = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chatCont.innerHTML = "";
                const chat = historyData.history[index];
                const pMap = new Map(chat.participants.map(p => {
                    return [p.id, {
                        avatar: p.avatar ? dataUrlToObjectUrl(p.avatar) : undefined,
                        is_human: p.is_human,
                        name: p.name
                    }];
                }));
                chat.content.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);
                    const parti = pMap.get(msg.author);

                    // Check avatar
                    const avatar = parti.avatar
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (parti.avatar) {
                        avatar.src = parti.avatar;
                    } else {
                        avatar.classList.add(parti.is_human ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = parti.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(msg.message);
                    chatCont.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                if (!chat.content.length) {
                    return;
                }
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.create_date)}</span><br /><br />` + parseMessageText(chat.content[chat.content.length - 1]?.message || "(Empty message)");
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });


            // UTILS

            function dataUrlToObjectUrl(dataUrl) {
                const img = extractFromDataURL(dataUrl);
                const blob = b64toBlob(img.base64, img.type);
                return URL.createObjectURL(blob);
            }
            function extractFromDataURL(dataURL) {
                const [meta, base64] = dataURL.split(",");
                const type = meta.slice(5, meta.indexOf(";"));
                return { type, base64 };
            }
            function b64toBlob(b64Data, contentType = '', sliceSize = 512) {
                if (!contentType) { // If contentType isn't defined, this is a data url
                    [contentType, b64Data] = b64Data.split(",");
                    contentType = contentType.slice(5, contentType.indexOf(";"));
                }
                const byteCharacters = atob(b64Data);
                const byteArrays = [];

                for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
                    const slice = byteCharacters.slice(offset, offset + sliceSize);

                    const byteNumbers = new Uint8Array(slice.length);
                    for (let i = 0; i < slice.length; i++) {
                        byteNumbers[i] = slice.charCodeAt(i);
                    }

                    byteArrays.push(byteNumbers);
                }

                const blob = new Blob(byteArrays, { type: contentType });
                return blob;
            }

            function parseMessageText(message) {
                if (typeof message == 'string') {
                    // Escape other HTML tags
                    message = escapeHTML(message);
                    // Replace ***text*** with bold-italic
                    message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                    // Replace **text** with bold
                    message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                    // Replace *text* with italic
                    message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                    // Trim and then Replace newlines (\n) with line breaks (<br>)
                    message = message.trim().replace(/\n/g, '<br>');
                }
                else if (typeof message == 'object') {
                    message = JSON.stringify(message, null, 2);
                }
                return message;
            }
            function escapeHTML(input) {
                const div = document.createElement('div');
                div.textContent = input;
                return div.innerHTML;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
