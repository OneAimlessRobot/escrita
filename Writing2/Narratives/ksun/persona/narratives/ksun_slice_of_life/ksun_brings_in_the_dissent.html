<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1.1rem;
            cursor: pointer;
            background-color: #4e9733;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .nav-new_char-btn:hover {
            background-color: #6ba755;
        }*/

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

        /*nav .char-item {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            transition: background-color 0.1s ease-in-out;
            padding: 10px 40px 10px 20px;
            cursor: pointer;
        }

        nav .char-item:hover {
            background-color: var(--rgba-1);
        }

        nav .nav-avatar-wrap {
            width: 40px;
            height: 40px;
        }

        nav .nav-avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        nav .char-item span {
            font-size: 1.3rem;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }*/

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        /*.update_current_char-btn {
            margin-left: auto;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1rem;
            align-self: center;
            cursor: pointer;
            background-color: #336c97;
            transition: background-color 0.1s ease-in-out;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .update_current_char-btn:hover {
            background-color: #5f829d;
        }*/

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .history_title-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .history_title-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })


            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

right%2C%20kid.%20It's%20a%20damn%20mess.%20It's%20just%20one%20big%2C%20endless%20cycle%20that%20keeps%20feeding%20on%20itself%E2%80%A6%20I%20don't%20think%20it'll%20ever%20end.%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22Its%20not%20easy%2C%20no...%5CnCrime%20has%20always%20existed.%5CnAnd%2C%5CnAs%20a%20certain%20jesus%20once%20said%3A%5CnOnce%20a%20sinner%2C%5Cnalways%20a%20sinner.%5CnAnd%20because%20there%20is%20sin%2C%5CnThere%20needs%20to%20be%20hope.%5CnAnd%20the%20two%20entwine%20everywhere%20we%20look%3A%5Cn%5CnWater%20and%20land.%5CnWind%20and%20heat...%5CnBoth%20drive%20eachother.%5Cn%5CnCheaters%20and%20referees.%5CnHackers%20and%20cyber%20security.%5Cn%5Cn%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Nemuri%20found%20herself%20letting%20out%20an%20amused%20scoff%20as%20the%20student%20continued%2C%20their%20endless%20observations%20and%20analysis%20both%20entertaining%20and%20spot-on.*%5Cn%5Cn%5C%22Oh%2C%20god.%20You%20really%20have%20no%20off%20switch%2C%20do%20you%3F%20You're%20just%20some%20kind%20of%20endless%20fountain%20of%20wisdom%E2%80%A6%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22And%20this%20was%20about...%5CnMy%20hero%20clothes.%5CnWell%2C%5CnI%20guess%20I%20will%20just%20keep%20my%20current%20outfit.%5CnBecause%20at%20least...%5CnThat%20one%20is%20consistent.%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Nemuri%20chuckled%2C%20finding%20herself%20amused%20by%20the%20sudden%20conclusion.*%5Cn%5Cn%5C%22Hey%2C%20don't%20worry%20about%20your%20outfit.%20It%20suits%20you.%20Besides%E2%80%A6%20I'm%20kind%20of%20tired%20of%20seeing%20all%20these%20wannabe%20heroes%20running%20around%20in%20ridiculous%20and%20attention-seeking%20clothes.%20It's%20a%20nice%20change%20of%20pace%20to%20see%20something%20simple%20like%20what%20you're%20wearing.%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22Wanna%20be%20heroes%20that%20get%20drip%20fed%20by%20institutions~%5CnIts%20not%20the%20heroes'%20fault%2C%20only.%20Remember%20that%20%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Nemuri%20couldn't%20help%20but%20nod%20once%20more%20in%20agreement%2C%20a%20small%20smirk%20forming%20on%20her%20face%20once%20again.*%5Cn%5Cn%5C%22Yeah%2C%20you're%20right.%20It's%20not%20just%20the%20heroes'%20faults%E2%80%A6%20the%20institutions%20and%20the%20way%20that%20they%20run%20things%20are%20responsible%20too.%20It's%20a%20crappy%20system%20in%20general%20and%20it%20only%20leads%20to%20these%20wannabe%20heroes%20who%20just%20want%20to%20make%20themselves%20famous%E2%80%A6%20it's%20an%20ugly%20cycle.%5C%22%22%7D%2C%7B%22author%22%3A2%2C%22message%22%3A%22The%20world%20is%20bad%20in%20more%20ways%20than%20one.%5CnBut%20we%20still%20strive%20to%20make%20sure%20that%20people%20with%20disabling%20quirks%20can%20remain%20healthy%2C%5CnAnd%20still%20push%20the%20elderly%20around%20on%20wheelchairs.%5CnThe%20world%20is%20not%20so%20bad.%5CnBecause%2C%5CnIn%20the%20middle%20of%20so%20much%20indifference%20and%20aimlessness%2C%5CnWe%20can%20still%20talk%20to%20our%20friends%20on%20the%20phone%2C%5CnAnd%20pray%20for%20the%20deceased%20in%20church%22%7D%2C%7B%22author%22%3A1%2C%22message%22%3A%22*Nemuri%20felt%20her%20expression%20soften%20as%20the%20student%20continued%2C%20finding%20herself%20agreeing%20wholeheartedly%20with%20their%20words.%20They%20were%20right%2C%20despite%20all%20the%20awfulness%20and%20bad%20parts%20in%20the%20world%2C%20there%20were%20still%20good%20things%20that%20made%20life%20worth%20living%20for.*%5Cn%5Cn%5C%22Yeah%2C%20you're%20damn%20right%2C%20kid.%20It's%20easy%20to%20get%20focused%20on%20the%20bad%20parts%20and%20see%20the%20world%20as%20a%20hopeless%20place%2C%20but%20there%20are%20still%20some%20good%20things%20out%20there.%20Sometimes%2C%20we%20just%20have%20to%20stop%20and%20appreciate%20the%20small%20things.%5Cn%5CnLike%20a%20phone%20call%20with%20your%20friends%E2%80%A6%20or%20a%20prayer%20for%20the%20departed.%5C%22%22%7D%5D%2C%22create_date%22%3A1766002677412%7D%5D%7D`;
            try {
                historyData = JSON.parse(decodeURIComponent(historyData));
            } catch (error) {
                historyData = JSON.parse(historyData);
            }
            console.log(historyData);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.history_title-cont h3').textContent = historyData.title;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chatCont = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chatCont.innerHTML = "";
                const chat = historyData.history[index];
                const pMap = new Map(chat.participants.map(p => {
                    return [p.id, {
                        avatar: p.avatar ? dataUrlToObjectUrl(p.avatar) : undefined,
                        is_human: p.is_human,
                        name: p.name
                    }];
                }));
                chat.content.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);
                    const parti = pMap.get(msg.author);

                    // Check avatar
                    const avatar = parti.avatar
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (parti.avatar) {
                        avatar.src = parti.avatar;
                    } else {
                        avatar.classList.add(parti.is_human ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = parti.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(msg.message);
                    chatCont.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                if (!chat.content.length) {
                    return;
                }
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.create_date)}</span><br /><br />` + parseMessageText(chat.content[chat.content.length - 1]?.message || "(Empty message)");
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });


            // UTILS

            function dataUrlToObjectUrl(dataUrl) {
                const img = extractFromDataURL(dataUrl);
                const blob = b64toBlob(img.base64, img.type);
                return URL.createObjectURL(blob);
            }
            function extractFromDataURL(dataURL) {
                const [meta, base64] = dataURL.split(",");
                const type = meta.slice(5, meta.indexOf(";"));
                return { type, base64 };
            }
            function b64toBlob(b64Data, contentType = '', sliceSize = 512) {
                if (!contentType) { // If contentType isn't defined, this is a data url
                    [contentType, b64Data] = b64Data.split(",");
                    contentType = contentType.slice(5, contentType.indexOf(";"));
                }
                const byteCharacters = atob(b64Data);
                const byteArrays = [];

                for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
                    const slice = byteCharacters.slice(offset, offset + sliceSize);

                    const byteNumbers = new Uint8Array(slice.length);
                    for (let i = 0; i < slice.length; i++) {
                        byteNumbers[i] = slice.charCodeAt(i);
                    }

                    byteArrays.push(byteNumbers);
                }

                const blob = new Blob(byteArrays, { type: contentType });
                return blob;
            }

            function parseMessageText(message) {
                if (typeof message == 'string') {
                    // Escape other HTML tags
                    message = escapeHTML(message);
                    // Replace ***text*** with bold-italic
                    message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                    // Replace **text** with bold
                    message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                    // Replace *text* with italic
                    message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                    // Trim and then Replace newlines (\n) with line breaks (<br>)
                    message = message.trim().replace(/\n/g, '<br>');
                }
                else if (typeof message == 'object') {
                    message = JSON.stringify(message, null, 2);
                }
                return message;
            }
            function escapeHTML(input) {
                const div = document.createElement('div');
                div.textContent = input;
                return div.innerHTML;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
