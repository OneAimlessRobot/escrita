# ... for the left outer camera
camera_outer_left_name = 
camera_outer_left_config = 
camera_outer_left_flip = 
# ... for the inner camera
camera_inner_name = 
camera_inner_config = 
camera_inner_flip = 

[Miscellaneous]
# A filter which removes logs below a certain logging level.
