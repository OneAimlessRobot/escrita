<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1.1rem;

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

            display: flex;

            cursor: pointer;

        nav .char-item:hover {

        nav .nav-avatar-wrap {
            width: 40px;

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .character_name-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .character_name-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })

            // Handle background
            // If there is one
            const currentBg = localStorage.getItem('background');
            if (currentBg) {
                changeBg(currentBg);
            }
            // Change by hand
            const bgInput = document.querySelector('#bgInput');
            document.querySelector('.change-bg').addEventListener('click', () => {
                bgInput.click();
            })
            document.querySelector('.delete-bg').addEventListener('click', () => {
                document.body.classList.remove('custom-bg');
                document.body.style.backgroundImage = "unset";
                localStorage.removeItem('background');
            })
            bgInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    // convert image file to base64 string
                    changeBg(reader.result);
                    bgInput.value = "";
                    try {
                        localStorage.setItem('background', reader.result);
                    } catch (error) {
                        alert('Note: File is likely too big to save.')
                        //console.log(error)
                    }
                }
                reader.readAsDataURL(file);
            })
            function changeBg(bg) {
                let objUrl = URL.createObjectURL(dataURItoBlob(bg));
                document.body.classList.add('custom-bg');
                document.body.style.backgroundImage = `url(${objUrl})`;
            }
            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

ster%20often%20pulled%20at%20her%20mother's%20hair%20and%20would%20only%20stop%20when%20breast%20fed.%0AShe%20learned%20how%20to%20walk%20at%2018%20months%2C%20but%20kept%20it%20concealed%20until%203%20days%20off%20the%20end%20of%20the%20fourth%20year%2C%20because%20whenever%20she%20saw%20other%20kids%20walk%2C%20parents%20would%20always%20leave%20them%20with%20other%20kids%20and%20not%20stick%20with%20them.%0AAt%203%20years%20old%2C%20a%20time%20where%20her%20parents%20thought%20she%20could%20not%20walk%20yet%2C%20she%20was%20caught%20trying%20to%20poke%20a%20cube%20toy's%20edge%20in%20another%20kid's%20eyes%20while%20standing%20over%20them%20without%20anyone%20looking.%0AShe%20also%20knew%20how%20to%20cry%20selectively%20and%20attempted%20to%20put%20her%20parents%20against%20each%20other%20many%20times.%0AAlso%2C%20she%20had%20psychic%20powers.%0AAnyways...%0AAfter%20yet%20another%20incident...%20at%205%20years%20old%2C%20a%20time%20when%20she%20still%20had%20teeth%2C%20she%20was%20caught%20trying%20to%20bite%20the%20hand%20off%20another%20toddler%20without%20giving%20away%20any%20reasonable%20explanation.%0AAnd%20at%205%20years%20old...%20she%20was%20diagnosed%20with%20ASPD-S%20and%20NPD.%0A5%20years%20old.%0A%0AI%20had%20not%20written%20any%20kind%20of%20beginning%20for%20her%20yet%20so%20whatcha%20think%3F%0A%0A%0AAll%20good%3F%0Aokay%20so%20let%20me%20continue%3A%0A%0ABut%20besides%20her...%20mischiveous%2C%20lets%20say%2C%20behaviour%2C%20her%20doctors%20also%20said%20that%20she%20had%20been%20born%20with%20a%20mutation%20that%2C%20in%20the%20most%20practical%20and%20outcome%20effective%20terms%2C%20gave%20her%20psychic%20powers.%0AThese%20powers%20were%20*not*%20very%20common%20*anywhere*%20but%20it%20was%20still%20statistically%20relevant%3A%0Aabout%20a%203%25%20onset%20on%20any%20adequately%20sized%20sample.%20%0AThe%20users%20of%20these%20powers%20were%20born%20with%20eyes%20that%20were%20hollow%20at%20their%20retinas%20and%20their%20brains%20featured%20a%20muscle%2Fgland%20that%20would%20glow%20green%20when%20activated.%20the%20glow%20from%20this%20gland%20would%20be%20visible%20through%20the%20hollow%20retinas.%0AWhenever%20it%20lit%20up%2C%20Ester%20would%20feel%20very%20deep%20headaches%20(imagine%20giving%20a%2030%20year%20old's%20migraine%20to%20a%20child.)%20and%20there%20would%20always%20be%20at%20least%20some%20background%20discomfort%20until%20the%20later%20stages%20of%20early%20childhood%20were%20over%2C%20when%20her%20skull%20grew%20thick%20enough%20to%20desensitize%20its%20user%20to%20the%20pain.%0APeople%20born%20with%20this%20mutation%20always%20forget%20this%20pain%20at%20about%20year%204%2C%20on%20average.%0ASo%20the%20problem%20was%20that%20she%20*did%20cry%20selectively%20sometimes*...%0Abut%20other%20times%20it%20was%20not%20selective.%0AAnd%20the%20eyes%20glowing%20is%20also%20not%20a%20good%20indicator%20because%20suction%20motions%20would%20also%20cause%20headaches%20sometimes.%20As%20well%20as%20chewing%20some%20foods%20until%20the%20mid%20point%20between%20age%205%20and%206%0ASo%20getting%20her%20diagnosis%20was%20very%20tricky.%0ABut%20then.%20.%20.%20.%20.%20.%20.%0AShe%20kept%20going.%20.%20.%20.%0AJust%20subtler.%0AAt%20age%207%2C%20she%20became%20self-aware%20that%20she%20had%20these%20powers%20and%20realized%20that%20she%20could%20sense%20other%20sentient%20brains%20in%20her%20room%20if%20she%20breathed%20down%20to%20relax%20and%20then%20engaged%20with%20her%20psychic%20gland.%0AThis%20is%20called%20a%20*Scan*.%20I%20explain%20these%20powers%20in%20detail%20in%20other%20files%20though.%0AShe%20could%20scan%20people%20within%20a%20radius%20that%20was%20porportional%20to%20how%20many%20neural%20pathways%20were%20built%20towards%20the%20psychic%20gland%2C%20how%20strong%20it%20got%20and%20how%20much%20control%20the%20user%20had%20over%20it.%0AAnd%20then...%20she%20learned%20that%20she%20could%20lift%20small%20objects%20and%20even%20manipulate%20fluids%20that%20were%20not%20concealed%20within%20organic%20beings.%0AShe%20could%20manipulate%20*her%20own*%20body%20using%20self-induced%20telekinesis%20so...%20theoretically...%20she%20could%20fly%20as%20well.%0AAt%20age%209%2C%20she%20learned%20to%20use%20arguably%20the%20most%20terrifying%20technique%20a%20psychic%20can%20learn%3A%20Psychic%20sockets.%20To%20create%20a%20psychic%20socket%2C%20you%20first%20perform%20a%20scan.%20After%20you%20perform%20a%20scan%2C%20the%20brains%20within%20the%20radius%20you%20scanned%20would%20get%20inprinted%20into%20the%20gland%20temporarly%2C%20like%20sun%20spots%20when%20you%20look%20at%20something%20bright%20for%20too%20long.%20If%20you%20then%20focus%20the%20same%20energy%20you%20use%20for%20the%20scans%2C%20with%20precise%20and%20continuous%20periodic%20pulsing%2C%20into%20one%20of%20those%20spots%20as%20firmly%20as%20you%20can%2C%20you%20can%20create%20a%20psychic%20socket%20between%20you%20and%20that%20person.%0AYou%20are%20then%20able%20to%20actually%20*see%20into%20the%20other%20persons*%20*conscious*%20mind%20if%20you%20match%20the%20adequate%20frequency%20of%20that%20person.%0AEveryone%20has%20a%20distinct%20frequency%20and%20it%20works%20like%20a%20radio%20station.%0AAnd%20some%20pulses%20are%20more%20like%20sawtooth%20waves%20and%20others%20more%20square%2C%20while%20others%20are%20closer%20to%20sine%20waves.%0APsychic%20powers%20are%20fundamentally%20unable%20to%20permeate%20into%20the%20unconscious%20mind%20of%20people.%0ASo%20you%20can%20*literally*%20read%20the%20thoughts%20of%20the%20people%20you%20are%20connected%20with%20that%20are%20created%20with%20deliberate%20intent.%20%22Feelings%22%20instead%20of%20%22emotions%22.%20That%20includes%20things%20like%20%22proactive%20imagination%22%20and%20%22reactive%20outrage%22%20as%20well.%22"},{"isUser":false,"name":"Anan Kurose","message":"(OOC%3A%20Damn%E2%80%A6%20that's%E2%80%A6%20one%20hell%20of%20an%20OC!%20She's%20super%20interesting%20and%20I'm%20super%20intrigued%20to%20find%20out%20more%20as%20to%20what%20she'll%20do!)"}]}]}`);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.character_name-cont h3').textContent = historyData.charName;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chat = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chat.innerHTML = "";
                historyData.history[index].chat.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);

                    // Check avatar
                    const avatarGood = (msg.isUser && historyData.userPic) || (!msg.isUser && historyData.charPic);
                    const avatar = avatarGood
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (avatarGood) {
                        avatar.src = msg.isUser ? historyData.userPic : historyData.charPic;
                    } else {
                        avatar.classList.add(msg.isUser ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = msg.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(decodeURIComponent(msg.message));
                    chat.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.date)}</span><br /><br />` + parseMessageText(decodeURIComponent(chat.chat[chat.chat.length - 1].message));
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });

            function parseMessageText(message) {
                // Clean up memory reminders (second check)
                message = message.replace(memoryRegex, '');
                // Replace ***text*** with bold-italic
                message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                // Replace **text** with bold
                message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                // Replace *text* with italic
                message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                // Trim and then Replace newlines (\n) with line breaks (<br>)
                message = message.trim().replace(/\n/g, '<br>');
                return message;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
