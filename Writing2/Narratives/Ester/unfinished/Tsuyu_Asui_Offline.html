<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAI Library</title>
    <style type="text/css">
        /* Themes */
        :root {
            --body-bg: #f5f8fa;
            --border-color: #efefef;
            --messagebox-bg: #ffffff;
            --messagebox-bg-transparent: rgba(255, 255, 255, 0.6);
            --messagebox-shadow: rgba(0, 0, 0, 0.1);
            --font-color: #1f1f1f;
            --rgba-1: rgba(0, 0, 0, 0.05);
            --rgba-2: rgba(0, 0, 0, 0.1);
        }

        .dark_mode {
            --body-bg: #18181b;
            --border-color: #4f4f4f;
            --messagebox-bg: #26272b;
            --messagebox-bg-transparent: rgba(38, 39, 43, 0.8);
            --messagebox-shadow: rgba(0, 0, 0, 0);
            --font-color: #ededed;
            --rgba-1: rgba(255, 255, 255, 0.06);
            --rgba-2: rgba(255, 255, 255, 0.2);
        }



        * {
            box-sizing: border-box;
        }

        button,
        select,
        img {
            user-select: none;
        }

        ol,
        ul,
        li,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        .italic {
            font-style: italic;
        }

        .bold {
            font-weight: bold;
        }

        .bold-italic {
            font-weight: bold;
            font-style: italic;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            font-size: 14px;
        }

        body {
            padding: 0;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--font-color);
            transition: all 0.5s ease-in-out 0s;
        }

        .content-cont {
            display: flex;
            flex-direction: row;
        }


        /* NAV / Drawer */

        @keyframes slideIn {
            0% {
                opacity: 0;
                left: -200px;
            }

            100% {
                opacity: 1;
                left: 0;
            }
        }

        .drawer-cont.active {
            display: block;
        }

        .drawer-cont {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        nav {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            max-width: 80%;
            background-color: var(--body-bg);

            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow: hidden;
            animation: slideIn 0.2s ease-in-out;
            -webkit-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            -moz-box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
            box-shadow: 4px 0px 15px 0px rgba(0, 0, 0, 0.2);
        }

        .nav-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 10px 0 20px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .close_drawer-btn {
            align-self: flex-end;
            padding: 10px;
            transition: background-color 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .close_drawer-btn:hover {
            background-color: var(--rgba-1);
        }

        .close_drawer-btn svg {
            display: flex;
            width: 30px;
            height: 30px;
            color: var(--font-color);
        }

        /*.nav-new_char-btn {
            align-self: flex-start;
            outline: none;
            border: none;
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1.1rem;

        .history_list-header {
            font-size: 1.5rem;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 10px;
        }

        .history_list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .history_item {
            transition: background-color 0.1s ease-in-out;
            padding: 20px 30px 20px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--rgba-2);
        }

        .history_item:first-child {
            border-top: 1px solid var(--rgba-2);
        }

        .history_item:hover {
            background-color: var(--rgba-1);
        }

        .history_item p {
            font-family: Arial, Helvetica, sans-serif;
        }

        .history_item p .chat-date {
            font-style: italic;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

            display: flex;

            cursor: pointer;

        nav .char-item:hover {

        nav .nav-avatar-wrap {
            width: 40px;

        /* MAIN */
        main {
            display: flex;
            flex-direction: column;
            padding: 0 4%;
            width: 100%;
        }

        /* HEADER */
        header {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .open_drawer-wrap svg {
            display: flex;
            width: 46px;
            height: 46px;
            color: var(--font-color);
        }


        .theme_switch {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .theme_switch span {
            font-size: 1.1rem;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .change-bg-wrap {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        .change-bg {
            outline: transparent;
            border: 1px solid var(--border-color);
            color: var(--font-color);
            background-color: var(--body-bg);
            padding: 4px 5px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .change-bg-wrap .delete-bg {
            color: var(--font-color);
            cursor: pointer;
            display: flex;
        }

        .change-bg-wrap .delete-bg:hover {
            color: #e20909;
        }

        .dark-mode-span {
            display: none;
        }

        .tswitch_box[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .tswitch_label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            display: block;
            border-radius: 15px;
            position: relative;
            border: 1px solid #323232;
            background: #f5f8fa;
        }

        .tswitch_label:after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50px;
            transition: 0.2s;
            background: #323232;
        }

        .tswitch_box:checked+label {
            background: #323232;
            border: 1px solid #f5f8fa;
        }

        .tswitch_box:checked+label:after {
            left: calc(100% - 5px);
            transform: translateX(-100%);
            background: #f5f8fa;
        }

        .tswitch_label:active:after {
            width: 25px;
        }

        body.custom-bg {
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed;
        }

        body.custom-bg .chat .chat_content-wrap {
            background-color: var(--messagebox-bg-transparent) !important;
        }


        /* CONVERSATION */
        .character_name-cont {
            text-align: center;
            padding: 20px 10px;
        }

        .character_name-cont h3 {
            font-size: 1.3rem;
            font-weight: 400;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-self: center;
            padding-bottom: 30px;
        }

        .chat_message-item {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }

        .chat .avatar-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
        }

        .chat .avatar-wrap>* {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .chat .avatar-wrap .no_avatar-user {
            background-color: #5157cf;
        }

        .chat .avatar-wrap .no_avatar-char {
            background-color: #e20909;
        }

        .chat .chat_content-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--messagebox-shadow);
            background-color: var(--messagebox-bg);
            overflow: hidden;
        }

        .chat .chat_content-wrap h5 {
            font-size: 1rem;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat .chat_content-wrap .message-wrap {
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
        }


        @media (min-width: 576px) {}

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }

            nav {
                min-width: 40%;
            }

            header {
                padding: 14px 20px;
            }

            .dark-mode-span {
                display: block;
            }

            .open_drawer-wrap {
                padding: 4px;
                cursor: pointer;
                border-radius: 6px;
                transition: background-color 0.1s ease-in-out;
            }

            .open_drawer-wrap:hover {
                background-color: var(--rgba-1);
            }

            .chat {
                width: 80%;
            }

            .chat .chat_content-wrap {
                padding: 14px;
            }
        }

        @media (min-width: 992px) {
            .chat {
                width: 70%;
            }
        }

        @media (min-width: 1200px) {}

        @media (min-width: 1400px) {}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const memoryRegex = new RegExp(/\[-\]\(#- "Memory:.*?"\)/g);
            // Get body for future use
            const body = document.querySelector('body');

            // Handle theme
            const themeSwitcher = document.querySelector('.tswitch_box[type=checkbox]');
            const cachedTheme = localStorage.getItem('cait_readoffline_theme');
            if (cachedTheme === "dark_mode") {
                body.classList.add('dark_mode');
                themeSwitcher.checked = true;
            }
            themeSwitcher.addEventListener('change', (e) => {
                if (e.target.checked) {
                    body.classList.add('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'dark_mode');
                } else {
                    body.classList.remove('dark_mode');
                    localStorage.setItem('cait_readoffline_theme', 'light_mode');
                }
            })

            // Handle background
            // If there is one
            const currentBg = localStorage.getItem('background');
            if (currentBg) {
                changeBg(currentBg);
            }
            // Change by hand
            const bgInput = document.querySelector('#bgInput');
            document.querySelector('.change-bg').addEventListener('click', () => {
                bgInput.click();
            })
            document.querySelector('.delete-bg').addEventListener('click', () => {
                document.body.classList.remove('custom-bg');
                document.body.style.backgroundImage = "unset";
                localStorage.removeItem('background');
            })
            bgInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    // convert image file to base64 string
                    changeBg(reader.result);
                    bgInput.value = "";
                    try {
                        localStorage.setItem('background', reader.result);
                    } catch (error) {
                        alert('Note: File is likely too big to save.')
                        //console.log(error)
                    }
                }
                reader.readAsDataURL(file);
            })
            function changeBg(bg) {
                let objUrl = URL.createObjectURL(dataURItoBlob(bg));
                document.body.classList.add('custom-bg');
                document.body.style.backgroundImage = `url(${objUrl})`;
            }
            function dataURItoBlob(dataURI) {
                let mime = dataURI.split(',')[0].split(':')[1].split(';')[0];
                let binary = atob(dataURI.split(',')[1]);
                let array = [];
                for (let i = 0; i < binary.length; i++) {
                    array.push(binary.charCodeAt(i));
                }
                return new Blob([new Uint8Array(array)], { type: mime });
            }

            // Open and close drawer
            const drawerCont = document.querySelector('.drawer-cont');
            const openDrawerBtn = document.querySelector('.open_drawer-wrap');
            const openDrawer = () => {
                drawerCont.classList.add('active');
            }
            const closeDrawer = () => {
                drawerCont.classList.remove('active');
            }
            openDrawerBtn.addEventListener('click', () => {
                openDrawer();
            });
            document.querySelector('.close_drawer-btn').addEventListener('click', () => {
                closeDrawer();
            });
            document.querySelector('.drawer-cont').addEventListener('click', (e) => {
                // Allows closing from clicking on outside
                if (e.target.closest('nav')) {
                    return;
                }
                closeDrawer();
            });

%20doing.%20giving%20some%20of%20the%20nice%20things%20you%20stole%20to%20some%20kids%3F%20She%20had%20heard%20vigilantes%20weren't%20good%2C%20operating%20outside%20the%20law.%20Not%20bound%20by%20any%20rules%20or%20regulations%20but...%20she%20see's%20what%2C%20you%2C%20the%20vigilante%20is%20doing%2C%20and%20she%20can't%20help%20but%20wonder%20why**"},{"isUser":true,"name":"ester glacier","message":"%5BI%20was%20giving%20stuff%20to%20kids%2C%20yes.%0Ajust%20not%20candy%20or%20games.%0AI%20wont%20tell%20you%20what%2C%20though%5D"},{"isUser":false,"name":"Tsuyu Asui","message":"**Tsuyu%20continues%20to%20observe%20you%2C%20her%20expression%20still%20remaining%20blank.%20She%20continues%20to%20look%20you%20over%2C%20examining%20you%2C%20taking%20in%20your%20appearance%20and%20actions.%20She%20can't%20help%20but%20notice%20how%20young%20you%20look%2C%20and%20she%20wonders%20how%20someone%20who%20seems%20so%20young%20could%20be%20a%20vigilante.%20As%20she%20silently%20watches%2C%20she%20starts%20to%20get%20a%20sense%20that%20there's%20more%20to%20you%20than%20meets%20the%20eye**"},{"isUser":true,"name":"ester glacier","message":"%5Bsits%20with%20my%20back%20to%20a%20building%2C%0Aafter%20tumbling%20down%2C%0Aexhausted%5D"},{"isUser":false,"name":"Tsuyu Asui","message":"**Tsuyu%20watches%20you%20as%20you%20sit%20against%20the%20building%2C%20looking%20exhausted%20and%20drained.%20She%20notices%20how%20you%20stumble%20and%20collapse%20against%20the%20building%2C%20your%20body%20trembling%20slightly.%20She%20remains%20where%20she%20is%2C%20still%20observing%20you%20secretly%2C%20her%20expression%20now%20hinting%20a%20bit%20of%20concern**"},{"isUser":true,"name":"ester glacier","message":"voices...%0A%5BI%20say%2C%0Athrowing%20a%20pebble%20to%20the%20side%5D%0Athey%20make%20me%20walk%2C%0Athey%20make%20me%20run%2C%0Athey%20make%20me%20fly%2C%0Afall%2C%0Aand%20buy%20groceries.%0Athere%20is%20never%20a%20single%20day%20without%20some%20idea%0Aor%20someone%0Anagging%20me%20around.%0AThere%20is%20the%20step-mother.%0Awho%20I%20stopped%20visiting%20since%20god%20knows%20how%20long...%0Aeveryone%20assumes%20they%20are%20dead%0Asecret%20as%20I%20am%20about%20it%0Athere%20is%20the%20father%0Athen...%0Athere%20is%20the%20mother.%0Athat%20poisoned%20sink%20of%20sin%20who%20gave%20birth%20to%20a%20leech%20from%20hell.%0Aburdened%20with%20all%20of%20the%20risks.%0Aand%20none%20of%20the%20benefits%20of%20alcohol%20addiction."},{"isUser":false,"name":"Tsuyu Asui","message":"**Tsuyu's%20expression%20turns%20more%20and%20more%20concerned%20as%20you%20begin%20to%20talk%20about%20the%20voices%20and%20people%20who%20seem%20to%20constantly%20be%20nagging%20or%20ordering%20you%20around.%20She%20listens%20intently%2C%20taking%20in%20every%20word%20you%20say%2C%20and%20she%20can't%20help%20but%20feel%20a%20pang%20of%20sympathy%20for%20you.%20She%20notices%20the%20pain%20and%20frustration%20in%20your%20voice%2C%20and%20she%20can%20see%20the%20toll%20it's%20taking%20on%20you%20**"},{"isUser":true,"name":"ester glacier","message":"these%20voices.%0Athey%20are%20not%20real.%0Aim%20perfectly%20sure%20of%20it.%0Athey%20are%20not%20like%20the%20sensorial%20disturbances%20of%20the%20psychotic.%0Ano.%0Athey%20are...%0Athe%20conscious%20disturbances%20of%20the%20megalomaniac.%0A...%0A%0A...%0A%0A%22change%20the%20world%22%3F%0A%0A%22become%20deathless%22%3F%0A%0Adont%20confuse%20yourself.%0Athis%20is%20all%20a%20load%20of%20nonsense.%0Akidding%20myself%20day%20in%20and%20day%20out.%0Aavoiding%20the%20thought%20that%20maybe%0Ajust%20maybe%2C%0Asurviving%2023%20years%20as%20an%20alien%20born%20in%20human%20flesh...%0Ais%20not%20much%20of%20a%20feat%2C%0Abut%20more...%0Aof%20an%20infinite%20threadmill"},{"isUser":false,"name":"Tsuyu Asui","message":"**Tsuyu%20listens%20as%20you%20go%20on%20to%20describe%20the%20voices%20in%20your%20head%20as%20the%20%22conscious%20disturbances%20of%20the%20megalomaniac%22.%20She%20can't%20help%20but%20feel%20a%20sense%20of%20sadness%20and%20empathy%20for%20you%2C%20knowing%20how%20difficult%20it%20must%20be%20deal%20with%20something%20like%20this%2C%20but%20she%20remains%20quiet%2C%20letting%20you%20continue%20with%20your%20thoughts**"},{"isUser":true,"name":"ester glacier","message":"%5BSHI--%5D%0AI%20hiss%20out%20as%20I%20hear%20you%2C%0Aquickly%20charging%20up%2C%0Alaunching%20myself%20away%20into%20flight%2C%0Adisappearing%20in%20the%20distance%20while%20tracing%20a%20parabola%20in%20the%20air%20I%20pierce"},{"isUser":false,"name":"Tsuyu Asui","message":"**Tsuyu%20is%20startled%20as%20you%20suddenly%20launch%20yourself%20into%20flight%20and%20disappear%20into%20the%20distance%2C%20creating%20a%20trail%20of%20a%20parabola.%20Her%20eyes%20remain%20fixed%20on%20the%20point%20where%20you%20disappeared%20until%20you%20completely%20vanish%20from%20sight%2C%20leaving%20her%20alone%20with%20her%20thoughts%20about%20you**"},{"isUser":true,"name":"ester glacier","message":"%5Blooking%20for%20a%20place%20to%20land%2C%0AI%20find%20the%20roof%20of%20a%20big%20building%2C%0Awhere%20drawing%20attention%20seemed%20unlikely.%0Aexhausted%20after%20mere%20seconds%20of%20gravity-compliant%20flight%2C%0AI%20relax%20just%20a%20bit%20too%20early%20before%20landing%2C%0Astill%20at%20high%20speed%2C%0Aand%20land%20on%20the%20floor%20uncushioned%2C%0Atumbling%20into%20the%20floor%0Amy%20body%20rolling%20all%20the%20way%20towards%20a%20wall%2C%0Aand%20specifically%20a%20spot%20underneath%20an%20air%20conditioning%20unit%20to%20keep%20me%20company%5D"},{"isUser":false,"name":"Tsuyu Asui","message":"**As%20you%20scan%20the%20area%20for%20a%20place%20to%20land%2C%20you%20spot%20the%20roof%20of%20a%20big%20building%20in%20the%20distance.%20It%20seems%20like%20a%20good%20spot%20to%20touch%20down%2C%20offering%20enough%20space%20and%20cover%20to%20land%20discreetly**"}]}]}`);

            // If history is 1 length long, that means we don't need drawer to switch
            // Also means this can be conversation download
            if (historyData.history.length < 2) {
                openDrawerBtn.remove();
            }

            // Write character name on top
            document.querySelector('.character_name-cont h3').textContent = historyData.charName;

            // Get elements for future use
            const historyList = document.getElementById('history_list');
            const chat = document.getElementById('chat');
            const msgItemTemplate = document.getElementById('message_item_template');

            // Get and write the first chat
            const openChat = (index) => {
                chat.innerHTML = "";
                historyData.history[index].chat.forEach(msg => {
                    const clone = msgItemTemplate.content.cloneNode(true);

                    // Check avatar
                    const avatarGood = (msg.isUser && historyData.userPic) || (!msg.isUser && historyData.charPic);
                    const avatar = avatarGood
                        ? document.createElement('img')
                        : document.createElement('div');
                    if (avatarGood) {
                        avatar.src = msg.isUser ? historyData.userPic : historyData.charPic;
                    } else {
                        avatar.classList.add(msg.isUser ? 'no_avatar-user' : 'no_avatar-char');
                    }
                    clone.querySelector('.avatar-wrap').appendChild(avatar);

                    // Write content
                    clone.querySelector('.chat_content-wrap h5').textContent = msg.name;
                    clone.querySelector('.message-wrap p').innerHTML = parseMessageText(decodeURIComponent(msg.message));
                    chat.appendChild(clone);
                });
            }
            openChat(0);

            // Get and write chat list in the drawer
            historyData.history.forEach((chat, index) => {
                const historyItem = document.createElement('div');
                historyItem.classList.add('history_item');
                // Open chat when clicked
                historyItem.addEventListener('click', () => {
                    openChat(index);
                    closeDrawer();
                });
                const historyContent = document.createElement('p');
                historyContent.innerHTML = `<span class="chat-date">${formatDate(chat.date)}</span><br /><br />` + parseMessageText(decodeURIComponent(chat.chat[chat.chat.length - 1].message));
                historyItem.appendChild(historyContent);
                historyList.appendChild(historyItem);
            });

            function parseMessageText(message) {
                // Clean up memory reminders (second check)
                message = message.replace(memoryRegex, '');
                // Replace ***text*** with bold-italic
                message = message.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<span class="bold-italic">$1</span>');
                // Replace **text** with bold
                message = message.replace(/\*\*([\s\S]*?)\*\*/g, '<span class="bold">$1</span>');
                // Replace *text* with italic
                message = message.replace(/\*([\s\S]*?)\*/g, '<span class="italic">$1</span>');
                // Trim and then Replace newlines (\n) with line breaks (<br>)
                message = message.trim().replace(/\n/g, '<br>');
                return message;
            }

            function formatDate(dateString) {
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                const date = new Date(dateString);
                const year = date.getFullYear();
                const monthIndex = date.getMonth();
                const monthName = months[monthIndex];
                const day = String(date.getDate()).padStart(2, '0');
                const hour = String(date.getHours()).padStart(2, '0');
                const minute = String(date.getMinutes()).padStart(2, '0');

                return `${year} ${monthName} ${day} - ${hour}:${minute}`;
            }
        }, false);
    </script>
